<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1d14">
<title>だるま落とし / Daruma Knock</title>
<style>
/* One portrait play area: canvas + DOM overlays, centred on wide screens. Warm washi-paper daylight palette. */
:root {
  --paper: #f3e8d2;
  --card: #fbf5e8;
  --ink: #2a1d14;
  --dim: #7a6250;
  --red: #c8281e;
  --red-deep: #8f1a12;
  --gold: #e0a82e;
  --matcha: #5f8a2e;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --brush: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "IPAMincho", serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: #2b1d14 radial-gradient(ellipse at 50% 40%, #4a3322 0%, #2b1d14 70%);
  color: var(--ink); font-family: var(--font); overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: none;
}
#app {
  position: relative; height: 100%; width: 100%; margin: 0 auto; overflow: hidden;
  background: var(--paper); touch-action: none; box-shadow: 0 0 60px #0008;
}
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

/* DOM UI scales with the play area, like the canvas (--ui = play width / 360, set in resize) */
.hud, .panel { zoom: var(--ui, 1); }
.hud {
  position: absolute; inset: 0 0 auto 0; z-index: 6; display: flex; justify-content: space-between; align-items: flex-start;
  padding: max(10px, env(safe-area-inset-top)) 12px 0; pointer-events: none;
}
.scorebox { min-height: 56px; }
.lbl { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--dim); }
.score { font-size: 40px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 #fff8; }
.streak { margin-top: 4px; font-size: 13px; font-weight: 900; color: var(--red); min-height: 1.2em; letter-spacing: .04em; }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.btns { display: flex; gap: 6px; pointer-events: auto; }
.chip {
  font: 800 12px var(--font); color: var(--ink); background: #fffaf0d9; border: 1.5px solid #2a1d1433;
  border-radius: 999px; min-width: 38px; min-height: 32px; padding: 0 10px; cursor: pointer;
}
.chip:active { transform: translateY(1px); }
.best { font-size: 12px; font-weight: 800; color: var(--dim); text-align: right; }
.best b { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; margin-left: 4px; }

.panel {
  position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; padding: 84px 16px 24px; text-align: center;
  background: linear-gradient(#f3e8d2ee 0%, #f3e8d2aa 45%, #f3e8d200 75%);
}
#titlePanel { cursor: pointer; }
.panel.dim { justify-content: center; padding-top: 24px; background: #2a1d14a6; }
.card {
  background: var(--card); border-radius: 20px; padding: 18px 20px 20px; width: min(100%, 330px); box-sizing: border-box;
  box-shadow: 0 10px 30px #4a2a1033, inset 0 0 0 2px #2a1d1414; display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.kicker { font-size: 11px; font-weight: 800; letter-spacing: .28em; color: var(--matcha); }
.title {
  margin: 0; font-family: var(--brush); font-weight: 900; font-size: 44px; line-height: 1.05;
  color: var(--red); letter-spacing: .02em; text-shadow: 2px 3px 0 #e0a82e55; word-break: keep-all;
}
.subtitle { font-size: 13px; font-weight: 800; letter-spacing: .2em; color: var(--dim); margin-top: -4px; }
.how { white-space: pre-line; margin: 2px 0 0; font-size: 14px; line-height: 1.6; font-weight: 700; max-width: 21em; text-wrap: balance; }
.btn {
  font: 900 20px var(--font); color: #fff; background: var(--red); border: 0; border-radius: 999px;
  padding: 13px 40px; cursor: pointer; box-shadow: 0 5px 0 var(--red-deep); margin-top: 4px; letter-spacing: .06em;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--red-deep); }
.btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.keys { font-size: 11px; font-weight: 700; color: var(--dim); }
.credit { position: absolute; bottom: max(8px, env(safe-area-inset-bottom)); left: 0; right: 0; font-size: 11px; font-weight: 700; color: #2a1d1499; pointer-events: none; }
.over-head { font-family: var(--brush); font-weight: 900; font-size: 34px; color: var(--red); margin: 0; }
.big { font-size: 64px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.newbest { font-size: 13px; font-weight: 900; color: #fff; background: var(--gold); border-radius: 999px; padding: 3px 12px; letter-spacing: .1em; }
.stats { font-size: 12px; font-weight: 700; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { .btn:active, .chip:active { transform: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <section class="panel" id="titlePanel">
    <div class="card">
      <div class="kicker" data-t="kicker"></div>
      <h1 class="title" data-t="title"></h1>
      <div class="subtitle" data-t="subtitle"></div>
      <p class="how" data-t="how"></p>
      <button class="btn" id="startBtn" type="button" data-t="play"></button>
      <div class="keys" data-t="keysPlay"></div>
    </div>
    <div class="credit">Made with Claude</div>
  </section>

  <section class="panel dim" id="pausePanel" hidden>
    <div class="card">
      <div class="over-head" data-t="paused"></div>
      <button class="btn" id="resumeBtn" type="button" data-t="resume"></button>
      <div class="keys" data-t="keysResume"></div>
    </div>
  </section>

  <section class="panel" id="overPanel" hidden>
    <div class="card">
      <div class="over-head" data-t="over"></div>
      <div class="big" id="finalScore">0</div>
      <div class="newbest" id="newBest" data-t="newBest" hidden></div>
      <div class="stats" id="stats"></div>
      <button class="btn" id="retryBtn" type="button" data-t="retry"></button>
      <div class="keys" data-t="keysRetry"></div>
    </div>
  </section>

  <div class="hud">
    <div class="scorebox" id="scoreBox">
      <div class="lbl" data-t="score"></div>
      <div class="score" id="score">0</div>
      <div class="streak" id="streak"></div>
    </div>
    <div class="side">
      <div class="btns">
        <button class="chip" id="pauseBtn" type="button">II</button>
        <button class="chip" id="muteBtn" type="button"></button>
        <button class="chip" id="langBtn" type="button"></button>
      </div>
      <div class="best"><span data-t="best"></span><b id="best">0</b></div>
    </div>
  </div>
</div>

<script>
(function () {
"use strict";

// Portal SDK adapter: a portal build can replace this object before the game loads.
window.Platform = window.Platform || { gameplayStart() {}, gameplayStop() {}, happytime() {}, gameOver(score) {} };
const platform = (name, arg) => { try { window.Platform[name](arg); } catch (e) { /* adapter errors never break the game */ } };

// ---------- strings ----------
const STR = {
  ja: {
    kicker: "週刊ミニゲーム #02", title: "だるま落とし", subtitle: "DARUMA KNOCK",
    how: "長押しでため、緑の帯で離して叩く。\n叩く側で傾きを直せ!",
    play: "はじめる", keysPlay: "Space / Enter でもスタート ・ M で消音", score: "スコア", best: "ベスト",
    paused: "一時停止", resume: "つづける", keysResume: "Space / Enter でもどる",
    over: "崩れた!", retry: "もう一回", keysRetry: "Space / Enter / R でもう一回", newBest: "ベスト更新!",
    stats: "落とした {n} 枚 ・ 最高連続PERFECT {s}", streak: "連続PERFECT ×{n}",
    soundOn: "音 ON", soundOff: "音 OFF", lang: "EN",
    hintHold: "長押しでパワーをためる", hintRelease: "緑の帯で離す!", hintSides: "左右どちらで離すかで叩く側が決まる",
    hintSteer: "こっち側で叩くと戻る!",
    hintHoldKey: "Space か ←/→ を長押し", hintSidesKey: "← / → で叩く側を選べる", hintSteerKey: "こっち側の矢印キーで戻る!", here: "ここで離す", newType: "NEW",
    perfect: "PERFECT", good: "よし", weak: "弱い!", strong: "強すぎ!", shatter: "割れた!",
    save: "ナイス立て直し!", listen: "音で聴け!", lean: "傾き", aria: "だるま落とし ゲーム画面", pauseBtn: "一時停止",
    types: { lacquer: "漆", wood: "白木", rubber: "ゴム", cracked: "ひび", gold: "金" },
    typeHints: { lacquer: "ふつうに", wood: "少し弱く", rubber: "強く!", cracked: "そっと!", gold: "×3 せまい!" }
  },
  en: {
    kicker: "WEEKLY MINI GAME #02", title: "Daruma Knock", subtitle: "だるま落とし",
    how: "Hold to charge, release in the green band. Strike from the side that rights the tower!",
    play: "PLAY", keysPlay: "or press Space / Enter · M to mute", score: "SCORE", best: "BEST",
    paused: "Paused", resume: "RESUME", keysResume: "Space / Enter to resume",
    over: "Toppled!", retry: "RETRY", keysRetry: "Space / Enter / R to retry", newBest: "NEW BEST!",
    stats: "{n} discs knocked · best PERFECT streak {s}", streak: "PERFECT ×{n}",
    soundOn: "SOUND ON", soundOff: "SOUND OFF", lang: "JA",
    hintHold: "Hold to charge", hintRelease: "Release in the green band!", hintSides: "Screen half = strike side",
    hintSteer: "Strike from here to straighten!",
    hintHoldKey: "Hold Space or ← / →", hintSidesKey: "← / → picks the strike side", hintSteerKey: "Use this arrow key to straighten!", here: "RELEASE HERE", newType: "NEW",
    perfect: "PERFECT", good: "GOOD", weak: "TOO WEAK", strong: "TOO STRONG", shatter: "SHATTERED",
    save: "NICE SAVE!", listen: "LISTEN!", lean: "LEAN", aria: "Daruma Knock game", pauseBtn: "Pause",
    types: { lacquer: "Lacquer", wood: "Raw wood", rubber: "Rubber", cracked: "Cracked", gold: "Gold" },
    typeHints: { lacquer: "normal", wood: "softer", rubber: "hard!", cracked: "gentle!", gold: "×3 tiny!" }
  }
};

const store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, String(v)); } catch (e) { /* storage blocked: play on */ } }
};
const KEY_BEST = "daruma-otoshi.best", KEY_MUTE = "daruma-otoshi.mute", KEY_LANG = "daruma-otoshi.lang";

let lang = store.get(KEY_LANG) || ((navigator.language || "ja").toLowerCase().startsWith("ja") ? "ja" : "en");
if (lang !== "ja" && lang !== "en") lang = "ja";
const t = (key, vars) => {
  let s = STR[lang][key];
  if (vars) for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
  return s;
};

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const app = $("app"), canvas = $("game"), ctx = canvas.getContext("2d");
const titlePanel = $("titlePanel"), pausePanel = $("pausePanel"), overPanel = $("overPanel");
const scoreEl = $("score"), streakEl = $("streak"), bestEl = $("best"), scoreBox = $("scoreBox");
const muteBtn = $("muteBtn"), langBtn = $("langBtn"), pauseBtn = $("pauseBtn");

const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const demoMode = /[?&]demo=1(&|$)/.test(location.search);

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const rand = (a, b) => a + Math.random() * (b - a);
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let r = Math.imul(seed ^ seed >>> 15, 1 | seed);
    r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif';
const BRUSH = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","IPAMincho",serif';

// ---------- sound (WebAudio synthesis, created on first gesture) ----------
const Sound = (() => {
  let ac = null, master = null, echoIn = null, noiseBuf = null, chargeOsc = null, chargeGain = null;
  let muted = store.get(KEY_MUTE) === "1";
  const live = () => ac && !muted && run.mode !== "attract";

  function unlock() {
    if (ac) { if (ac.state !== "running" && ac.resume) ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination);
      // short slap-back echo used for the PERFECT "kaan"
      echoIn = ac.createGain(); echoIn.gain.value = 0.35;
      const delay = ac.createDelay(); delay.delayTime.value = 0.11;
      const fb = ac.createGain(); fb.gain.value = 0.3;
      echoIn.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(master);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  function env(gain, at, attack, peak, decay) {
    gain.gain.setValueAtTime(0.0001, at);
    gain.gain.exponentialRampToValueAtTime(peak, at + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + attack + decay);
  }
  function osc(type, f0, f1, delay, attack, decay, peak, echo) {
    const at = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, at);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, at + attack + decay);
    env(g, at, attack, peak, decay);
    o.connect(g); g.connect(master); if (echo) g.connect(echoIn);
    o.start(at); o.stop(at + attack + decay + 0.05);
  }
  function noise(delay, decay, peak, type, freq, q) {
    const at = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q || 1;
    env(g, at, 0.002, peak, decay);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(at, Math.random() * 0.5); s.stop(at + decay + 0.05);
  }
  const api = {
    unlock,
    get muted() { return muted; },
    toggleMute() {
      muted = !muted; store.set(KEY_MUTE, muted ? "1" : "0");
      if (master) master.gain.value = muted ? 0 : 0.8;
      if (muted) api.chargeStop();
    },
    knock(kind, streak) {
      if (!live()) return;
      if (kind === "perfect") { // woody "kaaan"
        osc("sine", 1180, 1120, 0, 0.001, 0.42, 0.32, true);
        osc("triangle", 2650, 2600, 0, 0.001, 0.16, 0.12, true);
        osc("sine", 470, 430, 0, 0.001, 0.2, 0.25);
        noise(0, 0.035, 0.5, "bandpass", 3600, 1.2);
        const f = 880 * Math.pow(2, Math.min(streak, 12) / 12 * 2);
        osc("sine", f, 0, 0.06, 0.004, 0.25, 0.08);
      } else if (kind === "ok") { // "kon"
        osc("sine", 820, 760, 0, 0.001, 0.16, 0.3);
        osc("triangle", 1640, 1600, 0, 0.001, 0.06, 0.08);
        noise(0, 0.03, 0.35, "bandpass", 2600, 1.4);
      } else if (kind === "weak") { // dull thud + drag
        osc("sine", 230, 140, 0, 0.002, 0.14, 0.4);
        noise(0.02, 0.26, 0.18, "lowpass", 900, 0.7);
      } else if (kind === "strong") { // clack-clack: clipped the next disc
        osc("sine", 660, 600, 0, 0.001, 0.09, 0.3);
        noise(0, 0.03, 0.4, "bandpass", 3000, 1.2);
        osc("sine", 960, 880, 0.045, 0.001, 0.08, 0.25);
        osc("sine", 180, 90, 0.05, 0.002, 0.18, 0.35);
      } else if (kind === "shatter") {
        noise(0, 0.3, 0.5, "highpass", 2800, 0.7);
        for (let i = 0; i < 6; i++) noise(0.015 * i + Math.random() * 0.02, 0.03, 0.3, "bandpass", rand(2200, 5200), 3);
        osc("sine", 300, 120, 0, 0.002, 0.15, 0.3);
      }
    },
    land() { if (!live()) return; osc("sine", 170, 90, 0, 0.002, 0.1, 0.22); noise(0, 0.05, 0.12, "lowpass", 700); },
    hop() { if (!live()) return; osc("sine", 380, 780, 0, 0.005, 0.1, 0.06); },
    headLand() { if (!live()) return; osc("sine", 620, 420, 0, 0.002, 0.08, 0.08); },
    whoosh() { if (!live()) return; noise(0, 0.16, 0.06, "bandpass", 1300, 0.8); },
    gold() { if (!live()) return; [1568, 2093, 2637, 3136].forEach((f, i) => osc("triangle", f, 0, i * 0.05, 0.003, 0.4, 0.07)); },
    fanfare() { if (!live()) return; [784, 988, 1175, 1568].forEach((f, i) => osc("square", f, 0, i * 0.07, 0.004, 0.14, 0.04)); },
    creak() {
      if (!live()) return;
      const at = ac.currentTime, o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(70, at); o.frequency.linearRampToValueAtTime(115, at + 0.3);
      f.type = "bandpass"; f.frequency.value = 520; f.Q.value = 5;
      env(g, at, 0.05, 0.12, 0.3);
      o.connect(f); f.connect(g); g.connect(master); o.start(at); o.stop(at + 0.4);
    },
    collapse() {
      if (!live()) return;
      for (let i = 0; i < 6; i++) { osc("sine", 160 - i * 8, 70, i * 0.09, 0.002, 0.14, 0.3); noise(i * 0.09, 0.07, 0.2, "lowpass", 900); }
      osc("sawtooth", 140, 60, 0, 0.05, 0.5, 0.05);
    },
    thump() { if (!live()) return; osc("sine", rand(120, 170), 70, 0, 0.002, 0.1, 0.22); noise(0, 0.04, 0.1, "lowpass", 800); },
    bonk() { // head hits the floor: "poko-n" plus stars
      if (!live()) return;
      osc("sine", 900, 190, 0, 0.002, 0.26, 0.32);
      osc("triangle", 1800, 400, 0, 0.002, 0.12, 0.08);
      [2349, 2794, 3136].forEach((f, i) => osc("sine", f, 0, 0.18 + i * 0.07, 0.003, 0.2, 0.05));
    },
    start() { if (!live()) return; osc("sine", 120, 55, 0, 0.003, 0.38, 0.6); noise(0, 0.08, 0.25, "lowpass", 400); },
    tick() { if (!ac || muted) return; osc("triangle", 1200, 0, 0, 0.002, 0.04, 0.05); },
    chargeStart() {
      if (!live() || chargeOsc) return;
      const at = ac.currentTime;
      chargeOsc = ac.createOscillator(); chargeGain = ac.createGain();
      chargeOsc.type = "triangle"; chargeOsc.frequency.value = 170;
      chargeGain.gain.setValueAtTime(0.0001, at); chargeGain.gain.exponentialRampToValueAtTime(0.07, at + 0.04);
      chargeOsc.connect(chargeGain); chargeGain.connect(master); chargeOsc.start(at);
    },
    chargeSet(power) { if (chargeOsc) chargeOsc.frequency.setTargetAtTime(170 + power * 6.5, ac.currentTime, 0.012); },
    chargeStop() {
      if (!chargeOsc) return;
      const at = ac.currentTime;
      chargeGain.gain.cancelScheduledValues(at); chargeGain.gain.setValueAtTime(chargeGain.gain.value, at);
      chargeGain.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
      chargeOsc.stop(at + 0.07); chargeOsc = null; chargeGain = null;
    }
  };
  return api;
})();

// ---------- world constants ----------
const LW = 360;             // logical width; logical height LH follows the window
const DW = 156, DH = 32;    // disc size
const HEAD_H = 92;
const STACK = 8;
const BANDS = { lacquer: [70, 82], wood: [50, 65], rubber: [85, 95], cracked: [35, 45], gold: [57, 63] };
const LACQUER = [
  { color: "#c8321f", pat: "#f2c14e", crack: "#a5574a" }, // vermilion
  { color: "#27407a", pat: "#e9cf86", crack: "#56607a" }, // indigo
  { color: "#5f8a2e", pat: "#f3e6b5", crack: "#7c8059" }, // matcha
  { color: "#b8841c", pat: "#4e260a", crack: "#9a8758" }  // mustard
];
const PATTERNS = ["asanoha", "ichimatsu", "shippo", "seigaiha"];
const WOBBLE_K = Math.pow(2 * Math.PI * 1.3, 2), WOBBLE_W = Math.sqrt(WOBBLE_K), WOBBLE_C = 2 * 0.2 * WOBBLE_W;
const G = 4200;             // gravity for stack settling (snappy)

// ---------- layout ----------
let LH = 640, scale = 1, dpr = 1, rs = 1, standTop = 512, meterY = 588, gaugeY = 96, floorTop = 478;
let bgCanvas = null, spriteVersion = 0;

function resize() {
  const vw = window.innerWidth, vh = app.parentElement.clientHeight || window.innerHeight;
  const w = Math.min(vw, Math.round(vh * 0.5625));
  if (w < 8 || vh < 8) return; // hidden or collapsed iframe: keep the last good layout
  app.style.width = w + "px";
  dpr = Math.min(2, window.devicePixelRatio || 1);
  scale = w / LW; LH = vh / scale; rs = scale * dpr;
  app.style.setProperty("--ui", scale.toFixed(4));
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(vh * dpr);
  meterY = LH - 46 - (LH > 700 ? 10 : 0);
  standTop = meterY - 78;
  floorTop = standTop - 34;
  gaugeY = Math.max(92, standTop - STACK * DH - HEAD_H - 70);
  spriteVersion++;
  buildBackground();
}

function buildBackground() {
  bgCanvas = document.createElement("canvas");
  bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
  const g = bgCanvas.getContext("2d"); g.scale(rs, rs);
  const rnd = mulberry32(11);
  let gr = g.createLinearGradient(0, 0, 0, floorTop);
  gr.addColorStop(0, "#f6ecd8"); gr.addColorStop(1, "#ecdcbd");
  g.fillStyle = gr; g.fillRect(0, 0, LW, floorTop);
  // shoji lattice, barely there
  g.strokeStyle = "rgba(120,85,45,.07)"; g.lineWidth = 2;
  for (let x = 30; x < LW; x += 75) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, floorTop); g.stroke(); }
  for (let y = floorTop - 90; y > 0; y -= 110) { g.beginPath(); g.moveTo(0, y); g.lineTo(LW, y); g.stroke(); }
  // ensō brush circle behind the tower
  g.save(); g.translate(LW / 2, standTop - 210); g.rotate(-0.6);
  for (let i = 0; i < 70; i++) {
    const a0 = i / 70 * Math.PI * 1.82, a1 = (i + 1.4) / 70 * Math.PI * 1.82;
    g.strokeStyle = "rgba(60,30,15," + (0.05 + 0.03 * Math.sin(i / 70 * Math.PI)) + ")";
    g.lineWidth = 3 + 9 * Math.sin(i / 70 * Math.PI);
    g.beginPath(); g.arc(0, 0, 128 + rnd() * 2, a0, a1); g.stroke();
  }
  g.restore();
  // washi fibres
  for (let i = 0; i < 900; i++) {
    const x = rnd() * LW, y = rnd() * floorTop, a = rnd() * Math.PI, l = 3 + rnd() * 12;
    g.strokeStyle = rnd() < 0.5 ? "rgba(255,255,255,.35)" : "rgba(140,100,60,.07)";
    g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + rnd() * 2, y + Math.sin(a) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  // tatami floor
  gr = g.createLinearGradient(0, floorTop, 0, LH);
  gr.addColorStop(0, "#cdbf84"); gr.addColorStop(1, "#b9aa6c");
  g.fillStyle = gr; g.fillRect(0, floorTop, LW, LH - floorTop);
  g.lineWidth = 1;
  for (let y = floorTop + 8; y < LH; y += 3) { g.strokeStyle = (y % 2) ? "rgba(90,80,30,.10)" : "rgba(255,250,210,.10)"; g.beginPath(); g.moveTo(0, y); g.lineTo(LW, y); g.stroke(); }
  g.strokeStyle = "rgba(80,70,30,.18)"; g.beginPath(); g.moveTo(LW * 0.5 + 120, floorTop + 7); g.lineTo(LW * 0.5 + 150, LH); g.stroke();
  // heri (tatami border)
  g.fillStyle = "#2f3b2c"; g.fillRect(0, floorTop, LW, 7);
  g.fillStyle = "rgba(224,168,46,.45)";
  for (let x = 4; x < LW; x += 10) g.fillRect(x, floorTop + 3, 3, 1.4);
  // vignette
  const vg = g.createRadialGradient(LW / 2, LH * 0.48, LH * 0.25, LW / 2, LH * 0.5, LH * 0.8);
  vg.addColorStop(0, "rgba(80,45,15,0)"); vg.addColorStop(1, "rgba(80,45,15,.4)");
  g.fillStyle = vg; g.fillRect(0, 0, LW, LH);
}

// ---------- disc sprites ----------
function paintPattern(g, kind, w, h, base, line) {
  g.strokeStyle = line; g.fillStyle = line; g.lineWidth = 0.9;
  if (kind === "ichimatsu") {
    const s = 6.4; g.beginPath();
    for (let y = 0, j = 0; y < h; y += s, j++) for (let x = 0, i = 0; x < w; x += s, i++) if ((i + j) % 2 === 0) g.rect(x, y, s, s);
    g.globalAlpha = 0.45; g.fill();
  } else if (kind === "shippo") {
    const s = 10, r = s * 0.707; g.beginPath();
    for (let y = 0; y < h + s; y += s) for (let x = 0; x < w + s; x += s) { g.moveTo(x + r, y); g.arc(x, y, r, 0, Math.PI * 2); }
    g.globalAlpha = 0.6; g.stroke();
  } else if (kind === "seigaiha") {
    for (let y = 2, row = 0; y < h + 8; y += 4.5, row++) {
      for (let x = (row % 2) * 6 - 6; x < w + 12; x += 12) {
        g.globalAlpha = 1; g.fillStyle = base; g.beginPath(); g.arc(x, y, 6, Math.PI, 0); g.fill();
        g.globalAlpha = 0.65; g.beginPath();
        for (const r of [6, 4.2, 2.4]) { g.moveTo(x - r, y); g.arc(x, y, r, Math.PI, 0); }
        g.stroke();
      }
    }
  } else { // asanoha: six-ray stars on a hex lattice
    g.beginPath();
    for (let j = 0, y = 0; y < h + 12; j++, y += 10.4) {
      for (let x = (j % 2) * 6; x < w + 12; x += 12) {
        for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 6.9, y + Math.sin(a) * 6.9); }
      }
    }
    g.globalAlpha = 0.55; g.stroke();
  }
  g.globalAlpha = 1;
}

function paintDisc(g, d) {
  const w = DW, h = DH, rnd = mulberry32(d.seed);
  g.save();
  roundRect(g, 0, 0, w, h, 9); g.clip();
  if (d.type === "gold") {
    const gg = g.createLinearGradient(0, 0, 0, h);
    gg.addColorStop(0, "#fff6c4"); gg.addColorStop(0.45, "#f5cf4f"); gg.addColorStop(1, "#c98d16");
    g.fillStyle = gg;
  } else g.fillStyle = d.color;
  g.fillRect(0, 0, w, h);

  if (d.type === "lacquer" || d.type === "cracked" || d.type === "gold") {
    g.save(); g.beginPath(); g.rect(0, h * 0.2, w, h * 0.6); g.clip();
    if (d.type === "cracked") g.globalAlpha = 0.5;
    paintPattern(g, d.pattern, w, h, d.type === "gold" ? "#e2ae35" : d.color, d.pat);
    g.restore();
    g.fillStyle = d.type === "gold" ? "#a0200f" : "#e8b84a";
    g.globalAlpha = d.type === "cracked" ? 0.5 : 0.9;
    g.fillRect(0, h * 0.2 - 1.2, w, 1.4); g.fillRect(0, h * 0.8, w, 1.4);
    g.globalAlpha = 1;
  } else if (d.type === "wood") {
    g.lineWidth = 0.9;
    for (let k = 0; k < 7; k++) {
      const y0 = 3 + rnd() * (h - 6), ph = rnd() * 6, amp = 0.8 + rnd() * 1.6;
      g.strokeStyle = "rgba(130,80,35," + (0.25 + rnd() * 0.25) + ")";
      g.beginPath();
      for (let x = 0; x <= w; x += 5) { const y = y0 + Math.sin(x * 0.045 + ph) * amp; x ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    }
    g.fillStyle = "rgba(120,70,30,.35)"; g.beginPath(); g.ellipse(30 + rnd() * 90, h * 0.5, 5, 2.4, 0, 0, Math.PI * 2); g.fill();
  } else if (d.type === "rubber") {
    for (let i = 0; i < 160; i++) { g.fillStyle = rnd() < 0.5 ? "rgba(255,255,255,.07)" : "rgba(0,0,0,.18)"; g.fillRect(rnd() * w, rnd() * h, 1.2, 1.2); }
    g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(0, h * 0.42, w, h * 0.16);
  }

  const gloss = d.type === "rubber" ? 0.04 : d.type === "wood" ? 0.18 : d.type === "cracked" ? 0.2 : 0.42;
  const sh = g.createLinearGradient(0, 0, w, 0);
  sh.addColorStop(0, "rgba(0,0,0,.45)"); sh.addColorStop(0.16, "rgba(0,0,0,.08)");
  sh.addColorStop(0.3, "rgba(255,255,255," + gloss + ")"); sh.addColorStop(0.44, "rgba(255,255,255,0)");
  sh.addColorStop(0.82, "rgba(0,0,0,.12)"); sh.addColorStop(1, "rgba(0,0,0,.52)");
  g.fillStyle = sh; g.fillRect(0, 0, w, h);
  const vg = g.createLinearGradient(0, 0, 0, h);
  vg.addColorStop(0, "rgba(255,255,255," + gloss * 0.9 + ")"); vg.addColorStop(0.16, "rgba(255,255,255,0)");
  vg.addColorStop(0.8, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.35)");
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
  if (gloss > 0.3) { // lacquer glint
    g.fillStyle = "rgba(255,255,255,.5)"; g.beginPath(); g.ellipse(w * 0.3, h * 0.17, w * 0.13, 1.4, 0, 0, Math.PI * 2); g.fill();
  }
  if (d.type === "cracked") {
    for (let c = 0; c < 4; c++) {
      let x = 20 + rnd() * (w - 40), y = rnd() < 0.5 ? 0 : h;
      const dir = y === 0 ? 1 : -1, pts = [[x, y]];
      while (y >= 0 && y <= h) { x += rand(-6, 6) * 0.8 + (rnd() - 0.5) * 6; y += dir * (3 + rnd() * 5); pts.push([x, y]); }
      for (const [col, off] of [["rgba(255,255,255,.35)", 0.7], ["rgba(25,10,5,.8)", 0]]) {
        g.strokeStyle = col; g.lineWidth = 1.2; g.beginPath();
        pts.forEach(([px, py], i) => i ? g.lineTo(px + off, py) : g.moveTo(px + off, py)); g.stroke();
      }
    }
  }
  if (d.type === "gold") {
    g.font = "900 17px " + FONT; g.textAlign = "center"; g.textBaseline = "middle";
    g.lineWidth = 3.5; g.strokeStyle = "#fff6c4"; g.strokeText("×3", w / 2, h / 2 + 1);
    g.fillStyle = "#a0200f"; g.fillText("×3", w / 2, h / 2 + 1);
    g.fillStyle = "#fff";
    for (const [sx, sy, s] of [[w * 0.2, h * 0.32, 3.4], [w * 0.78, h * 0.62, 2.6]]) { g.beginPath(); g.moveTo(sx, sy - s * 2); g.lineTo(sx + s * 0.5, sy); g.lineTo(sx, sy + s * 2); g.lineTo(sx - s * 0.5, sy); g.fill(); g.fillRect(sx - s * 2, sy - 0.5, s * 4, 1); }
  }
  g.restore();
  roundRect(g, 0.5, 0.5, w - 1, h - 1, 9);
  g.strokeStyle = "rgba(40,18,8,.55)"; g.lineWidth = 1; g.stroke();
}

const SPRITE_PAD = 2;
function spriteOf(d) {
  if (!d.sprite || d.spriteVersion !== spriteVersion) {
    const c = document.createElement("canvas");
    c.width = Math.ceil((DW + SPRITE_PAD * 2) * rs); c.height = Math.ceil((DH + SPRITE_PAD * 2) * rs);
    const g = c.getContext("2d"); g.scale(rs, rs); g.translate(SPRITE_PAD, SPRITE_PAD);
    paintDisc(g, d);
    d.sprite = c; d.spriteVersion = spriteVersion;
  }
  return d.sprite;
}
function drawDiscAt(g, d, x, y) { g.drawImage(spriteOf(d), x - SPRITE_PAD, y - SPRITE_PAD, DW + SPRITE_PAD * 2, DH + SPRITE_PAD * 2); }

// ---------- run state ----------
const run = {
  mode: "attract", alive: true, phase: "ready",
  discs: [], head: null, incoming: [], fliers: [], bodies: [],
  lean: 0, wob: 0, wobV: 0, theta: 0, squash: 0,
  knocked: 0, serial: 0, score: 0, streak: 0, maxStreak: 0,
  power: 0, rising: true, chargeT: 0, side: 1, strikePower: 0, impactT: 0, busyT: 0,
  lastRelease: null, collapseT: 0, seenTypes: new Set(), dangerT: 0, listenShown: false
};
const hammer = { side: 1, ext: -16, alpha: 1 };
let particles = [], popups = [], stamp = null, shake = 0, slowT = 0, hitStopT = 0;
let paused = false, overShownAt = 0, best = parseInt(store.get(KEY_BEST), 10) || 0;
const session = { firstHintDone: false, steeredOnce: false, sidesHintT: 0, keys: false };

function newDisc(n) {
  let type = "lacquer";
  if (n >= 10) {
    const r = Math.random();
    if (Math.random() < 1 / 12) type = "gold";
    else if (n < 25) type = r < 0.5 ? "lacquer" : r < 0.75 ? "wood" : "rubber";
    else type = r < 0.34 ? "lacquer" : r < 0.56 ? "wood" : r < 0.78 ? "rubber" : "cracked";
  }
  const pal = LACQUER[(Math.random() * LACQUER.length) | 0];
  const d = {
    id: n, type, seed: (Math.random() * 1e9) | 0, xOff: 0, xTarget: 0, yOff: 0, vy: 0, sprite: null, spriteVersion: -1,
    pattern: PATTERNS[(Math.random() * PATTERNS.length) | 0], color: pal.color, pat: pal.pat
  };
  if (type === "wood") d.color = "#d4a76c";
  if (type === "rubber") d.color = "#34302f";
  if (type === "cracked") { d.color = pal.crack; d.pat = "#e9dcc0"; }
  if (type === "gold") { d.pat = "#8a5a0c"; d.pattern = "seigaiha"; }
  return d;
}

function newRun(mode) {
  run.mode = mode; run.alive = true; run.phase = "ready";
  run.discs = []; run.incoming = []; run.fliers = []; run.bodies = [];
  run.serial = 0;
  for (let i = 0; i < STACK; i++) run.discs.push(newDisc(run.serial++));
  run.head = { yOff: -LH * 0.5, vy: 0, sq: 0, sqV: 0, hopDelay: -1, blinkT: 0, swirl: false };
  run.lean = 0; run.wob = 0; run.wobV = 0; run.theta = 0; run.squash = 0;
  run.knocked = 0; run.score = 0; run.streak = 0; run.maxStreak = 0;
  run.power = 0; run.rising = true; run.chargeT = 0; run.side = 1; run.impactT = 0; run.busyT = 0.5;
  run.lastRelease = null; run.collapseT = 0; run.seenTypes = new Set(); run.dangerT = 0; run.listenShown = false;
  run.restartT = 0; run.overT = 0; run.finished = false; run.isBest = false;
  hammer.side = 1; hammer.ext = -16; hammer.alpha = 1;
  particles = []; popups = []; stamp = null; shake = 0; slowT = 0; hitStopT = 0;
  input.holding = null;
  ai.reset();
  Sound.chargeStop();
}

// ---------- difficulty ----------
// eases from 1.5 s to 1.2 s over the first 10 discs (no cliff at 10, where new disc types arrive), then steps every 5
function sweepTime() {
  const k = run.knocked;
  if (k < 10) return 1.5 - 0.03 * k;
  return Math.max(0.7, 1.2 / Math.pow(1.04, Math.floor((k - 10) / 5)));
}
// beginner aid: the first discs of every run get a wider green band and gold center around the same
// center, easing back to normal by the 4th disc. Indexed by discs knocked, so a miss does not use one up.
const EASY = [{ half: 16, perf: 5 }, { half: 16, perf: 5 }, { half: 12, perf: 3.5 }];
function bandOf(d) {
  let [lo, hi] = BANDS[d.type];
  if (d.type === "lacquer" && run.knocked < 10) { lo = 68; hi = 84; }
  const c = (lo + hi) / 2;
  let half = (hi - lo) / 2, perf = Math.max(half * 0.2, Math.min(2.2, half * 0.5));
  const easy = EASY[run.knocked];
  if (easy) { half = Math.max(half, easy.half); perf = Math.max(perf, easy.perf); }
  return { lo: Math.max(0, c - half), hi: Math.min(100, c + half), c, perf };
}
// tower height grows the wobble: x1.03 per disc knocked, capped
const wobbleMul = () => Math.pow(1.03, Math.min(run.knocked, 30));
const tilt = () => run.lean + run.wob;

// ---------- tower geometry ----------
const bendAt = i => tilt() * 7 * Math.pow(i / STACK, 2);
function towerToWorld(lx, ly) {
  const th = run.theta, sg = th > 0 ? 1 : th < 0 ? -1 : 0;
  const x0 = lx - sg * DW / 2, y0 = ly * (1 - run.squash);
  const c = Math.cos(th), s = Math.sin(th);
  return { x: LW / 2 + sg * DW / 2 + x0 * c - y0 * s, y: standTop + x0 * s + y0 * c };
}
const discCenterLocal = i => ({ x: run.discs[i].xOff + bendAt(i), y: -(i + 0.5) * DH + run.discs[i].yOff });

// ---------- particles & popups ----------
function burst(x, y, n, opts) {
  for (let i = 0; i < n && particles.length < 500; i++) {
    const a = (opts.angle != null ? opts.angle : -Math.PI / 2) + rand(-1, 1) * (opts.spread != null ? opts.spread : Math.PI);
    const sp = rand(opts.speed * 0.4, opts.speed);
    particles.push({
      kind: opts.kind || "chip", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: rand(0, 6), vr: rand(-12, 12),
      life: rand(opts.life * 0.6, opts.life), max: opts.life, size: rand(opts.size * 0.5, opts.size),
      color: Array.isArray(opts.color) ? opts.color[(Math.random() * opts.color.length) | 0] : opts.color, g: opts.gravity != null ? opts.gravity : 900
    });
  }
}
function popup(text, x, y, color, size, life) {
  for (const q of popups) if (q.text === text) q.t = Math.max(q.t, q.life * 0.75); // fade a repeat instead of stacking it
  popups.push({ text, x, y, color, size: size || 20, t: 0, life: life || 0.8 });
}
function addShake(a) { if (!reducedMotion) shake = Math.max(shake, a); }

// ---------- knocking ----------
function startCharge(side) {
  if (!run.alive || run.phase !== "ready" || !run.discs.length) return false;
  run.phase = "charging"; run.chargeT = 0; run.power = 0; run.rising = true; run.side = side; hammer.side = side;
  Sound.chargeStart();
  return true;
}
function releaseCharge(side) {
  if (run.phase !== "charging") return;
  if (side) { run.side = side; hammer.side = side; }
  run.phase = "busy"; run.strikePower = run.power; run.impactT = 0.05; run.busyT = 1;
  Sound.chargeStop();
}
function cancelCharge() {
  if (run.phase === "charging") { run.phase = "ready"; run.power = 0; }
  Sound.chargeStop();
}

function resolveImpact() {
  const d = run.discs[0];
  if (!run.alive) return;
  if (!d) { run.phase = "ready"; return; }
  const b = bandOf(d), p = run.strikePower, s = run.side, mul = wobbleMul();
  const result = Math.abs(p - b.c) <= b.perf ? "perfect" : (p >= b.lo && p <= b.hi) ? "ok" : p < b.lo ? "weak" : d.type === "cracked" ? "shatter" : "strong";
  run.lastRelease = { p, result, t: 0, band: b };
  run.seenTypes.add(d.type); // drives the NEW tag on the meter
  const lc = discCenterLocal(0), wc = towerToWorld(lc.x, lc.y);
  const hitX = wc.x - s * DW / 2, hitY = wc.y;
  const prevLean = run.lean;
  const impulse = a => { run.wobV += s * a * mul * WOBBLE_W; };
  const chipColors = d.type === "wood" ? ["#d4a76c", "#b07c45", "#f0d3a0"] : d.type === "rubber" ? ["#34302f", "#5a5350"] : d.type === "gold" ? ["#fbe08a", "#e2ae35", "#fff"] : [d.color, d.pat, "#e8b84a"];
  const away = s > 0 ? Math.PI : 0; // particles spray away from the hammer

  if (result === "perfect" || result === "ok") {
    const gold = d.type === "gold";
    run.knocked++;
    let pts;
    if (result === "perfect") {
      run.streak++; run.maxStreak = Math.max(run.maxStreak, run.streak);
      // a PERFECT never adds tilt, but from the correcting side it nudges the tower back
      if (s * run.lean < 0) run.lean += s * Math.min(0.07, Math.abs(run.lean));
      impulse(0.03);
      pts = (1 + 2 * run.streak) * (gold ? 3 : 1);
      slowT = 0.25; addShake(3);
      stamp = { text: t("perfect"), streak: run.streak, t: 0, life: 1.0, rot: rand(-0.14, -0.05), seed: (Math.random() * 1e9) | 0, gold };
      run.head.blinkT = 0.45;
      Sound.knock("perfect", run.streak);
      burst(hitX, hitY, 26, { speed: 420, life: 0.7, size: 5, color: ["#fff6c8", "#ffd54a", "#ffffff"], kind: "spark", angle: away, spread: 1.1, gravity: 200 });
      if (run.streak % 5 === 0) { popup(t("streak", { n: run.streak }), LW / 2, standTop - 330, "#c8281e", 24, 1.4); Sound.fanfare(); if (run.mode === "human") platform("happytime"); }
    } else {
      run.streak = 0;
      run.lean += s * 0.11; impulse(0.07);
      pts = gold ? 3 : 1;
      hitStopT = 0.05; addShake(2);
      popup(t("good"), hitX + s * -30, hitY - 40, "#4f7a22", 22);
      Sound.knock("ok");
    }
    if (gold) { Sound.gold(); burst(wc.x, wc.y, 30, { speed: 300, life: 0.9, size: 5, color: ["#fbe08a", "#fff"], kind: "spark", gravity: 120 }); if (result === "perfect" && run.mode === "human") platform("happytime"); }
    run.score += pts;
    popup("+" + pts, wc.x - s * 60, wc.y - 26, gold ? "#b07a18" : "#2a1d14", gold ? 26 : 20, 0.9);
    burst(hitX, hitY, 10, { speed: 260, life: 0.5, size: 4, color: chipColors, angle: away, spread: 1.2 });
    if (Math.abs(prevLean) > 0.55 && s * prevLean < 0) {
      popup(t("save"), LW / 2, standTop - 300, "#c8281e", 24, 1.2);
      if (run.mode === "human") platform("happytime");
    }
    if (Math.abs(prevLean) > 0.15 && s * prevLean < 0) session.steeredOnce = true;
    removeBottom(result === "perfect" ? 1450 : 1050, result === "perfect" ? 9 : 3);
    run.busyT = 0.22;
  } else if (result === "weak") {
    run.streak = 0;
    run.lean += s * 0.26; impulse(0.1);
    d.xTarget = clamp(d.xTarget - s * DW * 0.45, -DW * 0.6, DW * 0.6);
    addShake(6); hitStopT = 0.06;
    popup(t("weak"), hitX + s * -20, hitY - 44, "#3d5a8a", 22);
    Sound.knock("weak");

// ---------- collapse ----------
function collapse() {

// ---------- demo / attract AI ----------
const ai = {
  wait: 0, releaseAt: 50, alt: 1, planned: 24,
  reset() { this.wait = 0.7; this.alt = Math.random() < 0.5 ? -1 : 1; this.planned = 16 + Math.floor(Math.random() * 7); }, // topples ~30-45 s in, so a Shorts clip catches it
  update(dt) {

    if (run.phase === "ready") {

      const b = bandOf(run.discs[0]);
      let side, target;
      if (run.knocked >= this.planned) { // scripted ending: overshoot toward the lean until it topples

// ---------- input ----------
const input = { holding: null };

canvas.addEventListener("pointerdown", e => {

});

  const side = sideFromX(e.clientX);

const KEY_SIDES = { ArrowLeft: -1, KeyA: -1, ArrowRight: 1, KeyD: 1 };
window.addEventListener("keydown", e => {
  const code = e.code || e.key;
  const confirmKey = code === "Space" || code === "Enter" || code === "NumpadEnter";
  Sound.unlock();
  // a button focused by Tab handles Space/Enter itself, so it never fires twice
  const focused = document.activeElement;
  if (confirmKey && focused && focused.tagName === "BUTTON" && focused.offsetParent !== null) return;
  if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(code)) e.preventDefault();
  if (e.repeat) return;
  if (code === "KeyM") { Sound.toggleMute(); Sound.tick(); applyLang(); return; }
  if (!titlePanel.hidden) { if (confirmKey) startGame(); return; }
  if (!overPanel.hidden) {
    if ((confirmKey || code === "KeyR") && performance.now() - overShownAt > 400) startGame();
    return;
  }
  if (paused) { if (confirmKey || code === "KeyP" || code === "Escape") resume(); return; }
  if (run.mode !== "human") return;
  if (code === "KeyR") { startGame(); return; }
  if (code === "KeyP" || code === "Escape") { pause(); return; }
  if (input.holding) return;
  let side = KEY_SIDES[code];
  if (code === "Space") side = run.side;
  if (!side || !run.alive) return;
  session.keys = true;
  input.holding = { src: "key", code, side };
  hammer.side = side;
  startCharge(side);
});
window.addEventListener("keyup", e => {

// ---------- flow ----------
function startGame() {

  Sound.unlock();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // stop Space re-clicking a hidden button
  titlePanel.hidden = true; overPanel.hidden = true; pausePanel.hidden = true; paused = false;
  newRun("human");
  run.head.yOff = -40;
  Sound.start();
  platform("gameplayStart");
  updateHud(true);
}
// banks the best score and reports game over exactly once per human run, even if R skips the game-over screen
function finishRun() {

  run.finished = true; run.isBest = run.score > best;
  if (run.isBest) { best = run.score; store.set(KEY_BEST, best); }
  platform("gameOver", run.score);
}
function showOver() {
  finishRun();
  $("finalScore").textContent = run.score;
  $("newBest").hidden = !run.isBest;
  $("stats").textContent = t("stats", { n: run.knocked, s: run.maxStreak });
  overPanel.hidden = false; overShownAt = performance.now();

}
function pause() {

  paused = true; cancelCharge(); input.holding = null;
  pausePanel.hidden = false;
  platform("gameplayStop");
}
function resume() {
  if (!paused) return;
  paused = false; pausePanel.hidden = true; lastTime = performance.now();
  Sound.unlock();
  platform("gameplayStart");
}
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
window.addEventListener("blur", pause);

titlePanel.addEventListener("click", startGame); // tap anywhere on the title (PLAY's click bubbles here, so it fires once)
$("retryBtn").addEventListener("click", () => { if (performance.now() - overShownAt > 300) startGame(); });
$("resumeBtn").addEventListener("click", resume);
pauseBtn.addEventListener("click", () => { Sound.unlock(); paused ? resume() : pause(); });
muteBtn.addEventListener("click", () => { Sound.unlock(); Sound.toggleMute(); Sound.tick(); applyLang(); });
langBtn.addEventListener("click", () => { Sound.unlock(); lang = lang === "ja" ? "en" : "ja"; store.set(KEY_LANG, lang); Sound.tick(); applyLang(); });
// iOS Safari pinch/double-tap zoom gestures ignore touch-action on some versions
for (const ev of ["gesturestart", "dblclick"]) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
for (const b of document.querySelectorAll("button")) {
  b.addEventListener("pointerdown", e => e.stopPropagation());
  b.addEventListener("click", e => { if (e.detail) b.blur(); }); // after a mouse/touch click, Space goes back to the game
}

function applyLang() {
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  muteBtn.textContent = Sound.muted ? t("soundOff") : t("soundOn");
  langBtn.textContent = t("lang");
  canvas.setAttribute("aria-label", t("aria")); pauseBtn.setAttribute("aria-label", t("pauseBtn"));
  if (!overPanel.hidden) $("stats").textContent = t("stats", { n: run.knocked, s: run.maxStreak });
  hudCache.streak = null;
  updateHud(true);
}

const hudCache = { score: null, streak: null, best: null, vis: null };
function updateHud(force) {
  const vis = run.mode !== "attract";
  if (force || hudCache.vis !== vis) { scoreBox.style.visibility = vis ? "visible" : "hidden"; hudCache.vis = vis; }
  const canPause = run.mode === "human" && run.alive;
  if (pauseBtn.hidden === canPause) pauseBtn.hidden = !canPause;
  if (force || hudCache.score !== run.score) { scoreEl.textContent = run.score; hudCache.score = run.score; }
  const st = run.streak >= 2 ? t("streak", { n: run.streak }) : "";
  if (force || hudCache.streak !== st) { streakEl.textContent = st; hudCache.streak = st; }

}

// ---------- update ----------
function update(realDt) {
  let ts = 1;
  if (hitStopT > 0) { hitStopT -= realDt; ts = 0.04; }
  else if (slowT > 0) { slowT -= realDt; ts = 0.25; }
  const dt = realDt * ts;

  if (run.mode !== "human") ai.update(dt);
  else if (input.holding && run.phase === "ready" && run.alive) startCharge(input.holding.side);

  if (run.phase === "charging") {
    run.chargeT += realDt;
    const cyc = (run.chargeT / sweepTime()) % 2;
    run.rising = cyc < 1;
    run.power = (cyc < 1 ? cyc : 2 - cyc) * 100;
    Sound.chargeSet(run.power);
  }
  if (run.impactT > 0) { run.impactT -= realDt; if (run.impactT <= 0) resolveImpact(); }
  else if (run.phase === "busy") { run.busyT -= dt; if (run.busyT <= 0 && run.alive) run.phase = "ready"; }

  if (run.alive) {
    // tilt: persistent lean that slowly worsens + damped-spring wobble
    run.lean += run.lean * (0.05 + 0.0015 * Math.min(run.knocked, 40)) * dt;
    run.wobV += (-WOBBLE_K * run.wob - WOBBLE_C * run.wobV) * dt;
    run.wob += run.wobV * dt;
    if (Math.abs(tilt()) > 1) collapse();
    const danger = Math.abs(tilt());
    if (danger > 0.68) { run.dangerT -= dt; if (run.dangerT <= 0) { Sound.creak(); run.dangerT = 0.7; } }
    if (run.mode === "human" && run.knocked >= 40 && !run.listenShown) { run.listenShown = true; popup(t("listen"), LW / 2, standTop - 300, "#27407a", 30, 1.8); }
  }
  run.theta = run.alive ? tilt() * 0.25 : run.theta;
  run.squash *= Math.exp(-14 * dt);

  // stack settling
  let landed = false;
  for (const d of run.discs) {
    if (d.yOff < 0 || d.vy) { d.vy += G * dt; d.yOff += d.vy * dt; if (d.yOff >= 0) { if (d.vy > 300) landed = true; d.yOff = 0; d.vy = 0; } }
    d.xOff = lerp(d.xOff, d.xTarget, 1 - Math.exp(-20 * dt));
  }
  if (landed) { run.squash = 0.05; Sound.land(); const wc = towerToWorld(0, 0); burst(wc.x, wc.y, 6, { speed: 80, life: 0.5, size: 8, color: "rgba(160,130,90,.35)", kind: "dust", gravity: -30 }); }

  const hd = run.head;
  if (hd) {
    if (hd.hopDelay > 0) { hd.hopDelay -= dt; if (hd.hopDelay <= 0) { hd.vy = -880; hd.sq = -0.12; Sound.hop(); } }
    if (hd.yOff > 0) { hd.yOff = lerp(hd.yOff, 0, 1 - Math.exp(-30 * dt)); hd.vy = Math.min(hd.vy, 0); }
    if (hd.yOff < 0 || hd.vy < 0) {

      if (hd.yOff >= 0) { if (hd.vy > 500) { hd.sq = 0.22; Sound.headLand(); } hd.yOff = 0; hd.vy = 0; }
    }
    hd.sqV += (-420 * hd.sq - 16 * hd.sqV) * dt; hd.sq += hd.sqV * dt;
    if (hd.blinkT > 0) hd.blinkT -= dt;
  }

  // incoming refill discs swoop in from the side and slide under the hopping head
  for (let i = run.incoming.length - 1; i >= 0; i--) {
    const inc = run.incoming[i];
    inc.t += dt;
    if (inc.t >= inc.dur) {
      run.incoming.splice(i, 1);
      if (!run.alive) continue;
      run.discs.push(inc.d);
      run.head.yOff += DH;
      const n = run.discs.length - 1, lc = discCenterLocal(n), wc = towerToWorld(lc.x, lc.y);
      burst(wc.x - DW / 2, wc.y, 3, { speed: 60, life: 0.4, size: 6, color: "rgba(160,130,90,.3)", kind: "dust", gravity: -20 });
      burst(wc.x + DW / 2, wc.y, 3, { speed: 60, life: 0.4, size: 6, color: "rgba(160,130,90,.3)", kind: "dust", gravity: -20 });
    }
  }

  for (let i = run.fliers.length - 1; i >= 0; i--) {
    const f = run.fliers[i];

    if (f.trail.length > f.trailMax) f.trail.shift();
    f.vy += 1300 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
    if (f.x < -260 || f.x > LW + 260 || f.y > LH + 120) run.fliers.splice(i, 1);
  }

  for (const b of run.bodies) {
    b.vy += 1900 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
    if (b.head) {
      if (b.x < 60) { b.x = 60; b.vx = Math.abs(b.vx) * 0.5; }
      if (b.x > LW - 60) { b.x = LW - 60; b.vx = -Math.abs(b.vx) * 0.5; }
    }
    const ext = Math.abs(Math.sin(b.rot)) * b.w / 2 + Math.abs(Math.cos(b.rot)) * b.h / 2;
    const gy = groundAt(b.x);
    if (b.y + ext > gy) {
      b.y = gy - ext;
      if (b.vy > 160) {
        b.hits++;
        if (b.head && b.hits === 1) {
          run.head.swirl = true; Sound.bonk(); addShake(8);
          if (run.mode !== "human") run.restartT = Math.min(run.restartT, 1);
          burst(b.x, b.y - 30, 8, { speed: 220, life: 0.8, size: 8, color: ["#ffd54a", "#fff3a0"], kind: "star", gravity: 400 });
        } else if (b.hits === 1) Sound.thump();
        burst(b.x, gy, 4, { speed: 90, life: 0.5, size: 9, color: "rgba(150,120,80,.35)", kind: "dust", gravity: -30 });
        b.vy *= -0.3; b.vx *= 0.6; b.vr *= 0.5;
      } else {
        b.vy = 0; b.vx *= Math.exp(-8 * dt); b.vr *= Math.exp(-10 * dt);

          target = clamp(Math.round(b.rot / (Math.PI / 2)), -1, 1) * Math.PI / 2;
        } else target = Math.round(b.rot / Math.PI) * Math.PI;
        b.rot = lerp(b.rot, target, 1 - Math.exp(-8 * dt));
      }
    }
  }

  // hammer pose
  const target = run.phase === "charging" ? -(8 + run.power * 0.36) : run.impactT > 0 ? 6 : -16;
  hammer.ext = lerp(hammer.ext, target, 1 - Math.exp(-(run.impactT > 0 ? 90 : 16) * realDt));
  hammer.alpha = lerp(hammer.alpha, run.alive ? 1 : 0, 1 - Math.exp(-6 * dt));

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.kind === "dust") { p.vx *= Math.exp(-3 * dt); p.size += 14 * dt; }
    if (p.kind !== "dust" && p.kind !== "spark" && p.y > standTop + 40) { p.y = standTop + 40; p.vy *= -0.3; p.vx *= 0.6; }
  }
  for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.t += realDt; if (p.t > p.life) popups.splice(i, 1); }
  if (stamp) { stamp.t += realDt; if (stamp.t > stamp.life) stamp = null; }
  if (run.lastRelease) run.lastRelease.t += realDt;
  if (session.sidesHintT > 0) session.sidesHintT -= realDt;
  shake *= Math.exp(-9 * realDt);

  if (!run.alive) {
    run.collapseT += dt;
    if (run.mode === "human" && run.overT > 0) { run.overT -= realDt; if (run.overT <= 0) showOver(); }
    if (run.mode !== "human" && run.restartT > 0) { run.restartT -= realDt; if (run.restartT <= 0) newRun(run.mode); }
  }
  updateHud(false);
}

// ---------- drawing ----------
function drawHead(g, opts) {

  g.save();

  const body = new Path2D();
  body.moveTo(-54, 0);
  body.bezierCurveTo(-64, -34, -52, -90, 0, -92);
  body.bezierCurveTo(52, -90, 64, -34, 54, 0);
  body.closePath();
  const rg = g.createRadialGradient(-20, -66, 6, 0, -46, 70);
  rg.addColorStop(0, "#ef5a40"); rg.addColorStop(0.6, "#c8281e"); rg.addColorStop(1, "#8f1a12");
  g.fillStyle = rg; g.fill(body);
  g.strokeStyle = "rgba(60,10,5,.6)"; g.lineWidth = 1.5; g.stroke(body);

  g.beginPath(); g.moveTo(-46, -26); g.quadraticCurveTo(0, -16, 46, -26); g.stroke();
  g.fillStyle = "#f2c14e"; g.font = "900 16px " + BRUSH; g.textAlign = "center"; g.textBaseline = "middle";

  g.strokeStyle = "rgba(90,40,20,.35)"; g.lineWidth = 1; g.stroke();

  g.beginPath(); g.moveTo(-26, browY + 3); g.quadraticCurveTo(-16, browY - 5 - danger * 3, -5, browY + 1); g.stroke();
  g.beginPath(); g.moveTo(26, browY + 3); g.quadraticCurveTo(16, browY - 5 - danger * 3, 5, browY + 1); g.stroke();
  // eyes
  const eyeR = 6.5 + danger * 4.5;

    if (opts.swirl) {
      g.strokeStyle = "#1e1410"; g.lineWidth = 1.6; g.beginPath();
      for (let a = 0; a < Math.PI * 5; a += 0.3) { const r = a * 1.2 / (Math.PI * 5) * 8; const px = ex + Math.cos(a + opts.time * 8) * r, py = -55 + Math.sin(a + opts.time * 8) * r; a ? g.lineTo(px, py) : g.moveTo(px, py); }

      g.strokeStyle = "#1e1410"; g.lineWidth = 2.6; g.beginPath(); g.arc(ex, -53, 5.5, Math.PI * 1.1, Math.PI * 1.9); g.stroke();
    } else {

      g.strokeStyle = "#1e1410"; g.lineWidth = 1.4; g.stroke();
      g.fillStyle = "#1e1410"; g.beginPath(); g.arc(ex + look * eyeR * 0.45, -55 + danger * 1.5, 3.4 - danger * 0.8, 0, Math.PI * 2); g.fill();
    }
  }
  // moustache + mouth
  g.strokeStyle = "#1e1410"; g.lineWidth = 2.4;
  g.beginPath(); g.moveTo(-3, -43); g.quadraticCurveTo(-14, -47, -22, -39); g.stroke();
  g.beginPath(); g.moveTo(3, -43); g.quadraticCurveTo(14, -47, 22, -39); g.stroke();
  g.lineWidth = 1.8; g.beginPath();
  if (opts.swirl || danger > 0.5) g.ellipse(0, -37, 3, 2.2 + danger * 1.5, 0, 0, Math.PI * 2);
  else { g.moveTo(-5, -38); g.quadraticCurveTo(0, -34, 5, -38); }
  g.stroke();
  // golden whisker swirls on the cheeks
  g.strokeStyle = "#e8b84a"; g.lineWidth = 1.6;
  for (const sx of [-1, 1]) { g.beginPath(); g.arc(sx * 40, -52, 6, sx > 0 ? Math.PI * 0.5 : Math.PI * 1.5, sx > 0 ? Math.PI * 2.1 : Math.PI * 3.1); g.stroke(); }
  // sweat drops
  if (danger > 0.35 && !opts.swirl) {
    const ph = (opts.time * 1.6) % 1, sx = look >= 0 ? -1 : 1;
    g.fillStyle = "rgba(90,160,230," + (0.9 - ph * 0.6) + ")";
    const dx = sx * 36, dy = -76 + ph * 22;
    g.beginPath(); g.moveTo(dx, dy - 8); g.quadraticCurveTo(dx + 5, dy, dx, dy + 4); g.quadraticCurveTo(dx - 5, dy, dx, dy - 8); g.fill();
  }
  g.restore();
}

function drawHammer(g, x, y, side, alpha) {
  if (alpha < 0.02) return;
  g.save(); g.globalAlpha = alpha;
  g.translate(x, y); if (side > 0) g.scale(-1, 1);
  // drawn for a left-side hammer whose face is at x=0, pointing right
  const tremble = run.phase === "charging" && run.power > 80 ? Math.sin(perfNow * 0.09) * 0.7 : 0;
  g.translate(0, tremble);
  g.save(); g.rotate(0.38);
  g.fillStyle = "#a8743f"; roundRect(g, -27, 10, 9, 92, 4); g.fill();
  g.fillStyle = "rgba(255,255,255,.2)"; g.fillRect(-25, 12, 2, 86);
  g.restore();
  const hg = g.createLinearGradient(0, -19, 0, 19);
  hg.addColorStop(0, "#9b6a3c"); hg.addColorStop(0.35, "#c08a52"); hg.addColorStop(1, "#5e3b1d");
  g.fillStyle = hg; roundRect(g, -50, -19, 50, 38, 6); g.fill();
  g.fillStyle = "#3a2516"; g.fillRect(-44, -19, 5, 38); g.fillRect(-11, -19, 5, 38);
  g.fillStyle = "#e1b57e"; g.beginPath(); g.ellipse(-1, 0, 4, 18, 0, 0, Math.PI * 2); g.fill();
  g.restore();
}

function drawStand(g) {
  const x0 = LW / 2 - 100;
  g.fillStyle = "rgba(60,40,20,.22)"; g.beginPath(); g.ellipse(LW / 2, standTop + 24, 118, 9, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#6e4526"; g.fillRect(x0 + 10, standTop + 10, 14, 14); g.fillRect(x0 + 176, standTop + 10, 14, 14);
  const sg = g.createLinearGradient(0, standTop, 0, standTop + 12);
  sg.addColorStop(0, "#b98250"); sg.addColorStop(1, "#7d5029");
  g.fillStyle = sg; roundRect(g, x0, standTop, 200, 12, 3); g.fill();
  g.fillStyle = "rgba(255,255,255,.25)"; g.fillRect(x0 + 3, standTop + 1, 194, 1.5);
}

function drawTower(g) {
  if (!run.alive) return;
  const th = run.theta, sg = th > 0 ? 1 : th < 0 ? -1 : 0;
  g.save();
  g.translate(LW / 2 + sg * DW / 2, standTop);
  g.rotate(th);
  g.translate(-sg * DW / 2, 0);
  g.scale(1, 1 - run.squash);
  // soft contact shadow between discs is baked into sprites; draw bottom-up
  const n = run.discs.length;
  for (let i = 0; i < n; i++) {
    const d = run.discs[i];
    const x = d.xOff + bendAt(i) - DW / 2, y = -(i + 1) * DH + d.yOff;
    drawDiscAt(g, d, x, y);
    if (d.type === "gold") { // travelling shimmer so gold reads at a glance
      const sx = x + ((perfNow * 0.0007 + (d.seed % 10) * 0.1) % 1.6 - 0.3) * DW;
      const gr = g.createLinearGradient(sx - 22, 0, sx + 22, 0);
      gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(0.5, "rgba(255,255,240,.7)"); gr.addColorStop(1, "rgba(255,255,255,0)");
      g.save(); roundRect(g, x, y, DW, DH, 9); g.clip(); g.fillStyle = gr; g.fillRect(x, y, DW, DH); g.restore();
    }
  }
  if (run.phase === "charging" && n) { // glow on the disc about to be struck
    const d = run.discs[0];
    g.strokeStyle = "rgba(255,213,74," + (0.35 + 0.35 * Math.sin(perfNow * 0.02)) + ")"; g.lineWidth = 2.5;
    roundRect(g, d.xOff - DW / 2 - 1, -DH - 1 + d.yOff, DW + 2, DH + 2, 10); g.stroke();
  }
  g.save();
  g.translate(bendAt(n), -n * DH + run.head.yOff);
  drawHead(g, { tilt: tilt(), sq: run.head.sq, swirl: false, happy: run.head.blinkT > 0, time: perfNow / 1000 });
  g.restore();
  g.restore();
}

function drawIncoming(g) {
  for (const inc of run.incoming) {
    if (inc.t < 0) continue;
    const e = clamp(inc.t / inc.dur, 0, 1), k = 1 - (1 - e) * (1 - e);
    const n = run.discs.length, tgt = towerToWorld(bendAt(n), -(n + 0.5) * DH);
    const sx = LW / 2 + inc.from * 300, sy = tgt.y - 120;
    const x = lerp(sx, tgt.x, k), y = lerp(sy, tgt.y, k) - Math.sin(Math.PI * e) * 40;
    g.save(); g.translate(x, y); g.rotate((1 - k) * inc.from * -0.8 + run.theta * k);
    drawDiscAt(g, inc.d, -DW / 2, -DH / 2);
    g.restore();
  }
}

function drawSprite(g, d, x, y, rot, alpha) {
  g.save(); g.globalAlpha = alpha; g.translate(x, y); g.rotate(rot); drawDiscAt(g, d, -DW / 2, -DH / 2); g.restore();
}

function drawParticles(g) {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    g.save(); g.globalAlpha = p.kind === "dust" ? a * 0.8 : Math.min(1, a * 1.5);
    g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.color;
    if (p.kind === "dust") { g.beginPath(); g.arc(0, 0, p.size, 0, Math.PI * 2); g.fill(); }
    else if (p.kind === "shard") { g.beginPath(); g.moveTo(-p.size, -p.size * 0.4); g.lineTo(p.size, 0); g.lineTo(-p.size * 0.3, p.size * 0.6); g.closePath(); g.fill(); }
    else if (p.kind === "spark") { const s = p.size; g.beginPath(); g.moveTo(0, -s); g.lineTo(s * 0.3, 0); g.lineTo(0, s); g.lineTo(-s * 0.3, 0); g.closePath(); g.fill(); }
    else if (p.kind === "star") { starPath(g, p.size); g.fill(); g.strokeStyle = "#b07a18"; g.lineWidth = 1; g.stroke(); }
    else g.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
    g.restore();
  }
}
function starPath(g, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  g.closePath();
}

function outlinedText(g, text, x, y, size, color, font) {
  g.font = "900 " + size + "px " + (font || FONT);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.lineJoin = "round"; g.lineWidth = Math.max(3, size * 0.2); g.strokeStyle = "rgba(255,250,240,.95)";
  g.strokeText(text, x, y); g.fillStyle = color; g.fillText(text, x, y);
}

function drawStamp(g) {
  if (!stamp) return;
  const s = stamp, k = s.t < 0.12 ? s.t / 0.12 : 1;
  const sc = lerp(1.9, 1, 1 - Math.pow(1 - k, 3));
  const alpha = s.t > s.life - 0.25 ? (s.life - s.t) / 0.25 : 1;
  const rnd = mulberry32(s.seed);
  g.save();
  g.globalAlpha = clamp(alpha, 0, 1);
  g.translate(LW / 2, standTop - 210); g.rotate(s.rot); g.scale(sc, sc);
  // brush swash: tapered body plus dry-brush streaks
  const ink = s.gold ? "#c8901e" : "#c8281e";
  g.fillStyle = ink;
  g.beginPath(); g.moveTo(-138, 6);
  g.bezierCurveTo(-110, -30, 60, -34, 140, -14);
  g.bezierCurveTo(150, -6, 146, 10, 128, 14);
  g.bezierCurveTo(40, 24, -80, 30, -138, 6); g.fill();
  g.strokeStyle = ink; g.lineCap = "round";
  for (let i = 0; i < 9; i++) {
    const y = -22 + i * 5 + rnd() * 2, x1 = -120 + rnd() * 30, x2 = 120 + rnd() * 40;
    g.globalAlpha = clamp(alpha, 0, 1) * (0.4 + rnd() * 0.5); g.lineWidth = 1 + rnd() * 2.2;
    g.beginPath(); g.moveTo(x1, y + 6); g.quadraticCurveTo(0, y - 4, x2, y); g.stroke();
  }
  g.globalAlpha = clamp(alpha, 0, 1);
  g.font = "italic 900 44px " + BRUSH; g.textAlign = "center"; g.textBaseline = "middle";
  g.lineJoin = "round"; g.lineWidth = 6; g.strokeStyle = "#2a1d14"; g.strokeText(s.text, 0, -2);
  g.fillStyle = "#fffaf0"; g.fillText(s.text, 0, -2);
  if (s.streak >= 2) outlinedText(g, "×" + s.streak, 112, 26, 24, "#2a1d14");
  g.restore();
}

function drawGauge(g) {
  const cx = LW / 2, w = 200, y = gaugeY, v = clamp(tilt(), -1.15, 1.15);
  g.save();
  g.fillStyle = "rgba(255,250,240,.75)"; roundRect(g, cx - w / 2 - 8, y - 9, w + 16, 18, 9); g.fill();
  g.fillStyle = "rgba(200,40,30,.28)";
  g.fillRect(cx - w / 2, y - 4, w * 0.15, 8); g.fillRect(cx + w / 2 - w * 0.15, y - 4, w * 0.15, 8);
  g.fillStyle = "rgba(42,29,20,.18)"; g.fillRect(cx - w / 2 + w * 0.15, y - 2, w * 0.7, 4);
  g.fillStyle = "#2a1d14"; g.fillRect(cx - 1, y - 7, 2, 14);
  const danger = Math.abs(v);
  g.fillStyle = danger > 0.7 ? "#c8281e" : danger > 0.4 ? "#d29a22" : "#5f8a2e";
  g.beginPath(); g.arc(cx + v * w / 2, y, 7 + (danger > 0.7 ? Math.sin(perfNow * 0.03) * 1.5 : 0), 0, Math.PI * 2); g.fill();
  g.strokeStyle = "#fff"; g.lineWidth = 2; g.stroke();
  g.font = "800 10px " + FONT; g.fillStyle = "#7a6250"; g.textAlign = "center"; g.textBaseline = "bottom";
  g.fillText(t("lean"), cx, y - 10);
  g.restore();
}

function drawMeter(g) {
  const d = run.discs[0];
  const x0 = 50, w = 260, y = meterY - 11, h = 22;
  g.save();
  g.fillStyle = "#3b2a20"; roundRect(g, x0 - 4, y - 4, w + 8, h + 8, 15); g.fill();
  g.fillStyle = "#5a4232"; roundRect(g, x0, y, w, h, 11); g.fill();
  if (d) {
    const b = bandOf(d), X = p => x0 + p / 100 * w;
    g.fillStyle = "#79b33d"; g.fillRect(X(b.lo), y, X(b.hi) - X(b.lo), h);
    g.fillStyle = "#ffd54a"; g.fillRect(X(b.c - b.perf), y, X(b.c + b.perf) - X(b.c - b.perf), h);
    // fill fades once the player should be listening for the pitch instead
    const fade = run.knocked >= 40 ? 0.3 : 1;
    if (run.phase === "charging" || run.impactT > 0) {
      const p = run.phase === "charging" ? run.power : run.strikePower;
      g.globalAlpha = fade;
      g.fillStyle = "rgba(255,240,215,.55)"; roundRect(g, x0, y, Math.max(11, X(p) - x0), h, 11); g.fill();
      g.fillStyle = "#fff"; g.fillRect(X(p) - 2, y - 7, 4, h + 14);
      g.beginPath(); g.moveTo(X(p) - 7, y - 12); g.lineTo(X(p) + 7, y - 12); g.lineTo(X(p), y - 4); g.fill();
      g.globalAlpha = 1;
    }
    g.fillStyle = "rgba(255,255,255,.18)";
    for (const tk of [25, 50, 75]) g.fillRect(X(tk) - 0.5, y + 3, 1, h - 6);
    const lr = run.lastRelease;
    if (lr && lr.t < 1.4 && run.phase !== "charging") {
      g.globalAlpha = clamp(1.4 - lr.t, 0, 1);
      g.fillStyle = lr.result === "perfect" ? "#ffd54a" : lr.result === "ok" ? "#79b33d" : "#e05040";
      const px = x0 + lr.p / 100 * w;
      g.beginPath(); g.moveTo(px, y + h + 2); g.lineTo(px - 6, y + h + 11); g.lineTo(px + 6, y + h + 11); g.fill();
      g.globalAlpha = 1;
    }
    // label: disc type + how hard
    const isNew = !run.seenTypes.has(d.type) && run.mode === "human";
    g.textBaseline = "middle"; g.textAlign = "left";
    g.save(); g.translate(x0, y - 18); g.scale(0.16, 0.5); drawDiscAt(g, d, 0, -DH / 2); g.restore();
    g.font = "900 13px " + FONT; g.fillStyle = "#2a1d14";
    const label = STR[lang].types[d.type] + "  " + STR[lang].typeHints[d.type];
    g.fillText(label, x0 + 30, y - 18);
    if (isNew && run.knocked > 0) {
      const lw = g.measureText(label).width;
      g.fillStyle = "#c8281e"; roundRect(g, x0 + 36 + lw, y - 26, 36, 16, 8); g.fill();
      g.fillStyle = "#fff"; g.font = "900 10px " + FONT; g.textAlign = "center"; g.fillText(t("newType"), x0 + 54 + lw, y - 18);
    }
    if (run.knocked < 10 && run.mode === "human") {
      const bx = (X(b.lo) + X(b.hi)) / 2, bob = Math.sin(perfNow * 0.008) * 2;
      g.textAlign = "right"; g.font = "900 11px " + FONT; g.fillStyle = "#4f7a22";
      g.fillText(t("here"), x0 + w, y - 18 + bob);
      g.beginPath(); g.moveTo(bx - 5, y - 8 + bob); g.lineTo(bx + 5, y - 8 + bob); g.lineTo(bx, y - 2 + bob); g.fill();
    }
  }
  g.restore();
}

function drawHints(g) {
  if (run.mode !== "human" || !run.alive || paused) return;
  const pulse = 0.85 + 0.15 * Math.sin(perfNow * 0.006);
  const pill = (text, x, y, color) => {
    g.font = "900 15px " + FONT;
    const w = g.measureText(text).width + 26;
    g.fillStyle = "rgba(251,245,232,.92)"; roundRect(g, x - w / 2, y - 16, w, 32, 16); g.fill();
    g.strokeStyle = color; g.lineWidth = 2; g.stroke();
    g.fillStyle = color; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, x, y + 1);
  };
  if (!session.firstHintDone) {
    g.save(); g.globalAlpha = pulse;
    if (run.phase === "charging") pill(t("hintRelease"), LW / 2, meterY - 52, "#4f7a22");
    else {
      pill(t(session.keys ? "hintHoldKey" : "hintHold"), LW / 2, standTop - 150, "#2a1d14");
      // hand icon pressing
      const yy = standTop - 100 + Math.sin(perfNow * 0.008) * 4;
      g.fillStyle = "#fffaf0"; g.strokeStyle = "#2a1d14"; g.lineWidth = 2;
      g.beginPath(); g.arc(LW / 2, yy, 11, 0, Math.PI * 2); g.fill(); g.stroke();
      g.beginPath(); g.arc(LW / 2, yy, 18 + (perfNow * 0.03 % 12), 0, Math.PI * 2); g.globalAlpha = 0.4; g.stroke();
    }
    g.restore();
    return;
  }
  const steerHint = !session.steeredOnce && Math.abs(run.lean) > 0.22 && run.phase !== "busy";
  if (session.sidesHintT > 0 && run.phase !== "charging" && !stamp && !steerHint) { // the steer hint already says it
    g.save(); g.globalAlpha = clamp(session.sidesHintT, 0, 1) * 0.9;
    pill(t(session.keys ? "hintSidesKey" : "hintSides"), LW / 2, standTop - 150, "#2a1d14");
    g.restore();
  }
  if (steerHint) {
    const s = run.lean > 0 ? -1 : 1, x = LW / 2 + s * 112, y = standTop - 60;
    g.save(); g.globalAlpha = pulse;
    g.fillStyle = "rgba(200,40,30,.10)"; g.fillRect(s < 0 ? 0 : LW / 2, 0, LW / 2, LH);
    g.fillStyle = "#c8281e";
    g.beginPath(); g.moveTo(x + s * 22, y - 14); g.lineTo(x - s * 6, y - 14); g.lineTo(x - s * 6, y - 26); g.lineTo(x - s * 28, y); g.lineTo(x - s * 6, y + 26); g.lineTo(x - s * 6, y + 14); g.lineTo(x + s * 22, y + 14); g.closePath(); g.fill();
    pill(t(session.keys ? "hintSteerKey" : "hintSteer"), LW / 2, standTop - 200, "#c8281e");
    g.restore();
  }
}

let perfNow = 0;
function draw() {
  const g = ctx;
  if (!bgCanvas) return;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(bgCanvas, 0, 0);
  g.setTransform(rs, 0, 0, rs, 0, 0);

  g.save();
  if (shake > 0.2) g.translate(rand(-shake, shake), rand(-shake, shake));
  drawStand(g);
  drawTower(g);
  drawIncoming(g);
  for (const b of run.bodies) {
    if (b.head) {
      g.save(); g.translate(b.x, b.y); g.rotate(b.rot); g.translate(0, HEAD_H / 2);
      drawHead(g, { tilt: 0, sq: 0, swirl: run.head.swirl, happy: false, time: perfNow / 1000 });
      g.restore();
      if (run.head.swirl) { // orbiting stars
        for (let i = 0; i < 3; i++) {
          const a = perfNow * 0.005 + i * Math.PI * 2 / 3;
          g.save(); g.translate(b.x + Math.cos(a) * 40, b.y - 62 + Math.sin(a) * 9); g.fillStyle = "#ffd54a"; starPath(g, 7); g.fill(); g.restore();
        }
      }
    } else drawSprite(g, b.d, b.x, b.y, b.rot, 1);
  }
  for (const f of run.fliers) {
    f.trail.forEach((p, i) => drawSprite(g, f.d, p.x, p.y, p.rot, 0.35 * (i + 1) / (f.trail.length + 1)));
    drawSprite(g, f.d, f.x, f.y, f.rot, 1);
  }
  const bottomY = towerToWorld(0, -DH / 2).y;
  const bx = run.discs[0] ? run.discs[0].xOff : 0;
  drawHammer(g, LW / 2 + bx + hammer.side * (DW / 2 - hammer.ext), bottomY, hammer.side, hammer.alpha);
  drawParticles(g);
  for (const p of popups) {
    const k = p.t / p.life, a = k > 0.7 ? (1 - k) / 0.3 : 1, pop = k < 0.12 ? lerp(0.5, 1.15, k / 0.12) : lerp(1.15, 1, Math.min(1, (k - 0.12) * 5));
    g.font = "900 " + p.size + "px " + FONT;
    const hw = (g.measureText(p.text).width / 2 + p.size * 0.1) * pop + 6; // keep the whole word on screen
    g.save(); g.globalAlpha = clamp(a, 0, 1); g.translate(clamp(p.x, hw, LW - hw), p.y - k * 36); g.scale(pop, pop);
    outlinedText(g, p.text, 0, 0, p.size, p.color);
    g.restore();
  }
  g.restore();

  // danger vignette
  const dg = run.alive ? clamp((Math.abs(tilt()) - 0.6) / 0.4, 0, 1) : 0;
  if (dg > 0) {
    const vg = g.createRadialGradient(LW / 2, LH / 2, LH * 0.3, LW / 2, LH / 2, LH * 0.75);
    vg.addColorStop(0, "rgba(200,30,20,0)"); vg.addColorStop(1, "rgba(200,30,20," + (dg * (0.3 + 0.15 * Math.sin(perfNow * 0.015))) + ")");
    g.fillStyle = vg; g.fillRect(0, 0, LW, LH);
  }
  if (run.alive) drawGauge(g);
  if (run.alive) drawMeter(g);
  drawHints(g);
  drawStamp(g);
}

// ---------- main loop ----------
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
  lastTime = now; perfNow = now;
  requestAnimationFrame(frame);
  if (!paused) update(dt);
  draw();
}

window.addEventListener("resize", resize);
resize();
applyLang();
if (demoMode) { titlePanel.hidden = true; document.querySelector(".btns").hidden = true; newRun("demo"); } // clean frame for recording
else newRun("attract");
updateHud(true);
requestAnimationFrame(frame);
})();
</script>
</body>
