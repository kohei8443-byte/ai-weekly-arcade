<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>餅つきビート / Mochi Pound</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#bfe6ff}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;color:#3b2414;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;pointer-events:none;font-size:16px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1em;pointer-events:auto;touch-action:none}
.ov.dim{background:rgba(60,30,10,.38);box-shadow:0 0 0 100vmax rgba(60,30,10,.38)}
#ovTitle{justify-content:flex-start;padding-top:3.2em}
.card{background:rgba(255,252,243,.93);border:.18em solid #d7263d;border-radius:1.1em;padding:1em 1.1em .9em;text-align:center;width:min(19.6em,100%);box-shadow:0 .35em 0 rgba(140,40,20,.28),0 .8em 2em rgba(0,0,0,.18)}
.logo{line-height:1.05}
.logo .main{display:block;font-size:2.2em;white-space:nowrap;font-weight:900;color:#e0283c;letter-spacing:.02em;text-shadow:0 .06em 0 #fff,0 .1em 0 #8e1426}
.logo .sub{display:block;margin-top:.35em;font-size:.82em;font-weight:800;letter-spacing:.3em;color:#b07a2a}
.howto{margin:.75em 0 .2em;font-size:.98em;font-weight:800;line-height:1.45;white-space:pre-line}
.keys{font-size:.72em;opacity:.7;margin-top:.45em;font-weight:700}
.best{font-size:.8em;font-weight:800;margin-top:.5em;color:#8a5a1c}
.quick{display:inline-block;margin-top:.45em;background:#e0283c;color:#fff;padding:.2em .75em;border-radius:1em;font-size:.76em;font-weight:900;line-height:1.35}
.row{display:flex;gap:.5em;justify-content:center;margin-top:.7em}
button{font:inherit;font-weight:900;cursor:pointer;border:0;border-radius:.8em;color:inherit;pointer-events:auto;touch-action:manipulation}
button:focus{outline:none}
button:focus-visible{outline:.15em solid #1f6fd1;outline-offset:.15em}
.big{background:#e0283c;color:#fff;font-size:1.32em;padding:.5em 1.7em;margin-top:.55em;box-shadow:0 .22em 0 #8e1426}
.big:active{transform:translateY(.15em);box-shadow:0 .07em 0 #8e1426}
.small{background:#fff3d6;color:#7a4b12;font-size:.8em;padding:.45em .9em;box-shadow:0 .15em 0 #d9b77a}
.small b{color:#e0283c}
.credit{position:absolute;bottom:.7em;left:0;right:0;text-align:center;font-size:.72em;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(80,40,0,.7)}
#topbar{position:absolute;top:.45em;right:.45em;display:flex;gap:.4em;pointer-events:none}
.icon{width:2.3em;height:2.3em;padding:0;display:grid;place-items:center;background:rgba(255,255,255,.88);box-shadow:0 .13em 0 rgba(120,50,20,.3)}
.icon svg{width:1.3em;height:1.3em;display:block}
.over-head{font-size:2.2em;font-weight:900;color:#e0283c;text-shadow:0 .06em 0 #fff,0 .1em 0 #8e1426}
.over-head.cool{font-size:1.45em;color:#4a6fa5;text-shadow:0 .06em 0 #fff,0 .1em 0 #263f66}
.bpm-label{margin-top:.4em;font-size:.8em;font-weight:900;letter-spacing:.15em;color:#b07a2a}
.bpm-big{font-size:4.2em;font-weight:900;line-height:1;color:#3b2414;letter-spacing:-.02em}
.bpm-big small{font-size:.28em;letter-spacing:.1em;margin-left:.2em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.3em .8em;margin:.7em 0 .2em;font-size:.86em;font-weight:800;text-align:left}
.stats span{opacity:.65;font-weight:700}
.stats b{text-align:right}
.badge{display:inline-block;margin-top:.4em;background:#ffcf3a;color:#7a3b00;padding:.15em .7em;border-radius:1em;font-size:.8em;font-weight:900}
.p-title{font-size:1.8em;font-weight:900;color:#e0283c}
.hint{font-size:.75em;opacity:.65;margin-top:.5em;font-weight:700}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="ui">
  <section id="ovTitle" class="ov">
    <div class="card">
      <div class="logo"><span class="main" id="logoMain">餅つきビート</span><span class="sub" id="logoSub">MOCHI POUND</span></div>
      <p class="howto" data-s="howto"></p>
      <button id="btnStart" class="big" data-s="start"></button>
      <div class="keys" data-s="startKey"></div>
      <div class="best" id="titleBest"></div>
      <div class="quick" id="titleQuick" hidden></div>
      <div class="row"><button id="btnLang" class="small"></button></div>
    </div>
    <div class="credit">Made with Claude</div>
  </section>
  <section id="ovPause" class="ov dim" hidden>
    <div class="card">
      <div class="p-title" data-s="paused"></div>
      <button id="btnResume" class="big" data-s="resume"></button>
      <div class="row"><button id="btnRestart" class="small" data-s="restart"></button><button id="btnQuit" class="small" data-s="toTitle"></button></div>
      <div class="hint" data-s="resumeKey"></div>
    </div>
  </section>
  <section id="ovOver" class="ov dim" hidden>
    <div class="card">
      <div class="over-head" id="overHead"></div>
      <div class="bpm-label" data-s="maxBpm"></div>
      <div class="bpm-big"><span id="overBpm">0</span><small>BPM</small></div>
      <div id="overBadge" class="badge" data-s="newBest" hidden></div>
      <div class="stats" id="overStats"></div>
      <button id="btnRetry" class="big" data-s="retry"></button>
      <div class="row"><button id="btnToTitle" class="small" data-s="toTitle"></button></div>
      <div class="hint" data-s="retryKey"></div>
    </div>
  </section>
  <div id="topbar">
    <button id="btnPause" class="icon" aria-label="pause" hidden><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4" height="14" rx="1.2" fill="#7a3b12"/><rect x="12" y="3" width="4" height="14" rx="1.2" fill="#7a3b12"/></svg></button>
    <button id="btnMute" class="icon" aria-label="sound"></button>
  </div>
</div>
</div>
<script>
(function () {
"use strict";

window.Platform = window.Platform || { gameplayStart() {}, gameplayStop() {}, happytime() {}, gameOver(score) {} };
function platform(name, arg) { try { const fn = window.Platform[name]; if (typeof fn === "function") fn.call(window.Platform, arg); } catch (e) { /* SDK errors must never break the game */ } }

// ---------- constants ----------
const W = 360, H = 640;
const PERFECT_MS = 45, GOOD_MS = 110;
const POUNDS_PER_MOCHI = 20;
const DEMO = /[?&]demo=1(&|$)/.test(location.search);
const AI_START_MOCHI = 3, DEMO_START_MOCHI = 8;
const QUICK_START_MOCHI = 3; // bpmOf(3) = 120: once a player has reached mochi 3, later runs start there
const HAND_HIT_COOLS = 2;    // a hand hit costs this many cools (3 cools end the run)
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif';
const BRUSH = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif';
const reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

const STR = {
  ja: {
    title: "餅つきビート", sub: "MOCHI POUND",
    howto: "「ドン」の拍でタップしてつこう!\n相方の手が臼に入ってる時はダメ!",
    start: "はじめる", startKey: "タップ / スペース / Enter",
    best: "ベスト", maxBpm: "最高BPM", langBtn: "<b>日本語</b> / EN",
    paused: "一時停止", resume: "つづける", restart: "最初から", toTitle: "タイトル", resumeKey: "スペースかタップで再開",
    retry: "もう一回", retryKey: "スペース / Enter でリトライ", newBest: "ベスト更新!",
    score: "スコア", combo: "コンボ", mochi: "もち", goldMochi: "金もち",
    perfect: "ペッタン!", good: "ペタッ", late: "おそい…", early: "はやい!",
    hint1: "「ドン!」でタップ", hint2: "手が入ってる時は打たない!",
    cue_double: "もう一回!", cue_water: "お水~", cue_feint: "ニヤリ", cue_glance: "あれ?",
    tip_double: "手が入ったまま! 1拍がまん", tip_water: "水入れ中! 手が出るまで待て",
    tip_feint: "フェイント! 拍を信じて打て", tip_glance: "よそ見で手が遅い! 拍ぴったりで",
    bpmUp: "テンポUP!", golden: "金の餅! 得点×2", ouch: "イタッ!", overBonk: "イタッ!!", overCool: "餅が冷めた…",
    sMochi: "できた餅", sScore: "スコア", sBest: "ベスト", sPerfect: "ペッタン", sCombo: "最大コンボ", sPounds: "ついた回数",
    cooled: "ヒュ~", ouchCost: "冷め×2", quickStart: "★ 3個目到達! 120 BPMからスタート"
  },
  en: {
    title: "Mochi Pound", sub: "餅つきビート",
    howto: "Tap on the DON beat!\nNot while the hands are in!",
    start: "Start", startKey: "Tap / Space / Enter",
    best: "Best", maxBpm: "TOP BPM", langBtn: "日本語 / <b>EN</b>",
    paused: "Paused", resume: "Resume", restart: "Restart", toTitle: "Title", resumeKey: "Space or tap to resume",
    retry: "Again", retryKey: "Space / Enter to retry", newBest: "New best!",
    score: "SCORE", combo: "COMBO", mochi: "MOCHI", goldMochi: "GOLD",
    perfect: "PERFECT!", good: "GOOD", late: "LATE", early: "EARLY",
    hint1: "Tap on the DON!", hint2: "Never hit the hands!",
    cue_double: "Once more!", cue_water: "Water~", cue_feint: "Heh heh", cue_glance: "Huh?",
    tip_double: "Hands stay in! Skip one beat", tip_water: "Water break! Wait for the hands",
    tip_feint: "A fake! Trust the beat and pound", tip_glance: "Distracted, slow hands! Hit right on the beat",
    bpmUp: "TEMPO UP!", golden: "GOLDEN MOCHI! x2", ouch: "OUCH!", overBonk: "OUCH!!", overCool: "Mochi went cold…",
    sMochi: "Mochi made", sScore: "Score", sBest: "Best", sPerfect: "Perfects", sCombo: "Max combo", sPounds: "Pounds",
    cooled: "brrr…", ouchCost: "2 cools!", quickStart: "★ Mochi 3 reached! Start at 120 BPM"
  }
};

// ---------- storage (never throws) ----------
const num = v => { v = Number(v); return isFinite(v) && v > 0 ? v : 0; };
const store = (function () {
  const KEY = "mochitsuki-beat.v1";
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { data = {}; }
  return {
    get(k, d) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : d; },
    set(k, v) { data[k] = v; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage blocked */ } }
  };
})();

let lang = store.get("lang", null);
if (lang !== "ja" && lang !== "en") lang = (navigator.language || "").toLowerCase().startsWith("ja") ? "ja" : "en";
const S = k => (STR[lang] && STR[lang][k]) || STR.ja[k] || k;

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const wrap = $("wrap"), cv = $("cv"), uiEl = $("ui"), ctx = cv.getContext("2d");
const ovTitle = $("ovTitle"), ovPause = $("ovPause"), ovOver = $("ovOver");
const btnPause = $("btnPause"), btnMute = $("btnMute");

let cssW = 360, cssH = 640, dpr = 1, scale = 1, ox = 0, oy = 0;
function resize() {
  cssW = wrap.clientWidth || innerWidth; cssH = wrap.clientHeight || innerHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = Math.min(cssW / W, cssH / H);
  ox = (cssW - W * scale) / 2; oy = (cssH - H * scale) / 2;
  uiEl.style.left = ox + "px"; uiEl.style.top = oy + "px";
  uiEl.style.width = W * scale + "px"; uiEl.style.height = H * scale + "px";
  uiEl.style.fontSize = (16 * scale) + "px";
}
window.addEventListener("resize", resize);

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-s]").forEach(el => { el.textContent = S(el.getAttribute("data-s")); });
  $("logoMain").textContent = S("title"); $("logoSub").textContent = S("sub");
  $("btnLang").innerHTML = S("langBtn");
  updateTitleBest();
}
function updateTitleBest() {
  const b = num(store.get("best", 0)), bb = num(store.get("bestBpm", 0));
  $("titleBest").textContent = b > 0 ? `${S("best")} ${fmt(b)} ・ ${S("maxBpm")} ${bb}` : "";
  const q = $("titleQuick");
  q.textContent = S("quickStart"); q.hidden = !quickStart();
}
const quickStart = () => store.get("reached3", false) === true;
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

// ---------- audio ----------
let actx = null, master = null, bus = null, noiseBuf = null;
let muted = !!store.get("mute", false);
function ensureAudio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { actx = new AC(); } catch (e) { actx = null; return; }
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.85;
    master.connect(comp); comp.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    newBus();
  }
  if (actx.state !== "running" && actx.state !== "closed") actx.resume().catch(() => {});
}
// scheduled click-track notes go to a bus we can drop on pause
function newBus() {
  if (!actx) return;
  if (bus) { try { bus.disconnect(); } catch (e) {} }
  bus = actx.createGain(); bus.connect(master);
}
const audioOn = () => actx && actx.state === "running";
function env(g, when, peak, dur, att) {
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(peak, when + (att || 0.003));
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
}
function osc(type, f0, f1, dur, peak, when, dest, att) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, when);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, when + dur * 0.9);
  env(g, when, peak, dur, att); o.connect(g); g.connect(dest || master);
  o.start(when); o.stop(when + dur + 0.05);
}
function noise(ftype, freq, q, dur, peak, when, dest, f1) {
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.setValueAtTime(freq, when);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, when + dur);
  f.Q.value = q; env(g, when, peak, dur, 0.002);
  s.connect(f); f.connect(g); g.connect(dest || master);
  s.start(when, Math.random() * 0.5); s.stop(when + dur + 0.05);
}
const YO = [293.66, 329.63, 392.0, 440.0, 493.88, 587.33, 659.25, 783.99, 880.0];
const MELODY = [5, 4, 3, 4, 5, 5, 6, 5, 4, 3, 2, 3, 4, -1, 3, -1, 3, 4, 5, 6, 7, 6, 5, 4, 3, 4, 3, 2, 1, -1, 2, -1];
const sfx = {
  don(w, v) { osc("sine", 160, 62, 0.2, 0.42 * v, w, bus); noise("lowpass", 380, 1, 0.06, 0.25 * v, w, bus); },
  ka(w) { noise("bandpass", 3200, 5, 0.035, 0.22, w, bus); osc("square", 1900, 1800, 0.02, 0.03, w, bus); },
  stick(w, accent) { osc("sine", 1250 * accent, 1150 * accent, 0.07, 0.3, w, bus); noise("bandpass", 2500, 3, 0.03, 0.18, w, bus); },
  koto(w, f) { osc("triangle", f, f * 0.995, 0.42, 0.11, w, bus, 0.002); osc("sine", f * 2, f * 2, 0.14, 0.04, w, bus, 0.002); },
  bass(w, f) { osc("sine", f, f * 0.97, 0.3, 0.3, w, bus, 0.005); },
  shaker(w) { noise("highpass", 6500, 0.8, 0.035, 0.07, w, bus); },
  splash(w) { for (let i = 0; i < 3; i++) noise("bandpass", 2200 + i * 900, 2, 0.12, 0.14, w + i * 0.035, bus, 900); },
  pound(strength) {
    if (!audioOn()) return; const w = actx.currentTime;
    osc("sine", 120, 42, 0.24, 0.75 * strength, w);
    noise("lowpass", 900, 1, 0.13, 0.5 * strength, w, null, 200);
    noise("bandpass", 650, 4, 0.11, 0.22 * strength, w + 0.012, null, 1600);
  },
  perfect() {
    if (!audioOn()) return; const w = actx.currentTime + 0.01;
    osc("sine", 1568, 1568, 0.18, 0.11, w); osc("sine", 2349, 2349, 0.22, 0.07, w + 0.03);
  },
  whiff() { if (!audioOn()) return; noise("bandpass", 500, 2, 0.08, 0.15, actx.currentTime, null, 300); },
  cool() { if (!audioOn()) return; const w = actx.currentTime; osc("triangle", 330, 150, 0.28, 0.2, w); osc("sine", 1300, 420, 0.45, 0.08, w + 0.05); },
  bonk() {
    if (!audioOn()) return; const w = actx.currentTime;
    osc("sine", 720, 480, 0.14, 0.7, w); osc("square", 360, 240, 0.08, 0.15, w); noise("bandpass", 1400, 3, 0.09, 0.5, w);
    const f = actx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1500; f.Q.value = 1.2; f.connect(master);
    osc("square", 520, 980, 0.07, 0.22, w + 0.1, f); osc("square", 1050, 560, 0.24, 0.24, w + 0.17, f);
    osc("sine", 300, 110, 0.5, 0.18, w + 0.45);
  },
  done(golden) {
    if (!audioOn()) return; const w = actx.currentTime;
    [3, 4, 5, 7].forEach((n, i) => osc("triangle", YO[n] * (golden ? 1.5 : 1), YO[n], 0.25, 0.14, w + i * 0.06));
    if (golden) for (let i = 0; i < 6; i++) osc("sine", 2000 + i * 300, 2100 + i * 300, 0.12, 0.05, w + 0.25 + i * 0.04);
  },
  ui() { if (!audioOn()) return; osc("sine", 880, 1320, 0.08, 0.12, actx.currentTime); }
};
function slotAudio(s, w) {
  const n = s.mochi;
  if (s.on) {
    if (s.kind === "count") sfx.stick(w, s.countNum === 1 ? 1.25 : 1);
    else sfx.don(w, s.kind === "pound" ? 1 : 0.7);
    if (n >= 2 && s.kind !== "count") {
      const m = MELODY[s.beatNo % MELODY.length];
      if (m >= 0) sfx.koto(w, YO[m] * (s.golden ? 1.335 : 1));
    }
    if (n >= 4 && s.beatNo % 2 === 0) sfx.bass(w, s.beatNo % 4 === 0 ? 73.4 : 55);
  } else {
    if (s.kind !== "rest") sfx.ka(w);
    if (s.kind === "water" && s.waterFirst) sfx.splash(w);
    if (n >= 3 && s.kind !== "rest") {
      const m = MELODY[(s.beatNo + 7) % MELODY.length];
      if (n >= 6 && m >= 0) sfx.koto(w, YO[m] * 2 * (s.golden ? 1.335 : 1));
    }
  }
  if (n >= 5) { sfx.shaker(w); sfx.shaker(w + s.h / 2000); }
}
function setMute(m) {
  muted = m; store.set("mute", m);
  if (master && actx) master.gain.setTargetAtTime(m ? 0 : 0.85, actx.currentTime, 0.02);
  btnMute.innerHTML = '<svg viewBox="0 0 20 20"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="#7a3b12"/>' +
    (m ? '<path d="M13 7l5 6M18 7l-5 6" stroke="#e0283c" stroke-width="2" stroke-linecap="round"/>'
       : '<path d="M13 7.2a4 4 0 0 1 0 5.6M15.3 5a7 7 0 0 1 0 10" stroke="#7a3b12" stroke-width="1.8" fill="none" stroke-linecap="round"/>') + "</svg>";
}

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const rnd = Math.random;
function gauss(mu, sigma) { let u = 0, v = 0; while (u === 0) u = rnd(); while (v === 0) v = rnd(); return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function pickWeighted(list) { let sum = 0; list.forEach(x => sum += x[1]); let r = rnd() * sum; for (const x of list) { r -= x[1]; if (r <= 0) return x[0]; } return list[0][0]; }
function bpmOf(n) { const base = n <= 1 ? 90 : n === 2 ? 105 : n === 3 ? 120 : n === 4 ? 135 : Math.min(210, 135 + 12 * (n - 4)); return n % 5 === 0 ? base + 15 : base; }
function variationChance(n) { return n < 2 ? 0 : Math.min(0.35, 0.10 + (n - 2) * 0.25 / 8); }
function allowedVariations(n) {
  const a = [];
  if (n >= 2) a.push(["double", 35]);
  if (n >= 3) a.push(["water", 20]);
  if (n >= 4) a.push(["feint", 25]);
  if (n >= 5) a.push(["glance", 20]);
  return a;
}

// ---------- game state ----------
// state: title (attract AI behind overlay) | play | paused | dying | over | demo
let state = "title";
let run = null;
let fx = null;

function newFx() {

const clockNow = () => {

// ---------- beat schedule ----------

// ---------- hands ----------
function handState(c) {

    const v = run.ivs[i];

      const fc = v.feintT - 0.2 * v.feintH, fw = 0.15 * v.feintH;

// ---------- mochi blob: 16 spring-connected rim points ----------
const NPT = 16;
const blob = { d: new Float32Array(NPT), v: new Float32Array(NPT), sq: 0, sqv: 0, grow: 0, acc: 0, drop: 0 };

// ---------- juice ----------
function addPart(o) { if (fx.parts.length < 260) fx.parts.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 1, max: 1, r: 3, col: "#fff", kind: "dot", rot: 0, vr: 0 }, o)); }

function burst(x, y, n, kind, col, spd) {

    const a = rnd() * Math.PI * 2, v = spd * (0.4 + rnd() * 0.8);
    addPart({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.4, g: 600, life: 0.5 + rnd() * 0.4, max: 0.9, r: 2 + rnd() * 3, col, kind, vr: (rnd() - 0.5) * 12 });

// ---------- judging ----------
function tap(tc) {

  }

    const s = run.slots[i];

  }

// ---------- slot events ----------
function onSlot(s) {

  }

    if (run.mochiVisible) blobTurn();

// ---------- AI (attract + demo) ----------
function aiUpdate(c) {
  const S2 = run.slots;
  while (run.aiIdx < S2.length && S2[run.aiIdx].t < c + 350) {
    const s = S2[run.aiIdx++];
    if (s.kind === "pound") {
      if (s.variant === "feint" && rnd() < 0.25 && run.cools < 2) continue;
      const sigma = 15 + clamp((s.bpm - 90) / 110, 0, 1.2) * 45;
      const lo = s.winStart - s.t + 14, hi = Math.min(100, s.winEnd - s.t - 14);
      run.aiTaps.push(s.t + clamp(gauss(25, sigma), lo, hi));
    } else if (s.kind === "hold" && run.ai.armed && s.bpm >= run.ai.bonkBpm && s.t > 30000 && rnd() < 0.6) {
      run.aiTaps.push(s.t + gauss(0, 12));
    }
  }
  run.aiTaps.sort((a, b) => a - b);
  while (run.aiTaps.length && run.aiTaps[0] <= c && !run.dead) tap(run.aiTaps.shift());
}

// ---------- update ----------
function updateRun(now) {
  const c = now - run.offset;
  while (run.genT < c + 3500) genCycle();
  if (run.mode === "ai") aiUpdate(c);
  if (run.dead) return;
  while (run.evIdx < run.slots.length && run.slots[run.evIdx].t <= c) onSlot(run.slots[run.evIdx++]);
  while (run.cueIdx < run.cues.length && run.cues[run.cueIdx].t <= c) {
    const q = run.cues[run.cueIdx++];
    run.cue = q;
    if (run.mode === "play" && !run.tipsShown[q.type]) { run.tipsShown[q.type] = true; fx.tip = { txt: S("tip_" + q.type), t: now }; }
  }
  if (run.cue && c > run.cue.end + 60) run.cue = null;
  // misses
  for (let i = run.judgeIdx; i < run.slots.length; i++) {
    const s = run.slots[i];
    if (s.t > c) break;
    if (s.kind !== "pound" || s.res) { if (i === run.judgeIdx) run.judgeIdx++; continue; }
    if (c > s.winEnd) { resolvePound(s, "late"); if (run.dead) return; }
  }
  while (run.ivIdx < run.ivs.length - 1 && run.ivs[run.ivIdx].b + 400 < c) run.ivIdx++;

  if (run.audible && audioOn()) {
    const lat = Math.min(0.08, (actx.baseLatency || 0) + (actx.outputLatency || 0));
    while (run.schedIdx < run.slots.length && run.slots[run.schedIdx].t <= c + 140) {
      const s = run.slots[run.schedIdx++];
      if (s.sched || s.t < c - 20) continue;
      s.sched = true;
      slotAudio(s, Math.max(actx.currentTime, actx.currentTime + (s.t - c) / 1000 - lat));
    }
  } else {
    while (run.schedIdx < run.slots.length && run.slots[run.schedIdx].t <= c + 140) run.schedIdx++;
  }
}

function update(now, dt) {
  if (!run) return;
  if (state === "play" || state === "title" || state === "demo") {
    if (run.holdAt == null) updateRun(now);
  }
  if (isDying()) {
    const el = now - run.dead.at;
    if (state === "dying" && el > (run.dead.reason === "bonk" ? 1500 : 1100)) showOver();
    else if (state === "demo-dying" && el > 1600) startAI("demo");
    else if (state === "title-dying" && el > 1600) startAI("title");
  }
  const frozen = isDying() && run.dead && run.dead.reason === "bonk" && now - run.dead.at < 520;
  fx.flash *= Math.exp(-dt * (frozen ? 5 : 14));

    }

    if (fx.sweatT <= 0) { fx.sweatT = 0.5 - clamp((run.curBpm - 160) / 100, 0, 0.35); addPart({ x: 84, y: 340, vx: 30 + rnd() * 40, vy: -80, g: 500, life: 0.6, max: 0.6, r: 3, col: "#8fd3ff", kind: "drop" }); }
  }

// Drawn in two halves: the back half behind the mochi, the front half on the usu.
function drawBeatCue(c, hs, front) {
  if (!run || run.dead) return;
  const a0 = front ? 0 : Math.PI, a1 = front ? Math.PI : Math.PI * 2;
  const arc = (rx, ry) => { ctx.beginPath(); ctx.ellipse(180, 455, rx, ry, 0, a0, a1); };
  ctx.lineCap = "round";
  const d = hs.iv ? hs.p : 0;
  if (d > 0.02) {
    ctx.strokeStyle = `rgba(224,40,60,${0.3 * d})`; ctx.lineWidth = 16; arc(91, 25); ctx.stroke();
    ctx.strokeStyle = `rgba(224,40,60,${0.9 * d})`; ctx.lineWidth = 5; arc(90, 24); ctx.stroke();
  }
  const b = fx.beatRing;
  if (!b) return;
  const k = (c - b.t) / b.dur;
  if (k < 0 || k >= 1) return;
  const a = 1 - k, e = 1 - a * a;
  const col = b.red ? "224,40,60" : b.count ? "255,255,255" : "255,200,40";
  if (k < 0.5) { ctx.strokeStyle = `rgba(${col},${(0.5 - k) * 1.8})`; ctx.lineWidth = 6; arc(90, 24); ctx.stroke(); }
  if (reduceMotion) return;
  const rx = 92 + e * 34, ry = 25 + e * 13;
  ctx.strokeStyle = `rgba(110,50,15,${0.4 * a})`; ctx.lineWidth = 6 * a + 4; arc(rx, ry); ctx.stroke();
  ctx.strokeStyle = `rgba(${col},${a})`; ctx.lineWidth = 6 * a + 1.5; arc(rx, ry); ctx.stroke();
}
const grains = Array.from({ length: 26 }, () => ({ x: (rnd() - 0.5) * 1.6, y: -rnd() * 0.9, a: rnd() * Math.PI }));
function drawMochi() {
  if (!run || !run.mochiVisible) return;
  const prog = clamp(run.pounds / POUNDS_PER_MOCHI, 0, 1);
  const sc = 0.86 + 0.14 * prog + blob.grow;
  const rx = 56 * sc, ry = 30 * sc, cx = 182, cy = 452 + blob.drop;
  const pts = [];
  for (let i = 0; i < NPT; i++) {
    const a = i / NPT * Math.PI * 2;
    pts.push({ x: cx + (rx * (1 + 0.55 * blob.sq) + blob.d[i]) * Math.cos(a), y: cy + (ry * (1 - blob.sq) + blob.d[i]) * Math.sin(a) });
  }
  ctx.beginPath();
  for (let i = 0; i <= NPT; i++) {
    const p0 = pts[i % NPT], p1 = pts[(i + 1) % NPT];
    const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2;
    if (i === 0) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(p0.x, p0.y, mx, my);
  }
  ctx.closePath();
  const cool = run.cools / 3;
  const gold = run.golden;
  const g = ctx.createRadialGradient(cx - rx * 0.3, cy - ry * 0.6, 4, cx, cy, rx * 1.1);
  g.addColorStop(0, "#ffffff");
  g.addColorStop(0.55, gold ? "#fff2c2" : cool > 0.5 ? "#eef2f6" : "#fbf7ef");
  g.addColorStop(1, gold ? "#f0c95a" : cool > 0.5 ? "#c8d3e0" : cool > 0 ? "#e2ddd6" : "#e8dcc8");
  ctx.fillStyle = g; ctx.fill();
  if (prog < 0.55) {
    ctx.save(); ctx.clip();
    ctx.fillStyle = `rgba(255,255,255,${(0.55 - prog) * 1.6})`; ctx.strokeStyle = `rgba(200,190,170,${(0.55 - prog) * 1.2})`; ctx.lineWidth = 1;
    grains.forEach(gr => { ctx.beginPath(); ctx.ellipse(cx + gr.x * rx * 0.6, cy + gr.y * ry, 4, 2.2, gr.a, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
    ctx.restore();
  }
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.beginPath(); ctx.ellipse(cx - rx * 0.32, cy - ry * (0.62 - blob.sq * 0.3), rx * 0.22, ry * 0.16, -0.2, 0, Math.PI * 2); ctx.fill();
}
function drawParticles() {
  fx.parts.forEach(p => {
    const a = clamp(p.life / p.max, 0, 1);
    if (p.kind === "steam") { ctx.fillStyle = `rgba(255,255,255,${0.32 * a})`; ell(p.x, p.y, p.r, p.r); ctx.fill(); return; }
    ctx.globalAlpha = a; ctx.fillStyle = p.col;
    if (p.kind === "star") { star(p.x, p.y, p.r * 2, p.rot); ctx.fill(); }
    else if (p.kind === "drop") { ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 0.8, p.r * 1.3, Math.atan2(p.vy, p.vx) + Math.PI / 2, 0, Math.PI * 2); ctx.fill(); }
    else { ell(p.x, p.y, p.r, p.r); ctx.fill(); }
    ctx.globalAlpha = 1;
  });
}
function drawPops() {
  fx.pops.forEach(p => {
    const k = 1 - p.life / p.max, a = clamp(p.life / (p.max * 0.4), 0, 1);
    const sc = k < 0.15 ? 1.5 - k / 0.15 * 0.5 : 1;
    // keep the whole word on screen (narrow phones) even at its 1.5x pop-in size
    ctx.font = `900 ${p.size}px ${p.font}`;
    const hw = ctx.measureText(p.txt).width * 0.75 + p.size * 0.2;
    const x = Math.max(vx0 + 14 + hw, Math.min(p.x, vx1 - 14 - hw));
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x, p.y); ctx.rotate(p.rot); ctx.scale(sc, sc);
    text(p.txt, 0, 0, p.size, p.col, { s: p.stroke, f: p.font, sw: p.size * 0.22 });
    ctx.restore();
  });
}
function drawBubble(x, y, txt, col) {
  ctx.font = `900 17px ${FONT}`;
  const w = Math.max(70, ctx.measureText(txt).width + 24);
  ctx.fillStyle = "#fff"; ctx.strokeStyle = col || "#3b2414"; ctx.lineWidth = 2.5;
  rr(x - w / 2, y - 18, w, 36, 15); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 18, y + 14); ctx.lineTo(x - 30, y + 30); ctx.lineTo(x - 6, y + 15); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - 18, y + 16); ctx.lineTo(x - 30, y + 30); ctx.lineTo(x - 6, y + 16); ctx.stroke();
  text(txt, x, y + 1, 17, col || "#3b2414");
}
function drawCue(c, head) {
  if (!run || !run.cue || run.dead) return;
  const q = run.cue, cols = { double: "#e0283c", water: "#1f7fd1", feint: "#8a3bc4", glance: "#d4780f" };
  const pop = clamp((c - q.t) / 90, 0, 1);
  ctx.save(); ctx.translate(head.hx + 40, head.hy - 64); ctx.scale(0.6 + 0.4 * pop, 0.6 + 0.4 * pop);
  drawBubble(0, 0, S("cue_" + q.type), cols[q.type]);
  if (q.type === "double") { ctx.strokeStyle = "#e0283c"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, -30, 7, 0.3, Math.PI * 1.7); ctx.stroke(); }
  ctx.restore();
}
function drawStars(now, head) {
  if (!run || !run.dead || run.dead.reason !== "bonk") return;
  const t = (now - run.dead.at) / 1000;
  for (let i = 0; i < 5; i++) {
    const a = t * 5 + i * Math.PI * 2 / 5;
    const x = head.hx + Math.cos(a) * 36, y = head.hy - 30 + Math.sin(a) * 9;
    ctx.fillStyle = "#ffd23f"; ctx.strokeStyle = "#b07a00"; ctx.lineWidth = 1.5;
    star(x, y, 7, a); ctx.fill(); ctx.stroke();
  }
  const pop = clamp((now - run.dead.at) / 120, 0, 1);
  ctx.save(); ctx.translate(head.hx + 62, head.hy - 70); ctx.rotate(-0.12); ctx.scale(0.5 + pop * 0.6, 0.5 + pop * 0.6);
  text(S("ouch"), 0, 0, 40, "#e0283c", { s: "#fff", f: BRUSH, sw: 9 });
  ctx.restore();
}
function drawRing(c) {
  if (!run || run.mode !== "play" || run.cur !== 1 || run.dead) return;
  for (let i = run.judgeIdx; i < run.slots.length; i++) {
    const s = run.slots[i];
    if (s.t - 4 * s.h > c) break;
    if (s.kind !== "pound" || s.res) continue;
    const k = (s.t - c) / (2 * s.h);
    if (k < -0.15 || k > 1) continue;
    ctx.strokeStyle = "rgba(224,40,60,.5)"; ctx.lineWidth = 3; ctx.setLineDash([5, 5]);
    ell(186, 420, 30, 12); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = `rgba(255,255,255,${clamp(1 - Math.abs(k) * 0.6, 0, 1)})`; ctx.lineWidth = 4;
    const r = 30 + Math.max(0, k) * 70;
    ell(186, 420, r, r * 0.4); ctx.stroke();
    break;
  }
}
function drawHUD(now) {
  ctx.fillStyle = "rgba(255,255,255,.88)";
  rr(10, 44, 120, 50, 12); ctx.fill();
  rr(230, 44, 120, 50, 12); ctx.fill();
  text(S("score"), 20, 56, 10, "#b07a2a", { a: "left" });
  text(fmt(run.score), 20, 77, 22, "#3b2414", { a: "left" });
  const bp = 1 + fx.beatPulse * 0.12;
  ctx.save(); ctx.translate(304, 72); ctx.scale(bp, bp);
  text(String(run.curBpm), 0, 0, 30, run.golden ? "#d39200" : run.curBpm >= 160 ? "#e0283c" : "#3b2414", { a: "right" });
  ctx.restore();
  text("BPM", 312, 80, 11, "#b07a2a", { a: "left" });
  text("♩", 246, 58, 12, "#b07a2a", { a: "left" });
  // heat (3 lives)
  for (let i = 0; i < 3; i++) {
    const x = 266 + i * 24, y = 110, alive = i >= run.cools;
    ctx.fillStyle = alive ? "#ff6a2a" : "#b8c6d8";
    ctx.beginPath(); ctx.moveTo(x, y - 11); ctx.quadraticCurveTo(x + 9, y - 1, x + 6, y + 5); ctx.quadraticCurveTo(x, y + 10, x - 6, y + 5); ctx.quadraticCurveTo(x - 9, y - 1, x, y - 11); ctx.fill();
    if (alive) { ctx.fillStyle = "#ffd23f"; ell(x, y + 3, 3, 4); ctx.fill(); }
  }
  // mochi progress
  text(`${run.golden ? S("goldMochi") : S("mochi")} ${run.cur}`, 180, 54, 12, run.golden ? "#d39200" : "#3b2414", { s: "rgba(255,255,255,.9)", sw: 4 });
  for (let i = 0; i < POUNDS_PER_MOCHI; i++) {
    const x = 139 + (i % 10) * 9.2, y = 68 + Math.floor(i / 10) * 10;
    ctx.fillStyle = i < run.pounds ? (run.golden ? "#ffc21a" : "#e0283c") : "rgba(255,255,255,.75)";
    ell(x, y, 3.6, 3.6); ctx.fill();
  }
  if (run.combo > 0) {
    text(`${run.combo} ${S("combo")}`, 16, 110, 15, "#fff", { a: "left", s: "#7a3b12", sw: 4 });
    if (run.mult > 1) text(`×${run.mult}`, 16, 130, 18, "#ffd23f", { a: "left", s: "#7a3b12", sw: 4 });
  }
}
function drawOverlays(now, c) {
  // count-in
  if (fx.countPop && now - fx.countPop.t < 450 && run && !run.dead) {
    const k = (now - fx.countPop.t) / 450;
    ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(180, 260); ctx.scale(1.4 - k * 0.4, 1.4 - k * 0.4);
    text(String(fx.countPop.n), 0, 0, 64, "#fff", { s: "#e0283c", sw: 10 });
    ctx.restore();
  }
  if (fx.banner) {
    const k = (now - fx.banner.t) / 1500;
    if (k > 1) fx.banner = null;
    else {
      const x = 180 + (k < 0.15 ? (1 - k / 0.15) * 300 : k > 0.85 ? -(k - 0.85) / 0.15 * 300 : 0);
      ctx.fillStyle = fx.banner.gold ? "rgba(214,150,0,.9)" : "rgba(224,40,60,.9)";
      ctx.fillRect(vx0, 196, vx1 - vx0, 50);
      text(fx.banner.txt, x, 216, 24, "#fff", { s: "rgba(80,20,0,.5)", sw: 4 });
      if (fx.banner.sub) text(fx.banner.sub, x, 238, 11, "#fff");
    }
  }
  if (run && run.mode === "play" && !run.dead) {
    if (run.cur === 1 && run.hintHits < 4) {
      text(S("hint1"), 180, 160, 22, "#fff", { s: "#e0283c", sw: 6 });
      text(S("hint2"), 180, 186, 13, "#3b2414", { s: "rgba(255,255,255,.95)", sw: 5 });
    }
    if (fx.tip && now - fx.tip.t < 2800) {
      const a = clamp((2800 - (now - fx.tip.t)) / 400, 0, 1);
      ctx.globalAlpha = a; text(fx.tip.txt, 180, 168, 16, "#fff", { s: "#3b2414", sw: 5 }); ctx.globalAlpha = 1;
    }
  }
  if (run && run.dead && run.mode === "ai" && state === "demo-dying") {
    const k = clamp((now - run.dead.at - 300) / 250, 0, 1);
    ctx.save(); ctx.globalAlpha = k; ctx.translate(180, 192); ctx.scale(0.6 + k * 0.4, 0.6 + k * 0.4);
    text(S("maxBpm"), 0, -44, 16, "#fff", { s: "#3b2414", sw: 5 });
    text(String(run.maxBpm), 0, 10, 76, "#fff", { s: "#e0283c", sw: 12 });
    ctx.restore();
  }
  if (run && run.dead && run.dead.reason === "cool") {
    text(S("cooled"), 182, 380, 26, "#6f8fbf", { s: "#fff", sw: 6, f: BRUSH });
  }
}

function draw(now) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sh = fx && fx.shake ? fx.shake : 0;
  const sx = sh ? (rnd() - 0.5) * 2 * sh : 0, sy = sh ? (rnd() - 0.5) * 2 * sh : 0;
  const k = dpr * scale;
  ctx.setTransform(k, 0, 0, k, dpr * (ox + sx * scale), dpr * (oy + sy * scale));
  vx0 = -ox / scale - 16; vx1 = (cssW - ox) / scale + 16; vy0 = -oy / scale - 16; vy1 = (cssH - oy) / scale + 16;
  drawBackground(now);
  drawBunting(now);
  if (!run) return;
  const c = clockNow();
  drawKadomatsu(26, 505, 1);
  drawKadomatsu(336, 505, 0.92);
  drawStack(now);
  let hs = handState(c);
  const face = partnerFace(c);
  let handP = hs.p, hurt = now - fx.hurtT < 450;
  if (run.dead && run.dead.reason === "bonk") {
    hurt = true;
    const after = Math.max(0, now - run.dead.at - 520);
    handP = run.dead.handP * (1 - smooth(after / 300));
  }
  const head = drawPartnerBody(c, handP, face, now);
  drawUsuBack();
  drawBeatCue(c, hs, false);
  drawMochi();
  drawUsuFront();
  drawBeatCue(c, hs, true);
  // kine animation: instant down on tap, then lift
  const since = now - fx.kineT;
  let kk = 0;
  if (run.dead && run.dead.reason === "bonk") kk = now - run.dead.at < 900 ? 1 : 1 - smooth((now - run.dead.at - 900) / 300);
  else if (since < 70) kk = 1;
  else if (since < 270) kk = 1 - smooth((since - 70) / 200);
  else kk = -0.04 * fx.beatPulse;
  const hp = handPositions(handP, c, hs.iv);
  const lean = handP * 8;
  const since0 = run.dead ? now - run.dead.at : now - fx.hurtT;
  if (hurt && run.dead && since0 < 520) { hp.near.x = 190; hp.near.y = 424; hp.far.x = 168; hp.far.y = 428; }
  const squash = hurt && since0 < (run.dead ? 900 : 300) ? 1 : 0;
  drawArm(60 + lean, 410, hp.far.x, hp.far.y, squash, hurt);
  drawArm(86 + lean, 414, hp.near.x, hp.near.y, squash, hurt);
  if (since > 0 && since < 60 && !run.dead) drawKine(0.45, true);
  drawKine(kk, false);
  drawFlying(now);
  drawParticles();
  drawRing(c);
  drawPops();
  drawCue(c, head);
  drawStars(now, head);
  if (state !== "title" && state !== "title-dying") drawHUD(now);
  drawOverlays(now, c);
  if (fx.flash > 0.01) { ctx.fillStyle = `rgba(255,255,255,${fx.flash})`; ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0); }
}

// ---------- flow ----------
function hideAll() { ovTitle.hidden = true; ovPause.hidden = true; ovOver.hidden = true; }
function startAI(kind) {
  state = kind;
  newRun("ai", kind === "demo");
  btnPause.hidden = true;
}
function toTitle() {
  hideAll(); ovTitle.hidden = false; updateTitleBest();
  startAI("title");
}
function startPlay() {
  ensureAudio(); sfx.ui();
  hideAll();
  state = "play";
  newRun("play", true);
  btnPause.hidden = false;
  platform("gameplayStart");
}
let overShownAt = 0;
function showOver() {
  state = "over";
  run.pauseClock = run.deadClock;
  const bonked = run.dead.reason === "bonk";
  const head = $("overHead");
  head.textContent = bonked ? S("overBonk") : S("overCool");
  head.className = "over-head" + (bonked ? "" : " cool");
  $("overBpm").textContent = run.maxBpm;
  $("overBadge").hidden = !run.newBest;
  const rows = [["sScore", fmt(run.score)], ["sBest", fmt(num(store.get("best", 0)))], ["sMochi", run.made], ["sPerfect", run.perfects], ["sCombo", run.maxCombo], ["sPounds", run.hits]];
  $("overStats").innerHTML = rows.map(r => `<span>${S(r[0])}</span><b>${r[1]}</b>`).join("");
  ovOver.hidden = false;
  overShownAt = performance.now();
  platform("gameOver", run.score);
}
function pauseGame(at) {
  if (state !== "play") return;
  state = "paused";
  run.pauseClock = (at || performance.now()) - run.offset;
  newBus();
  ovPause.hidden = false; btnPause.hidden = true;
  platform("gameplayStop");
}
function resumeGame() {
  if (state !== "paused") return;
  ensureAudio();
  const now = performance.now();
  let target = run.pauseClock;
  const next = run.slots.find(s => s.kind === "pound" && !s.res && s.t > target - 1);
  if (next && next.t - target < 4 * next.h) target = next.t - 4 * next.h;
  run.offset = now - target;
  for (let i = 0; i < run.slots.length; i++) if (run.slots[i].t > target) run.slots[i].sched = false;
  run.schedIdx = run.slots.findIndex(s => s.t > target); if (run.schedIdx < 0) run.schedIdx = run.slots.length;
  state = "play"; ovPause.hidden = true; btnPause.hidden = false;
  platform("gameplayStart");
}
function holdClock() { if (run && run.holdAt == null && (state === "title" || state === "demo")) run.holdAt = performance.now(); }
function releaseClock() { if (run && run.holdAt != null) { run.offset += performance.now() - run.holdAt; run.holdAt = null; } }
function onHide() { if (state === "play") pauseGame(); else holdClock(); }
// the first frame after a hidden tab must not count the hidden time again as a hitch
function onShow() { releaseClock(); lastNow = performance.now(); }

// ---------- input ----------
function eventClock(e) {
  const n = performance.now();
  const ts = e && typeof e.timeStamp === "number" && e.timeStamp > 0 && Math.abs(n - e.timeStamp) < 500 ? e.timeStamp : n;
  return ts - run.offset;
}
document.addEventListener("pointerdown", () => ensureAudio(), true);
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (state === "play") tap(eventClock(e));
  else if (state === "paused") resumeGame();
  else if (isTitle()) startPlay();
});
ovPause.addEventListener("click", e => { if (e.target === ovPause) resumeGame(); });
ovTitle.addEventListener("click", e => { if (!e.target.closest("button") || e.target.id === "btnStart") startPlay(); });
$("btnLang").addEventListener("click", e => { e.stopPropagation(); lang = lang === "ja" ? "en" : "ja"; store.set("lang", lang); applyLang(); sfx.ui(); });
btnMute.addEventListener("click", e => { e.stopPropagation(); ensureAudio(); setMute(!muted); btnMute.blur(); });
btnPause.addEventListener("click", e => { e.stopPropagation(); pauseGame(); btnPause.blur(); });
const overReady = () => performance.now() - overShownAt > 350; // a frantic tap must not skip the result
$("btnResume").addEventListener("click", e => { e.stopPropagation(); resumeGame(); });
$("btnRestart").addEventListener("click", e => { e.stopPropagation(); startPlay(); });
$("btnQuit").addEventListener("click", e => { e.stopPropagation(); toTitle(); });
$("btnRetry").addEventListener("click", e => { e.stopPropagation(); if (overReady()) startPlay(); });
$("btnToTitle").addEventListener("click", e => { e.stopPropagation(); if (overReady()) toTitle(); });
document.addEventListener("keydown", e => {
  ensureAudio();
  if (e.ctrlKey || e.metaKey || e.altKey || e.key === "Tab") return;
  const k = e.key, isConfirm = k === " " || k === "Enter" || k === "Spacebar";
  if (isConfirm || k.startsWith("Arrow")) e.preventDefault();
  if (e.repeat) return;
  if (k === "m" || k === "M") { setMute(!muted); return; }
  if (isTitle()) { if (isConfirm) startPlay(); }
  else if (state === "play") {
    if (k === "Escape" || k === "p" || k === "P") pauseGame();
    else if (isConfirm || k.length === 1 || k.startsWith("Arrow")) tap(eventClock(e));
  } else if (state === "paused") { if (isConfirm || k === "Escape" || k === "p" || k === "P") resumeGame(); }
  else if (state === "over") {
    if (isConfirm && performance.now() - overShownAt > 300) startPlay();
    else if (k === "Escape") toTitle();
  }
});
document.addEventListener("visibilitychange", () => { if (document.hidden) onHide(); else onShow(); });
// losing focus pauses a real run; attract/demo keep going (e.g. screen recording with focus elsewhere)
window.addEventListener("blur", () => { if (state === "play") pauseGame(); });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());

// ---------- loop ----------
let lastNow = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now < lastNow) now = lastNow; // a frame stamped before a stall or a tab switch
  const raw = now - lastNow, prev = lastNow; lastNow = now;
  // a long stall mid-run would silently sweep beats past the player: pause at the last good frame instead
  if (raw > 300 && state === "play") pauseGame(prev);
  // in attract/demo, swallow long hitches so the AI never "teleports"
  if (raw > 250 && run && run.mode === "ai" && run.holdAt == null && !isDying()) run.offset += raw - 16;
  const dt = clamp(raw, 0, 50) / 1000;
  update(now, dt);
  draw(now);
}

resize();
applyLang();
setMute(muted);
if (DEMO) { hideAll(); startAI("demo"); }
else toTitle();
requestAnimationFrame(frame);
})();
</script>
