<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14071d">
<title>連鎖花火 / Hanabi Chain: Fireworks</title>
<style>
:root {
  --plum: #14071d;
  --ink: #fff3e2;
  --dim: #c9a9c9;
  --gold: #ffcf5a;
  --coral: #ff7a5c;
  --jade: #4fe0a8;
  --amber: #ffb04a;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--plum); color: var(--ink); font-family: var(--font); overflow: hidden;
  overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: none;
}
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; outline: none; }
#bar { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 5; }
#bar button {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid #ffffff30; background: #1a0a24b0;
  color: var(--ink); font: 800 13px var(--font); display: grid; place-items: center; cursor: pointer; padding: 0;
}
#bar button svg { width: 18px; height: 18px; fill: currentColor; }
#bar button:focus-visible, .ov button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.ov {
  position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
  padding: 16px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 45%, #1a0a2450 0%, #0b0412c0 75%);
}
.card { width: 100%; max-width: 360px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.kicker { font: 800 12px var(--font); letter-spacing: .3em; color: var(--dim); }
h1 {
  margin: 0; font: 900 clamp(46px, 14vw, 64px)/1.05 var(--font); letter-spacing: .06em;
  background: linear-gradient(180deg, #fff6d8 0%, var(--gold) 45%, var(--coral) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px #ff8a5c70);
}
h2 { margin: 0; font: 900 34px/1.1 var(--font); color: var(--gold); text-shadow: 0 0 16px #ff8a5c80; }
.sub { font: 800 13px var(--font); letter-spacing: .2em; color: #ffd9b8; margin-top: -4px; text-wrap: balance; }
.how { font: 700 15px/1.55 var(--font); color: var(--ink); background: #00000050; border-radius: 12px; padding: 10px 14px; word-break: auto-phrase; text-wrap: balance; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; font: 700 12px var(--font); color: var(--dim); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; box-shadow: 0 0 8px currentColor; vertical-align: 0; }
.ov button.main {
  margin-top: 6px; min-width: 200px; padding: 14px 28px; border-radius: 999px; border: 0; cursor: pointer;
  font: 900 20px var(--font); color: #2a0b1c; background: linear-gradient(180deg, #ffe08a, #ff9a5c);
  box-shadow: 0 0 28px #ff9a5c80, inset 0 -3px 0 #00000030;
}

  padding: 10px 22px; border-radius: 999px; border: 1px solid #ffffff40; background: transparent;
  color: var(--ink); font: 800 15px var(--font); cursor: pointer;
}
.best { font: 800 14px var(--font); color: var(--dim); }
.keys { font: 700 12px var(--font); color: var(--dim); opacity: .8; }
.flashnote { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/1.3 var(--font); color: #ffd9b8; border: 1px solid #ffd9b850; border-radius: 999px; padding: 4px 12px; background: #00000040; }
.flashnote svg { width: 14px; height: 14px; flex: none; fill: currentColor; }
.credit { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font: 700 11px var(--font); color: #ffffff70; letter-spacing: .08em; }
.score { font: 900 54px/1 var(--font); color: var(--ink); text-shadow: 0 0 20px #ffcf5a90; }
.newbest { font: 900 15px var(--font); color: #2a0b1c; background: var(--gold); border-radius: 999px; padding: 4px 12px; }
.stats { display: flex; gap: 18px; font: 700 13px var(--font); color: var(--dim); }
.stats b { display: block; font: 900 22px var(--font); color: var(--ink); }
</style>

<body>
<div id="stage">
  <canvas id="cv" tabindex="-1" aria-label="game"></canvas>
  <div id="ovTitle" class="ov">
    <div class="card">
      <div class="kicker">WEEKLY MINI GAME #05</div>
      <h1 data-t="title"></h1>
      <div class="sub" data-t="sub"></div>
      <div class="how" data-t="how"></div>

      <div class="best" id="titleBest"></div>
      <div class="keys" data-t="keysTitle"></div>
      <div class="flashnote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 1.5 21h21zM11 9h2v6.5h-2zm0 8h2v2h-2z"/></svg><span data-t="flashNote"></span></div>
    </div>
    <div class="credit">Made with Claude</div>
  </div>
  <div id="ovPause" class="ov" hidden>
    <div class="card">
      <h2 data-t="paused"></h2>

      <button class="ghost" id="btnRestart" type="button" data-t="restart"></button>
    </div>

  <div id="ovOver" class="ov" hidden>
    <div class="card">
      <h2 data-t="over"></h2>
      <div class="score" id="overScore">0</div>
      <div class="newbest" id="overNew" data-t="newBest" hidden></div>
      <div class="best" id="overBest"></div>
      <div class="stats">
        <div><span data-t="maxChain"></span><b id="overChain">0</b></div>
        <div><span data-t="reached"></span><b id="overVolley">1</b></div>
      </div>
      <button class="main" id="btnRetry" type="button" data-t="retry"></button>

    </div>

  <div id="bar">
    <button id="btnPause" type="button" aria-label="pause"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <button id="btnMute" type="button" aria-label="sound"></button>
    <button id="btnLang" type="button" aria-label="language">EN</button>

<script>
(function () {
"use strict";

window.Platform = window.Platform || { gameplayStart() {}, gameplayStop() {}, happytime() {}, gameOver(score) {} };
// A portal adapter may lack a method or throw; the game must keep running either way.
const Platform = {};
for (const name of ["gameplayStart", "gameplayStop", "happytime", "gameOver"]) {
  Platform[name] = arg => { try { const p = window.Platform; if (p && typeof p[name] === "function") p[name](arg); } catch (e) { /* ignore adapter errors */ } };
}

// ---------------------------------------------------------------- strings
const STR = {
  ja: {
    title: "連鎖花火", sub: "HANABI CHAIN: FIREWORKS", start: "点火する", best: "ベスト",
    how: "タップ1回で点火 → 花火玉を巻き込んで大連鎖！", flashNote: "光の点滅があります",
    legend: ["牡丹", "柳", "分裂", "輪", "黄金"],
    keysTitle: "マウス / タップ ・ キーボードは矢印＋Space",
    paused: "ひと休み", resume: "つづける", restart: "最初から",
    over: "祭りのあと", retry: "もう一回", newBest: "自己ベスト更新！",
    maxChain: "最大連鎖", reached: "到達", keysRetry: "Space / Enter でリトライ",
    volley: n => "第" + n + "弾", quota: n => "目標 " + n, chain: n => "連鎖 ×" + n,
    hintWait: "花火玉が集まる瞬間を狙え", hintTap: "ここで点火！",
    spark: "タップで点火", sparkKey: "矢印で照準 ・ Spaceで点火", sparkUsed: "連鎖中…",
    nice: "成功！", great: "お見事！", lost: "ちょうちんが消えた…",
    tamaya: "たまや〜！", golden: "黄金玉！ 範囲2倍", dud: "不発", wind: "風",
    bestShort: "BEST",
  },
  en: {
    title: "Hanabi Chain", sub: "FIREWORKS · 連鎖花火", start: "Light it up", best: "Best",
    how: "One tap, one spark. Catch the shells, chain the sky!", flashNote: "Contains flashing lights",
    legend: ["Peony", "Willow", "Crossette", "Ring", "Golden"],
    keysTitle: "Mouse / touch · Keyboard: arrows + Space",
    paused: "Paused", resume: "Resume", restart: "Restart",
    over: "Festival's Over", retry: "Again", newBest: "New best!",
    maxChain: "Max chain", reached: "Volley", keysRetry: "Space / Enter to retry",
    volley: n => "VOLLEY " + n, quota: n => "GOAL " + n, chain: n => "CHAIN ×" + n,
    hintWait: "Wait for the shells to bunch up", hintTap: "Ignite here!",
    spark: "Tap to ignite", sparkKey: "Arrows to aim · Space to ignite", sparkUsed: "Chaining…",
    nice: "Nice!", great: "Brilliant!", lost: "A lantern went out…",
    tamaya: "TAMAYA!", golden: "GOLDEN! Radius ×2", dud: "dud", wind: "Wind",
    bestShort: "BEST",
  },
};

// ---------------------------------------------------------------- storage (never trusted)
function load(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, String(value)); } catch (e) { /* storage blocked */ } }
function loadBest() { const n = Number(load(K_BEST, "0")); return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0; }
const K_BEST = "hanabi-chain-best", K_MUTE = "hanabi-chain-muted", K_LANG = "hanabi-chain-lang";

const DEMO = /(?:^|[?&])demo=1(?:&|$)/.test(location.search.slice(1));
const REDUCED = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
let lang = load(K_LANG, "");
if (lang !== "ja" && lang !== "en") lang = (navigator.language || "ja").toLowerCase().startsWith("ja") ? "ja" : "en";
const T = () => STR[lang];

// ---------------------------------------------------------------- simulation core
// World is a 450x800 portrait column. Shells fly on analytic ballistic arcs, so the
// whole chain reaction can be simulated ahead of time (used for playback and for the AI).
const W = 450, H = 800, HORIZON = 640, LAUNCH_Y = 630, TAP_MAX_Y = 612;
const EXPAND = 0.28;
const ease = u => 1 - (1 - u) * (1 - u) * (1 - u);

function shellX(s, t) { const a = t - s.tl; return s.x0 + s.vx * a + 0.5 * s.w * a * a; }
function shellY(s, t) { const a = t - s.tl; return s.y0 + s.vy * a + 0.5 * s.g * a * a; }
function catchable(s, t) { return t - s.tl >= 0.4 && t <= s.tEnd; }

// Ignition sources. k: 0 disc, 1 hoop, 2 willow strand.
function addSources(type, x, y, t, sc, spin, wind, out) {
  if (type === "willow") {
    out.push({ k: 0, x, y, t, r: 55 * sc, life: 0.5 });
    for (let i = 0; i < 10; i++) {
      const a = spin + i * Math.PI / 5;
      out.push({ k: 2, x, y, t, ux: Math.cos(a), uy: Math.sin(a), sc, wind, life: 1.5 });
    }
  } else if (type === "crossette") {
    out.push({ k: 0, x, y, t, r: 26 * sc, life: 0.3 });
    for (let i = 0; i < 4; i++) {
      const a = spin + Math.PI / 4 + i * Math.PI / 2;
      out.push({ k: 0, x: x + Math.cos(a) * 52 * sc, y: y + Math.sin(a) * 52 * sc, t: t + 0.2, r: 40 * sc, life: 0.45 });
    }
  } else if (type === "ring") {
    out.push({ k: 1, x, y, t, r: 120 * sc, life: 0.5, band: 14 * sc });
  } else {
    out.push({ k: 0, x, y, t, r: 70 * sc, life: 0.5 });
  }
}
function strandX(s, a) { return s.x + s.ux * 65 * s.sc * (1 - Math.exp(-3.2 * a)) + 0.8 * s.wind * a * a; }
function strandY(s, a) { return s.y + s.uy * 65 * s.sc * (1 - Math.exp(-3.2 * a)) + 30 * a * a; }

const CX = new Float32Array(1024), CY = new Float32Array(1024), CR = new Float32Array(1024);
const RX = new Float32Array(64), RY = new Float32Array(64), RI = new Float32Array(64), RO = new Float32Array(64);

// Simulates a spark at (px,py) fired at time t0. Returns catch events in time order.
function simulate(shells, px, py, t0, dt, wind) {
  const n = shells.length, caught = new Uint8Array(n);
  let tMax = 0;
  for (let i = 0; i < n; i++) { if (shells[i].done) caught[i] = 1; else if (shells[i].tEnd > tMax) tMax = shells[i].tEnd; }
  const src = [];
  addSources("spark", px, py, t0, 1, 0, wind, src);
  const events = [];
  let sc = 1, count = 0, t = t0;
  while (src.length && t <= tMax) {
    let nc = 0, nr = 0;
    for (let j = src.length - 1; j >= 0; j--) {
      const s = src[j], a = t - s.t;
      if (a > s.life) { src[j] = src[src.length - 1]; src.pop(); continue; }
      if (a < 0) continue;
      if (s.k === 0) {
        const r = s.r * ease(Math.min(1, a / EXPAND));
        if (nc < 1024) { CX[nc] = s.x; CY[nc] = s.y; CR[nc++] = r * r; }
      } else if (s.k === 1) {
        const r = s.r * ease(Math.min(1, a / EXPAND));
        if (r > 0.5 * s.r && nr < 64) { RX[nr] = s.x; RY[nr] = s.y; RI[nr] = (r - s.band) * (r - s.band); RO[nr++] = (r + s.band) * (r + s.band); }
      } else if (a > 0.12) {
        const rr = 15 * s.sc * 15 * s.sc;
        for (let m = 0; m < 3; m++) {
          const b = a - m * 0.3;
          if (b < 0.1 || nc >= 1024) break;
          CX[nc] = strandX(s, b); CY[nc] = strandY(s, b); CR[nc++] = rr;
        }
      }
    }
    if (nc || nr) {
      for (let i = 0; i < n; i++) {
        if (caught[i]) continue;
        const sh = shells[i];
        if (!catchable(sh, t)) continue;
        const x = shellX(sh, t), y = shellY(sh, t);
        let hit = false;
        for (let c = 0; c < nc && !hit; c++) { const dx = x - CX[c], dy = y - CY[c]; if (dx * dx + dy * dy < CR[c]) hit = true; }
        for (let c = 0; c < nr && !hit; c++) { const dx = x - RX[c], dy = y - RY[c], d = dx * dx + dy * dy; if (d > RI[c] && d < RO[c]) hit = true; }
        if (!hit) continue;
        caught[i] = 1;
        if (sh.dud) { events.push({ i, t, sc, x, y }); continue; }
        if (sh.golden) sc = 2;
        count++;
        events.push({ i, t, sc, x, y, n: count });
        addSources(sh.type, x, y, t, sc, sh.spin, wind, src);
      }
    }
    t += dt;
  }
  return { events, count };
}

function volleySpec(n, rnd) {
  if (n <= 3) return { count: 12, quota: 4 + n, stagger: 0.12, clusters: 1, sx: 60, sy: 34, g: 165, wind: 0, mix: [1, 0, 0, 0], duds: 0 };
  if (n <= 8) {
    const c = Math.round(14 + (n - 4) * 1.5);
    return { count: c, quota: Math.round(c * 0.4), stagger: 1.5, clusters: n < 6 ? 1 : 2, sx: 110 + (n - 4) * 8, sy: 62 + (n - 4) * 4, g: 180, wind: 0, mix: [0.5, 0.25, 0.25, 0], duds: 0 };
  }
  if (n <= 15) {
    const c = Math.min(28, Math.round(19 + (n - 9) * 1.3));
    const wind = (rnd() < 0.5 ? -1 : 1) * (8 + rnd() * 6 + (n - 9) * 1.5);
    return { count: c, quota: Math.round(c * 0.55), stagger: 1.6, clusters: n < 12 ? 2 : 3, sx: 145 + (n - 9) * 4, sy: 80 + (n - 9) * 2, g: 195, wind, mix: [0.38, 0.24, 0.2, 0.18], duds: 0 };
  }
  const c = Math.max(16, 23 - Math.floor((n - 16) / 2));
  const duds = Math.min(6, 2 + Math.floor((n - 16) / 3));
  const wind = (rnd() < 0.5 ? -1 : 1) * (10 + rnd() * 14);
  return { count: c, quota: Math.round((c - duds) * 0.6), stagger: 1.6, clusters: 3, sx: 170, sy: 90, g: 205, wind, mix: [0.38, 0.24, 0.2, 0.18], duds };
}

const SHELL_TYPES = ["peony", "willow", "crossette", "ring"];
function gauss(rnd) { return (rnd() + rnd() + rnd() - 1.5) / 1.5; }

function makeVolley(n, rnd) {
  const spec = volleySpec(n, rnd);
  const clusters = [];
  for (let c = 0; c < spec.clusters; c++) {
    clusters.push({
      x: 80 + rnd() * 290, y: 205 + rnd() * 185,
      t: 0.4 + (spec.clusters === 1 ? 0 : (c / (spec.clusters - 1)) * spec.stagger),
    });
  }
  const shells = [];
  for (let i = 0; i < spec.count; i++) {
    const cl = clusters[i % clusters.length];
    let r = rnd(), type = 0;
    for (let k = 0; k < 4; k++) { r -= spec.mix[k]; if (r < 0) { type = k; break; } }
    const ax = Math.max(40, Math.min(410, cl.x + gauss(rnd) * spec.sx * 1.6));
    const ay = Math.max(150, Math.min(445, cl.y + gauss(rnd) * spec.sy * 1.6));
    const g = spec.g, w = spec.wind;
    const vy = -Math.sqrt(2 * g * (LAUNCH_Y - ay)), ta = -vy / g;
    let vx = (rnd() - 0.5) * 100;
    let x0 = ax - vx * ta - 0.5 * w * ta * ta;
    if (x0 < 15 || x0 > 435) { x0 = Math.max(15, Math.min(435, x0)); vx = (ax - x0 - 0.5 * w * ta * ta) / ta; }
    const local = spec.clusters === 1 ? rnd() * spec.stagger : (rnd() - 0.5) * 0.5;
    const tl = Math.max(0.3, cl.t + local);
    shells.push({
      type: SHELL_TYPES[type], x0, y0: LAUNCH_Y, vx, vy, g, w, tl, ta, tEnd: tl + ta + 1.0,
      spin: rnd() * Math.PI * 2, golden: false, dud: false, done: false, launched: false, color: 0,
    });
  }
  for (let d = 0; d < spec.duds; d++) shells[(d * 7 + 3) % shells.length].dud = true;
  if (n % 4 === 3) {
    const pick = shells.filter(s => !s.dud);
    pick[Math.floor(rnd() * pick.length)].golden = true;
  }
  return { shells, quota: spec.quota, wind: spec.wind };
}

// Generator so the search can be spread over several frames.
function* planTaps(shells, tFrom, wind, cols, rows, nTimes, dt) {
  const ap = shells.filter(s => !s.dud && !s.done).map(s => s.tl + s.ta).sort((a, b) => a - b);
  if (!ap.length) return [];
  const a0 = ap[Math.floor(ap.length * 0.1)], a1 = ap[Math.floor(ap.length * 0.9)];
  const tStart = Math.max(tFrom + 0.2, a0 - 0.8), tEnd = Math.max(tStart + 0.5, a1 + 0.2);
  const cands = [];
  for (let ti = 0; ti < nTimes; ti++) {
    const t = tStart + (tEnd - tStart) * ti / (nTimes - 1);
    const pts = [];
    for (const s of shells) {
      if (s.done) continue;
      for (const o of [0, 0.2, 0.4]) if (catchable(s, t + o)) pts.push(shellX(s, t + o), shellY(s, t + o));
    }
    for (let gx = 0; gx < cols; gx++) {
      for (let gy = 0; gy < rows; gy++) {
        const x = 30 + gx * 390 / (cols - 1), y = 70 + gy * 500 / (rows - 1);
        let near = false;
        for (let p = 0; p < pts.length; p += 2) { const dx = pts[p] - x, dy = pts[p + 1] - y; if (dx * dx + dy * dy < 7225) { near = true; break; } }
        if (!near) continue;
        const r = simulate(shells, x, y, t, dt, wind);
        cands.push({ x, y, t, c: r.count });
        yield;
      }
    }
  }
  cands.sort((a, b) => b.c - a.c);
  return cands;
}
// Among the best candidates, prefer the one nearest the shells' centre near their median apex: it reads as a "smart" tap.
function naturalPick(cands, shells, pool) {
  if (!cands.length) return null;
  pool = pool || cands.filter(c => c.c >= cands[0].c);
  const ap = shells.filter(s => !s.dud).map(s => s.tl + s.ta).sort((a, b) => a - b), mid = ap[ap.length >> 1] || 0;
  let best = pool[0], bestScore = Infinity;
  for (const c of pool) {
    let sx = 0, sy = 0, n = 0;
    for (const s of shells) if (!s.dud && !s.done && catchable(s, c.t)) { sx += shellX(s, c.t); sy += shellY(s, c.t); n++; }
    if (!n) continue;
    const score = Math.hypot(c.x - sx / n, c.y - sy / n) + 60 * Math.abs(c.t - mid);
    if (score < bestScore) { bestScore = score; best = c; }
  }
  return best;
}
function runSync(gen) { let r; do { r = gen.next(); } while (!r.done); return r.value; }

// ---------------------------------------------------------------- audio
const Snd = (() => {
  let ac = null, master = null, noiseBuf = null;
  let muted = load(K_MUTE, "0") === "1";
  const last = {};
  function init() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.8;
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; }
  }
  const ok = (key, gap) => {

// Fairness guard: make sure a good tap exists; regenerate or soften the quota otherwise.
function* prepareVolley(n) {

    const v = makeVolley(n, Math.random), gen = planTaps(v.shells, 0, v.wind, 8, 10, 6, 1 / 30);
    let r;

    const c = r.value.length ? r.value[0].c : 0;
    if (!pick || c - v.quota > pick.bestC - pick.quota) { pick = v; pick.bestC = c; pickBest = r.value; }

  if (!nextPrep) nextPrep = { n: game.volleyN + 1, gen: prepareVolley(game.volleyN + 1), vol: null };
}

function startVolley() {
  game.volleyN++;
  if (!nextPrep || nextPrep.n !== game.volleyN) nextPrep = { n: game.volleyN, gen: prepareVolley(game.volleyN), vol: null };
  const vol = nextPrep.vol || runSync(nextPrep.gen);
  nextPrep = null;
  wind = vol.wind;
  // The last volley's result popups would sit under the new VOLLEY / GOAL banner, so fade them out fast.
  for (const p of popups) p.life = Math.min(p.life, p.t + 0.2);
  game.vol = {
    shells: vol.shells, quota: vol.quota, wind: vol.wind, t: 0, sparkUsed: false, events: null, evIdx: 0,
    chain: 0, phase: "live", resultT: 0, slowAt: 0, lastT: 0, hint: vol.hint,
    banner: 1.6, chainPulse: 0, tamaya: false,

  ai.coarse = vol.cands || []; ai.deadline = vol.hint ? vol.hint.t - 0.6 : Infinity;

  if (!nextPrep || nextPrep.vol) return;
  const start = performance.now();
  while (performance.now() - start < ms) {
    const r = nextPrep.gen.next();
    if (r.done) { nextPrep.vol = r.value; return; }
  }
}

// `at` lets the AI fire at its exact planned time even if this frame landed a few ms later.
function fireSpark(x, y, at) {
  const v = game.vol;
  if (!v || v.sparkUsed || v.phase !== "live") return false;
  if (y > TAP_MAX_Y) return false;
  // A nervous tap before any shell has even left the bank is ignored rather than wasting the volley.
  if (at === undefined && !v.shells.some(s => s.launched)) return false;
  x = Math.max(xL, Math.min(xR, x)); y = Math.max(20, y);
  v.sparkUsed = true;
  const t0 = at === undefined ? v.t : Math.min(v.t, at);
  const r = simulate(v.shells, x, y, t0, 1 / 60, v.wind);
  v.events = r.events; v.evIdx = 0;
  v.lastT = r.events.length ? r.events[r.events.length - 1].t : t0;
  if (r.count >= 10) { v.slowAt = v.lastT - 0.08; slowFocus = r.events[r.events.length - 1]; }
  sparkFx(x, y);
  return true;
}

function detonate(ev) {
  const v = game.vol, sh = v.shells[ev.i];
  sh.done = true;
  if (sh.dud) {
    radial(ev.x, ev.y, 10, 60, 0.5, C_GREY, 3, 60, 2, false);
    addSmoke(ev.x, ev.y, 3, 30);
    popup(T().dud, ev.x, ev.y - 14, 13, "#b8adc0", 0.8);
    Snd.fizzle((ev.x - 225) / 260);
    return;
  }
  v.chain = ev.n; v.chainPulse = 1;
  burstFx(sh, ev);
  Snd.chime(ev.n - 1);
  if (ev.n >= 5) popup("×" + ev.n, ev.x, ev.y - 10, 12 + Math.min(10, ev.n * 0.5), "#fff3e2", 0.7);
  if (ev.n === 15 && !v.tamaya) {
    v.tamaya = true;
    popup(T().tamaya, 225, 235, 44, "#ffe08a", 1.8);
    Snd.tamaya(); flash = Math.max(flash, 0.3);
    if (!game.ai) Platform.happytime();
  }
  if (v.evIdx >= v.events.length && v.chain >= 10) {
    flash = Math.max(flash, 0.45); flashCol = "255,190,140"; addShake(8); lightUp(0.8, "255,200,140");
    Snd.finale();
  }
}

function fizzle(sh, t) {
  sh.done = true;
  const x = shellX(sh, t), y = shellY(sh, t);
  radial(x, y, 6, 40, 0.4, C_GREY, 3, 60, 1.6, true);
  addSmoke(x, y, 1, 20);
  Snd.fizzle((x - 225) / 260);
}

function updateVolley(dt, rdt) {
  const v = game.vol;
  if (!v) return;
  v.banner = Math.max(0, v.banner - rdt);
  v.chainPulse = Math.max(0, v.chainPulse - rdt * 4);
  if (v.phase === "live") {
    v.t += dt;
    for (const s of v.shells) {
      if (!s.launched && v.t >= s.tl) {
        s.launched = true;
        radial(s.x0, s.y0 - 6, 6, 60, 0.3, C_PALE, 4, -40, 2, false);
        addSmoke(s.x0, s.y0 - 10, 1, 16);
        Snd.launch((s.x0 - 225) / 260);
      }
    }
    if (v.events) {
      if (v.slowAt && v.t >= v.slowAt) { v.slowAt = 0; slowT = 0.45; Snd.slow(); }
      while (v.evIdx < v.events.length && v.events[v.evIdx].t <= v.t) detonate(v.events[v.evIdx++]);
    }
    // Build the next volley a few ms per frame now, so the volley change never stalls (the AI's own search goes first).
    if (game.lanterns > 0 && (!game.ai || !ai.gen)) { ensureNextPrep(); stepPrep(3); }
    const chainOver = v.sparkUsed && v.evIdx >= v.events.length;
    let alive = 0;
    for (const s of v.shells) {
      if (s.done) continue;
      if (v.t >= s.tEnd || (chainOver && s.launched && v.t >= Math.max(s.tl + s.ta, v.lastT + 0.3))) fizzle(s, v.t);
      else alive++;
      if (!s.done && s.launched && Math.random() < 0.35) {
        const x = shellX(s, v.t), y = shellY(s, v.t);
        emit(x, y + 3, (Math.random() - 0.5) * 20, 30 + Math.random() * 30, 0.35, 1.6, s.dud ? C_GREY : s.golden ? C_GOLD : C_PALE, 2, 60, true);
      }
    }
    if (!alive) {
      v.phase = "result"; v.resultT = 1.2;
      const ok = v.chain >= v.quota;
      game.maxChain = Math.max(game.maxChain, v.chain);
      if (v.chain > 0) { game.score += v.chain * v.chain; popup("+" + (v.chain * v.chain).toLocaleString(), 225, 480, 30, "#ffe08a", 1.4); }
      if (ok) {
        popup(v.chain >= v.quota * 1.6 ? T().great : T().nice, 225, 438, 34, "#bff7dc", 1.3);
        if (!game.ai) game.needHint = false;
        Snd.success();
      } else {
        game.lanterns--;
        popup(T().lost, 225, 438, 24, "#ffb0a0", 1.4);
        addShake(5); Snd.fail();
      }
    }
  } else if (v.phase === "result") {
    if (game.lanterns > 0) { ensureNextPrep(); stepPrep(v.resultT > 0 ? 6 : 12); }
    v.resultT -= rdt;
    if (v.resultT <= 0) {
      if (game.lanterns <= 0) gameOver();
      // On a slow device wait up to 1 s more for the background build instead of freezing the frame.
      else if (nextPrep.vol || v.resultT < -1) startVolley();
    }
  }
}

function gameOver() {
  game.vol.phase = "done";
  if (game.ai) { game.overT = 1.0; return; }
  game.state = "over"; game.overAt = performance.now();
  if (game.score > game.best) { game.best = game.score; game.newBest = true; save(K_BEST, game.best); }
  Platform.gameplayStop();
  Platform.gameOver(game.score);
  Snd.over();
  document.getElementById("overScore").textContent = game.score.toLocaleString();
  document.getElementById("overNew").hidden = !game.newBest;
  document.getElementById("overBest").textContent = T().best + " " + game.best.toLocaleString();
  document.getElementById("overChain").textContent = game.maxChain;
  document.getElementById("overVolley").textContent = game.volleyN;
  show("ovOver");
  setTimeout(() => { if (game.state === "over") document.getElementById("btnRetry").focus({ preventScroll: true }); }, 50);
}

// ---------------------------------------------------------------- AI (attract + demo)
function updateAI(rdt) {
  const v = game.vol;
  if (!v) return;
  if (v.phase === "done") {
    game.overT -= rdt;
    if (game.overT <= 0) newRun(true);
    return;
  }
  if (ai.gen) {
    const start = performance.now();
    while (performance.now() - start < 5) {
      const r = ai.gen.next();
      if (r.done) { ai.cands = r.value; ai.gen = null; break; }
    }
    if (!ai.cands && v.t >= ai.deadline) { ai.cands = ai.coarse; ai.gen = null; }
    if (ai.cands) ai.target = pickTarget(ai.cands);
  }
  const tg = ai.target;
  const goal = tg && !v.sparkUsed ? tg : { x: 225 + Math.sin(clock * 0.7) * 60, y: 430 + Math.cos(clock * 0.9) * 30 };
  const k = 1 - Math.exp(-rdt * (tg ? 5 : 1.5));
  ai.cursor.x += (goal.x - ai.cursor.x) * k; ai.cursor.y += (goal.y - ai.cursor.y) * k;
  if (tg && !ai.fired && v.phase === "live" && v.t >= tg.t) {
    ai.fired = true;
    fireSpark(tg.x, tg.y, tg.t);
  }
}

function pickTarget(all) {
  const v = game.vol;
  // Only taps still ahead of us, and never a deliberate total miss.
  let cands = all.filter(c => c.t > v.t + 0.1);
  const hits = cands.filter(c => c.c > 0);
  if (hits.length) cands = hits;
  if (!cands.length) {
    const s = v.shells.find(s => !s.done && !s.dud && s.tl + s.ta > v.t + 0.3);
    return s ? { x: shellX(s, s.tl + s.ta), y: shellY(s, s.tl + s.ta), t: s.tl + s.ta } : null;
  }
  // 70%: the best tap. 30% (from volley 3, so a clip never opens on a miss): a lower-ranked one, preferably near the quota.
  const values = [...new Set(cands.map(c => c.c))];
  let pool = cands.filter(c => c.c === values[0]);
  if (game.volleyN > 2 && Math.random() >= 0.7 && values.length > 1) {
    const close = cands.filter(c => c.c >= v.quota - 1 && c.c <= v.quota + 2 && c.c < values[0]);
    pool = close.length ? close : cands.filter(c => c.c === values[Math.min(values.length - 1, 1 + Math.floor(Math.random() * 2))]);
  }
  const c = Math.random() < 0.75 ? naturalPick(cands, v.shells, pool) : pool[Math.floor(Math.random() * pool.length)];
  // Human-looking jitter, kept only if it does not wreck the planned chain (a 12 px nudge can miss the first shell).
  for (let k = 0; k < 4; k++) {
    const x = c.x + (Math.random() - 0.5) * 24, y = c.y + (Math.random() - 0.5) * 24, t = Math.max(v.t + 0.05, c.t + (Math.random() - 0.5) * 0.12);
    if (simulate(v.shells, x, y, t, 1 / 60, v.wind).count >= Math.max(1, c.c - 1)) return { x, y, t };
  }
  return { x: c.x, y: c.y, t: c.t };
}

// ---------------------------------------------------------------- update
function update(dt, rdt) {
  clock += dt;
  if (game.state === "play" || game.state === "title") {
    if (game.ai) updateAI(rdt);
    updateVolley(dt, rdt);
    if (!game.ai) updateAim(rdt);
  }
  for (let i = timers.length - 1; i >= 0; i--) if (clock >= timers[i].at) { const f = timers[i].fn; timers.splice(i, 1); f(); }
  // particles
  for (let i = 0; i < pn;) {
    pLife[i] -= dt;
    if (pLife[i] <= 0) {
      pn--;
      pX[i] = pX[pn]; pY[i] = pY[pn]; pVX[i] = pVX[pn]; pVY[i] = pVY[pn]; pLife[i] = pLife[pn]; pMax[i] = pMax[pn];
      pSize[i] = pSize[pn]; pDrag[i] = pDrag[pn]; pGrav[i] = pGrav[pn]; pCol[i] = pCol[pn]; pFlk[i] = pFlk[pn];
      continue;
    }
    const d = Math.exp(-pDrag[i] * dt);
    pVX[i] = pVX[i] * d + wind * 0.4 * dt; pVY[i] = pVY[i] * d + pGrav[i] * dt;
    pX[i] += pVX[i] * dt; pY[i] += pVY[i] * dt;
    i++;
  }
  for (let i = willows.length - 1; i >= 0; i--) {
    const w = willows[i], a = clock - w.t;
    if (a > 1.9) { willows.splice(i, 1); continue; }
    if (a < 1.5) for (let k = 0; k < 20; k++) {
      if (Math.random() > 0.12) continue;
      const s = { x: w.x, y: w.y, ux: Math.cos(w.spin + k * Math.PI / 10), uy: Math.sin(w.spin + k * Math.PI / 10), sc: w.sc, wind: w.wind };
      emit(strandX(s, a), strandY(s, a), (Math.random() - 0.5) * 10, 10 + Math.random() * 20, 0.6, 1.5, C_PALE, 1, 30, true);
    }
  }
  for (let i = smoke.length - 1; i >= 0; i--) {
    const s = smoke[i]; s.life -= dt;
    if (s.life <= 0) { smoke.splice(i, 1); continue; }
    s.x += (s.vx + wind * 0.8) * dt; s.y += s.vy * dt; s.r += 6 * dt;
  }
  for (let i = shocks.length - 1; i >= 0; i--) if (clock - shocks[i].t > shocks[i].life) shocks.splice(i, 1);
  for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.t += rdt; if (p.t > p.life) popups.splice(i, 1); }
  shake = Math.max(0, shake - rdt * 30);
  flash = Math.max(0, flash - rdt * 1.6);
  skyLight = Math.max(0, skyLight - rdt * 1.4);
}

function updateAim(rdt) {
  const a = game.aim, k = game.keys;
  const dx = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0), dy = (k.ArrowDown ? 1 : 0) - (k.ArrowUp ? 1 : 0);
  if (dx || dy) { a.ox += dx * 230 * rdt; a.oy += dy * 230 * rdt; }
  else a.phase += rdt * 0.5;
  a.x = Math.max(20, Math.min(W - 20, 225 + Math.sin(a.phase) * 150 + a.ox));
  a.y = Math.max(60, Math.min(TAP_MAX_Y - 10, 290 + Math.sin(a.phase * 2) * 100 + a.oy));
  a.ox = Math.max(-380, Math.min(380, a.ox)); a.oy = Math.max(-300, Math.min(300, a.oy));
}

// ---------------------------------------------------------------- render
function render() {
  const g = ctx;
  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - 0.5) * shake; sy = (Math.random() - 0.5) * shake; }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
  g.drawImage(bgCv, Math.round(sx * scale * dpr), Math.round(sy * scale * dpr));
  worldTransform(g, sx, sy);
  if (skyLight > 0.01) {
    g.globalCompositeOperation = "lighter";
    g.fillStyle = "rgba(" + skyCol + "," + (skyLight * SKY_ALPHA).toFixed(3) + ")";
    g.fillRect(xL - 20, yT - 20, xR - xL + 40, HORIZON - yT + 20);
    g.globalCompositeOperation = "source-over";
  }
  for (const s of smoke) {
    g.globalAlpha = Math.min(1, s.life / 2) * 0.28;
    g.drawImage(smokeSprite, s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
  }
  g.globalAlpha = 1;
  g.globalCompositeOperation = "lighter";
  drawShocks(g);
  drawShells(g);
  drawWillows(g);
  drawParticles(g);
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(bankCv, Math.round(sx * scale * dpr), Math.round(sy * scale * dpr));
  worldTransform(g, sx, sy);
  g.globalCompositeOperation = "lighter";
  for (const l of lanternsPos) {
    if (l.x < xL - 20 || l.x > xR + 20) continue;
    const f = 0.75 + 0.25 * Math.sin(clock * 3 + l.ph) + skyLight * 0.3;
    g.globalAlpha = 0.55 * f;
    g.drawImage(sprites[C_AMBER], l.x - 14 * l.s, l.y - 14 * l.s, 28 * l.s, 28 * l.s);
    g.globalAlpha = 0.95;
    g.fillStyle = "#ff8a3c"; g.fillRect(l.x - 3 * l.s, l.y - 4 * l.s, 6 * l.s, 8 * l.s);
  }
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
  drawRiver(g, sy);
  worldTransform(g);
  drawHUD(g);
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (flash > 0.01 && FLASH_ALPHA > 0) {
    g.globalCompositeOperation = "lighter";
    g.fillStyle = "rgba(" + flashCol + "," + (flash * FLASH_ALPHA).toFixed(3) + ")";
    g.fillRect(0, 0, cv.width, cv.height);
    g.globalCompositeOperation = "source-over";
  }
  if (slowT > 0) {
    const a = Math.min(1, slowT / 0.15) * 0.45;
    const vg = g.createRadialGradient(cv.width / 2, cv.height / 2, Math.min(cv.width, cv.height) * 0.3, cv.width / 2, cv.height / 2, Math.max(cv.width, cv.height) * 0.75);
    vg.addColorStop(0, "rgba(10,2,16,0)"); vg.addColorStop(1, "rgba(10,2,16," + a + ")");
    g.fillStyle = vg; g.fillRect(0, 0, cv.width, cv.height);
  }
}

function drawShocks(g) {
  for (const s of shocks) {
    const a = clock - s.t, u = Math.min(1, a / EXPAND), fade = 1 - a / s.life;
    g.globalAlpha = Math.max(0, fade) * (s.strong ? 0.5 : 0.15);
    g.strokeStyle = s.col; g.lineWidth = s.hoop ? 3 : s.strong ? 2 : 1.4;
    g.beginPath(); g.arc(s.x, s.y, Math.max(1, s.r * ease(u)), 0, Math.PI * 2); g.stroke();
  }
  g.globalAlpha = 1;
}

function drawShells(g) {
  const v = game.vol;
  if (!v) return;
  const t = v.t;
  for (const s of v.shells) {
    if (s.done || t < s.tl) continue;
    const col = s.dud ? C_GREY : s.golden ? C_GOLD : TYPE_COLOR[s.type];
    g.fillStyle = COLORS[col];
    for (let j = 1; j <= 10; j++) {
      const tt = t + j * 0.11;
      if (tt > s.tEnd) break;
      g.globalAlpha = 0.32 * (1 - j / 11);
      g.fillRect(shellX(s, tt) - 1, shellY(s, tt) - 1, 2, 2);
    }
    const x = shellX(s, t), y = shellY(s, t);
    const tx = shellX(s, Math.max(s.tl, t - 0.1)), ty = shellY(s, Math.max(s.tl, t - 0.1));
    g.globalAlpha = 0.6; g.strokeStyle = COLORS[col]; g.lineWidth = 2;
    g.beginPath(); g.moveTo(tx, ty); g.lineTo(x, y); g.stroke();
    const size = s.golden ? 13 + Math.sin(clock * 12) * 3 : 8;
    g.globalAlpha = 1;
    g.drawImage(sprites[col], x - size, y - size, size * 2, size * 2);
    if (s.type === "ring" && !s.dud && !s.golden) { g.globalAlpha = 0.5; g.strokeStyle = COLORS[col]; g.lineWidth = 1; g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2); g.stroke(); }
    if (s.type === "crossette" && !s.dud && !s.golden) { g.globalAlpha = 0.6; g.fillStyle = COLORS[col]; g.fillRect(x - 6, y - 0.6, 12, 1.2); g.fillRect(x - 0.6, y - 6, 1.2, 12); }
  }
  g.globalAlpha = 1;
}

function drawWillows(g) {
  for (const w of willows) {
    const a = clock - w.t, fade = a < 1.5 ? 1 : Math.max(0, (1.9 - a) / 0.4);
    const s = { x: w.x, y: w.y, ux: 0, uy: 0, sc: w.sc, wind: w.wind };
    g.strokeStyle = COLORS[C_AMBER];
    for (let pass = 0; pass < 2; pass++) {
      g.globalAlpha = fade * (pass ? 0.3 : 0.85); g.lineWidth = pass ? 1.2 : 1.8;
      g.beginPath();
      for (let k = 0; k < 20; k++) {
        const ang = w.spin + k * Math.PI / 10; s.ux = Math.cos(ang); s.uy = Math.sin(ang);
        const j0 = pass ? 4 : 0, j1 = pass ? 14 : 4;
        let first = true;
        for (let j = j0; j <= j1; j++) {
          const b = a - j * 0.06;
          if (b < 0) break;
          const x = strandX(s, b), y = strandY(s, b);
          if (first) { g.moveTo(x, y); first = false; } else g.lineTo(x, y);
        }
      }
      g.stroke();
    }
    g.globalAlpha = fade;
    for (let k = 0; k < 20; k += 2) {
      const ang = w.spin + k * Math.PI / 10; s.ux = Math.cos(ang); s.uy = Math.sin(ang);
      g.drawImage(sprites[C_PALE], strandX(s, a) - 5, strandY(s, a) - 5, 10, 10);
    }
  }
  g.globalAlpha = 1;
}

function drawParticles(g) {
  bucketN.fill(0);
  let bright = 0;
  for (let i = 0; i < pn; i++) {
    const f = pLife[i] / pMax[i], age = pMax[i] - pLife[i];
    let b;
    if ((pFlk[i] & 2) && age < FRESH) b = age < FRESH / 2 ? 0 : 1;
    else b = f > 0.6 ? 2 : f > 0.3 ? 3 : 4;
    if (b < 3) bright++;
    const key = pCol[i] * NB + b;
    bucketIdx[key][bucketN[key]++] = i;
  }
  const k = Math.max(BRIGHT_MIN, Math.min(BRIGHT_MAX, BRIGHT_BUDGET / Math.max(1, bright)));
  BUCKET_ALPHA[0] = k * 0.4; BUCKET_ALPHA[1] = k * 0.7; BUCKET_ALPHA[2] = k; BUCKET_ALPHA[3] = 0.6 * (0.5 + 0.5 * k);
  g.lineWidth = 1.5;
  for (let key = 0; key < BUCKETS; key++) {
    const n = bucketN[key];
    if (!n) continue;
    const col = (key / NB) | 0, b = key % NB, alpha = BUCKET_ALPHA[b], idx = bucketIdx[key];
    g.globalAlpha = alpha * 0.7; g.strokeStyle = COLORS[col];
    g.beginPath();
    for (let m = 0; m < n; m++) { const i = idx[m]; g.moveTo(pX[i] - pVX[i] * 0.045, pY[i] - pVY[i] * 0.045); g.lineTo(pX[i], pY[i]); }
    g.stroke();
    g.globalAlpha = alpha;
    const sp = sprites[col];
    for (let m = 0; m < n; m++) {
      const i = idx[m];
      if ((pFlk[i] & 1) && !REDUCED && Math.random() < 0.35) continue;
      let s = pSize[i] * (0.55 + 0.45 * pLife[i] / pMax[i]) * 2;
      if (b < 2) s *= FRESH_SIZE + (1 - FRESH_SIZE) * (pMax[i] - pLife[i]) / FRESH;
      g.drawImage(sp, pX[i] - s, pY[i] - s, s * 2, s * 2);
    }
  }
  g.globalAlpha = 1;
}

function drawRiver(g, sy) {
  const hz = Math.round((oy + (HORIZON + sy) * scale) * dpr);
  const depth = cv.height - hz;
  if (depth < 2) return;
  const rw = Math.max(1, Math.ceil(cv.width / 2)), rh = Math.max(1, Math.ceil(depth / 2));
  if (reflCv.width !== rw || reflCv.height !== rh) { reflCv.width = rw; reflCv.height = rh; }
  g.setTransform(1, 0, 0, 1, 0, 0);
  const srcH = Math.min(hz, depth * 2.6);
  reflCtx.clearRect(0, 0, rw, rh);
  if (srcH > 1) reflCtx.drawImage(cv, 0, hz - srcH, cv.width, srcH, 0, 0, rw, rh);
  g.fillStyle = "#12061a"; g.fillRect(0, hz, cv.width, depth);
  const hs = Math.max(2, Math.round(3 * dpr));
  g.globalAlpha = 0.62;
  for (let d = 0; d < depth; d += hs) {
    const top = Math.max(0, Math.min(rh - 1, (depth - d - hs) / 2));
    const amp = (1.2 + d * 0.025) * dpr * scale;
    const off = Math.sin(clock * 1.7 + d * 0.05 / dpr) * amp + Math.sin(clock * 0.9 + d * 0.013 / dpr) * amp * 0.6;
    g.drawImage(reflCv, 0, top, rw, Math.max(1, hs / 2), off, hz + d, cv.width, hs);
  }
  g.globalAlpha = 1;
  g.drawImage(waterShade, 0, 0, 4, 128, 0, hz, cv.width, depth);
  worldTransform(g);
  g.globalCompositeOperation = "lighter";
  g.fillStyle = "rgba(255,180,140,0.07)";
  for (let i = 0; i < 18; i++) {
    const y = HORIZON + 6 + i * i * 1.1, x = ((i * 97 + clock * (12 + i)) % (xR - xL + 200)) + xL - 100;
    g.fillRect(x, y, 30 + i * 3, 1);
  }
  g.globalCompositeOperation = "source-over";
}

function txt(g, s, x, y, size, color, align, weight) {
  g.font = (weight || 900) + " " + size + "px " + FONT_STACK;
  g.textAlign = align || "center"; g.textBaseline = "middle";
  g.lineJoin = "round"; g.lineWidth = Math.max(3, size * 0.18); g.strokeStyle = "rgba(20,6,26,0.85)";
  g.strokeText(s, x, y); g.fillStyle = color; g.fillText(s, x, y);
}
const FONT_STACK = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif';

function lanternIcon(g, x, y, lit) {
  if (lit) { g.globalCompositeOperation = "lighter"; g.globalAlpha = 0.7; g.drawImage(sprites[C_AMBER], x - 18, y - 18, 36, 36); g.globalCompositeOperation = "source-over"; g.globalAlpha = 1; }
  g.fillStyle = lit ? "#ff7a3c" : "#3a2440";
  g.beginPath(); g.ellipse(x, y, 8, 10, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = lit ? "#2a0b1c" : "#1a0d20";
  g.fillRect(x - 5, y - 12, 10, 3); g.fillRect(x - 5, y + 9, 10, 3);
  g.strokeStyle = lit ? "#ffcf8a" : "#55405a"; g.lineWidth = 0.8;
  g.beginPath(); g.moveTo(x - 7, y - 3); g.lineTo(x + 7, y - 3); g.moveTo(x - 7, y + 3); g.lineTo(x + 7, y + 3); g.stroke();
}

function drawHUD(g) {
  const v = game.vol, S = T();
  if (!v) return;
  const titleMode = game.state === "title";
  const frozen = game.state === "paused" || game.state === "over";
  if (!titleMode) {
    for (let i = 0; i < 3; i++) lanternIcon(g, 24 + i * 26, 30, i < game.lanterns);
    txt(g, game.score.toLocaleString(), 225, 30, 28, "#fff3e2");
    txt(g, S.bestShort + " " + Math.max(game.best, game.score).toLocaleString(), 225, 54, 11, "#c9a9c9", "center", 800);
  }
  const yq = 80;
  if (!titleMode) txt(g, S.volley(game.volleyN) + "   " + S.quota(v.quota), 225, yq, 14, "#ffd9b8", "center", 800);
  const bw = 170, bx = 225 - bw / 2, by = yq + 14, u = Math.min(1, v.chain / v.quota);
  if (!titleMode) {
    g.fillStyle = "rgba(20,6,26,0.7)"; g.fillRect(bx - 2, by - 2, bw + 4, 10);
    g.fillStyle = v.chain >= v.quota ? "#4fe0a8" : "#ffb04a"; g.fillRect(bx, by, bw * u, 6);
  }
  if (v.wind && !titleMode) {
    const arrows = v.wind > 0 ? "→" : "←", n = Math.abs(v.wind) > 18 ? 2 : 1;
    txt(g, S.wind + " " + arrows.repeat(n), 225 + bw / 2 + 32, yq + 17, 11, "#c9d8ff", "center", 800);
  }
  // Mid-screen text would show through the pause / game-over cards, so only the top HUD stays.
  if (frozen) return;
  if (v.chain > 0) {
    const big = v.chain >= 10, size = (big ? 42 : 32) * (1 + v.chainPulse * 0.25);
    const col = v.chain >= 15 ? "#ffe08a" : v.chain >= v.quota ? "#bff7dc" : "#fff3e2";
    g.globalAlpha = v.phase === "result" ? Math.max(0, v.resultT / 1.2) : 1;
    txt(g, S.chain(v.chain), 225, titleMode ? 120 : 150, size, col);
    g.globalAlpha = 1;
  }
  if (v.banner > 0 && !titleMode) {
    const a = Math.min(1, v.banner / 0.4);
    g.globalAlpha = a;
    txt(g, S.volley(game.volleyN), 225, 300, 34, "#fff3e2");
    txt(g, S.quota(v.quota), 225, 340, 22, "#ffcf5a");
    g.globalAlpha = 1;
  }
  for (const p of popups) {
    const u = p.t / p.life;
    g.globalAlpha = u < 0.8 ? 1 : (1 - u) / 0.2;
    const s = p.size * (u < 0.12 ? 0.6 + u / 0.12 * 0.4 : 1);
    g.font = "900 " + s + "px " + FONT_STACK;
    const half = g.measureText(p.text).width / 2 + 6;
    txt(g, p.text, Math.max(half, Math.min(W - half, p.x)), p.y - u * 26, s, p.color);
  }
  g.globalAlpha = 1;
  if (game.state === "play" && !game.ai && v.phase === "live") drawPlayerAim(g, v, S);
  if (game.ai && v.phase !== "done" && !titleMode) drawAICursor(g, v);
}

function drawReach(g, x, y, alpha, dashed) {
  g.globalAlpha = alpha; g.strokeStyle = "#fff3e2"; g.lineWidth = 1.5;
  if (dashed) g.setLineDash([6, 6]);
  g.beginPath(); g.arc(x, y, 70, 0, Math.PI * 2); g.stroke();
  g.setLineDash([]);
  g.beginPath(); g.moveTo(x - 8, y); g.lineTo(x + 8, y); g.moveTo(x, y - 8); g.lineTo(x, y + 8); g.stroke();
  g.globalAlpha = 1;
}

function drawPlayerAim(g, v, S) {
  if (!v.sparkUsed) {
    if (game.lastInput === "key") drawReach(g, game.aim.x, game.aim.y, 0.75, true);
    else if (game.hover && game.hover.y < TAP_MAX_Y) drawReach(g, game.hover.x, game.hover.y, 0.35, true);
    txt(g, game.lastInput === "key" ? S.sparkKey : S.spark, 225, 556, 13, "#ffd9b8", "center", 800);
    if (game.needHint && v.hint) {
      const h = v.hint, dtA = h.t - v.t;
      if (dtA < 0.9 && dtA > -0.6) {
        const pulse = 0.5 + 0.5 * Math.sin(clock * 10);
        drawReach(g, h.x, h.y, 0.5 + pulse * 0.4, false);
        // Label above the ring, or below it when that would collide with the top HUD; never past the column edge.
        txt(g, S.hintTap, Math.max(72, Math.min(W - 72, h.x)), h.y - 88 > 125 ? h.y - 88 : h.y + 90, 18, "#ffe08a");
      } else if (dtA >= 0.9) txt(g, S.hintWait, 225, 520, 15, "#fff3e2");
    }
  } else if (v.evIdx < (v.events ? v.events.length : 0)) {
    txt(g, S.sparkUsed, 225, 556, 13, "#c9a9c9", "center", 800);
  }
}

function drawAICursor(g, v) {
  const c = ai.cursor;
  if (!v.sparkUsed) drawReach(g, c.x, c.y, 0.45, true);
  else if (v.t - (ai.target ? ai.target.t : 0) < 0.4) {
    const u = (v.t - ai.target.t) / 0.4;
    g.globalAlpha = 1 - u; g.strokeStyle = "#ffffff"; g.lineWidth = 3;
    g.beginPath(); g.arc(ai.target.x, ai.target.y, 14 + u * 30, 0, Math.PI * 2); g.stroke();
    g.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------- loop
let lastNow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = lastNow ? (now - lastNow) / 1000 : 0.016;
  lastNow = now;
  rdt = Math.min(0.05, Math.max(0, rdt));
  if (game.state === "paused" || game.state === "over") {
    if (game.state === "over") update(rdt * 0.5, rdt);
    render();
    return;
  }
  let ts = 1;
  if (hitstop > 0) { hitstop -= rdt; ts = 0.05; }
  else if (slowT > 0) { slowT -= rdt; ts = 0.22; }
  update(rdt * ts, rdt);
  render();
}

// ---------------------------------------------------------------- UI / input
function show(id) {
  for (const o of ["ovTitle", "ovPause", "ovOver"]) document.getElementById(o).hidden = o !== id;
  document.getElementById("btnPause").hidden = id === "ovTitle" || id === "ovOver";
}

function applyLang() {
  const S = T();
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = S[el.dataset.t];
  document.getElementById("btnLang").textContent = lang === "ja" ? "EN" : "JA";
  const cols = ["--gold", "--amber", "--jade", "--coral", "--gold"];
  const legend = document.getElementById("legend"); legend.textContent = "";
  S.legend.forEach((name, i) => {
    const s = document.createElement("span"), dot = document.createElement("i");
    dot.style.background = "var(" + cols[i] + ")"; dot.style.color = "var(" + cols[i] + ")";
    if (i === 3) { dot.style.background = "#ff6fb5"; dot.style.color = "#ff6fb5"; }
    if (i === 4) { dot.style.width = dot.style.height = "12px"; }
    s.append(dot, name); legend.append(s);
  });
  document.getElementById("overBest").textContent = S.best + " " + game.best.toLocaleString();
  document.getElementById("titleBest").textContent = game.best ? S.best + " " + game.best.toLocaleString() : "";
  document.title = lang === "ja" ? "連鎖花火 / Hanabi Chain: Fireworks" : "Hanabi Chain: Fireworks / 連鎖花火";
}

function applyMute() {
  document.getElementById("btnMute").innerHTML = Snd.muted
    ? '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" fill="currentColor"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a8.5 8.5 0 0 1 0 13" stroke="currentColor" stroke-width="2" fill="none"/></svg>';
}

function startGame() {
  // A tap or Space meant for the last volley must not skip the game-over screen.
  if (game.state === "over" && performance.now() - game.overAt < 600) return;
  Snd.init(); Snd.click();
  show(null);
  game.state = "play";
  clearFx();
  newRun(false);
  cv.focus({ preventScroll: true });
}
function clearFx() { pn = 0; smoke.length = shocks.length = willows.length = popups.length = timers.length = 0; slowT = 0; hitstop = 0; }

function pause() {
  if (game.state !== "play") return;
  game.state = "paused"; show("ovPause");
  Platform.gameplayStop();
  setTimeout(() => document.getElementById("btnResume").focus({ preventScroll: true }), 30);
}
function resume() {
  if (game.state !== "paused") return;
  Snd.init();
  game.state = "play"; show(null); lastNow = 0;
  Platform.gameplayStart();
  cv.focus({ preventScroll: true });
}

function toWorld(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / scale, y: (e.clientY - r.top - oy) / scale }; }

cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  Snd.init();
  if (game.state !== "play" || game.ai) return;
  game.lastInput = e.pointerType === "mouse" ? "mouse" : "touch";
  const p = toWorld(e);
  fireSpark(p.x, p.y);
});
cv.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  game.hover = toWorld(e);
  if (game.lastInput === "key" && game.state === "play") game.lastInput = "mouse";
});
cv.addEventListener("pointerleave", () => { game.hover = null; });
cv.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("touchmove", e => { if (e.target === cv || e.target === stage) e.preventDefault(); }, { passive: false });

window.addEventListener("keydown", e => {
  const k = e.key || "";
  if (k === "Tab") return;
  Snd.init();
  if (k.startsWith("Arrow")) { e.preventDefault(); game.keys[k] = true; if (game.state === "play") game.lastInput = "key"; return; }
  if (k === " " || k === "Enter") {
    const onButton = document.activeElement && document.activeElement.tagName === "BUTTON";
    if (onButton) game.lastInput = "key";
    if ((game.state === "title" || game.state === "over") && !onButton) { e.preventDefault(); startGame(); game.lastInput = "key"; }
    else if (game.state === "paused" && !onButton) { e.preventDefault(); resume(); }
    else if (game.state === "play" && !e.repeat) {
      e.preventDefault();
      if (game.lastInput !== "key") { game.lastInput = "key"; return; }
      fireSpark(game.aim.x, game.aim.y);
    }
    return;
  }
  if (k === "Escape" || k === "p" || k === "P") { if (game.state === "play") pause(); else if (game.state === "paused") resume(); }
  if (k === "m" || k === "M") { Snd.setMuted(!Snd.muted); applyMute(); }
});
window.addEventListener("keyup", e => { game.keys[e.key] = false; });

document.getElementById("btnStart").addEventListener("click", startGame);
document.getElementById("btnRetry").addEventListener("click", startGame);
document.getElementById("btnResume").addEventListener("click", resume);
document.getElementById("btnRestart").addEventListener("click", startGame);
document.getElementById("btnPause").addEventListener("click", () => { Snd.init(); if (game.state === "play") pause(); else if (game.state === "paused") resume(); });
document.getElementById("btnMute").addEventListener("click", () => { Snd.init(); Snd.setMuted(!Snd.muted); applyMute(); Snd.click(); });
document.getElementById("btnLang").addEventListener("click", () => { lang = lang === "ja" ? "en" : "ja"; save(K_LANG, lang); applyLang(); });
for (const b of document.querySelectorAll("button")) b.addEventListener("pointerdown", e => e.stopPropagation());
for (const b of document.querySelectorAll("#bar button")) b.addEventListener("click", () => { if (game.state === "play") cv.focus({ preventScroll: true }); });

function autoPause() { game.keys = {}; if (!game.ai) pause(); }
document.addEventListener("visibilitychange", () => { if (document.hidden) { autoPause(); Snd.suspend(); } else if (game.state !== "paused") Snd.wake(); });
window.addEventListener("blur", autoPause);
window.addEventListener("resize", resize);

// ---------------------------------------------------------------- boot
resize();
applyLang();
applyMute();
if (DEMO) {
  show(null);
  document.getElementById("bar").hidden = true;
  game.state = "play";
  newRun(true);
} else {
  show("ovTitle");
  game.state = "title";
  newRun(true);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
