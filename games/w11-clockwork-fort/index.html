<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゼンマイとりで / Clockwork Fort</title>
<style>
/* Clockwork Fort: everything is drawn on one canvas; the DOM holds only transparent hit areas over the drawn
   controls, so tools/qa.mjs can find them by data-qa. */
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#9fdcff}
body{font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#ui button{position:absolute;margin:0;padding:0;border:0;background:transparent;color:transparent;font:8px system-ui,sans-serif;overflow:hidden;cursor:pointer;pointer-events:auto;touch-action:manipulation}
#ui button:focus{outline:none}
#ui button:focus-visible{outline:2px dashed #1d2340;outline-offset:1px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="ui">
  <section id="ovTitle" class="ov">
    <button id="btnStart" type="button" data-qa="start" data-s="start"></button>
    <button id="btnLang" type="button" data-qa="lang"></button>
  </section>
  <section id="ovPause" class="ov" hidden>
    <button id="btnResume" type="button" data-qa="resume" data-s="resume"></button>
    <button id="btnRestart" type="button" data-qa="restart" data-s="restart"></button>
    <button id="btnQuit" type="button" data-qa="quit" data-s="toTitle"></button>
  </section>
  <section id="ovOver" class="ov" hidden>
    <button id="btnRetry" type="button" data-qa="retry" data-s="retry"></button>
    <button id="btnToTitle" type="button" data-qa="title" data-s="toTitle"></button>
  </section>
  <button id="btnPause" type="button" data-qa="pause" aria-label="pause" hidden>II</button>
  <button id="btnMute" type="button" data-qa="mute" aria-label="sound"></button>
</div>
</div>
<script>
(function () {
"use strict";
// Portal SDK adapter: a portal build can replace this object before the game script runs.
window.Platform = window.Platform || { gameplayStart() {}, gameplayStop() {}, happytime() {}, gameOver(score) {} };
const platform = (name, ...args) => { try { window.Platform[name](...args); } catch (e) { /* SDK failures never break the game */ } };

// ==== ART KIT START ====
// From the template's kit (layout, paths, shapes, text, sprite cache, juice, particles, audio bus, hint), with this
// game's own palette and one flat "toy" style: flat colour, one shade tone, a dark navy ink line. No gradients.

// ---------- palette: one table (the only hex colours in the script) ----------
const PALS = {
  T: { // a bright toy meadow at noon
    ink: "#1d2340", paper: "#fffaf0", paperD: "#e9e1cf", grey: "#b9bfcc", greyD: "#6e7488", white: "#ffffff",
    sky: "#9fdcff", skyL: "#c8ecff", cloud: "#ffffff", hill: "#7ccb6c", hillD: "#62b45a", far: "#a8d9c0",
    grass: "#9fd86c", grassL: "#b2e27e", grassD: "#86c75c", hedge: "#4fa356", hedgeD: "#3c8a47", trunk: "#a06f48",
    soil: "#e8cf98", soilD: "#d3b57a", floor: "#efe2c2", floorD: "#d9c9a4",
    red: "#ef5a4c", redD: "#c03f3a", redL: "#ff8f80", blue: "#3f86e0", blueD: "#2b62b0", blueL: "#8cc0ff",
    yellow: "#ffc93c", yellowD: "#d99b1f", green: "#5cc46a", greenD: "#3d9a50", purple: "#8a63d2", purpleD: "#6544a8", purpleL: "#b79cf0",
    orange: "#ff9a3c", orangeD: "#d9741f", pink: "#ff8fb0",
    tin: "#c4cfe0", tinD: "#93a0b8", tinL: "#e8eef8", wood: "#e7b97c", woodD: "#bd8a52", stone: "#ddd8cc", stoneD: "#b0a999",
    gold: "#ffcf3a", goldD: "#d79a12", goldL: "#fff0a6", hp: "#52cf6c", hpD: "#2f9a4c", bar: "#2b3352", lock: "#cdd1da"
  }
};

// ---------- style: how fills, ink and shade look ----------
const SANS = '"Hiragino Maru Gothic ProN","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif';
let PAL = PALS.T, MONO = false, FLASH = false;
// palette name -> colour. Under MONO (bake(..., mono)) colours print as greys and the ink stays ink
function C(c) {
  const v = PAL[c] || c; if (FLASH) return v === PAL.ink ? v : PAL.white;
  if (!MONO || v === PAL.ink) return v;
  const n = parseInt(v.slice(1), 16), l = (0.3 * (n >> 16) + 0.59 * (n >> 8 & 255) + 0.11 * (n & 255)) / 255;
  return l > 0.72 ? PAL.paperD : l > 0.55 ? PAL.grey : PAL.greyD;
}
function rgba(c, a) { const n = parseInt(C(c).slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
const ST = { id: "T", lw: 2, ui: SANS, title: SANS,
  fill(x, p, c, rule) { x.fillStyle = C(c); x.fill(p, rule || "nonzero"); },
  edge(x, p, w) { x.lineJoin = "round"; x.lineCap = "round"; x.strokeStyle = PAL.ink; x.lineWidth = w || this.lw; x.stroke(p); },
  line(x, p, w, c) { x.lineCap = x.lineJoin = "round"; x.strokeStyle = C(c || "ink"); x.lineWidth = w; x.stroke(p); },
  shade(x, p, c, ox, oy) { celShade(x, p, C(c), ox, oy); }, light() {} };
// ---------- small helpers ----------
const TAU = Math.PI * 2, fl = Math.floor;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const easeOut = x => 1 - (1 - clamp(x, 0, 1)) ** 3;
const easeBack = x => { x = clamp(x, 0, 1) - 1; return 1 + 2.7 * x * x * x + 1.7 * x * x; };   // overshoots about 10 %
const wob = (k, f, d) => k < 0 || k > 1 ? 0 : Math.exp(-k * d) * Math.cos(k * f);           // damped wobble 1 -> 0
const cnv = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
// seeded PRNG (mulberry32) for everything that changes the outcome, so a run replays the same at any frame rate
function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss(r, mu, sigma) { const u = Math.max(1e-9, r()), v = r(); return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }

// ---------- storage: one JSON record under "<prefix>save"; never throws, works in memory when blocked ----------
function makeStore(prefix) {
  const KEY = prefix + "save"; let data = {};
  try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); if (v && typeof v === "object") data = v; } catch (e) { data = {}; }
  return {
    get(k, d) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : d; },
    set(k, v) { data[k] = v; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage blocked */ } }
  };
}

// ---------- screen layout: a cw x ch logical scene drawn at device resolution ----------
// K = device px per logical px (one uniform scale, devicePixelRatio capped at 2). Space around the scene shows more
// world, never bars; (L.x0, L.y0) is the scene's (0, 0). L.wide: the side areas can take the HUD while the play area
// keeps the full height. L.u scales UI and text up on small landscape screens (TEXT_MIN, bar 1.4.4).
const TEXT_MIN = 14;
const L = { K: 1, dpr: 1, kc: 1, W: 360, H: 640, x0: 0, y0: 0, u: 1, wide: false };
function artResize(cv, cssW, cssH, cw, ch, sideMin) {
  const dpr = L.dpr = Math.min(2, window.devicePixelRatio || 1);
  const dw = Math.max(2, Math.round(cssW * dpr)), dh = Math.max(2, Math.round(cssH * dpr)), K = Math.min(dw / cw, dh / ch);
  if (K !== L.K) SPR.clear();
  cv.width = dw; cv.height = dh;
  Object.assign(L, { K, kc: K / dpr, W: dw / K, H: dh / K });
  L.x0 = (L.W - cw) / 2; L.y0 = (L.H - ch) * 0.6;   // extra height goes mostly to the sky
  L.u = clamp(12.6 / (TEXT_MIN * L.kc), 1, L.x0 > 40 ? 1.45 : 1.1);
  L.wide = L.x0 >= (sideMin || 200) * L.u;
}
// scene coords -> device px, with a shake (sx, sy in logical px) and a camera zoom z = { x, y, s } around a scene point
function view(x, sx, sy, z) {
  const K = L.K, s = z ? z.s : 1, fx = z ? z.x + L.x0 : 0, fy = z ? z.y + L.y0 : 0;
  x.setTransform(K * s, 0, 0, K * s, K * (fx * (1 - s) + s * (L.x0 + (sx || 0))), K * (fy * (1 - s) + s * (L.y0 + (sy || 0))));
}
// a cached layer: the whole screen plus a margin m for the shake; fn(x, X0, Y0, W, H) fills that rect in scene coords
function layer(m, fn) {
  const K = L.K, c = cnv((L.W + 2 * m) * K, (L.H + 2 * m) * K), x = c.getContext("2d");
  x.setTransform(K, 0, 0, K, K * (m + L.x0), K * (m + L.y0));
  c.txt = baking(() => fn(x, -L.x0 - m, -L.y0 - m, L.W + 2 * m, L.H + 2 * m));
  c.m = m; return c;
}
function putLayer(x, c, sx, sy, z) {
  const K = L.K, s = z ? z.s : 1, fx = z ? z.x + L.x0 : 0, fy = z ? z.y + L.y0 : 0;
  let ox = K * (fx * (1 - s) + s * ((sx || 0) - c.m)), oy = K * (fy * (1 - s) + s * ((sy || 0) - c.m));
  if (s === 1) { ox = Math.round(ox); oy = Math.round(oy); }   // whole device px: a plain copy without filtering
  x.setTransform(s, 0, 0, s, ox, oy); x.drawImage(c, 0, 0); carry(x, c.txt, s);
}
// a transparent DOM hit area over something drawn at scene rect (x, y, w, h)
function place(el, x, y, w, h) { const k = L.kc; el.style.left = (x + L.x0) * k + "px"; el.style.top = (y + L.y0) * k + "px"; el.style.width = w * k + "px"; el.style.height = h * k + "px"; }
// draw fn in a frame moved to (X, Y), scaled by s and turned by a
function at(x, X, Y, s, a, fn) { x.save(); x.translate(X, Y); if (s !== 1) x.scale(s, s); if (a) x.rotate(a); fn(); x.restore(); }

// ---------- paths: shapes drawn by hand with curves, never compass-made clip art ----------
const P2 = () => new Path2D();
const mtx = (dx, dy) => new DOMMatrix([1, 0, 0, 1, dx, dy]);
function pEll(cx, cy, rx, ry, rot) { const p = P2(); p.ellipse(cx, cy, rx, ry, rot || 0, 0, TAU); return p; }
function pRR(x, y, w, h, r) {
  const p = P2(); r = Math.min(r, w / 2, h / 2);
  p.moveTo(x + r, y); p.arcTo(x + w, y, x + w, y + h, r); p.arcTo(x + w, y + h, x, y + h, r); p.arcTo(x, y + h, x, y, r); p.arcTo(x, y, x + w, y, r); p.closePath();
  return p;
}
function pPoly(pts, open) { const p = P2(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); if (!open) p.closePath(); return p; }
const pLine = (x0, y0, x1, y1) => pPoly([[x0, y0], [x1, y1]], true);
const pCut = (x, y, w, h, c) => pPoly([[x + c, y], [x + w - c, y], [x + w, y + c], [x + w, y + h - c], [x + w - c, y + h], [x + c, y + h], [x, y + h - c], [x, y + c]]);
// a smooth curve through the midpoints of the points: reads as drawn by hand
function pSmooth(pts, open) {
  const p = P2(), n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  if (open) { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) p.quadraticCurveTo(pts[i][0], pts[i][1], ...mid(pts[i], pts[i + 1])); p.lineTo(pts[n - 1][0], pts[n - 1][1]); return p; }
  p.moveTo(...mid(pts[n - 1], pts[0]));
  for (let i = 0; i < n; i++) p.quadraticCurveTo(pts[i][0], pts[i][1], ...mid(pts[i], pts[(i + 1) % n]));
  p.closePath(); return p;
}
function pPolar(cx, cy, rx, ry, fn, n) { const pts = []; for (let i = 0; i < n; i++) { const t = i / n * TAU, f = fn(t); pts.push([cx + Math.cos(t) * rx * f, cy + Math.sin(t) * ry * f]); } return pSmooth(pts); }
// a disc whose edge wanders a little, like something cut or turned by hand
function pBlob(cx, cy, rx, ry, amp, seed) { const r = seeded(seed), k1 = r() * TAU, k2 = r() * TAU, k3 = r() * TAU; return pPolar(cx, cy, rx, ry, t => 1 + amp * (Math.sin(2 * t + k1) * 0.5 + Math.sin(3 * t + k2) * 0.3 + Math.sin(5 * t + k3) * 0.2), 40); }
function pStar(cx, cy, ro, ri, n, rot) { const pts = []; for (let i = 0; i < 2 * n; i++) { const a = (rot || 0) + i * Math.PI / n, r = i % 2 ? ri : ro; pts.push([cx + Math.sin(a) * r, cy - Math.cos(a) * r]); } return pPoly(pts); }
// crescent: half a circle back along a narrower half ellipse (k: 0 thin .. 1 half moon), turned by rot
function pMoon(cx, cy, r, k, rot) { const p = P2(); p.ellipse(cx, cy, r, r, rot, -Math.PI / 2, Math.PI / 2); p.ellipse(cx, cy, r * k, r, rot, Math.PI / 2, -Math.PI / 2, true); p.closePath(); return p; }
function chaikin(pts, k) {
  for (let j = 0; j < k; j++) {
    const o = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
    o.push(pts[pts.length - 1]); pts = o;
  }
  return pts;
}

// ---------- drawing helpers ----------
// one inked shape: flat colour, an optional shade tone sc (the shape moved ox, oy away from the light), the light
// lt = [colour, ox, oy, w, mx, my, mr] (style A only, see glint), brush ink of width w
function shape(x, p, c, w, sc, ox, oy, lt) { ST.fill(x, p, c); if (sc) ST.shade(x, p, sc, ox, oy); if (lt) ST.light(x, p, ...lt); ST.edge(x, p, w); return p; }
// one flat shade tone: the part of a shape not covered by itself moved toward the light
function celShade(x, path, col, ox, oy) {
  x.save(); x.clip(path);
  const p = P2(); p.rect(-4e3, -4e3, 8e3, 8e3); p.addPath(path, mtx(-ox, -oy));
  x.fillStyle = col; x.fill(p, "evenodd"); x.restore();
}

// tapered brush stroke along points: thin at both ends, full in the middle
function brush(x, pts, w, col) {
  const s = chaikin(pts, 3), n = s.length, A = [], B = [];
  for (let i = 0; i < n; i++) {
    const a = s[Math.max(0, i - 1)], b = s[Math.min(n - 1, i + 1)], d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const k = w * 0.5 * Math.pow(Math.sin(Math.PI * (0.06 + 0.88 * i / (n - 1))), 0.6) / d, dx = (b[0] - a[0]) * k, dy = (b[1] - a[1]) * k;
    A.push([s[i][0] - dy, s[i][1] + dx]); B.push([s[i][0] + dy, s[i][1] - dx]);
  }
  x.fillStyle = C(col || "ink"); x.fill(pPoly(A.concat(B.reverse())));
}
// inked cord: a dark line with a coloured core (cords, stems, rope ends)
function cordLine(x, path, w, col, iw) {
  x.lineCap = x.lineJoin = "round";
  x.strokeStyle = C("ink"); x.lineWidth = w + 2 * (iw == null ? 0.5 : iw); x.stroke(path);
  x.strokeStyle = C(col); x.lineWidth = w; x.stroke(path);
}
// cords from points straight up to a beam at y = top: how boards, tags and lanterns hang in the world
function cords(x, pts, top, col) { for (const [px, py] of pts) cordLine(x, pLine(px, top, px, py), 1.5, col || "red"); }

// ---------- sprite cache: a drawing is made once per size at device resolution, then drawn turned and scaled ----------
const SPR = new Map();
// Text drawn while baking (bake, lit, layer) is kept with the picture and recorded again, at its on-screen size,
// each time the picture is drawn (carry), so QA measures a baked sign the way the player sees it.
let BAKED = null;
function baking(fn) { const keep = BAKED, t = BAKED = []; try { fn(); } finally { BAKED = keep; } return t.length ? t : null; }
function carry(x, txt, k) { if (!txt) return; k = k || Math.hypot(x.getTransform().c, x.getTransform().d) / L.K; for (const t of txt) noteText(t.str, t.px * k); }
// bake: fn draws in logical px with (0, 0) at (ox, oy) in a w x h box; mono prints it locked (greys, full ink)
function bake(key, w, h, ox, oy, fn, mono) {
  let b = SPR.get(key);
  if (!b) {
    const K = L.K, c = cnv(w * K + 2, h * K + 2), x = c.getContext("2d");
    x.setTransform(K, 0, 0, K, 1 + ox * K, 1 + oy * K);
    const txt = baking(() => { MONO = !!mono; try { fn(x); } finally { MONO = false; } });
    b = { c, w: c.width / K, h: c.height / K, ox: ox + 1 / K, oy: oy + 1 / K, txt }; SPR.set(key, b);
  }
  return b;
}
function put(x, b, X, Y, a, sx, sy) {
  if (!a && !sx) { x.drawImage(b.c, X - b.ox, Y - b.oy, b.w, b.h); carry(x, b.txt); return; }
  x.save(); x.translate(X, Y); if (sx) x.scale(sx, sy || sx); if (a) x.rotate(a); x.drawImage(b.c, -b.ox, -b.oy, b.w, b.h); carry(x, b.txt); x.restore();
}

// ---------- text: system fonts, an optional ink outline; TXT records each string and the smallest size (logical px) ----------
const TXT = { min: Infinity, seen: [], last: [] };
function textEnd() { TXT.last = TXT.seen; TXT.seen = []; }   // call once at the end of every drawn frame
function noteText(str, px) { if (BAKED) BAKED.push({ str, px }); else { if (px < TXT.min) TXT.min = px; if (TXT.seen.length < 300) TXT.seen.push(str); } }
// o: { a align, f font, w weight, ol outline colour, ow its share of size, deep: a second print down right, max: fit width }
function text(x, str, X, Y, size, col, o) {
  o = o || {}; str = String(str);
  const font = s => (o.w || 800) + " " + s + "px " + (o.f || ST.ui);
  x.font = font(size);
  if (o.max) { const w = x.measureText(str).width; if (w > o.max) x.font = font(size *= o.max / w); }
  const m = x.getTransform(), px = size * Math.hypot(m.c, m.d) / L.K;
  noteText(str, px);
  x.textAlign = o.a || "center"; x.textBaseline = "middle";
  if (o.deep) { x.fillStyle = C(o.deep); x.fillText(str, X + size * 0.035, Y + size * 0.06); }
  if (o.ol) { x.lineJoin = "round"; x.miterLimit = 2; x.lineWidth = size * (o.ow || 0.2); x.strokeStyle = C(o.ol); x.strokeText(str, X, Y); }
  x.fillStyle = C(col); x.fillText(str, X, Y);
}
function textW(x, str, size, o) { x.font = ((o && o.w) || 800) + " " + size + "px " + ((o && o.f) || ST.ui); return x.measureText(String(str)).width; }

// ---------- juice: trauma shake (squared, smooth noise), capped hitstop, camera punch ----------
const Juice = { trauma: 0, t: 0, stop: 0, reduce: false, zoom: null };
function addTrauma(a) { Juice.trauma = Math.min(1, Juice.trauma + a); }
function hitstop(sec) { Juice.stop = Math.max(Juice.stop, Math.min(0.15, sec)); }
function zoomPunch(x, y, s, ms, now) { if (!Juice.reduce) Juice.zoom = { x, y, s, t: now, ms }; }
function juiceStep(dt) { Juice.trauma = Math.max(0, Juice.trauma - dt * 1.8); Juice.t += dt; Juice.stop = Math.max(0, Juice.stop - dt); }
const hash1 = i => { let h = Math.imul(i ^ 0x2c1b3c6d, 0x297a2d39); h ^= h >>> 15; h = Math.imul(h, 0x165667b1); h ^= h >>> 13; return ((h >>> 0) / 4294967296) * 2 - 1; };
function vnoise(x) { const i = fl(x), f = x - i; return lerp(hash1(i), hash1(i + 1), f * f * (3 - 2 * f)); }
function shakeOffset(max) { // logical px
  const a = Juice.trauma * Juice.trauma * max * (Juice.reduce ? 0.3 : 1);
  return a < 0.05 ? { x: 0, y: 0 } : { x: vnoise(Juice.t * 24) * a, y: vnoise(Juice.t * 24 + 57.3) * a };
}
function zoomNow(now) {
  const z = Juice.zoom; if (!z) return null;
  const k = (now - z.t) / z.ms; if (k < 0 || k >= 1) { Juice.zoom = null; return null; }
  return { x: z.x, y: z.y, s: 1 + (z.s - 1) * (k < 0.12 ? k / 0.12 : 1 - smooth((k - 0.5) / 0.5)) };
}

// ---------- particles: a capped pool of small turning shapes (dot, chip, spark, star) ----------
const PARTS = [], PART_MAX = 300, rnd = () => Math.random(); // looked up on each call, so tools can seed it

  const bt = (e, label, size, kind) => at(x, e.cx, e.y + dy, e.s, 0, () => button(x, e.w, e.h, label, size, kind));
  bt(UI.resume, S("resume"), 22, "go"); bt(UI.restart, S("restart"), 16, "plain"); bt(UI.quit, S("toTitle"), 16, "plain");
}
function drawOver(x, now) {
  const r = run.result, play = state === "over", age = resAge(r, now), u = L.u, H = play ? 330 : 280, G = run.G;
  const y = overY() - (H + 80) * u * (1 - easeBack(age / RES.drop));
  at(x, 180, y, u, 0, () => {
    panel(x, -158, 0, 316, H, "paper", "paperD", 18);
    if (age > RES.head) text(x, S(r.won ? "win" : "over"), 0, 38, 30, r.won ? "greenD" : "redD", { w: 900, max: 290 });
    if (age > RES.cause) text(x, r.cause, 0, 70, 16, "greyD", { w: 800, max: 290 });
    if (age > RES.count) {
      const v = Math.round(r.score * easeOut((age - RES.count) / RES.countDur));
      coinIcon(x, (r.showRank ? -56 : 0) - textW(x, v, 48, { w: 900 }) / 2 - 18, 116, 12);
      text(x, v, r.showRank ? -56 : 0, 118, 48, "ink", { w: 900 });
      if (r.showRank && r.rankDone) { const rk = S("ranks")[r.rank], ra = age - RES.rank, ss = 1 + 0.5 * (1 - easeOut(ra / 140)); at(x, 90, 116, ss, -0.08, () => { const w = textW(x, rk, 17) + 22; shape(x, pRR(-w / 2, -16, w, 32, 8), "red", 2, "redD", 0, 3); text(x, rk, 0, 1, 17, "white", { w: 900 }); }); }
    }
    if (age > RES.rows) {
      const row = (ry, k, v) => { text(x, S(k), -134, ry, 16, "ink", { a: "left", w: 800 }); if (v != null) text(x, v, 134, ry, 19, "blueD", { a: "right", w: 900 }); x.fillStyle = C("paperD"); for (let i = -134; i < 134; i += 6) x.fillRect(i, ry + 14, 2, 2); };
      row(168, "rWave", r.won ? S("waveOf", WAVES) : S("waveOf", G.wave)); row(202, "rKills", G.kills);
      if (play && (r.newBest || r.best > 0)) {
        row(236, "rBest", r.newBest ? null : r.best);
        if (r.newBest) { if (age > RES.best) { const sa = age - RES.best, ss = 1 + 0.5 * (1 - easeOut(sa / 140)); at(x, 70, 236, ss, -0.06, () => { const t = S("newBest"), w = textW(x, t, 16) + 20; shape(x, pRR(-w / 2, -14, w, 28, 8), "gold", 2, "goldD", 0, 3); text(x, t, 0, 1, 16, "ink", { w: 900 }); }); } }
        else text(x, r.score === r.best ? S("tieBest") : S("toBest", r.best - r.score), 30, 236, 16, "redD", { w: 800 });
      }
    }
    if (play && age > RES.goal && r.goal) { const gt = S(r.goal.k, r.goal.n), tw = textW(x, gt, 16); hand(x, -tw / 2 - 8, 292, Math.PI / 2, 0.6); text(x, gt, -tw / 2 + 4, 292, 16, "greenD", { a: "left", w: 900 }); }
  });
  if (play) { at(x, UI.retry.cx, UI.retry.y, u, 0, () => button(x, UI.retry.w, UI.retry.h, S("retry"), 24, "go")); at(x, UI.toTitle.cx, UI.toTitle.y, u, 0, () => button(x, UI.toTitle.w, UI.toTitle.h, S("toTitle"), 16, "plain")); if (retryReady()) hand(x, UI.retry.cx + UI.retry.w * u * 0.3, UI.retry.y + UI.retry.h * u * 0.6 + (fl(now / 300) & 1) * 4, -0.3, u); }
}
function drawDemoLabel(x) { // ?demo=1: a small bilingual title instead of any tool, BEST or button
  at(x, 180, vBot() - 66 * L.u, L.u, 0, () => { panel(x, -100, 0, 200, 46, "paper", "paperD", 10); text(x, STRINGS.ja.title, 0, 15, 16, "red", { w: 900 }); text(x, STRINGS.en.title, 0, 33, 14, "blueD", { w: 800 }); });
}
function drawSys(x) { // round system buttons: sound, pause, language
  const b = (e, fn) => at(x, e.cx, e.y, e.s, 0, () => { shape(x, pEll(0, e.h / 2 + 2, e.h / 2 - 1, e.h / 2 - 1), "paperD", 2); shape(x, pEll(0, e.h / 2 - 1, e.h / 2 - 1, e.h / 2 - 1), "paper", 2); fn(); });
  if (!btnMute.hidden) b(UI.mute, () => { const m = AU.muted; x.fillStyle = C("ink"); x.fill(pPoly([[-9, 16], [-5, 16], [0, 11], [0, 29], [-5, 24], [-9, 24]])); if (m) { ST.line(x, pLine(4, 15, 11, 24), 2.2); ST.line(x, pLine(11, 15, 4, 24), 2.2); } else for (const r of [5, 9]) { const p = P2(); p.arc(0, 20, r, -0.8, 0.8); ST.line(x, p, 2); } });
  if (!btnPause.hidden) b(UI.pause, () => { x.fillStyle = C("ink"); x.fill(pRR(-6, 12, 4.4, 16, 1)); x.fill(pRR(1.6, 12, 4.4, 16, 1)); });
  if (isTitle() && !ovTitle.hidden) { const e = UI.lang; at(x, e.cx, e.y, e.s, 0, () => { shape(x, pRR(-e.w / 2, 3, e.w, e.h - 3, 12), "paperD", 2); shape(x, pRR(-e.w / 2, 0, e.w, e.h - 4, 12), "paper", 2); text(x, S("lang"), 0, (e.h - 4) / 2 + 1, 15, "ink", { w: 900 }); }); }
}
function draw(now) {
  if (!run) return;
  const x = ctx, G = run.G, c = clockNow(), sh = shakeOffset(10), a = run.dead || state === "paused" ? 1 : clamp(c * SIM_HZ / 1000 - G.step + 1, 0, 1);
  if (fx.wallTier !== wallTier()) buildWall();
  const zm = zoomNow(now);
  putLayer(x, BG, sh.x, sh.y, zm);
  view(x, sh.x, sh.y, zm);
  const ens = G.en.slice().sort((p, q) => p.y - q.y);
  for (const e of ens) drawEnemy(x, e, a, G);
  drawShots(x, G, a);
  view(x); putLayer(x, WALL, sh.x, sh.y, zm); view(x, sh.x, sh.y, zm);
  drawFort(x, G, now);
  partsDraw(x);
  drawAim(x, now);
  view(x); // the HUD and the panels never shake
  const shop = G.phase === "break" && !isTitle() && !isOver() && !isDying() && !DEMO;
  if (!isTitle() && !isOver() && (L.wide || !shop)) drawWallBar(x, G, now);
  if (!isTitle() && !isOver()) { drawBossBar(x, G); drawCall(x, now); }
  if (shop || (DEMO && G.phase === "break")) drawShop(x, now, G);
  drawFlyCoins(x, now);
  if (!isTitle() && !isOver() && !DEMO) drawHud(x, now, G);
  if (DEMO && !isOver()) drawHud(x, now, G);
  drawTeach(x, now, G);
  if (isTitle()) drawTitle(x, now);
  if (state === "paused") drawPause(x, now);
  if (isOver()) drawOver(x, now);
  if (DEMO) drawDemoLabel(x); else drawSys(x);
  textEnd();
}
function visualStep(dt, now) { // smooth follows of the visuals (the rules never read them)
  if (!dt || !run) return;
  const G = run.G, a = G.aim, want = Math.atan2(a.y - (TURRET.y - 22), a.x - TURRET.x);
  if (G.fire || now - fx.shotT < 300) fx.turretA += (want - fx.turretA) * Math.min(1, dt * 18);
  else fx.turretA += (-Math.PI / 2 - fx.turretA) * Math.min(1, dt * 3);
  fx.coinsDisp = fx.coinsDisp + (G.coins - fx.coinsDisp) * Math.min(1, dt * 10);
  if (Math.abs(G.coins - fx.coinsDisp) < 0.5) fx.coinsDisp = G.coins;
  for (let i = fx.lobs.length - 1; i >= 0; i--) if (now - fx.lobs[i].t > 600) { const l = fx.lobs.splice(i, 1)[0]; burst(l.x, WALL_Y + 8, 4, 90, { col: "stoneD", kind: "chip", s: 2.4 }); fx.wallT = now; }
  if (now - fx.confT < 2500 && rnd() < dt * 40) addPart({ x: rnd() * CW, y: vTop() - 10, vx: (rnd() - 0.5) * 60, vy: 40 + rnd() * 60, g: 30, life: 3, max: 3, kind: "chip", col: ["red", "yellow", "blue", "green", "pink"][fl(rnd() * 5)], s: 3, rot: rnd() * TAU, vr: (rnd() - 0.5) * 10 });
}

// ---------- screen, language, mute ----------
function resize() {
  artResize(cv, wrap.clientWidth || innerWidth, wrap.clientHeight || innerHeight, CW, CH, 220);
  buildBg(); if (fx) buildWall(); layoutUI();
  if (run && manual) draw(simT);
}
window.addEventListener("resize", resize);
function applyLang() {
  document.documentElement.lang = lang;
  document.title = STRINGS[lang].title + (lang === "ja" ? " / Clockwork Fort" : "");
  document.querySelectorAll("[data-s]").forEach(el => { el.textContent = S(el.getAttribute("data-s")); });
  $("btnLang").textContent = S("lang");
  layoutUI();
}
function setMute(m) { if (!DEMO) store.set("mute", m); auMute(m); btnMute.textContent = m ? "sound off" : "sound on"; }

// ---------- flow ----------
function hideAll() { ovTitle.hidden = true; ovPause.hidden = true; ovOver.hidden = true; }
const newSeed = () => (Math.random() * 4294967296) >>> 0;
function startAI(mode, seed) { state = mode === "demo" ? "demo" : "title"; newRun(mode, seed == null ? newSeed() : seed); btnPause.hidden = true; }
function toTitle() { pfStop(); hideAll(); ovTitle.hidden = DEMO; startAI("attract"); }
function startPlay() {
  if (auInit()) auResume();
  sfx.ui(); hideAll();
  state = "play"; runCount++;
  newRun("play", newSeed());
  btnPause.hidden = false;
  pfStart();
}
function showOver(now) {
  state = "over"; run.result = makeResult(now); musicLevel("bed");
  if (run.result.newBest) store.set("best", run.G.score);
  store.set("runs", runsOf() + 1);
  ovOver.hidden = false; overShownAt = T(); btnPause.hidden = true;
  platform("gameOver", run.G.score);
}
function pauseGame(at) {
  if (state !== "play") return;
  state = "paused"; fx.pauseT = T();
  run.pauseClock = (at || T()) - run.offset;
  run.G.fire = false; fx.ptr = null; fx.keyHeld = false;
  musicLevel("off");
  ovPause.hidden = false; btnPause.hidden = true;
  pfStop();
}
function resumeGame() {
  if (state !== "paused") return;
  if (auInit()) auResume();
  run.offset = T() - run.pauseClock;
  state = "play"; ovPause.hidden = true; btnPause.hidden = false;
  musicLevel(BOSS_WAVES.indexOf(run.G.wave) >= 0 && run.G.phase === "battle" ? "boss" : run.G.phase === "battle" ? "play" : "bed");
  pfStart();
}
function holdClock() { if (run && run.holdAt == null && (state === "title" || state === "demo")) run.holdAt = T(); }
function releaseClock() { if (run && run.holdAt != null) { run.offset += T() - run.holdAt; run.holdAt = null; } }
function onHide() { if (state === "play") pauseGame(); else holdClock(); }
function onShow() { releaseClock(); lastNow = performance.now(); }
const retryReady = () => T() - overShownAt > 350; // a short lockout so a late gameplay tap does not restart by accident
function retry() { if (state === "over" && retryReady()) startPlay(); }

// ---------- input. Gameplay on pointerdown / keydown; the response is drawn on the next frame ----------
function toScene(e) { const k = L.kc, b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) / k - L.x0, y: (e.clientY - b.top) / k - L.y0 }; }
function tryBuy(k) {
  const G = run.G;
  if (G.phase !== "break") return;
  if (buy(G, k)) { events(G, T()); if (L.wide) burst(UI.cards[UPG_KEYS.indexOf(k)].cx, UI.cards[UPG_KEYS.indexOf(k)].y + 40, 10, 160, { col: "gold", kind: "star", s: 2.6 }); }
  else { fx.nopeT = T(); fx.nopeK = k; if (loud()) sfx.nope(); }
}
function nextWave() { const G = run.G; if (G.phase !== "break") return; startWave(G); if (hint.active && G.wave >= 2) hint.success(); events(G, T()); sfx.ui(); }
function pressAt(p) { // the core input: in battle the crossbow fires at the finger; between waves the shop
  const G = run.G;
  if (G.phase === "break") {
    for (let i = 0; i < 4; i++) if (inBox(UI.cards[i], p.x, p.y, 4)) { tryBuy(UPG_KEYS[i]); return; }
    if (inBox(UI.next, p.x, p.y, 6)) nextWave();
    return;
  }
  if (G.phase !== "battle") return;
  const q = fieldPt(p.x, p.y); G.aim.x = q.x; G.aim.y = q.y; G.fire = true; fx.downT = T();
}
auUnlock();
const on = (el, f) => el.addEventListener("click", e => { e.stopPropagation(); f(); });
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); if (state !== "play") return;
  const p = toScene(e); fx.ptr = e.pointerId; pressAt(p);
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
});
cv.addEventListener("pointermove", e => { if (state !== "play" || fx.ptr !== e.pointerId || run.G.phase !== "battle") return; const q = fieldPt(...Object.values(toScene(e))); run.G.aim.x = q.x; run.G.aim.y = q.y; });
const release = e => { if (fx && fx.ptr === e.pointerId) { fx.ptr = null; if (run && !fx.keyHeld) run.G.fire = false; } };
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", e => { e.preventDefault(); release(e); });
ovPause.addEventListener("click", e => { if (e.target === ovPause) resumeGame(); });
ovTitle.addEventListener("click", e => { if (!e.target.closest("button") || e.target.id === "btnStart") startPlay(); }); // a tap anywhere starts
// inside the lockout a press only skips the result animation; after it, one press starts the next run
ovOver.addEventListener("click", e => { if (e.target !== ovOver) return; if (retryReady()) retry(); else skipResult(T()); });
on($("btnLang"), () => { lang = lang === "ja" ? "en" : "ja"; store.set("lang", lang); applyLang(); sfx.ui(); });
on(btnMute, () => { if (auInit()) auResume(); setMute(!AU.muted); btnMute.blur(); });
on(btnPause, () => { pauseGame(); btnPause.blur(); });
on($("btnResume"), resumeGame);
on($("btnRestart"), () => { pfStop(); startPlay(); });
on($("btnQuit"), toTitle);
on($("btnRetry"), retry);
on($("btnToTitle"), () => { if (retryReady()) toTitle(); });
document.addEventListener("keydown", e => {
  if (DEMO || e.ctrlKey || e.metaKey || e.altKey || e.key === "Tab") return;
  const k = e.key, ok = k === " " || k === "Enter" || k === "Spacebar", esc = k === "Escape" || k === "p" || k === "P";
  if (ok || k.startsWith("Arrow")) e.preventDefault();
  if (e.repeat) return;
  if (k === "m" || k === "M") { setMute(!AU.muted); return; }
  if (isTitle()) { if (ok) startPlay(); }
  else if (state === "play") {
    const G = run.G;
    if (esc) pauseGame();
    else if (G.phase === "break") { if (ok) nextWave(); else if (k >= "1" && k <= "4") tryBuy(UPG_KEYS[+k - 1]); }
    else if (ok && G.phase === "battle") { fx.keyHeld = true; const f = frontEnemy(G); if (f) { G.aim.x = f.x; G.aim.y = f.y; } G.pulse = 1; G.fire = !!f; fx.downT = T(); }
  }
  else if (state === "paused") { if (ok || esc) resumeGame(); }
  else if (state === "over") { if (ok) { if (retryReady()) retry(); else skipResult(T()); } else if (k === "Escape") toTitle(); }
});
document.addEventListener("keyup", e => { const k = e.key; if ((k === " " || k === "Enter" || k === "Spacebar") && fx) { fx.keyHeld = false; if (run && !fx.ptr) run.G.fire = false; } });
document.addEventListener("visibilitychange", () => { if (document.hidden) onHide(); else onShow(); });
window.addEventListener("blur", () => { if (state === "play") pauseGame(); });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());

// ---------- update and loop ----------
function update(now, dt) {
  if (!run) return;
  if ((state === "play" || state === "title" || state === "demo") && run.holdAt == null) updateRun(now);
  if (isDying()) {
    const el = now - run.dead.at, win = run.dead.reason === "win", wait = state === "dying" ? (win ? 1500 : FREEZE) : state === "demo-dying" ? 1300 : 1400;
    if (el > wait) { if (state === "dying") showOver(now); else if (state === "demo-dying") { state = "demo-over"; run.result = makeResult(now); musicLevel("bed"); } else startAI("attract"); }
  }
  if (state === "demo-over" && now - run.result.at > 3600) startAI("demo"); // a short result hold, then the clip loops
  if (isOver()) resultStep(now);
  juiceStep(dt);
  if (state === "paused" || (isDying() && now - run.dead.at < FREEZE)) return; // the failure freeze holds every pose
  const vdt = Juice.stop > 0 ? dt * 0.15 : dt; // hitstop slows the visuals only; the run clock never stops
  fx.vt += vdt * 1000;
  partsStep(vdt); visualStep(vdt, now);
}
function step(now, dt) { update(now, dt); musicStep(); }
let lastNow = performance.now();
function frame() {
  requestAnimationFrame(frame);
  if (manual) return;
  let now = performance.now(); if (now < lastNow) now = lastNow;
  const raw = now - lastNow, prev = lastNow; lastNow = now;
  if (raw > 300 && state === "play") pauseGame(prev); // a long stall must not count as time the player had
  if (raw > 250 && run && run.ai && run.holdAt == null && !isDying()) run.offset += raw - 16; // the AI never teleports
  step(now, clamp(raw, 0, 50) / 1000);
  draw(now);
}

// ---------- test hooks (the contract in tools/README.md; tools/qa.mjs and review-kit read them) ----------
window.__game = {
  get state() { return state === "demo-over" || state === "demo-dying" ? "demo" : state === "title-dying" ? "title" : state; },
  get score() { return run ? run.G.score : 0; },
  get mode() { return run ? run.mode : null; },
  snap() { // gameplay state for frame-rate parity: integers only, no wall clock
    if (!run) return null;
    const G = run.G;
    return { state, phase: G.phase, wave: G.wave, lives: G.lives, coins: G.coins, score: G.score, kills: G.kills, enemies: G.en.length,
      wall: Math.round(G.wallHp), step: G.step, dead: run.dead && run.dead.reason, t: Math.round(clockNow()) };
  },
  manual(on) { manual = !!on; simT = performance.now(); lastNow = simT; },
  tick(ms, render) { simT += ms; step(simT, ms / 1000); if (render) draw(simT); },
  demo(seed) { hideAll(); btnPause.hidden = true; startAI("demo", seed); },
  tap() { // one shot at the robot nearest the wall; between waves, the next wave
    if (state !== "play") return; const G = run.G;
    if (G.phase === "break") { nextWave(); return; }
    const f = frontEnemy(G); if (f) { G.aim.x = f.x; G.aim.y = f.y; } G.pulse = 1; fx.downT = T();
  },
  autoplay(on) { autopilot = !!on; },
  fail() { if (state === "play" && !run.dead) { const G = run.G; G.lives = 0; G.wallHp = 0; G.phase = "lost"; G.phaseT = 0; kill("wall", T()); } },
  audioState() { return AU.ctx ? AU.ctx.state : "none"; },
  view() { return { K: L.K, dpr: L.dpr, w: L.W, h: L.H, top: L.y0, left: L.x0, cw: CW, reduce: Juice.reduce, textMin: TXT.min, wide: L.wide }; },
  texts() { return TXT.last.slice(); },
  target() { // a fixed point: the middle of the field in battle, the NEXT WAVE button between waves
    const k = L.kc, b = cv.getBoundingClientRect(), br = run && run.G.phase === "break" && state === "play";
    const p = br ? { x: UI.next.cx, y: UI.next.y + UI.next.h * UI.next.s / 2 } : { x: CW / 2, y: 300 };
    return { x: b.left + (L.x0 + p.x) * k, y: b.top + (L.y0 + p.y) * k };
  },
  peak(n) { return auPeak(() => PEAK_SET.slice(0, n || 8).forEach(k => sfx[k](1))); },
  balance(seed, prof, maxSec) { return simRun(seed, prof, maxSec); }   // a whole run headless, for balance checks
};

// ---------- boot ----------
resize();
applyLang();
AU.muted = !!store.get("mute", false); setMute(AU.muted);
if (DEMO) { hideAll(); btnMute.hidden = true; btnPause.hidden = true; auInit(); startAI("demo"); } // recordings start the bus without a gesture when the browser allows it
else toTitle();
requestAnimationFrame(frame);
})();
</script>
