<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>福よせ / LUCKY HEAP</title>
<style>
/* 福よせ (AI Weekly Arcade w07), house style 「墨と和紙」 (STYLE.md). Everything the player sees is drawn on
   the canvas at device resolution; the DOM only holds transparent hit areas over the drawn wooden tags,
   so tools/qa.mjs can find them by data-qa. */
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#2a3a6a}
body{font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none}
#ui{position:absolute;left:0;top:0;pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#ui button{position:absolute;margin:0;padding:0;border:0;background:transparent;color:transparent;font:8px system-ui,sans-serif;overflow:hidden;cursor:pointer;pointer-events:auto;touch-action:manipulation}
#ui button:focus{outline:none}
#ui button:focus-visible{outline:2px dashed #f2e8cf;outline-offset:1px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="ui">
  <section id="ovTitle" class="ov">
    <button id="btnStart" type="button" data-qa="start" data-s="start"></button>
    <button id="btnLang" type="button" data-qa="lang"></button>
    <button id="btnBook" type="button" data-s="book"></button>
  </section>
  <section id="ovPause" class="ov" hidden>
    <button id="btnResume" type="button" data-qa="resume" data-s="resume"></button>
    <button id="btnAnew" type="button" data-s="restart"></button>
    <button id="btnQuit" type="button" data-s="toTitle"></button>
  </section>
  <section id="ovOver" class="ov" hidden>
    <button id="btnRetry" type="button" data-qa="retry" data-s="retry"></button>
    <button id="btnToTitle" type="button" data-s="toTitle"></button>
    <button id="btnBookR" type="button" data-s="book"></button>
  </section>
  <section id="ovBook" class="ov" hidden>
    <button id="btnBookClose" type="button" data-s="close"></button>
  </section>
  <button id="btnPause" type="button" data-qa="pause" aria-label="pause" hidden>II</button>
  <button id="btnMute" type="button" data-qa="mute" aria-label="sound"></button>
</div>
</div>
<script>
(function () {
"use strict";

// Portal SDK adapter: a portal build can replace this object before the game script runs.
window.Platform = window.Platform || { gameplayStart() {}, gameplayStop() {}, happytime() {}, gameOver(score) {} };
const platform = (name, ...args) => { try { window.Platform[name](...args); } catch (e) { /* SDK failures never break the game */ } };

// ==== BASE (kept from template/index.html: helpers, storage, audio bus, juice, particle cap, hint, text log) ====
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const easeOut = x => 1 - (1 - clamp(x, 0, 1)) ** 3;

// ---------- storage: one JSON record under "<prefix>save"; never throws, keeps working in memory when blocked ----------
function makeStore(prefix) {
  const KEY = prefix + "save"; let data = {};
  try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); if (v && typeof v === "object") data = v; } catch (e) { data = {}; }
  return {
    get(k, d) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : d; },
    set(k, v) { data[k] = v; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage blocked */ } }
  };
}

// ---------- text log: every string drawn this frame and the smallest text drawn so far (device px) ----------
// view() reports it in logical px (TXT.min / K), so tools/qa.mjs gets the CSS size as textMin * K / dpr, baked lettering included.
const TXT = { min: Infinity, seen: [], last: [] };
function noteText(str, dev) { if (dev < TXT.min) TXT.min = dev; if (TXT.seen.length < 300) TXT.seen.push(String(str)); }

// ---------- audio bus: every voice -> (sfx | music) -> master gain -> compressor -> speakers ----------
const AU = { ctx: null, master: null, comp: null, sfx: null, music: null, noise: null, muted: false, vol: 0.7, offline: false };
function auBuild(ctx) {
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 10; comp.attack.value = 0.002; comp.release.value = 0.15;
  const master = ctx.createGain(); master.gain.value = AU.muted ? 0 : AU.vol;
  master.connect(comp); comp.connect(ctx.destination); // the only connection to the speakers
  const sfx = ctx.createGain(); sfx.gain.value = 0.8; sfx.connect(master);
  const music = ctx.createGain(); music.gain.value = 0.75; music.connect(master);
  // one shared echo send, so dry voices sit in a small room: music fully, sfx at a lower level
  const echo = ctx.createDelay(1), fb = ctx.createGain(), wet = ctx.createGain(), sendS = ctx.createGain();
  echo.delayTime.value = 0.15; fb.gain.value = 0.3; wet.gain.value = 0.16; sendS.gain.value = 0.45;
  echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(master); music.connect(echo); sfx.connect(sendS); sendS.connect(echo);
  const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  Object.assign(AU, { ctx, comp, master, sfx, music, noise: nb });
}
function auInit() {
  if (AU.ctx) return true;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  try { auBuild(new AC()); } catch (e) { AU.ctx = null; return false; }
  try { if (navigator.audioSession) navigator.audioSession.type = "ambient"; } catch (e) { /* not supported */ }
  return true;
}
function auResume() { if (AU.ctx && AU.ctx.state !== "running" && AU.ctx.state !== "closed") AU.ctx.resume().catch(() => {}); }
const audioOn = () => !!AU.ctx && (AU.ctx.state === "running" || AU.offline);
// unlock on every kind of first gesture (iOS needs touchend/click), and again whenever the tab comes back
function auUnlock() {
  const f = () => { if (auInit()) auResume(); };
  for (const t of ["pointerdown", "pointerup", "touchend", "click", "keydown", "mousedown"]) document.addEventListener(t, f, true);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) auResume(); });
}
function auMute(m) { AU.muted = m; if (AU.master) { const t = AU.ctx.currentTime; AU.master.gain.cancelScheduledValues(t); AU.master.gain.setTargetAtTime(m ? 0 : AU.vol, t, 0.012); } }
const cents = c => Math.pow(2, c / 1200);
function vary(c, gv) { return { f: cents((Math.random() * 2 - 1) * (c == null ? 40 : c)), g: 1 + (Math.random() * 2 - 1) * (gv == null ? 0.1 : gv) }; }
// one oscillator voice: starts and ends at silence, always has stop() scheduled; square/saw go through a lowpass
function tone(type, f0, f1, dur, peak, when, dest, att, lp) {
  const c = AU.ctx, o = c.createOscillator(), gn = c.createGain();
  gn.gain.value = 0; // silent until its envelope starts (the default gain of 1 would leak a click)
  o.type = type; o.frequency.setValueAtTime(f0, when);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, when + dur * 0.9);
  gn.gain.setValueAtTime(0.0001, when); gn.gain.linearRampToValueAtTime(peak, when + (att || 0.004)); gn.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  let head = o;
  if (lp || type === "square" || type === "sawtooth") { const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp || 2400; o.connect(f); head = f; }
  head.connect(gn); gn.connect(dest || AU.sfx);
  o.start(when); o.stop(when + dur + 0.05);
}
function hiss(ftype, freq, q, dur, peak, when, dest, f1) { // filtered noise voice (transients, wood, straw, air)
  const c = AU.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), gn = c.createGain();
  gn.gain.value = 0;
  s.buffer = AU.noise; f.type = ftype; f.frequency.setValueAtTime(freq, when);
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, when + dur);
  f.Q.value = q; gn.gain.setValueAtTime(0.0001, when); gn.gain.linearRampToValueAtTime(peak, when + 0.002); gn.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  s.connect(f); f.connect(gn); gn.connect(dest || AU.sfx);
  s.start(when, Math.random() * 0.5); s.stop(when + dur + 0.05);
}
// Fire some voices together through a fresh copy of the bus on an OfflineAudioContext and return the peak
// sample (window.__game.peak, bar 1.3.2). The live bus is restored before rendering, so play is unaffected.
async function auPeak(fire, sec) {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!OAC) return 0;
  const keep = Object.assign({}, AU), oc = new OAC(1, Math.round(44100 * (sec || 1.5)), 44100);
  auBuild(oc); AU.master.gain.value = AU.vol; AU.offline = true;
  try { fire(); } finally { Object.assign(AU, keep); AU.offline = false; }
  const d = (await oc.startRendering()).getChannelData(0); let p = 0;
  for (let i = 0; i < d.length; i++) p = Math.max(p, Math.abs(d[i]));
  return p;
}

// ---------- juice: trauma shake (squared, smooth noise), camera punch, particle pool ----------
const Juice = { trauma: 0, t: 0, reduce: false, zoom: null };
function addTrauma(a) { Juice.trauma = Math.min(1, Juice.trauma + a); }
function zoomPunch(x, y, s, ms, now) { if (!Juice.reduce) Juice.zoom = { x, y, s, t: now, ms }; }
function juiceStep(dt) { Juice.trauma = Math.max(0, Juice.trauma - dt * 1.8); Juice.t += dt; }
const hash1 = i => { let h = Math.imul(i ^ 0x2c1b3c6d, 0x297a2d39); h ^= h >>> 15; h = Math.imul(h, 0x165667b1); h ^= h >>> 13; return ((h >>> 0) / 4294967296) * 2 - 1; };
function vnoise(x) { const i = Math.floor(x), f = x - i; return lerp(hash1(i), hash1(i + 1), f * f * (3 - 2 * f)); }
// shake in logical px: trauma squared, smooth noise, about 12 CSS px at most on a phone, a third of it with reduced motion
function shakeOffset(maxPx) {
  const a = Juice.trauma * Juice.trauma * maxPx * (Juice.reduce ? 0.3 : 1);
  return a < 0.05 ? { x: 0, y: 0 } : { x: vnoise(Juice.t * 24) * a, y: vnoise(Juice.t * 24 + 57.3) * a };
}
function zoomNow(now) {
  const z = Juice.zoom; if (!z) return null;
  const k = (now - z.t) / z.ms; if (k < 0 || k >= 1) { Juice.zoom = null; return null; }
  return { x: z.x, y: z.y, s: 1 + (z.s - 1) * (k < 0.12 ? k / 0.12 : 1 - smooth((k - 0.5) / 0.5)) };
}
const PARTS = [], PART_MAX = 300;
function addPart(o) { if (PARTS.length >= PART_MAX) PARTS.shift(); PARTS.push(o); }
function partsStep(dt) {
  for (let i = PARTS.length - 1; i >= 0; i--) {
    const q = PARTS[i]; q.life += dt;
    if (q.life > q.max) { PARTS.splice(i, 1); continue; }
    q.vy += q.g * dt; q.vx *= Math.exp(-1.8 * dt); q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
  }
}

// ---------- tap hint: an animated hand at the input target, per player (not per run) ----------
// shown until the first success; comes back after two quick deaths (< 5 s); works when storage is blocked
function makeHint(store, key) {
  let quick = 0;
  return {
    active: false,
    begin() { this.active = !store.get(key, false) || quick >= 2; },
    success() { if (this.active) { this.active = false; quick = 0; store.set(key, true); } },
    runEnded(sec) { quick = sec < 5 ? quick + 1 : 0; }
  };
}
// ==== BASE END ====
// ==== ART KIT START ====
// Series drawing kit for smooth, code-drawn art. Nothing in this block knows about charms or the kumade,
// so the next game can take it as is. Shapes are Path2D; a style decides how ink, fills and light look.
const TAU = Math.PI * 2;
const cnv = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const P2 = () => new Path2D();
const mtx = (dx, dy, s) => new DOMMatrix([s || 1, 0, 0, s || 1, dx, dy]);
function pEll(cx, cy, rx, ry, rot) { const p = P2(); p.ellipse(cx, cy, rx, ry, rot || 0, 0, TAU); return p; }
const pCirc = (cx, cy, r) => pEll(cx, cy, r, r);
function pRing(cx, cy, rx, ry, ix, iy) { const p = pEll(cx, cy, rx, ry); p.ellipse(cx, cy, ix, iy, 0, 0, TAU); return p; }   // fill with 'evenodd'
function pRR(x, y, w, h, r) {
  const p = P2(); r = Math.min(r, w / 2, h / 2);
  p.moveTo(x + r, y); p.arcTo(x + w, y, x + w, y + h, r); p.arcTo(x + w, y + h, x, y + h, r); p.arcTo(x, y + h, x, y, r); p.arcTo(x, y, x + w, y, r); p.closePath();
  return p;
}
// Crescent: circle (cx, cy, r) minus a circle of radius r2 moved by (dx, dy); one clean outline for ink.
function pCrescent(cx, cy, r, dx, dy, r2) {
  const d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d, a = (r * r - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r * r - a * a));
  const mx = cx + ux * a, my = cy + uy * a, p1 = [mx - uy * h, my + ux * h], p2 = [mx + uy * h, my - ux * h];
  const away = (ox, oy, A, B) => { const m = A + ((B - A + TAU) % TAU) / 2; return Math.cos(m) * ux + Math.sin(m) * uy > 0; };
  const A1 = Math.atan2(p1[1] - cy, p1[0] - cx), A2 = Math.atan2(p2[1] - cy, p2[0] - cx);
  const B2 = Math.atan2(p2[1] - cy - dy, p2[0] - cx - dx), B1 = Math.atan2(p1[1] - cy - dy, p1[0] - cx - dx);
  const p = P2(); p.arc(cx, cy, r, A1, A2, away(0, 0, A1, A2)); p.arc(cx + dx, cy + dy, r2, B2, B1, away(0, 0, B2, B1)); p.closePath();
  return p;
}
function pPoly(pts, open) { const p = P2(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); if (!open) p.closePath(); return p; }
// Smooth curve through the midpoints of the given points: reads as drawn by hand, never compass made.
function pSmooth(pts, open) {
  const p = P2(), n = pts.length;
  if (open) {
    p.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n - 1; i++) p.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    p.lineTo(pts[n - 1][0], pts[n - 1][1]);
    return p;
  }
  p.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; p.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
  p.closePath();
  return p;
}
function pPolar(cx, cy, rx, ry, fn, n) {
  const pts = [];
  for (let i = 0; i < n; i++) { const t = i / n * TAU, f = fn(t); pts.push([cx + Math.cos(t) * rx * f, cy + Math.sin(t) * ry * f]); }
  return pSmooth(pts);
}
// A disc whose edge wanders a little, like something cut or turned by hand.
function pBlob(cx, cy, rx, ry, amp, seed) {
  const r = rng32(seed), k1 = r() * TAU, k2 = r() * TAU, k3 = r() * TAU;
  return pPolar(cx, cy, rx, ry, t => 1 + amp * (Math.sin(2 * t + k1) * 0.5 + Math.sin(3 * t + k2) * 0.3 + Math.sin(5 * t + k3) * 0.2), 40);
}
const pMove = (path, dx, dy, s) => { const p = P2(); p.addPath(path, mtx(dx, dy, s)); return p; };
function chaikin(pts, k) {
  for (let j = 0; j < k; j++) {
    const o = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
    o.push(pts[pts.length - 1]); pts = o;
  }
  return pts;
}
// One flat shade tone on the side away from the light: the part of a shape not covered by itself moved toward the light.
function celShade(x, path, col, ox, oy) {
  x.save(); x.clip(path);
  const p = P2(); p.rect(-4e3, -4e3, 8e3, 8e3); p.addPath(path, mtx(-ox, -oy));
  x.fillStyle = col; x.fill(p, 'evenodd'); x.restore();
}
// Tapered brush ribbon along points: thin at both ends, full in the middle.
function brush(x, pts, w, col) {
  const s = chaikin(pts, 3), n = s.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = s[Math.max(0, i - 1)], b = s[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const ww = w * 0.5 * Math.pow(Math.sin(Math.PI * (0.06 + 0.88 * i / (n - 1))), 0.6);
    L.push([s[i][0] - dy * ww, s[i][1] + dx * ww]); R.push([s[i][0] + dy * ww, s[i][1] - dx * ww]);
  }
  x.fillStyle = col; x.fill(pPoly(L.concat(R.reverse())));
}
// Inked cord: a dark line with a coloured core (cords, stems, rope ends).
function cordLine(x, path, w, col, ink, iw) {
  x.lineCap = x.lineJoin = 'round';
  x.strokeStyle = ink; x.lineWidth = w + 2 * iw; x.stroke(path);
  x.strokeStyle = col; x.lineWidth = w; x.stroke(path);
}
// Twisted rope along a polyline: base strand, ink edge, and slanted strands of the second colour.
function rope(x, pts, w, c1, c2, ink, iw) {
  const p = pSmooth(pts, true);
  cordLine(x, p, w, c1, ink, iw);
  const s = chaikin(pts, 3); let acc = 0;
  x.strokeStyle = c2; x.lineWidth = w * 0.42; x.lineCap = 'butt';
  for (let i = 1; i < s.length; i++) {
    const a = s[i - 1], b = s[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]); acc += d;
    if (acc < w * 1.15) continue;
    acc = 0;
    const dx = (b[0] - a[0]) / d, dy = (b[1] - a[1]) / d, h = w * 0.42;
    x.beginPath(); x.moveTo(b[0] - dy * h - dx * h * 0.7, b[1] + dx * h - dy * h * 0.7); x.lineTo(b[0] + dy * h + dx * h * 0.7, b[1] - dx * h + dy * h * 0.7); x.stroke();
  }
}
// Flat light pool: hard-edged ellipses stepping from the ground colour up to the lit colours, each an opaque palette
// colour (an alpha wash over the ground mixes to an off-palette grey that reads as a puddle, never as light).
function pool(x, cx, cy, rx, ry, cols) {
  cols.forEach((c, i) => { x.fillStyle = c; x.beginPath(); x.ellipse(cx, cy, rx * (1 - i * 0.27), ry * (1 - i * 0.27), 0, 0, TAU); x.fill(); });
}
// Washi: laid lines, fibres and specks, made once and laid over a whole frame.
function washiTex(w, h, S, seed) {
  const c = cnv(w * S, h * S), x = c.getContext('2d'), r = rng32(seed);
  x.scale(S, S);
  x.fillStyle = 'rgba(240,230,205,0.03)';
  for (let i = 0; i < w; i += 3.6) x.fillRect(i, 0, 0.7, h);
  x.lineCap = 'round';
  for (let i = 0; i < w * h / 240; i++) {
    const fx = r() * w, fy = r() * h, a = r() * TAU, l = 4 + r() * 16;
    x.strokeStyle = r() < 0.72 ? 'rgba(244,234,210,0.11)' : 'rgba(18,14,22,0.1)';
    x.lineWidth = 0.3 + r() * 0.5;
    x.beginPath(); x.moveTo(fx, fy);
    x.quadraticCurveTo(fx + Math.cos(a) * l * 0.5 + (r() - 0.5) * 5, fy + Math.sin(a) * l * 0.5 + (r() - 0.5) * 5, fx + Math.cos(a) * l, fy + Math.sin(a) * l);
    x.stroke();
  }
  for (let i = 0; i < w * h / 70; i++) { const s = 0.3 + r() * 0.8; x.fillStyle = r() < 0.5 ? 'rgba(244,234,210,0.12)' : 'rgba(10,8,14,0.14)'; x.fillRect(r() * w, r() * h, s, s); }
  return c;
}
// Bake a drawing into a canvas once: w x h logical px at scale S.
function bake(w, h, S, fn) { const c = cnv(w * S, h * S), x = c.getContext('2d'); x.scale(S, S); fn(x); return { c, w, h }; }
const put = (x, b, X, Y) => x.drawImage(b.c, X, Y, b.w, b.h);
function tint(src, col) { const c = cnv(src.width, src.height), x = c.getContext('2d'); x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height); return c; }
// Rim light on a sprite: the band of its silhouette that faces (dx, dy), in one flat colour.
function rimLight(c, col, dx, dy, a) {
  const t = cnv(c.width, c.height), tx = t.getContext('2d');
  tx.drawImage(c, 0, 0); tx.globalCompositeOperation = 'destination-out'; tx.drawImage(c, -dx, -dy);
  tx.globalCompositeOperation = 'source-in'; tx.fillStyle = col; tx.fillRect(0, 0, t.width, t.height);
  const x = c.getContext('2d'); x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = a; x.globalCompositeOperation = 'source-atop'; x.drawImage(t, 0, 0); x.restore();
}
// Wooden tag: plank with cut corners, grain, cord holes, one shade tone, a lit edge and the style's ink.

function releaseClock() { if (run && run.holdAt != null) { run.offset += T() - run.holdAt; run.holdAt = null; } }
function onHide() { if (state === "play") pauseGame(); else holdClock(); }
function onShow() { releaseClock(); lastNow = performance.now(); }
const retryReady = () => T() - overShownAt > 350; // a short lockout so a late gameplay tap does not restart by accident
function retry() { if (state === "over" && retryReady()) startPlay(); }

// ---------- KEEP: input. Hold anywhere to grab the cord and slide to aim; let go to drop (keys: arrows/A D, Space) ----------
// The grab, the aim and the guide show on the frame after pointerdown; the drop happens on release.
const toLX = e => { const b = cv.getBoundingClientRect(); return V.x0 + (e.clientX - b.left) / V.k; };
function dropNow() {
  if (state !== "play" || !run || run.R.dead) return;
  if (run.R.release()) { fx.snip = T(); fx.ld = 1; }
}
auUnlock();
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (state !== "play" || !run || run.R.dead) return;
  fx.held = true; fx.pid = e.pointerId; run.R.kdir = 0;
  // the very first drop while the hand hint shows: the finger moves the cord from where it hangs (over the tower's
  // bean), so a plain tap anywhere drops there and starts the opening chain; later drops aim straight at the finger
  if (hint.active && run.R.drops === 0) fx.rel = { f: toLX(e), h: run.R.hang.x };
  else { fx.rel = null; run.R.aimAt(toLX(e)); }
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
});
cv.addEventListener("pointermove", e => {
  if (state !== "play" || !run || run.R.dead) return;
  if (fx.held ? e.pointerId === fx.pid : finePointer && e.pointerType === "mouse" && !(hint.active && run.R.drops === 0)) run.R.aimAt(fx.held && fx.rel ? fx.rel.h + toLX(e) - fx.rel.f : toLX(e));
});
const letGo = drop => e => { if (!fx || !fx.held || e.pointerId !== fx.pid) return; fx.held = false; fx.pid = null; fx.rel = null; if (drop) dropNow(); };
cv.addEventListener("pointerup", letGo(true));
cv.addEventListener("pointercancel", letGo(false)); // a cancelled touch (a system gesture) drops nothing
cv.addEventListener("lostpointercapture", letGo(false));
ovPause.addEventListener("click", e => { if (e.target === ovPause) resumeGame(); });
ovTitle.addEventListener("click", e => { if (!e.target.closest("button") || e.target.id === "btnStart") startPlay(); }); // a tap anywhere starts
ovBook.addEventListener("click", () => closeBook());
// inside the lockout a press only skips the result animation; after it, one press starts the next run (bar 1.5.4)
ovOver.addEventListener("click", e => { if (e.target !== ovOver) return; if (retryReady()) retry(); else skipResult(T()); });
$("btnLang").addEventListener("click", e => { e.stopPropagation(); lang = lang === "ja" ? "en" : "ja"; store.set("lang", lang); applyLang(); sfx.ui(); });
$("btnBook").addEventListener("click", e => { e.stopPropagation(); openBook(); });
btnMute.addEventListener("click", e => { e.stopPropagation(); if (auInit()) auResume(); setMute(!AU.muted); btnMute.blur(); });
btnPause.addEventListener("click", e => { e.stopPropagation(); pauseGame(); btnPause.blur(); });
$("btnResume").addEventListener("click", e => { e.stopPropagation(); resumeGame(); });
$("btnAnew").addEventListener("click", e => { e.stopPropagation(); pfStop(); startPlay(); });
$("btnQuit").addEventListener("click", e => { e.stopPropagation(); toTitle(); });
$("btnRetry").addEventListener("click", e => { e.stopPropagation(); retry(); });
$("btnToTitle").addEventListener("click", e => { e.stopPropagation(); if (retryReady()) toTitle(); });
$("btnBookR").addEventListener("click", e => { e.stopPropagation(); if (retryReady()) openBook(); });
const keys = new Set(), KL = ["ArrowLeft", "a", "A"], KR = ["ArrowRight", "d", "D"];
function setDir() { if (state === "play" && run) run.R.kdir = (keys.has("R") ? 1 : 0) - (keys.has("L") ? 1 : 0); }
document.addEventListener("keydown", e => {
  if (DEMO || e.ctrlKey || e.metaKey || e.altKey || e.key === "Tab") return;
  const k = e.key, ok = k === " " || k === "Enter" || k === "Spacebar";
  if (ok || k.startsWith("Arrow")) e.preventDefault();
  if (KL.includes(k)) { keys.add("L"); setDir(); }
  if (KR.includes(k)) { keys.add("R"); setDir(); }
  if (e.repeat) return;
  if (k === "m" || k === "M") { if (auInit()) auResume(); setMute(!AU.muted); return; }
  if (bookOpen) { if (ok || k === "Escape") closeBook(); return; }
  if (isTitle()) { if (ok) startPlay(); }
  else if (state === "play") { if (k === "Escape" || k === "p" || k === "P") pauseGame(); else if (ok || k === "ArrowDown" || k === "s" || k === "S") dropNow(); }
  else if (state === "paused") { if (ok || k === "Escape" || k === "p" || k === "P") resumeGame(); }
  else if (state === "over") { if (ok) { if (retryReady()) retry(); else skipResult(T()); } else if (k === "Escape") toTitle(); }
});
document.addEventListener("keyup", e => { if (KL.includes(e.key)) keys.delete("L"); if (KR.includes(e.key)) keys.delete("R"); setDir(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) onHide(); else onShow(); });
window.addEventListener("blur", () => { keys.clear(); if (state === "play") pauseGame(); });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());

// ---------- KEEP: update and loop. The rules step at a fixed 120 Hz from the run clock; visuals use frame time ----------
function update(now, dt) {
  if (!run) return;
  const R = run.R;
  if ((state === "play" || state === "title" || state === "demo") && run.holdAt == null) {
    const target = Math.floor(clockNow() * 0.12 + 1e-6);
    let n = 0;
    while (run.steps < target && n < 40 && !R.dead) { R.step(); run.steps++; n++; onEvents(now); }
    if (run.steps < target && !R.dead) run.offset += (target - run.steps) / 0.12;   // a long stall drops the lost time
    if (R.dead && !run.dead) die(now);
  }
  if (isDying()) {
    const el = now - run.dead.at;
    if (state === "dying") { if (el > FREEZE) showOver(now); }
    else {
      if (el > SPILL_AT && !R.spilling) { R.spill(); run.spill0 = now; if (loud()) { sfx.spill(); addTrauma(0.4); } }
      if (R.spilling) {   // the spill plays in slow motion: 0.45x as the basket lets go, then 0.7x
        const e2 = now - run.spill0, tg = Math.floor((e2 < 600 ? e2 * 0.45 : 270 + (e2 - 600) * 0.7) * 0.12); let n = 0;
        while (run.spillSteps < tg && n < 40) { R.step(); run.spillSteps++; n++; }
        R.events.length = 0;
      }
      if (el > SPILL_END) {
        if (state === "demo-dying") { state = "demo-over"; run.result = makeResult(now); musicLevel("bed"); }
        else startAI("attract");
      }
    }
  }
  if (state === "demo-over" && now - run.result.at > 1700) startAI("demo", nextDemoSeed());   // a short card, then the clip loops
  if (isOver()) resultStep(now);
  juiceStep(dt);
  if (state === "paused" || (isDying() && now - run.dead.at < FREEZE)) return;   // the failure freeze holds every pose
  partsStep(dt); fxStep(dt);
}
function step(now, dt) { update(now, dt); musicStep(); }
let lastNow = performance.now();
function frame() {
  requestAnimationFrame(frame);
  if (manual) return;
  let now = performance.now(); if (now < lastNow) now = lastNow;
  const raw = now - lastNow, prev = lastNow; lastNow = now;
  if (raw > 300 && state === "play") pauseGame(prev);   // a long stall must not count as time the player had
  if (raw > 250 && run && run.mode !== "play" && run.holdAt == null && !isDying()) run.offset += raw - 16;   // the AI never teleports
  step(now, clamp(raw, 0, 50) / 1000);
  draw(now);
}

// ---------- KEEP: test hooks (the contract in tools/README.md; tools/qa.mjs and review-kit read them) ----------
window.__game = {
  get state() { return state === "demo-over" || state === "demo-dying" ? "demo" : state === "title-dying" ? "title" : state; },
  get score() { return run ? run.R.score : 0; },
  get mode() { return run ? run.mode : null; },
  snap() { // gameplay state for frame-rate parity: integers only, no wall clock
    if (!run) return null;
    return Object.assign({ state: this.state }, run.R.snap(), { t: Math.round(clockNow()) });
  },
  manual(on) { manual = !!on; simT = performance.now(); lastNow = simT; },
  tick(ms, render) { simT += ms; step(simT, ms / 1000); if (render) draw(simT); },
  demo(seed) { hideAll(); btnPause.hidden = true; startAI("demo", seed); },
  tap() { if (state === "play") dropNow(); },
  autoplay(on) { autopilot = !!on; if (run && run.mode === "play") { const R = run.R; R.auto = autopilot; if (autopilot && R.hang.loaded) R.think(); } },
  fail() { if (state === "play" && !run.R.dead) { const R = run.R, b = R.lastOffender || { x: 180, y: F.rimY, r: 20, lv: 0, id: -1 }; R.kill(b); die(T()); } },
  audioState() { return AU.ctx ? AU.ctx.state : "none"; },
  // K: device px per logical px; w, h: the screen in logical px; left, top: the 360 x 640 scene's corner on the screen
  // (logical px); cw: the scene width; textMin: the smallest letter drawn so far in logical px (TXT keeps device px).
  view() { return { K: V.S, dpr: V.dpr, w: V.Wd / V.S, h: V.Hd / V.S, top: -V.y0, left: -V.x0, cw: 360, reduce: Juice.reduce, textMin: TXT.min / V.S, wide: V.wide }; },
  texts() { return TXT.last.slice(); },
  target() { const b = cv.getBoundingClientRect(); return { x: b.left + (180 - V.x0) * V.k, y: b.top + (300 - V.y0) * V.k }; }, // a fixed point in the kumade, never a moving object
  peak(n) { return auPeak(() => PEAK_SET.slice(0, n || 8).forEach(k => sfx[k](7, 3))); }
};

// ---------- boot ----------
resize();
applyLang();
AU.muted = !!store.get("mute", false); setMute(AU.muted);
if (DEMO) { hideAll(); btnMute.hidden = true; btnPause.hidden = true; auInit(); startAI("demo", nextDemoSeed()); } // recordings start the bus without a gesture when the browser allows it
else toTitle();
requestAnimationFrame(frame);
})();
</script>
</body>
