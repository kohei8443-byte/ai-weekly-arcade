<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>よるの惑星 / NIGHT PLANET</title>
<style>
/* AI Weekly Arcade template, house style 「墨と和紙」 (STYLE.md). Everything is drawn on one canvas; the DOM holds
   only transparent hit areas over the drawn controls, so tools/qa.mjs can find them by data-qa. */
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#2a2147}
body{font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#ui button{position:absolute;margin:0;padding:0;border:0;background:transparent;color:transparent;font:8px system-ui,sans-serif;overflow:hidden;cursor:pointer;pointer-events:auto;touch-action:manipulation}
#ui button:focus{outline:none}
#ui button:focus-visible{outline:2px dashed #f6f2ea;outline-offset:1px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="ui">
  <section id="ovTitle" class="ov">
    <button id="btnStart" type="button" data-qa="start" data-s="start"></button>
    <button id="btnLang" type="button" data-qa="lang"></button>
  </section>
  <section id="ovPause" class="ov" hidden>
    <button id="btnResume" type="button" data-qa="resume" data-s="resume"></button>
    <button id="btnRestart" type="button" data-qa="restart" data-s="restart"></button>
    <button id="btnQuit" type="button" data-qa="quit" data-s="toTitle"></button>
  </section>
  <section id="ovOver" class="ov" hidden>
    <button id="btnRetry" type="button" data-qa="retry" data-s="retry"></button>
    <button id="btnToTitle" type="button" data-qa="title" data-s="toTitle"></button>
  </section>
  <button id="btnPause" type="button" data-qa="pause" aria-label="pause" hidden>II</button>
  <button id="btnMute" type="button" data-qa="mute" aria-label="sound"></button>
</div>
</div>
<script>
(function () {
"use strict";

// Portal SDK adapter: a portal build can replace this object before the game script runs.
window.Platform = window.Platform || { gameplayStart() {}, gameplayStop() {}, happytime() {}, gameOver(score) {} };
const platform = (name, ...args) => { try { window.Platform[name](...args); } catch (e) { /* SDK failures never break the game */ } };

// ==== ART KIT START ====
// The house style 「墨と和紙」 (STYLE.md) as code. It knows nothing about the game: copy it unchanged (a week may retune
// palette values, or add a name to both B and A, 40 names at most). Style A 「つやつや細工」: useStyle("A").
// tools/qa.mjs relies on TXT, place(), auPeak().

// ---------- palettes: one table per style, same names (the only hex colours in the script) ----------
const PALS = {
  B: { // 「よるの惑星」 (w08, kouhei's pick): the night side of a small planet; CO in the game says what each colour is
    ink: "#241a3c", paper: "#f6f2ea", paperD: "#d8d0c4", grey: "#b2a7c4", greyD: "#6e6386",
    tag: "#3a3160", tagL: "#51478a", tagD: "#2a2147", tagG: "#cfc2dc", plank: "#9dcc5a", plankL: "#c8e692", plankD: "#72a13c",
    pane: "#8c5dc4", paneL: "#b394e0", paneT: "#63409a", paneS: "#f08c6a",
    red: "#f07a55", redD: "#c5553a", redL: "#ffd8c6", gold: "#f4c44e", goldD: "#c1902a", goldL: "#ffd36a", orange: "#fff3c4", indigo: "#3c5ba6",
    sky0: "#2a2147", sky1: "#342a5b", sky2: "#1e1836", sky3: "#90b3eb", mist: "#cfc2dc", far: "#19132e", mid: "#a996c3",
    ground: "#e8dff0", groundL: "#f4eff8", poolA: "#d7cae6", poolB: "#cbbcdd", lit: "#5fc9bf", warm: "#fff3c4", shadeK: "#2f9188", hlK: "#a9ede5", grass: "#72a13c"
  },
  A: { // 「つやつや細工」: a dusk in real materials (lacquer, brass, glaze) under one light
    ink: "#21161d", paper: "#f7ecd4", paperD: "#d8c49e", grey: "#bdb4aa", greyD: "#6c6470",
    tag: "#dcb47a", tagL: "#f4dcab", tagD: "#a77a46", tagG: "#c39a62", plank: "#4b3027", plankL: "#704c3b", plankD: "#2b1b1a",
    pane: "#1c1418", paneL: "#35262c", paneT: "#f7ecd4", paneS: "#fde3a0",
    red: "#d03a2c", redD: "#8b1e1d", redL: "#f08466", gold: "#e4ae3e", goldD: "#a0691c", goldL: "#fde3a0", orange: "#f28b2e", indigo: "#2b3b7a",
    sky0: "#1d1c40", sky1: "#3a2c62", sky2: "#7a4470", sky3: "#e08a5a", mist: "#b4607a", far: "#4f3768", mid: "#2f2549",
    ground: "#4a3030", groundL: "#6a4639", poolA: "#6e4a3a", poolB: "#98694a", lit: "#e8a65a", warm: "#ffb45e", shadeK: "#231a3c", hlK: "#fff8e8", grass: "#6f8a46"
  }
};

// ---------- small helpers ----------
const TAU = Math.PI * 2, fl = Math.floor;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const easeOut = x => 1 - (1 - clamp(x, 0, 1)) ** 3;
const easeBack = x => { x = clamp(x, 0, 1) - 1; return 1 + 2.7 * x * x * x + 1.7 * x * x; };   // overshoots about 10 %
const wob = (k, f, d) => k < 0 || k > 1 ? 0 : Math.exp(-k * d) * Math.cos(k * f);           // damped wobble 1 -> 0
const cnv = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
// seeded PRNG (mulberry32) for everything that changes the outcome, so a run replays the same at any frame rate
function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss(r, mu, sigma) { const u = Math.max(1e-9, r()), v = r(); return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }

// ---------- storage: one JSON record under "<prefix>save"; never throws, works in memory when blocked ----------
function makeStore(prefix) {
  const KEY = prefix + "save"; let data = {};
  try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); if (v && typeof v === "object") data = v; } catch (e) { data = {}; }
  return {
    get(k, d) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : d; },
    set(k, v) { data[k] = v; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage blocked */ } }
  };
}

// ---------- styles: how ink, fills, shade and light look; ST and PAL are the active style ----------
const SANS = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif';
const SERIF = '"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Noto Serif CJK JP",IPAPMincho,serif';
let PAL = PALS.B, ST = null, MONO = false;
// palette name -> colour. Under MONO (bake(..., mono)) colours print as the inactive greys and the ink stays ink:
// a locked or spent thing keeps its full outline and opacity, it never fades.
function C(c) {
  const v = PAL[c] || c; if (!MONO || v === PAL.ink) return v;
  const n = parseInt(v.slice(1), 16), l = (0.3 * (n >> 16) + 0.59 * (n >> 8 & 255) + 0.11 * (n & 255)) / 255;
  return l > 0.72 ? PAL.paperD : l > 0.55 ? PAL.grey : PAL.greyD;
}
function rgba(c, a) { const n = parseInt(C(c).slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
const shade = (x, p, c, ox, oy) => celShade(x, p, C(c), ox, oy);
const STYLES = {
  B: { id: "B", lit: false, grain: true, lw: 1.8, ui: SERIF, title: SERIF, shade, light() {},
    // flat colour laid a little off the key block, like a hand-registered woodblock (u: units per logical px)
    fill(x, p, c, rule, u) { u = u || 1; x.save(); x.translate(0.6 * u, 0.45 * u); x.fillStyle = C(c); x.fill(p, rule || "nonzero"); x.restore(); },
    // brush ink: a thin stroke, then a heavier one pressed toward the lower right
    edge(x, p, w) { w = w || this.lw; x.save(); x.lineJoin = x.lineCap = "round"; x.strokeStyle = PAL.ink; x.lineWidth = w * 0.58; x.stroke(p); x.translate(w * 0.3, w * 0.4); x.lineWidth = w * 0.7; x.stroke(p); x.restore(); },
    line(x, p, w, c) { x.save(); x.lineCap = x.lineJoin = "round"; x.strokeStyle = C(c || "ink"); x.lineWidth = w * 0.75; x.stroke(p); x.translate(w * 0.18, w * 0.24); x.lineWidth = w * 0.6; x.stroke(p); x.restore(); } },
  A: { id: "A", lit: true, grain: false, lw: 1.3, ui: SANS, title: SERIF, shade, // one fixed light (upper left), one crisp highlight
    fill(x, p, c, rule) { x.fillStyle = C(c); x.fill(p, rule || "nonzero"); },
    edge(x, p, w) { x.lineJoin = "round"; x.strokeStyle = PAL.ink; x.lineWidth = w || this.lw; x.stroke(p); },
    line(x, p, w, c) { x.lineCap = x.lineJoin = "round"; x.strokeStyle = C(c || "ink"); x.lineWidth = w; x.stroke(p); },
    light(x, p, c, ox, oy, w, mx, my, mr) { glint(x, p, C(c), ox, oy, w, mx, my, mr); } }
};
function useStyle(id) { ST = STYLES[id] || STYLES.B; PAL = PALS[ST.id]; SPR.clear(); }   // call before the first resize

// ---------- screen layout: a cw x ch logical scene drawn at device resolution ----------
// K = device px per logical px (one uniform scale, devicePixelRatio capped at 2). Space around the scene shows more
// world, never bars; (L.x0, L.y0) is the scene's (0, 0). L.wide: the side areas can take the HUD while the play area
// keeps the full height. L.u scales UI and text up on small landscape screens (TEXT_MIN, bar 1.4.4).
const TEXT_MIN = 14;
const L = { K: 1, dpr: 1, kc: 1, W: 360, H: 640, x0: 0, y0: 0, u: 1, wide: false };
function artResize(cv, cssW, cssH, cw, ch, sideMin) {
  const dpr = L.dpr = Math.min(2, window.devicePixelRatio || 1);
  const dw = Math.max(2, Math.round(cssW * dpr)), dh = Math.max(2, Math.round(cssH * dpr)), K = Math.min(dw / cw, dh / ch);
  if (K !== L.K) SPR.clear();
  cv.width = dw; cv.height = dh;
  Object.assign(L, { K, kc: K / dpr, W: dw / K, H: dh / K });
  L.x0 = (L.W - cw) / 2; L.y0 = (L.H - ch) * 0.6;   // extra height goes mostly to the sky
  L.u = clamp(12.6 / (TEXT_MIN * L.kc), 1, L.x0 > 40 ? 1.45 : 1.1);
  L.wide = L.x0 >= (sideMin || 200) * L.u;
}
// scene coords -> device px, with a shake (sx, sy in logical px) and a camera zoom z = { x, y, s } around a scene point
function view(x, sx, sy, z) {
  const K = L.K, s = z ? z.s : 1, fx = z ? z.x + L.x0 : 0, fy = z ? z.y + L.y0 : 0;
  x.setTransform(K * s, 0, 0, K * s, K * (fx * (1 - s) + s * (L.x0 + (sx || 0))), K * (fy * (1 - s) + s * (L.y0 + (sy || 0))));
}
// a cached layer: the whole screen plus a margin m for the shake; fn(x, X0, Y0, W, H) fills that rect in scene coords
function layer(m, fn) {
  const K = L.K, c = cnv((L.W + 2 * m) * K, (L.H + 2 * m) * K), x = c.getContext("2d");
  x.setTransform(K, 0, 0, K, K * (m + L.x0), K * (m + L.y0));
  c.txt = baking(() => fn(x, -L.x0 - m, -L.y0 - m, L.W + 2 * m, L.H + 2 * m));
  c.m = m; return c;
}
function putLayer(x, c, sx, sy, z) {
  const K = L.K, s = z ? z.s : 1, fx = z ? z.x + L.x0 : 0, fy = z ? z.y + L.y0 : 0;
  let ox = K * (fx * (1 - s) + s * ((sx || 0) - c.m)), oy = K * (fy * (1 - s) + s * ((sy || 0) - c.m));
  if (s === 1) { ox = Math.round(ox); oy = Math.round(oy); }   // whole device px: a plain copy without filtering
  x.setTransform(s, 0, 0, s, ox, oy); x.drawImage(c, 0, 0); carry(x, c.txt, s);
}
// a transparent DOM hit area over something drawn at scene rect (x, y, w, h)
function place(el, x, y, w, h) { const k = L.kc; el.style.left = (x + L.x0) * k + "px"; el.style.top = (y + L.y0) * k + "px"; el.style.width = w * k + "px"; el.style.height = h * k + "px"; }
// draw fn in a frame moved to (X, Y), scaled by s and turned by a
function at(x, X, Y, s, a, fn) { x.save(); x.translate(X, Y); if (s !== 1) x.scale(s, s); if (a) x.rotate(a); fn(); x.restore(); }

// ---------- paths: shapes drawn by hand with curves, never compass-made clip art ----------
const P2 = () => new Path2D();
const mtx = (dx, dy) => new DOMMatrix([1, 0, 0, 1, dx, dy]);
function pEll(cx, cy, rx, ry, rot) { const p = P2(); p.ellipse(cx, cy, rx, ry, rot || 0, 0, TAU); return p; }
function pRR(x, y, w, h, r) {
  const p = P2(); r = Math.min(r, w / 2, h / 2);
  p.moveTo(x + r, y); p.arcTo(x + w, y, x + w, y + h, r); p.arcTo(x + w, y + h, x, y + h, r); p.arcTo(x, y + h, x, y, r); p.arcTo(x, y, x + w, y, r); p.closePath();
  return p;
}
function pPoly(pts, open) { const p = P2(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); if (!open) p.closePath(); return p; }
const pLine = (x0, y0, x1, y1) => pPoly([[x0, y0], [x1, y1]], true);
const pCut = (x, y, w, h, c) => pPoly([[x + c, y], [x + w - c, y], [x + w, y + c], [x + w, y + h - c], [x + w - c, y + h], [x + c, y + h], [x, y + h - c], [x, y + c]]);
// a smooth curve through the midpoints of the points: reads as drawn by hand
function pSmooth(pts, open) {
  const p = P2(), n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  if (open) { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) p.quadraticCurveTo(pts[i][0], pts[i][1], ...mid(pts[i], pts[i + 1])); p.lineTo(pts[n - 1][0], pts[n - 1][1]); return p; }
  p.moveTo(...mid(pts[n - 1], pts[0]));
  for (let i = 0; i < n; i++) p.quadraticCurveTo(pts[i][0], pts[i][1], ...mid(pts[i], pts[(i + 1) % n]));
  p.closePath(); return p;
}
function pPolar(cx, cy, rx, ry, fn, n) { const pts = []; for (let i = 0; i < n; i++) { const t = i / n * TAU, f = fn(t); pts.push([cx + Math.cos(t) * rx * f, cy + Math.sin(t) * ry * f]); } return pSmooth(pts); }
// a disc whose edge wanders a little, like something cut or turned by hand
function pBlob(cx, cy, rx, ry, amp, seed) { const r = seeded(seed), k1 = r() * TAU, k2 = r() * TAU, k3 = r() * TAU; return pPolar(cx, cy, rx, ry, t => 1 + amp * (Math.sin(2 * t + k1) * 0.5 + Math.sin(3 * t + k2) * 0.3 + Math.sin(5 * t + k3) * 0.2), 40); }
function pStar(cx, cy, ro, ri, n, rot) { const pts = []; for (let i = 0; i < 2 * n; i++) { const a = (rot || 0) + i * Math.PI / n, r = i % 2 ? ri : ro; pts.push([cx + Math.sin(a) * r, cy - Math.cos(a) * r]); } return pPoly(pts); }
// crescent: half a circle back along a narrower half ellipse (k: 0 thin .. 1 half moon), turned by rot
function pMoon(cx, cy, r, k, rot) { const p = P2(); p.ellipse(cx, cy, r, r, rot, -Math.PI / 2, Math.PI / 2); p.ellipse(cx, cy, r * k, r, rot, Math.PI / 2, -Math.PI / 2, true); p.closePath(); return p; }
function chaikin(pts, k) {
  for (let j = 0; j < k; j++) {
    const o = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1]; o.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]); }
    o.push(pts[pts.length - 1]); pts = o;
  }
  return pts;
}

// ---------- drawing helpers ----------
// one inked shape: flat colour, an optional shade tone sc (the shape moved ox, oy away from the light), the light
// lt = [colour, ox, oy, w, mx, my, mr] (style A only, see glint), brush ink of width w
function shape(x, p, c, w, sc, ox, oy, lt) { ST.fill(x, p, c); if (sc) ST.shade(x, p, sc, ox, oy); if (lt) ST.light(x, p, ...lt); ST.edge(x, p, w); return p; }
// one flat shade tone: the part of a shape not covered by itself moved toward the light
function celShade(x, path, col, ox, oy) {
  x.save(); x.clip(path);
  const p = P2(); p.rect(-4e3, -4e3, 8e3, 8e3); p.addPath(path, mtx(-ox, -oy));
  x.fillStyle = col; x.fill(p, "evenodd"); x.restore();
}
// one crisp highlight (style A): a band just inside the lit edge, kept near the lit corner by a mask circle
function glint(x, path, col, ox, oy, w, mx, my, mr) {
  x.save(); x.clip(path); x.beginPath(); x.arc(mx, my, mr, 0, TAU); x.clip();
  const p = P2(); p.addPath(path, mtx(ox, oy)); p.addPath(path, mtx(ox + w, oy + w * 1.2));
  x.fillStyle = col; x.fill(p, "evenodd"); x.restore();
}
// material sheen (style A only): the one gradient in the kit, only while baking a sprite (metal, lacquer, glaze)
function sheen(x, p, kind, x0, y0, x1, y1) {
  if (!ST.lit) return;
  const s = kind === "metal" ? [0, rgba("hlK", 0.42), 0.3, rgba("hlK", 0), 0.5, rgba("goldD", 0.22), 0.6, rgba("goldL", 0.24), 0.74, rgba("goldD", 0), 1, rgba("plankD", 0.3)]
    : kind === "lacquer" ? [0, rgba("hlK", 0.16), 0.36, rgba("hlK", 0), 0.7, rgba("shadeK", 0.16), 1, rgba("shadeK", 0.26)]
    : [0, rgba("hlK", 0.2), 0.45, rgba("hlK", 0), 1, rgba("shadeK", 0.16)];
  const g = x.createLinearGradient(x0, y0, x1, y1);
  for (let i = 0; i < s.length; i += 2) g.addColorStop(s[i], s[i + 1]);
  x.save(); if (p) x.clip(p); x.fillStyle = g; x.fillRect(Math.min(x0, x1) - 99, Math.min(y0, y1) - 99, Math.abs(x1 - x0) + 198, Math.abs(y1 - y0) + 198); x.restore();
}
// tapered brush stroke along points: thin at both ends, full in the middle
function brush(x, pts, w, col) {
  const s = chaikin(pts, 3), n = s.length, A = [], B = [];
  for (let i = 0; i < n; i++) {
    const a = s[Math.max(0, i - 1)], b = s[Math.min(n - 1, i + 1)], d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const k = w * 0.5 * Math.pow(Math.sin(Math.PI * (0.06 + 0.88 * i / (n - 1))), 0.6) / d, dx = (b[0] - a[0]) * k, dy = (b[1] - a[1]) * k;
    A.push([s[i][0] - dy, s[i][1] + dx]); B.push([s[i][0] + dy, s[i][1] - dx]);
  }
  x.fillStyle = C(col || "ink"); x.fill(pPoly(A.concat(B.reverse())));
}
// inked cord: a dark line with a coloured core (cords, stems, rope ends)
function cordLine(x, path, w, col, iw) {
  x.lineCap = x.lineJoin = "round";
  x.strokeStyle = C("ink"); x.lineWidth = w + 2 * (iw == null ? 0.5 : iw); x.stroke(path);
  x.strokeStyle = C(col); x.lineWidth = w; x.stroke(path);
}
// cords from points straight up to a beam at y = top: how boards, tags and lanterns hang in the world
function cords(x, pts, top, col) { for (const [px, py] of pts) cordLine(x, pLine(px, top, px, py), 1.5, col || "red"); }
// twisted rope along a polyline: base strand, ink edge, slanted strands of the second colour
function rope(x, pts, w, c1, c2, iw) {
  cordLine(x, pSmooth(pts, true), w, c1, iw);
  const s = chaikin(pts, 3), h = w * 0.42; let acc = 0;
  x.strokeStyle = C(c2); x.lineWidth = h; x.lineCap = "butt";
  for (let i = 1; i < s.length; i++) {
    const a = s[i - 1], b = s[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]); acc += d;
    if (acc < w * 1.15 || !d) continue;
    acc = 0; const dx = (b[0] - a[0]) / d * h, dy = (b[1] - a[1]) / d * h;
    x.beginPath(); x.moveTo(b[0] - dy - dx * 0.7, b[1] + dx - dy * 0.7); x.lineTo(b[0] + dy + dx * 0.7, b[1] - dx + dy * 0.7); x.stroke();
  }
}
// flat light pool: hard-edged ellipses stepping from the ground colour to warm lit ground, all opaque palette
// colours (an alpha wash over the ground mixes to an off-palette grey that reads as a puddle, never as light)
function pool(x, cx, cy, rx, ry, cols) {
  cols = cols || ["ground", "poolA", "poolB"];
  cols.forEach((c, i) => { x.fillStyle = C(c); x.fill(pEll(cx, cy, rx * (1 - i * 0.27), ry * (1 - i * 0.27))); });
}

  const v = { title: 0.45, play: 0.8, bed: 0.4, duck: 0.12, off: 0 }[lv], t = AU.ctx.currentTime;
  mus.bus.gain.cancelScheduledValues(t); mus.bus.gain.setTargetAtTime(v, t, lv === "duck" ? 0.02 : 0.25);
  if (lv === "duck") mus.drop = mus.i + 16;
}
function pad(f, w, dur, peak) { // a held drone voice: linear swell, hold, release; starts and ends at silence
  const c = AU.ctx, o = c.createOscillator(), gn = c.createGain(), r = Math.min(0.6, dur * 0.3);
  o.type = "sine"; o.frequency.value = f; gn.gain.value = 0;
  gn.gain.setValueAtTime(0, w); gn.gain.linearRampToValueAtTime(peak, w + r); gn.gain.setValueAtTime(peak, w + dur - r); gn.gain.linearRampToValueAtTime(0, w + dur);

  if (!audioOn() || AU.offline) return;

  if (!mus.bus || mus.bus.context !== c) { mus.bus = c.createGain(); mus.bus.gain.value = 0; mus.bus.connect(AU.music); musicLevel(mus.level); mus.next = c.currentTime + 0.05; }
  if (mus.level === "off") { mus.next = c.currentTime + 0.05; return; }
  if (mus.next < c.currentTime) mus.next = c.currentTime + 0.02;
  while (mus.next < c.currentTime + 0.15) {
    const i = mus.i++, w = mus.next, R = run, full = mus.level === "play" && i >= mus.drop;
    if (i % 8 === 0) { pad(ni(-5), w, MSTEP * 8 + 0.6, 0.05); pad(ni(-3), w + 0.03, MSTEP * 8 + 0.6, 0.025); } // overlapping pads: never a silent gap
    const m = MEL[i % 16];
    if (m >= 0 && (mus.level !== "bed" || i % 2 === 0)) pluck(ni(m), w, mus.level === "title" ? 0.05 : 0.06, mus.bus, 0.9);
    if (i % 16 === 6) { tone("sine", 1568, 1568, 0.2, 0.016, w, mus.bus, 0.004); tone("sine", 1568, 1568, 0.2, 0.008, w + 0.27, mus.bus, 0.004); } // a far sonar ping and its echo
    if (full && R) {
      const lay = R.bossAlive ? 3 : R.foes.length > 90 ? 2 : R.foes.length > 35 ? 1 : 0;
      if (lay >= 1 && i % 4 === 0) drum(w, 0.26);
      if (lay >= 2 && i % 4 === 2) drum(w, 0.16);
      if (lay >= 3 && i % 2 === 1) drum(w, 0.12, 1);
    }
    mus.next += MSTEP;
  }
}

// ---------- KEEP: result screen. Steps in order (count-up, rows, NEW BEST, goal), skippable by tap ----------
const RES = { drop: 300, head: 220, count: 420, countDur: 650, rows: 1150, best: 1300, goal: 1450 };
function makeResult(now) {
  const R = run, play = R.mode === "play", best = bestOf(), runs = runsOf(), time = fl(R.wt), won = !!R.dead.won;
  const r = { at: now, time, kills: R.kills, lv: R.lv, best, newBest: play && time > best && time > 0, won, ticks: 0, stamped: false, goal: null };
  // one concrete next goal from a small rotating pool (bar 1.6.1)
  const nb = BOSSES[R.bossKills], pool = [
    won ? null : { k: "g_time", n: mmss(Math.min(600, (fl(time / 60) + 1) * 60)) }, nb && !won ? { k: "g_boss", b: nb.kind } : null,
    { k: "g_lv", n: R.lv + 3 }, { k: "g_kills", n: (fl(R.kills / 50) + 1) * 50 }
  ];
  for (let i = 0; i < pool.length && !r.goal; i++) r.goal = pool[(runs + i) % pool.length];
  return r;
}
function resultStep(now) {
  const r = run.result, age = resAge(r, now);
  if (age > RES.count && age < RES.count + RES.countDur) { const k = fl((age - RES.count) / 55); if (k > r.ticks) { r.ticks = k; if (state === "over" || k % 3 === 0) sfx.tick(k); } }
  if (!r.stamped && r.newBest && age > RES.best) { // never in demo: newBest is only set in play
    r.stamped = true; sfx.best(); platform("happytime");
    const u = L.u, bx = UI.ox + 70 * u, by = overY() + 238 * u;
    burst(bx, by, 16, 220, { col: CO.gold, kind: "chip", s: 3 }); burst(bx, by, 5, 240, { kind: "star", col: CO.goldL, s: 3 });

}
const resAge = (r, now) => state === "demo-over" ? RES.count + (now - r.at) * 2.5 : now - r.at;
function skipResult(now) { const r = run && run.result; if (r && now - r.at < RES.goal) { r.at = now - RES.goal; r.ticks = 99; return true; } return false; }

// ---------- GAME-SPECIFIC: world tiles. Baked once per screen scale and laid as world-anchored patterns ----------
// The lit ground is pale lavender dust with craters, pebbles, crystal clusters and little bulb plants; the night is
// dark purple with flat-topped rocks and crystal spikes in silhouette, so the dark still shows the world moving past.
const TILE_G = 384, TILE_D = 420;
let PAT = null;
const wrap9 = (x, T, fn) => { for (const ox of [-T, 0, T]) for (const oy of [-T, 0, T]) { x.save(); x.translate(ox, oy); fn(); x.restore(); } }; // seamless edges
function tilePats() {
  if (PAT && PAT.K === L.K) return PAT;
  const mk = (T, fn) => {
    const N = Math.round(T * L.K), k = N / T, c = cnv(N, N), x = c.getContext("2d");
    x.scale(k, k); fn(x, T);
    const p = ctx.createPattern(c, "repeat"); p.setTransform(new DOMMatrix([1 / k, 0, 0, 1 / k, 0, 0])); return p;
  };

  return PAT;
}
// one crystal spike standing at (X, Y): a flat face, a darker face away from the light, a light facet
function crystal(x, X, Y, h, a, hit) {
  at(x, X, Y, 1, a, () => {
    const p = pPoly([[-3, 0], [-3.4, -h * 0.7], [0, -h], [3.4, -h * 0.72], [3, 0]]);
    shape(x, p, hit ? CO.text : CO.crys, 1.1, hit ? CO.suitD : CO.crysD, 1.6, 0);
    if (!hit) { x.fillStyle = C(CO.crysL); x.fill(pPoly([[-1.8, -h * 0.25], [-2, -h * 0.68], [-0.4, -h * 0.86]])); }
  });
}
function bulbPlant(x, X, Y, v) { // a little plant: a bent stalk and a round bulb with a light spot
  const h = 10 + v * 6;
  ST.line(x, pSmooth([[X, Y], [X - 2, Y - h * 0.5], [X + 1, Y - h]], true), 1.6, CO.stalk);
  shape(x, pBlob(X + 1, Y - h - 2, 4, 3.6, 0.1, fl(v * 99)), CO.bulb, 1, CO.accentD, 0.8, 1);
  x.fillStyle = C(CO.accentL); x.fill(pEll(X - 0.4, Y - h - 3, 1, 0.8));
}
function groundArt(x, T) {
  const r = seeded(41), w9 = fn => wrap9(x, T, fn);
  x.fillStyle = C(CO.ground); x.fillRect(0, 0, T, T);
  for (let i = 0; i < 9; i++) { const p = pBlob(r() * T, r() * T, 18 + r() * 34, 9 + r() * 14, 0.26, fl(r() * 999)); w9(() => { x.fillStyle = C(CO.groundD); x.fill(p); }); }
  for (let i = 0; i < 6; i++) { const p = pBlob(r() * T, r() * T, 14 + r() * 24, 7 + r() * 10, 0.24, fl(r() * 999)); w9(() => { x.fillStyle = C(CO.groundL); x.fill(p); }); }
  for (let i = 0; i < 7; i++) { // craters of different sizes: a rim, then the floor with its shadow on the side away from the light
    const X = r() * T, Y = r() * T, w = 9 + r() * r() * 30, s = fl(r() * 999);
    const rim = pBlob(X, Y, w, w * 0.56, 0.08, s), floor = pBlob(X + 1, Y + 1, w * 0.72, w * 0.38, 0.08, s + 1);
    w9(() => { shape(x, rim, CO.crater, 1.2); shape(x, floor, CO.groundD, 0.9, CO.craterD, -w * 0.16, -w * 0.12); });
  }
  for (let i = 0; i < 18; i++) { const s = 1.8 + r() * 2.8, p = pBlob(r() * T, r() * T, s * 1.3, s, 0.2, fl(r() * 999)); w9(() => shape(x, p, CO.pebble, 0.8)); }
  for (let i = 0; i < 4; i++) { // crystal clusters of two to four spikes, the tallest in the middle
    const X = r() * T, Y = r() * T, sc = 0.6 + r() * 0.5, n = 2 + fl(r() * 3), sp = [];
    for (let k = 0; k < n; k++) { const m = (k - (n - 1) / 2); sp.push([m * 5.5 + (r() - 0.5) * 2, 24 - Math.abs(m) * 8 + r() * 4, m * 0.34 + (r() - 0.5) * 0.16]); }
    sp.sort((a, b) => a[1] - b[1]);

    fx.heartT -= dt; if (fx.heartT <= 0) { fx.heartT = 0.5 + 1.2 * R.light / (R.lmax * 0.25); sfx.heart(); }
  } else fx.heartT = 0;
  teachStep(R);
}

// ---------- KEEP: screen, language, mute ----------
const FREEZE = 480;                // ms between the light going out and the result board (the light collapses meanwhile)
function resize() {
  const w = wrap.clientWidth || innerWidth, h = wrap.clientHeight || innerHeight;
  artResize(cv, w, h, CW, w > h * 1.2 ? CH_WIDE : CH, 220);
  PAT = null; layoutUI();
  if (run && manual) draw(simT);
}
window.addEventListener("resize", resize);
function applyLang() {
  document.documentElement.lang = lang;
  document.title = STRINGS[lang].title + (lang === "ja" ? " / " + STRINGS.en.title : "");
  document.querySelectorAll("[data-s]").forEach(el => { el.textContent = S(el.getAttribute("data-s")); });
  $("btnLang").textContent = S("lang");
  layoutUI();
}
function setMute(m) { if (!DEMO) store.set("mute", m); auMute(m); btnMute.textContent = m ? "sound off" : "sound on"; }

// ---------- KEEP: flow ----------
function hideAll() { ovTitle.hidden = true; ovPause.hidden = true; ovOver.hidden = true; }
const newSeed = () => (Math.random() * 4294967296) >>> 0;
function startAI(mode, seed) { state = mode === "demo" ? "demo" : "title"; newRun(mode, seed == null ? newSeed() : seed); btnPause.hidden = true; ptr.on = false; }
function toTitle() { pfStop(); hideAll(); ovTitle.hidden = DEMO; startAI("attract"); }
function startPlay() {
  if (auInit()) auResume();
  sfx.ui(); hideAll();
  state = "play"; runCount++;
  newRun("play", newSeed());
  ptr.on = false;
  btnPause.hidden = false;
  pfStart();
}
function showOver(now) {
  state = "over"; run.result = makeResult(now); musicLevel("bed");
  if (run.result.newBest) store.set("best", run.result.time);
  store.set("runs", runsOf() + 1);
  ovOver.hidden = false; overShownAt = T(); btnPause.hidden = true;
  platform("gameOver", run.result.time); // the score a portal ranks is the time survived, in seconds
}
function pauseGame(at) {
  if (state !== "play") return;
  state = "paused"; fx.pauseT = T();
  run.pauseClock = (at || T()) - run.offset;
  musicLevel("off"); ptr.on = false;
  ovPause.hidden = false; btnPause.hidden = true;
  pfStop();
}
function resumeGame() {
  if (state !== "paused") return;
  if (auInit()) auResume();
  run.offset = T() - run.pauseClock;
  state = "play"; ovPause.hidden = true; btnPause.hidden = false;
  musicLevel("play");
  pfStart();
}
function holdClock() { if (run && run.holdAt == null && (state === "title" || state === "demo")) run.holdAt = T(); }
function releaseClock() { if (run && run.holdAt != null) { run.offset += T() - run.holdAt; run.holdAt = null; } }
function onHide() { if (state === "play") pauseGame(); else holdClock(); }
function onShow() { releaseClock(); lastNow = performance.now(); }
const retryReady = () => T() - overShownAt > 350; // a short lockout so a late gameplay tap does not restart by accident
function retry() { if (state === "over" && retryReady()) startPlay(); }

// ---------- KEEP: input. Gameplay on pointerdown / keydown; the response is drawn on the next frame ----------
// Touch: a floating stick where the finger lands; a quick tap (or a second finger) dashes.
// Mouse: hold the button and the child walks toward the cursor; a quick click dashes.
// Keys: WASD or the arrows move, Space or Enter dashes. Level-up cards: tap one, or 1 2 3, or arrows and Space.
const ptr = { on: false, id: -1, mouse: false, sx: 0, sy: 0, x: 0, y: 0, x0: 0, y0: 0, t0: 0, moved: 0 };
const keys = new Map();            // held key id -> direction (l r u d)
let keyMode = false;               // the last gameplay input was a key (the level-up card then shows its selection)
const DIRS = { ArrowLeft: "l", ArrowRight: "r", ArrowUp: "u", ArrowDown: "d", KeyA: "l", KeyD: "r", KeyW: "u", KeyS: "d", a: "l", d: "r", w: "u", s: "d", Left: "l", Right: "r", Up: "u", Down: "d" };
const dirOf = e => DIRS[e.code] || DIRS[e.key] || DIRS[String(e.key || "").toLowerCase()] || null;
function toScene(e) { const b = cv.getBoundingClientRect(), k = L.kc; return { x: (e.clientX - b.left) / k - L.x0, y: (e.clientY - b.top) / k - L.y0 }; }
function cardAt(X, Y) {
  for (let i = 0; i < 3; i++) { const b = cardBox(i), u = b.s, g = 6 * u; if (Math.abs(X - b.cx) < b.w * u / 2 + g && Y > b.y - g && Y < b.y + b.h * u + g) return i; }
  return -1;
}
function steer() { // the player's wish for this frame -> run.inp (the rules read it at each step)
  const R = run; let x = 0, y = 0;
  for (const d of keys.values()) { if (d === "l") x--; if (d === "r") x++; if (d === "u") y--; if (d === "d") y++; }
  x = clamp(x, -1, 1); y = clamp(y, -1, 1);
  let m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
  if (ptr.on) {
    let dx, dy;
    if (ptr.mouse) { dx = ptr.x - cam.sx; dy = ptr.y - playY(); m = Math.hypot(dx, dy); const k = m < 6 ? 0 : Math.min(1, (m - 6) / 26) / m; dx *= k; dy *= k; }
    else { dx = (ptr.x - ptr.sx) / JOY; dy = (ptr.y - ptr.sy) / JOY; m = Math.hypot(dx, dy); if (m < 0.25) dx = dy = 0; else if (m > 1) { dx /= m; dy /= m; } }
    if (dx || dy) { x = dx; y = dy; }
  }
  R.inp.x = x; R.inp.y = y;
}
function askDash() { // the dash, or a grey ring when it is still recharging; both show at once
  const R = run; if (!R || R.dead || R.card || state !== "play") return;
  const p = R.p;
  if (p.dashCd <= 0 && p.dash <= 0) { R.dashReq = true; fx.dashCue = fx.vt; }
  else { fx.fizzle = fx.vt; if (loud()) sfx.fizzle(); }
}
function cardKey(k, ok, dir) {
  const c = run.card, n = "123".indexOf(k);
  if (dir === "u" || dir === "d" || dir === "l" || dir === "r") { if (c.keyed) c.sel = (c.sel + (dir === "d" || dir === "r" ? 1 : 2)) % 3; c.keyed = true; sfx.ui(); return; }
  if (!cardReady()) return;
  if (n >= 0 && k.length === 1) chooseCard(n); else if (ok) chooseCard(c.sel);
}
auUnlock();
const on = (el, f) => el.addEventListener("click", e => { e.stopPropagation(); f(); });
cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (state !== "play" || !run || run.dead) return;
  keyMode = false;
  const q = toScene(e);
  if (run.card) { if (cardReady()) { const i = cardAt(q.x, q.y); if (i >= 0) chooseCard(i); } return; }
  if (ptr.on && ptr.id !== e.pointerId) { askDash(); return; } // a second finger dashes
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* the move and up events still reach the canvas */ }
  Object.assign(ptr, { on: true, id: e.pointerId, mouse: e.pointerType === "mouse", sx: q.x, sy: q.y, x: q.x, y: q.y, x0: q.x, y0: q.y, t0: T(), moved: 0 });
});
cv.addEventListener("pointermove", e => {
  if (!ptr.on || e.pointerId !== ptr.id) return;
  const q = toScene(e); ptr.x = q.x; ptr.y = q.y;
  ptr.moved = Math.max(ptr.moved, Math.hypot(q.x - ptr.x0, q.y - ptr.y0));
  if (!ptr.mouse) { const dx = q.x - ptr.sx, dy = q.y - ptr.sy, d = Math.hypot(dx, dy); if (d > JOY) { ptr.sx = q.x - dx / d * JOY; ptr.sy = q.y - dy / d * JOY; } } // the stick follows a long drag
});
function ptrEnd(e, tap) {
  if (!ptr.on || e.pointerId !== ptr.id) return;
  ptr.on = false;
  if (tap && T() - ptr.t0 < 220 && ptr.moved < 10) askDash(); // a quick tap or click
}
cv.addEventListener("pointerup", e => ptrEnd(e, true));
cv.addEventListener("pointercancel", e => ptrEnd(e, false));
ovPause.addEventListener("click", e => { if (e.target === ovPause) resumeGame(); });
ovTitle.addEventListener("click", e => { if (!e.target.closest("button") || e.target.id === "btnStart") startPlay(); }); // a tap anywhere starts
// inside the lockout a press only skips the result animation; after it, one press starts the next run (bar 1.5.4)
ovOver.addEventListener("click", e => { if (e.target !== ovOver) return; if (retryReady()) retry(); else skipResult(T()); });
on($("btnLang"), () => { lang = lang === "ja" ? "en" : "ja"; store.set("lang", lang); applyLang(); sfx.ui(); });
on(btnMute, () => { if (auInit()) auResume(); setMute(!AU.muted); btnMute.blur(); });
on(btnPause, () => { pauseGame(); btnPause.blur(); });
on($("btnResume"), resumeGame);
on($("btnRestart"), () => { pfStop(); startPlay(); });
on($("btnQuit"), toTitle);
on($("btnRetry"), retry);
on($("btnToTitle"), () => { if (retryReady()) toTitle(); });
document.addEventListener("keydown", e => {
  if (DEMO || e.ctrlKey || e.metaKey || e.altKey || e.key === "Tab") return;
  const k = e.key || "", ok = k === " " || k === "Enter" || k === "Spacebar", esc = k === "Escape" || k === "p" || k === "P", dir = dirOf(e);
  if (ok || k.startsWith("Arrow")) e.preventDefault();
  if (dir) keys.set(e.code || k, dir);
  if (e.repeat) return;
  if (k === "m" || k === "M") { setMute(!AU.muted); return; }
  if (isTitle()) { if (ok) startPlay(); }
  else if (state === "play") {
    if (dir || ok) keyMode = true;
    if (esc) pauseGame();
    else if (run.card) cardKey(k, ok, dir);
    else if (ok) askDash();
  }
  else if (state === "paused") { if (ok || esc) resumeGame(); }
  else if (state === "over") { if (ok) { if (retryReady()) retry(); else skipResult(T()); } else if (k === "Escape") toTitle(); }
});
document.addEventListener("keyup", e => { keys.delete(e.code || e.key || ""); });
document.addEventListener("visibilitychange", () => { if (document.hidden) onHide(); else onShow(); });
window.addEventListener("blur", () => { keys.clear(); if (state === "play") pauseGame(); });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());

// ---------- KEEP: update and loop ----------
function update(now, dt) {
  if (!run) return;
  if (state === "play" && !run.ai && !autopilot) steer();
  if ((state === "play" || state === "title" || state === "demo") && run.holdAt == null) updateRun(now);
  if (isDying()) {
    const el = now - run.dead.at, wait = state === "dying" ? (run.dead.won ? 1500 : FREEZE) : state === "demo-dying" ? 1100 : 1400;
    if (el > wait) { if (state === "dying") showOver(now); else if (state === "demo-dying") { state = "demo-over"; run.result = makeResult(now); musicLevel("bed"); } else startAI("attract"); }
  }
  if (state === "demo-over" && now - run.result.at > 3600) startAI("demo"); // a short result hold, then the clip loops
  if (isOver()) resultStep(now);
  juiceStep(dt);
  if (state === "paused") return;
  const vdt = Juice.stop > 0 ? dt * 0.15 : dt; // hitstop slows the visuals only; the run clock never stops
  fx.vt += vdt * 1000;
  partsStep(vdt); visualStep(vdt);
}
// the rules run in fixed steps up to the run clock (at most 90 a frame); the AI's runs skip a long stall instead
function updateRun(now) {
  const R = run, target = fl((now - R.offset) * HZ / 1000 + 1e-4);
  let n = 0;
  while (R.steps < target && !R.dead && n < 90) { simStep(); R.steps++; n++; }
  if (R.ai && !R.dead && R.steps < target) R.offset += (target - R.steps) * 1000 / HZ;
}
function step(now, dt) { update(now, dt); musicStep(); }
let lastNow = performance.now();
function frame() {
  requestAnimationFrame(frame);
  if (manual) return;
  let now = performance.now(); if (now < lastNow) now = lastNow;
  const raw = now - lastNow, prev = lastNow; lastNow = now;
  if (raw > 300 && state === "play") pauseGame(prev); // a long stall must not count as time the player had
  if (raw > 250 && run && run.ai && run.holdAt == null && !isDying()) run.offset += raw - 16; // the AI never teleports
  step(now, clamp(raw, 0, 50) / 1000);
  draw(now);
}

// ---------- KEEP: test hooks (the contract in tools/README.md; tools/qa.mjs and review-kit read them) ----------
window.__game = {
  get state() { return state === "demo-over" || state === "demo-dying" ? "demo" : state === "title-dying" ? "title" : state; },
  get score() { return run ? run.score : 0; },
  get mode() { return run ? run.mode : null; },
  snap() { // gameplay state for frame-rate parity: integers only, no wall clock
    const R = run; if (!R) return null;
    const b = R.foes.find(e => e.boss && !e.dead);
    return { state, kills: R.kills, light: Math.round(R.light), lv: R.lv, xp: R.xp, foes: R.foes.length, x: Math.round(R.p.x), y: Math.round(R.p.y),
      card: !!R.card, boss: b ? Math.round(b.hp) : 0, dead: R.dead && R.dead.reason, t: Math.round(clockNow()) };
  },
  manual(on) { manual = !!on; simT = performance.now(); lastNow = simT; },
  tick(ms, render) { simT += ms; step(simT, ms / 1000); if (render) draw(simT); },
  demo(seed) { hideAll(); btnPause.hidden = true; pfStop(); startAI("demo", seed); },
  tap() { if (state !== "play" || !run || run.dead) return; if (run.card) { if (cardReady()) chooseCard(run.card.sel); } else askDash(); },
  autoplay(on) { autopilot = !!on; },
  bot(name) { botName = name || null; if (run && run.mode === "play") run.bot.P = BOT[botName || "play"] || BOT.play; }, // probes: a player type
  fail() { if (state === "play" && run && !run.dead) { run.card = null; run.light = 0; die("dark"); } },
  audioState() { return AU.ctx ? AU.ctx.state : "none"; },
  // K = device px per logical px; textMin = the smallest text drawn so far, in logical px as it shows on screen;
  // left and cw = where the core scene sits across the screen (logical px), for the wide-sides check
  view() { return { K: L.K, dpr: L.dpr, w: L.W, h: L.H, top: L.y0, left: L.x0, cw: CW, reduce: Juice.reduce, textMin: TXT.min, wide: L.wide }; },
  texts() { return TXT.last.slice(); },
  target() { const k = L.kc, b = cv.getBoundingClientRect(); return { x: b.left + (L.x0 + 180) * k, y: b.top + (L.y0 + playY() + 70) * k }; }, // just below the child
  peak(n) { return auPeak(() => PEAK_SET.slice(0, n || 8).forEach(k => sfx[k](1))); },
  info() { // for balance probes: the run in plain numbers
    const R = run; if (!R) return null;
    return { mode: R.mode, wt: +R.wt.toFixed(2), light: +R.light.toFixed(1), lmax: R.lmax, lv: R.lv, kills: R.kills, foes: R.foes.length, hurts: R.hurts, picks: R.picks,
      w: Object.assign({}, R.w), ps: Object.assign({}, R.ps), bossKills: R.bossKills, dead: R.dead && R.dead.reason, card: !!R.card,
      xpAll: R.xpAll, xpGot: R.xpGot, lostHit: Math.round(R.lostHit), lostDrain: Math.round(R.lostDrain), dealt: Math.round(R.dealt), bossLog: R.bossLog.map(l => l.slice()) };
  }
};

// ---------- boot ----------
resize();
applyLang();
AU.muted = !!store.get("mute", false); setMute(AU.muted);
if (DEMO) { hideAll(); btnMute.hidden = true; btnPause.hidden = true; auInit(); startAI("demo"); } // recordings start the bus without a gesture when the browser allows it
else toTitle();
requestAnimationFrame(frame);
})();
</script>
