<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マグネ・シャフト / Magnet Shaft</title>
<style>
/* AI Weekly Arcade w10. Everything is drawn on one canvas; the DOM holds only transparent hit areas over the
   drawn controls, so tools/qa.mjs can find them by data-qa. */
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05081a}
body{font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#ui button{position:absolute;margin:0;padding:0;border:0;background:transparent;color:transparent;font:8px system-ui,sans-serif;overflow:hidden;cursor:pointer;pointer-events:auto;touch-action:manipulation}
#ui button:focus{outline:none}
#ui button:focus-visible{outline:2px dashed #5ce8ff;outline-offset:1px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="ui">
  <section id="ovTitle" class="ov">
    <button id="btnStart" type="button" data-qa="start" data-s="start"></button>
    <button id="btnLang" type="button" data-qa="lang"></button>
  </section>
  <section id="ovPause" class="ov" hidden>
    <button id="btnResume" type="button" data-qa="resume" data-s="resume"></button>
    <button id="btnRestart" type="button" data-qa="restart" data-s="restart"></button>
    <button id="btnQuit" type="button" data-qa="quit" data-s="toTitle"></button>
  </section>
  <section id="ovOver" class="ov" hidden>
    <button id="btnRetry" type="button" data-qa="retry" data-s="retry"></button>
    <button id="btnToTitle" type="button" data-qa="title" data-s="toTitle"></button>
  </section>
  <button id="btnPause" type="button" data-qa="pause" aria-label="pause" hidden>II</button>
  <button id="btnMute" type="button" data-qa="mute" aria-label="sound"></button>
</div>
</div>
<script>
(function () {
"use strict";

// Portal SDK adapter: a portal build can replace this object before the game script runs.
window.Platform = window.Platform || { gameplayStart() {}, gameplayStop() {}, happytime() {}, gameOver(score) {} };
const platform = (name, ...args) => { try { window.Platform[name](...args); } catch (e) { /* SDK failures never break the game */ } };

// ==== ART KIT START ====
// This week keeps only the style-neutral tools of the template kit: the palette table, helpers, storage, text records,
// juice, the audio bus and the tap hint. The 「墨と和紙」 drawing tools are left out on purpose: kouhei asked for a
// mechanical, abstract, futuristic world lit by its own machines (NOTES.md, design memo and kouhei's words).

// ---------- palette: one table, named colours (the only hex colours in the script) ----------
const PALS = {
  M: { // the lit machine shaft. Stage colours (wall, tile, lit, deep) are the back wall hues; danger is always orange
    bg: "#05081a", cyan: "#5ce8ff", cyanL: "#bff6ff", orange: "#ff6a1a", orangeL: "#ffb07a",
    steel: "#d8e3f5", steelD: "#7888b4", steelK: "#28365e", ice: "#eef4ff", white: "#ffffff", podD: "#aebbd3", podK: "#0c1b4d",
    plateK: "#07080d", frame: "#081130", girder: "#0a1338", gold: "#ffd23f", goldL: "#ffe9a0", ui: "#e8eefc", uiD: "#93a0c4", panel: "#0a1030",
    wall0: "#1636b8", tile0: "#1c44d0", lit0: "#284aaa", deep0: "#0a1644",
    wall1: "#3a1fb8", tile1: "#482cd2", lit1: "#462eaa", deep1: "#160e48",
    wall2: "#0b4f66", tile2: "#0f6280", lit2: "#186e82", deep2: "#05182a",
    wall3: "#282eaa", tile3: "#343ec6", lit3: "#323caa", deep3: "#101344",
    wall4: "#681a96", tile4: "#7e26b0", lit4: "#7828a0", deep4: "#1e0932"
  }
};
const PAL = PALS.M;
const C = c => PAL[c] || c;
const RGB = {};
for (const k in PAL) { const n = parseInt(PAL[k].slice(1), 16); RGB[k] = [n >> 16, n >> 8 & 255, n & 255]; }

// ---------- small helpers ----------
const TAU = Math.PI * 2, fl = Math.floor;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const easeOut = x => 1 - (1 - clamp(x, 0, 1)) ** 3;
const easeBack = x => { x = clamp(x, 0, 1) - 1; return 1 + 2.7 * x * x * x + 1.7 * x * x; };   // overshoots about 10 %
const mod = (a, n) => ((a % n) + n) % n;
const cnv = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
// seeded PRNG (mulberry32) for everything that changes the outcome, so a run replays the same at any frame rate
function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss(r, mu, sigma) { const u = Math.max(1e-9, r()), v = r(); return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
const colOf = c => typeof c === "string" ? RGB[c] : c;
function rgb(c, k) { c = colOf(c); k = k == null ? 1 : k; return "rgb(" + Math.round(clamp(c[0] * k, 0, 255)) + "," + Math.round(clamp(c[1] * k, 0, 255)) + "," + Math.round(clamp(c[2] * k, 0, 255)) + ")"; }
function rgba(c, a) { c = colOf(c); return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + clamp(a, 0, 1).toFixed(3) + ")"; }
function mix(a, b, f) { a = colOf(a); b = colOf(b); return [lerp(a[0], b[0], f), lerp(a[1], b[1], f), lerp(a[2], b[2], f)]; }

// ---------- storage: one JSON record under "<prefix>save"; never throws, works in memory when blocked ----------
function makeStore(prefix) {
  const KEY = prefix + "save"; let data = {};
  try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); if (v && typeof v === "object") data = v; } catch (e) { data = {}; }
  return {
    get(k, d) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : d; },
    set(k, v) { data[k] = v; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage blocked */ } }
  };
}

// ---------- text: system fonts; TXT records each string and the smallest size (logical px, as drawn) ----------
const SANS = '-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,"Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif';
const TEXT_MIN = 14;
// K = device px per logical px; S = CSS px per logical px; u = UI scale (CSS px per UI unit); W, H = CSS size
const L = { K: 1, dpr: 1, S: 1, W: 390, H: 844, x0: 0, y0: 0, u: 1, wide: false, lw: 390, lh: 844 };
const TXT = { min: Infinity, seen: [], last: [] };
function textEnd() { TXT.last = TXT.seen; TXT.seen = []; }   // call once at the end of every drawn frame
function noteText(str, px) { if (px < TXT.min) TXT.min = px; if (TXT.seen.length < 300) TXT.seen.push(str); }
// o: { a align, w weight, ol outline colour, ow its share of size, max: fit width, b baseline }
function text(x, str, X, Y, size, col, o) {
  o = o || {}; str = String(str);
  const font = s => (o.w || 700) + " " + s + "px " + SANS;
  x.font = font(size);
  if (o.max) { const w = x.measureText(str).width; if (w > o.max) x.font = font(size *= o.max / w); }
  const m = x.getTransform(), px = size * Math.hypot(m.c, m.d) / L.K;
  noteText(str, px);
  x.textAlign = o.a || "center"; x.textBaseline = o.b || "middle";
  if (o.ol) { x.lineJoin = "round"; x.miterLimit = 2; x.lineWidth = size * (o.ow || 0.2); x.strokeStyle = C(o.ol); x.strokeText(str, X, Y); }
  x.fillStyle = C(col); x.fillText(str, X, Y);
}
function textW(x, str, size, o) { x.font = ((o && o.w) || 700) + " " + size + "px " + SANS; return x.measureText(String(str)).width; }

// ---------- juice: trauma shake (squared, smooth noise), capped hitstop ----------
const Juice = { trauma: 0, t: 0, stop: 0, reduce: false };
function addTrauma(a) { Juice.trauma = Math.min(1, Juice.trauma + a); }
function hitstop(sec) { Juice.stop = Math.max(Juice.stop, Math.min(0.15, sec)); }
function juiceStep(dt) { Juice.trauma = Math.max(0, Juice.trauma - dt * 1.8); Juice.t += dt; Juice.stop = Math.max(0, Juice.stop - dt); }
const hash1 = i => { let h = Math.imul(i ^ 0x2c1b3c6d, 0x297a2d39); h ^= h >>> 15; h = Math.imul(h, 0x165667b1); h ^= h >>> 13; return ((h >>> 0) / 4294967296) * 2 - 1; };
function vnoise(x) { const i = fl(x), f = x - i; return lerp(hash1(i), hash1(i + 1), f * f * (3 - 2 * f)); }
function shakeOffset(max) { // CSS px
  const a = Juice.trauma * Juice.trauma * max * (Juice.reduce ? 0.3 : 1);
  return a < 0.05 ? { x: 0, y: 0 } : { x: vnoise(Juice.t * 24) * a, y: vnoise(Juice.t * 24 + 57.3) * a };
}

// ---------- audio bus: every voice -> (sfx | music) -> master gain -> compressor -> speakers ----------
const AU = { ctx: null, master: null, comp: null, sfx: null, music: null, noise: null, muted: false, vol: 0.7, offline: false };
function auBuild(ctx) {
  const g = v => { const n = ctx.createGain(); n.gain.value = v; return n; }, comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 10; comp.attack.value = 0.002; comp.release.value = 0.15;
  const master = g(AU.muted ? 0 : AU.vol), sfx = g(0.8), music = g(0.4);
  master.connect(comp); comp.connect(ctx.destination); // the only connection to the speakers
  sfx.connect(master); music.connect(master);
  // one shared short echo: the shaft is a metal tube
  const echo = ctx.createDelay(1), fb = g(0.28), wet = g(0.14), send = g(0.4);
  echo.delayTime.value = 0.121; echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(master); music.connect(echo); sfx.connect(send); send.connect(echo);
  const nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  Object.assign(AU, { ctx, comp, master, sfx, music, noise: nb });
}
function auInit() {
  if (AU.ctx) return true;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  try { auBuild(new AC()); } catch (e) { AU.ctx = null; return false; }
  try { if (navigator.audioSession) navigator.audioSession.type = "ambient"; } catch (e) { /* not supported */ }
  return true;
}
function auResume() { if (AU.ctx && AU.ctx.state !== "running" && AU.ctx.state !== "closed") AU.ctx.resume().catch(() => {}); }
const audioOn = () => !!AU.ctx && (AU.ctx.state === "running" || AU.offline);
// unlock on every kind of first gesture (iOS needs touchend/click), and again whenever the tab comes back
function auUnlock() {
  const f = () => { if (auInit()) auResume(); };
  for (const t of ["pointerdown", "pointerup", "touchend", "click", "keydown", "mousedown"]) document.addEventListener(t, f, true);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) auResume(); });
}
function auMute(m) { AU.muted = m; if (AU.master) { const t = AU.ctx.currentTime; AU.master.gain.cancelScheduledValues(t); AU.master.gain.setTargetAtTime(m ? 0 : AU.vol, t, 0.012); } }
const cents = c => Math.pow(2, c / 1200);
function vary(c, gv) { return { f: cents((Math.random() * 2 - 1) * (c == null ? 40 : c)), g: 1 + (Math.random() * 2 - 1) * (gv == null ? 0.1 : gv) }; }
// envelope from silence to peak and back to silence (the default gain of 1 would leak a click)
function env(gn, peak, when, att, dur) { gn.gain.value = 0; gn.gain.setValueAtTime(0.0001, when); gn.gain.linearRampToValueAtTime(peak, when + att); gn.gain.exponentialRampToValueAtTime(0.0001, when + dur); }
// one oscillator voice with stop() always scheduled; square and saw go through a lowpass
function tone(type, f0, f1, dur, peak, when, dest, att, lp) {
  const c = AU.ctx, o = c.createOscillator(), gn = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, when);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, when + dur * 0.9);
  env(gn, peak, when, att || 0.004, dur);
  let head = o;
  if (lp || type === "square" || type === "sawtooth") { const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lp || 2400; o.connect(f); head = f; }
  head.connect(gn); gn.connect(dest || AU.sfx);
  o.start(when); o.stop(when + dur + 0.05);
}
function hiss(ftype, freq, q, dur, peak, when, dest, f1) { // filtered noise voice (transients, air, sparks)
  const c = AU.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), gn = c.createGain();
  s.buffer = AU.noise; f.type = ftype; f.frequency.setValueAtTime(freq, when); f.Q.value = q;
  if (f1) f.frequency.exponentialRampToValueAtTime(f1, when + dur);
  env(gn, peak, when, 0.002, dur);
  s.connect(f); f.connect(gn); gn.connect(dest || AU.sfx);
  s.start(when, Math.random() * 0.5); s.stop(when + dur + 0.05);
}
// Fire voices together through a fresh copy of the bus on an OfflineAudioContext and return the peak sample
// (window.__game.peak, bar 1.3.2). The live bus is restored before rendering, so play is unaffected.
async function auPeak(fire, sec) {
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; if (!OAC) return 0;
  const keep = Object.assign({}, AU), oc = new OAC(1, Math.round(44100 * (sec || 1.5)), 44100);
  auBuild(oc); AU.master.gain.value = AU.vol; AU.offline = true;
  try { fire(); } finally { Object.assign(AU, keep); AU.offline = false; }
  const d = (await oc.startRendering()).getChannelData(0); let p = 0;
  for (let i = 0; i < d.length; i++) p = Math.max(p, Math.abs(d[i]));
  return p;
}

// ---------- tap hint per player: shown until the first success, back after two quick deaths (< 5 s) ----------
function makeHint(store, key) {
  let quick = 0;
  return {
    active: false,
    begin() { this.active = !store.get(key, false) || quick >= 2; },
    success() { if (this.active) { this.active = false; quick = 0; store.set(key, true); } },
    runEnded(sec) { quick = sec < 5 ? quick + 1 : 0; }
  };
}
// ==== ART KIT END ====

// ======================================================================================================
// マグネ・シャフト / Magnet Shaft. The pod climbs a lit lift shaft on its own; one tap flips its magnet and throws it
// to the other rail. GAME-SPECIFIC sections are this week's game; KEEP sections are the template's required systems.
// window.__game at the end is the test contract (tools/README.md), with extra hooks for the balance bots.
// ======================================================================================================

// ---------- GAME-SPECIFIC: identity ----------
const SLUG = "magnet-shaft", WEEK = 10;
const DEMO = /[?&]demo=1(&|$)/.test(location.search);
const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
const reduceMotion = mq("(prefers-reduced-motion: reduce)"), finePointer = mq("(hover: hover) and (pointer: fine)");
Juice.reduce = reduceMotion;
const RM = reduceMotion ? 0.3 : 1;   // sway, tilt and zoom under reduced motion (bar 1.10.4): the same game, less movement
const store = makeStore(SLUG + "-");

// ---------- GAME-SPECIFIC: tempo, scene and motion (the prototype's numbers) ----------
const BPM = 124, BEAT = 60 / BPM, BAR = 4 * BEAT, DEG = Math.PI / 180;
const SH = 844, SWL = 390, ANCH = 0.77;          // logical scene; the pod rides at 77 % of the screen height
const RX = 150;                                   // rail centre |X| (rails 300 px apart)
const PX = 138, CROSS = 2 * PX;                   // attached pod centre |X|, flip distance
const ACC = 9000, VMAX = 2400, KICK = 900;        // magnet pull, cap, launch kick (px/s^2, px/s, px/s)
const HB = 1 / 240, HW = 6, HH = 9;               // physics substep, pod hitbox half sizes (12 x 18)
const ZMIN = 0.78, SW0 = 4, EDGE = 20;            // deepest roll zoom-out; gentle sway amplitude (deg); rails keep 20 CSS px from the screen edge
const FLOOR = 384;                                // one painted floor of the shaft (px)

// flight curve: launch kick plus constant magnet pull, capped; crosses 276 px in 0.167 s
const TV = (VMAX - KICK) / ACC, DV = KICK * TV + 0.5 * ACC * TV * TV;
const fd = tau => tau < TV ? KICK * tau + 0.5 * ACC * tau * tau : DV + VMAX * (tau - TV);
function tauOf(d) { let lo = 0, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (fd(m) < d) lo = m; else hi = m; } return hi; }
const TFLY = tauOf(CROSS);
const flx = (from, tau) => from === 0 ? -PX + fd(Math.min(tau, TFLY)) : PX - fd(Math.min(tau, TFLY));
const T_OUT = tauOf(203), T_IN = tauOf(73);       // laser reach (the beam covers 70 % of the shaft from its rail)
const T_P0 = tauOf(21), T_P1 = tauOf(255);        // rail plate clearance
const T_C0 = tauOf(97), T_C1 = tauOf(179);        // centre column

// climb speed: +12 % about every 14 s (snapped to bars), goal at 36 bars (about 70 s), then overdrive +8 % to 880 px/s
const SPD = [];
(() => {
  const P = [], bars = [0, 7, 14, 22, 29];
  for (let i = 0; i < 5; i++) P.push([bars[i] * BAR, 480 * Math.pow(1.12, i)]);
  for (let i = 0; i < 6; i++) P.push([(36 + 5 * i) * BAR, Math.min(880, 755.3 * Math.pow(1.08, i + 1))]);
  let a = 0;
  for (let i = 0; i < P.length; i++) { if (i) a += (P[i][0] - P[i - 1][0]) * P[i - 1][1]; SPD.push({ t: P[i][0], v: P[i][1], a }); }
})();
function segAt(t) { let i = SPD.length - 1; while (i > 0 && SPD[i].t > t) i--; return SPD[i]; }
function ALT(t) { if (t <= 0) return t * 480; const p = segAt(t); return p.a + (t - p.t) * p.v; }
function SPEED(t) { return t <= 0 ? 480 : segAt(t).v; }
function altInv(a) { if (a <= 0) return a / 480; let i = SPD.length - 1; while (i > 0 && SPD[i].a > a) i--; return SPD[i].t + (a - SPD[i].a) / SPD[i].v; }
// Front-loaded ramp (data, bar 1.5.2): plates 5.8 s, lasers 11.6 s, gentle sway 15.5 s, pulse rails 19.4 s,
// first barrel spin 29 s, full sway 38.7 s, goal 69.7 s, then overdrive (denser phrases, barrel spins every 5 bars).
const T_PLATE = 3 * BAR, T_LASER = 6 * BAR, T_SWAY0 = 8 * BAR, T_PULSE = 10 * BAR, T_SWAY = 20 * BAR, T_GOAL = 36 * BAR;
const A_GOAL = ALT(T_GOAL);
const BARRELS = [15, 25, 31, 41, 46, 51, 56, 61, 66, 71, 76, 81, 86, 91, 96, 101, 106, 111, 116, 121].map(b => b * BAR);
const SPIN = 2 * BEAT;
const GATES = [];
SPD.forEach((p, i) => { if (i && p.v > SPD[i - 1].v + 1) GATES.push(p.t); });
const pctOf = a => Math.floor(100 * Math.max(0, a) / A_GOAL);

// shaft mirror (barrel spin): x positions scale 1 -> -1 over 2 beats
function spinM(t) {
  let n = 0;
  for (let i = 0; i < BARRELS.length; i++) {
    const b = BARRELS[i];
    if (t >= b + SPIN) n++;
    else if (t >= b) { let p = (t - b) / SPIN; p = p * p * (3 - 2 * p); const c = Math.cos(Math.PI * p); return (n & 1) ? -c : c; }
    else break;
  }
  return (n & 1) ? -1 : 1;
}

// palettes: only the back wall hue moves (0.6 s crossfade every 8 bars); the danger orange never changes
const STAGES = [0, 1, 2, 3, 4].map(i => ({ wall: "wall" + i, tile: "tile" + i, lit: "lit" + i, deep: "deep" + i }));
const PAL_LEN = 8 * BAR;
function palIdx(t) {
  if (t < T_GOAL) { const i = fl(Math.max(0, t) / PAL_LEN); return { i: i % 4, t0: i * PAL_LEN }; }
  const j = fl((t - T_GOAL) / PAL_LEN);
  return { i: j === 0 ? 4 : (j - 1) % 5, t0: T_GOAL + j * PAL_LEN };
}
function palAt(t) {
  const p = palIdx(t), f = p.t0 <= 0 ? 1 : clamp((t - p.t0) / 0.6, 0, 1);
  return { a: p.i, b: f < 1 ? palIdx(p.t0 - 1e-3).i : p.i, f };
}

// ---------- GAME-SPECIFIC: level. Rail breaks, plates, pillars, lasers and pulse rails, with a path proof ----------
// Every phrase is placed together with the flips of one intended path, and verify() replays that path through the
// same collision code at 1/240 s before the phrase is kept, so every run can be climbed.
let LV = null;
function newLevel(seed, t0, o) {
  o = o || {};
  LV = { soft: !!o.soft, intro: !!o.intro, f: [[], []], pl: [], lz: [], rnd: seeded(seed), cur: t0 + (o.lead != null ? o.lead : o.intro ? 6 : 3) * BEAT,
    side: 0, free: t0, late: t0, hz: [-9, -9], nf: [], path: [], seen: {}, fails: 0, tele: null, last: "", hist: null };
  for (const b of BARRELS) LV.nf.push([b - TFLY - 0.1, b + SPIN + 0.05]);   // never plan a flip into a barrel spin
}
function addF(s, f) {
  const Lr = LV.f[s], last = Lr[Lr.length - 1];
  if (last && f.k === 0 && last.k === 0 && f.a0 <= last.a1 + 1) { last.a1 = Math.max(last.a1, f.a1); return; }
  if (last && f.a0 < last.a1) { if (f.a1 <= last.a1) return; f.a0 = last.a1; }
  Lr.push(f);
}
function snap() {
  const f0 = LV.f[0], f1 = LV.f[1];
  return { n0: f0.length, n1: f1.length, e0: f0.length ? f0[f0.length - 1].a1 : 0, e1: f1.length ? f1[f1.length - 1].a1 : 0,
    np: LV.pl.length, nl: LV.lz.length, side: LV.side, free: LV.free, late: LV.late, h0: LV.hz[0], h1: LV.hz[1], nf: LV.nf.length,
    path: LV.path.length, cur: LV.cur, seen: Object.assign({}, LV.seen), tele: LV.tele };

on($("btnToTitle"), () => { if (retryReady()) toTitle(); });
document.addEventListener("keydown", e => {
  if (DEMO || e.ctrlKey || e.metaKey || e.altKey || e.key === "Tab") return;
  const k = e.key, ok = k === " " || k === "Enter" || k === "Spacebar", esc = k === "Escape" || k === "p" || k === "P";
  if (ok || k.startsWith("Arrow")) e.preventDefault();
  if (e.repeat) return;
  if (k === "m" || k === "M") { setMute(!AU.muted); return; }
  if (isTitle()) { if (ok) startPlay(); }
  else if (state === "play") { if (esc) pauseGame(); else if (ok || k === "ArrowUp" || k === "w" || k === "W") press(); }
  else if (state === "paused") { if (ok || esc) resumeGame(); }
  else if (state === "over") { if (ok) { if (retryReady()) retry(); else skipResult(T()); } else if (k === "Escape") toTitle(); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden) onHide(); else onShow(); });
window.addEventListener("blur", () => { if (state === "play") pauseGame(); });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());

// ---------- KEEP: update and loop ----------
const DIE_MS = { dying: 560, "demo-dying": 1500, "title-dying": 1100 };
function update(now, dt) {
  if (!R) return;
  perfT += dt; juiceStep(dt);
  if (state === "paused") return;
  if (state === "play" && R.hold > 0) { // the count-in after a pause: three beats with a tick, then the climb goes on
    R.hold = Math.max(0, R.hold - dt);
    const n = Math.ceil(R.hold / BEAT - 1e-6);
    if (n !== R.holdN) { R.holdN = n; if (n > 0) sfx.tick(2.5); }
  } else if ((state === "play" || state === "title" || state === "demo") && !held) simStep(dt);
  if (isDying()) {
    // the failure: 0.32 s with every pose held and the cause blinking, then the burst or the fall, then the result
    if (R.freeze > 0) { R.freeze -= dt; if (R.freeze <= 0) burstNow(); }
    else {
      const sl = state === "demo-dying" ? 0.45 : 1, d = dt * sl;   // the demo lingers in slow motion on its crash
      R.dclock += d;
      cam.v *= Math.exp(-d * 6); cam.a += cam.v * d;
      if (R.dk === "void" || R.dk === "pulse") { R.x += R.dvx * d; R.dvx *= Math.exp(-d * 1.2); R.dva -= 2400 * d; R.palt += R.dva * d; R.rot += d * 14 * (R.dvx < 0 ? -1 : 1); }
    }
    R.dying = (R.dying || 0) + dt * 1000;
    if (R.dying > DIE_MS[state]) {
      if (state === "dying") showOver(now);
      else if (state === "demo-dying") { state = "demo-over"; R.result = makeResult(now); musicLevel("bed"); }
      else startAI("attract");
    }
  } else if (isOver()) {
    R.dclock += dt; cam.v *= Math.exp(-dt * 6); cam.a += cam.v * dt;
    if (R.dk === "void" || R.dk === "pulse") { R.x += R.dvx * dt; R.dva -= 2400 * dt; R.palt += R.dva * dt; R.rot += dt * 14; }
  }
  if (state === "demo-over" && now - R.result.at > 2300) { demoN++; startAI("demo"); }
  if (isOver()) resultStep(now);
  const frozen = isDying() && R.freeze > 0;
  if (!frozen) visualStep(Juice.stop > 0 ? dt * 0.25 : dt);
}
function step(now, dt) { update(now, dt); musicStep(); }
let lastNow = performance.now();
function frame() {
  requestAnimationFrame(frame);
  if (manual) return;
  let now = performance.now(); if (now < lastNow) now = lastNow;
  const raw = now - lastNow; lastNow = now;
  if (raw > 300 && state === "play") pauseGame(); // a long stall must not count as time the player had
  step(now, clamp(raw, 0, 50) / 1000);
  draw(now);
}

// ---------- KEEP: test hooks (the contract in tools/README.md; tools/qa.mjs and review-kit read them) ----------
window.__game = {
  get state() { return state === "demo-over" || state === "demo-dying" ? "demo" : state === "title-dying" ? "title" : state; },
  get score() { return R ? (R.dead ? R.pct : pctOf(R.alt)) : 0; },
  get mode() { return R ? R.mode : null; },
  snap() { // gameplay state for frame-rate parity: integers only, no wall clock
    if (!R) return null;
    return { state, score: this.score, side: R.side, att: R.attached ? 1 : 0, flips: R.flips, alt: Math.round(R.alt), x: Math.round(R.x),
      closes: R.closes, dead: R.dead ? R.dk : null, t: Math.round(R.t * 1000) };
  },
  manual(on) { manual = !!on; simT = performance.now(); lastNow = simT; },
  tick(ms, render) { simT += ms; step(simT, ms / 1000); if (render) draw(simT); },
  demo(seed) { hideAll(); btnPause.hidden = true; demoN = 0; demoSeed = seed >>> 0; startAI("demo", seed >>> 0); },
  tap() { press(); },
  autoplay(on) { autopilot = !!on; if (R && R.mode === "play") { R.plan = null; R.wantAt = -1; } },
  fail() { if (state === "play" && !R.dead) die("give", R.x, R.alt, null); },
  audioState() { return AU.ctx ? AU.ctx.state : "none"; },
  // K = device px per logical px; textMin = the smallest text drawn so far, in logical px as it shows on screen;
  // left and cw = where the shaft scene sits across the screen (logical px), for the wide-sides check
  view() { return { K: L.K, dpr: L.dpr, w: L.lw, h: L.lh, top: L.y0, left: L.x0, cw: SWL, reduce: Juice.reduce, textMin: TXT.min, wide: L.wide }; },
  texts() { return TXT.last.slice(); },
  target() { const b = cv.getBoundingClientRect(); return { x: b.left + L.W / 2, y: b.top + L.H * 0.6 }; }, // a fixed point on the play field
  peak(n) { return auPeak(() => PEAK_SET.slice(0, n || 8).forEach(k => sfx[k](1))); },
  // ---- extra hooks for the balance bots and the generator check (C/bots in the build notes) ----
  sim: {
    get R() { return R; }, get LV() { return LV; },
    ALT, SPEED, altInv, spinM, TFLY, BEAT, BAR, PX, HW, HH, HB, T_GOAL, A_GOAL, BARRELS, laserLive, litOK,
    // start a play run at run time t0 with a level seed; fresh: the first-run opening of a fresh save
    start(t0, seed, o) { hideAll(); o = o || {}; state = "play"; runCount++; newRun("play", seed >>> 0, t0 || 0, { fresh: !!o.fresh, soft: o.soft != null ? !!o.soft : !!o.fresh, lead: o.lead }); btnPause.hidden = false; return R; },
    // the AI's safe window for the next flip on the current rail: { lo, hi } run times, or null when staying is safe
    window() { if (!R || R.dead || !R.attached) return null; setWin(R.alt - 100, R.alt + 1700); const w = aiDecide(R); if (w < 0) return null; return R.aiLo < 0 ? { lo: w, hi: w, now: true } : { lo: R.aiLo, hi: R.aiHi }; },
    stay(h) { if (!R || R.dead) return null; setWin(R.alt - 100, R.alt + 1700); return stayDeath(R.side, R.t, h || 1.6); },
    flipNow() { if (R && R.attached && !R.dead) flipNow(); },
    // generate a level up to tEnd and prove the whole intended path at once
    genCheck(seed, tEnd, o) {
      o = o || {};
      newLevel(seed >>> 0, 0, { intro: !!o.intro, soft: !!o.soft });
      LV.hist = [];
      while (LV.cur < tEnd) genNext();
      const ok = verify(0, 0, Math.min(LV.cur, tEnd));
      const kinds = {}, failed = {}, band = [0, 0, 0, 0, 0];
      for (const h of LV.hist) {
        const k = h[1].replace(/[0-9.x]+.*$/, ""); kinds[k] = (kinds[k] || 0) + 1;
        if (k === "fail") { failed[h[2]] = (failed[h[2]] || 0) + 1; band[h[0] < T_PULSE ? 0 : h[0] < T_SWAY ? 1 : h[0] < T_GOAL ? 2 : h[0] < T_GOAL + 30 ? 3 : 4]++; }
      }
      return { ok, fails: LV.fails, phrases: LV.hist.length, flips: LV.path.length, lasers: LV.lz.length, kinds, failed, band };
    }
  }
};

// ---------- boot ----------
resize();
applyLang();
AU.muted = !!store.get("mute", false); setMute(AU.muted);
if (DEMO) { hideAll(); btnMute.hidden = true; btnPause.hidden = true; auInit(); demoSeed = 20261010; startAI("demo", demoSeed); } // recordings start the bus without a gesture when the browser allows it
else toTitle();
requestAnimationFrame(frame);
})();
</script>
</body>
