<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>押し屋ラッシュ / Oshiya Rush</title>
<style>
/* Oshiya Rush (w06) in the pixel house style (STYLE.md, QUALITY_BAR.md).
   Everything the player sees is drawn into one pixel buffer on the canvas. The DOM only holds
   transparent hit areas over the drawn controls, so tools/qa.mjs can find them by data-qa. */
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#262b52}
body{font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;overflow:hidden;touch-action:none}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none;image-rendering:pixelated}
#ui{position:absolute;left:0;top:0;pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:auto;touch-action:none}
/* every control is drawn in pixels on the canvas; these buttons are invisible hit areas on top of the drawings */
#ui button{position:absolute;margin:0;padding:0;border:0;background:transparent;color:transparent;font:8px system-ui,sans-serif;overflow:hidden;cursor:pointer;pointer-events:auto;touch-action:manipulation}
#ui button:focus{outline:none}
#ui button:focus-visible{outline:2px dashed #f6e2a6;outline-offset:1px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="ui">
  <section id="ovTitle" class="ov">
    <button id="btnStart" type="button" data-qa="start" data-s="start"></button>
    <button id="btnLang" type="button" data-qa="lang"></button>
  </section>
  <section id="ovPause" class="ov" hidden>
    <button id="btnResume" type="button" data-qa="resume" data-s="resume"></button>
    <button id="btnRestart" type="button" data-s="restart"></button>
    <button id="btnQuit" type="button" data-s="toTitle"></button>
  </section>
  <section id="ovOver" class="ov" hidden>
    <button id="btnRetry" type="button" data-qa="retry" data-s="retry"></button>
    <button id="btnToTitle" type="button" data-s="toTitle"></button>
  </section>
  <button id="btnPause" type="button" data-qa="pause" aria-label="pause" hidden>II</button>
  <button id="btnMute" type="button" data-qa="mute" aria-label="sound"></button>
</div>
</div>
<script>
(function () {
"use strict";

// Portal SDK adapter: a portal build can replace this object before the game script runs.
window.Platform = window.Platform || { gameplayStart() {}, gameplayStop() {}, happytime() {}, gameOver(score) {} };
const platform = (name, ...args) => { try { window.Platform[name](...args); } catch (e) { /* SDK failures never break the game */ } };

// ==== PIXEL KIT START ====
// The pixel house style (STYLE.md) as reusable code. Nothing in this block knows about the game: the game
// passes its core size, sprites, glyph tables, strings and sounds. Copy it unchanged into every game; the
// only allowed edit is swapping up to ~6 palette hues for the theme. tools/qa.mjs relies on TXT and auPeak.

// ---------- palette: 24 colours, one letter each (a game may swap up to ~6 hues) ----------
const PAL = {
  k: "#2b1b17", n: "#262b52", b: "#3d5a98", s: "#8db7dc", p: "#d4e6ea", w: "#fbf6ea", m: "#e2d3b6", c: "#aebfd2",
  r: "#d6402b", R: "#8a2232", h: "#ef9a86", f: "#f1c597", F: "#c98b5e", o: "#dba268", O: "#a5653a", D: "#6a3b22",
  y: "#ecc659", Y: "#b4832d", g: "#3f7b3b", G: "#23432b", l: "#cf4a8b", a: "#ef8834", e: "#87838e", q: "#f6e2a6"
};

// ---------- small helpers ----------
const fl = Math.floor;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const easeOut = x => 1 - (1 - clamp(x, 0, 1)) ** 3;
const newCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };
// seeded PRNG (mulberry32) for everything that changes the outcome, so a run replays the same at any frame rate
function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- storage: one JSON record under "<prefix>save"; never throws, keeps working in memory when blocked ----------
function makeStore(prefix) {
  const KEY = prefix + "save"; let data = {};
  try { const v = JSON.parse(localStorage.getItem(KEY) || "{}"); if (v && typeof v === "object") data = v; } catch (e) { data = {}; }
  return {
    get(k, d) { return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : d; },
    set(k, v) { data[k] = v; try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* storage blocked */ } }
  };
}

// ---------- pixel buffer: one small canvas, integer upscale, never stretched ----------
const PX = { B: newCanvas(1, 1), K: 1, LW: 1, LH: 1, dpr: 1, TOP: 0, cx0: 0, cy0: 0 };
let g = PX.B.getContext("2d");
// Fit a cw x ch core scene at the largest integer scale; extra space shows more world around it.
// Landscape screens may crop `tops` rows of sky when that buys a bigger scale and okTop(sideBay) agrees.
function pixResize(cv, cssW, cssH, cw, ch, tops, okTop) {

    const k = Math.max(1, fl(Math.min(devW / cw, devH / (ch - top))));
    if (top && okTop && !okTop(fl((Math.ceil(devW / k) - cw) / 2))) continue;
    if (!best || k > best.k) best = { k, top };

  cv.width = PX.LW * PX.K; cv.height = PX.LH * PX.K;
  PX.cx0 = fl((PX.LW - cw) / 2); PX.cy0 = fl((PX.LH - (ch - PX.TOP)) * 0.6) - PX.TOP;
  const w = PX.LW * PX.K / dpr, h = PX.LH * PX.K / dpr;

}
// one drawImage per frame; zoom = { x, y, s } is a short camera punch toward buffer point (x, y)
function pixBlit(ctx, zoom) {
  const K = PX.K, W = PX.LW * K, H = PX.LH * K;
  TXT.last = TXT.seen; TXT.seen = []; // the strings of the frame just drawn (window.__game.texts())
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;
  if (!zoom || zoom.s <= 1.001) { ctx.drawImage(PX.B, 0, 0, W, H); return; }
  ctx.drawImage(PX.B, Math.round(zoom.x * K * (1 - zoom.s)), Math.round(zoom.y * K * (1 - zoom.s)), Math.round(W * zoom.s), Math.round(H * zoom.s));
}
// place a transparent DOM hit area over something drawn at buffer rect (x, y, w, h)
function place(el, x, y, w, h) {
  const u = PX.K / PX.dpr;
  el.style.left = x * u + "px"; el.style.top = y * u + "px"; el.style.width = w * u + "px"; el.style.height = h * u + "px";
}

// ---------- primitives: integer rectangles and spans from the palette ----------
function R(x, y, w, h, c) { g.fillStyle = PAL[c]; g.fillRect(fl(x), fl(y), fl(w), fl(h)); }
function P(x, y, c) { g.fillStyle = PAL[c]; g.fillRect(fl(x), fl(y), 1, 1); }
function line(x0, y0, x1, y1, c, t) { // Bresenham with a square brush of t px
  t = t || 1; x0 = fl(x0); y0 = fl(y0); x1 = fl(x1); y1 = fl(y1);
  const o = t >> 1, dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy; g.fillStyle = PAL[c];

    g.fillRect(x0 - o, y0 - o, t, t);
    if (x0 === x1 && y0 === y1) break;

const hw = (rx, ry, dy) => Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy / (ry + 0.5)) ** 2)));
// filled ellipse / ring from horizontal spans; part: 0 all, -1 top half, 1 bottom half
function ell(cx, cy, rx, ry, c, part) {
  cx = fl(cx); cy = fl(cy); g.fillStyle = PAL[c];
  for (let dy = -ry; dy <= ry; dy++) { if ((part < 0 && dy > 0) || (part > 0 && dy < 0)) continue; const w = hw(rx, ry, dy); g.fillRect(cx - w, cy + dy, 2 * w + 1, 1); }
}
function ring(cx, cy, rxo, ryo, rxi, ryi, c, part) {
  cx = fl(cx); cy = fl(cy); g.fillStyle = PAL[c];
  for (let dy = -ryo; dy <= ryo; dy++) {
    if ((part < 0 && dy > 0) || (part > 0 && dy < 0)) continue;
    const wo = hw(rxo, ryo, dy);
    if (Math.abs(dy) > ryi) { g.fillRect(cx - wo, cy + dy, 2 * wo + 1, 1); continue; }
    const wi = hw(rxi, ryi, dy);
    g.fillRect(cx - wo, cy + dy, wo - wi, 1); g.fillRect(cx + wi + 1, cy + dy, wo - wi, 1);
  }
}
// scanline polygon fill; c may be a function (y) -> palette letter or pattern for per-row cel shading
function poly(pts, c) {
  let y0 = 1e9, y1 = -1e9;
  for (const p of pts) { y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
  for (let y = fl(y0); y <= Math.ceil(y1); y++) {
    const sy = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; if ((a.y <= sy && b.y > sy) || (b.y <= sy && a.y > sy)) xs.push(a.x + (sy - a.y) / (b.y - a.y) * (b.x - a.x)); }
    xs.sort((a, b) => a - b);
    for (let j = 0; j + 1 < xs.length; j += 2) {
      const xa = Math.round(xs[j]), xb = Math.round(xs[j + 1]);
      if (xb > xa) { const v = typeof c === "function" ? c(y) : c; g.fillStyle = typeof v === "string" ? PAL[v] : v; g.fillRect(xa, y, xb - xa, 1); }
    }

}
// ordered dithering: 4x4 Bayer tile of two palette colours (null = transparent), level 0..16 = share of b
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], patCache = {};
function pat(a, b, lv) {
  const key = a + b + lv;
  if (!patCache[key]) {
    const t = newCanvas(4, 4), x = t.getContext("2d");
    for (let i = 0; i < 16; i++) { const col = BAYER[i] < lv ? b : a; if (col) { x.fillStyle = PAL[col]; x.fillRect(i % 4, i >> 2, 1, 1); } }

}
function D(x, y, w, h, a, b, lv) { g.fillStyle = pat(a, b, lv); g.fillRect(fl(x), fl(y), fl(w), fl(h)); }
function band(x, y, w, h, a, b) { for (let i = 0; i < h; i++) D(x, y + i, w, 1, a, b, Math.round((i + 0.5) / h * 16)); }

// ---------- sprites: char maps ("..kffk..", one palette letter per pixel) baked once into canvases ----------
function mk(rows, swap) {
  const c = newCanvas(Math.max(...rows.map(r => r.length)), rows.length), x = c.getContext("2d");
  rows.forEach((r, y) => { for (let i = 0; i < r.length; i++) { let ch = r[i]; if (swap && swap[ch]) ch = swap[ch]; if (ch !== "." && PAL[ch]) { x.fillStyle = PAL[ch]; x.fillRect(i, y, 1, 1); } } });

}

  if (!flip) { g.drawImage(c, fl(x), fl(y), w, h); return; }

}
function outline(src, col) { // 1 px border (8 neighbours) in one colour
  const c = newCanvas(src.width + 2, src.height + 2), x = c.getContext("2d"), m = newCanvas(src.width, src.height), mx = m.getContext("2d");
  mx.drawImage(src, 0, 0); mx.globalCompositeOperation = "source-in"; mx.fillStyle = PAL[col]; mx.fillRect(0, 0, m.width, m.height);

// ---------- type: 3x5 bitmap font (Latin, digits) and crisp system text (Japanese, >= 12 buffer px) ----------
// each glyph: width digit, then one base-32 digit per row (bit = pixel, MSB left); a 6th row is a descender
const GL = {
  "0": "375557", "1": "326227", "2": "371747", "3": "371317", "4": "355711", "5": "374717", "6": "374757", "7": "371222", "8": "375757", "9": "375717",
  A: "325755", B: "365656", C: "334443", D: "365556", E: "374647", F: "374644", G: "334553", H: "355755", I: "372227", J: "311152",
  K: "355655", L: "344447", M: "5hrlhh", N: "49db99", O: "325552", P: "365644", Q: "325563", R: "365655", S: "334216", T: "372222",
  U: "355557", V: "355552", W: "5hhlla", X: "355255", Y: "355222", Z: "371247",
  a: "303553", b: "346556", c: "303443", d: "313553", e: "303563", f: "312722", g: "3035316", h: "346555", i: "110111", j: "2101112",
  k: "345665", l: "222221", m: "50qlll", n: "306555", o: "302552", p: "3065644", q: "3035311", r: "305644", s: "303616", t: "327221",
  u: "305553", v: "305552", w: "50hlla", x: "305225", y: "3055316", z: "307127",
  " ": "200000", "!": "111101", "?": "361202", ".": "100001", ",": "100011", ":": "101010", "/": "311244", "-": "300700", "+": "302720",
  "×": "305250", "=": "307070", "'": "111000", "~": "405a00", "♩": "311176", "(": "212221", ")": "221112", ">": "342124"
};
// TXT: every string drawn this frame and the smallest text size drawn so far, in buffer px of font size
// (a 5 px Latin cap reads like a 7 px font). tools/qa.mjs turns it into CSS px with view().K / view().dpr.
const TXT = { min: Infinity, seen: [], last: [] };
function noteText(str, em) { if (em < TXT.min) TXT.min = em; if (TXT.seen.length < 300) TXT.seen.push(String(str)); }
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,system-ui,sans-serif';
const isLatin = s => [...s].every(ch => GL[ch]);

function cached(key, make) { let c = tcache.get(key); if (!c) { if (tcache.size > 600) tcache.clear(); c = make(); tcache.set(key, c); } return c; }
function bitmapText(str, col) {
  const gl = [...str].map(ch => GL[ch]); let w = -1;
  gl.forEach(q => { w += +q[0] + 1; });
  const c = newCanvas(w, 6), x = c.getContext("2d"); x.fillStyle = PAL[col];
  let px = 0;
  gl.forEach(q => { const gw = +q[0]; for (let r = 1; r < q.length; r++) { const bits = parseInt(q[r], 32); for (let i = 0; i < gw; i++) if (bits & (1 << (gw - 1 - i))) x.fillRect(px + i, r - 1, 1, 1); } px += gw + 1; });

}
const tcv = newCanvas(8, 8), tctx = tcv.getContext("2d", { willReadFrequently: true });
function crispText(str, px, col) { // never below 12 buffer px: smaller kanji turn to mush

  tctx.font = font;

// o: { c colour, o outline colour, sc integer scale for Latin (baked before the 1 px outline), px size for other text, a "l"|"c"|"r" }
function textCanvas(str, o) {

function txt(str, x, y, o) {

}
const textW = (str, o) => textCanvas(str, o || {}).width;
// big chunky Latin: glyphs scaled by sx/sy with a 1 px (unscaled) outline, optional second ring ol2
function bigText(str, x, y, sc, fill, ol, sx, sy, ol2) {
  sx = sx || sc; sy = sy || sc;

  noteText(str, (isLatin(str) ? 5 / 0.7 : 12) * Math.min(sx, sy));

// signature words from hand-placed glyph grids ("#" = ink). They are pictures, so call noteText(word, 12)

// kanaArt: bold 2 px strokes, ring outline(s), glyph cut points for stamping the word in letter by letter.
function kanaArt(table, str, fill, ol, ol2) {

    const gl = [...str].map(ch => table[ch]), gw = q => Math.max(...q.map(r => r.length));

function inkArt(table, str, jys, ink, shade) {
  return cached("I" + str + (ink || "k") + (shade || "D"), () => {
    const chars = [...str], gw = ch => Math.max(...table[ch].map(r => r.length)), H = Math.max(...chars.map(ch => table[ch].length)) + 3;
    const c = newCanvas(chars.reduce((a, ch) => a + gw(ch) + 1, 0) + 2, H), x = c.getContext("2d");
    const pass = (col, ox, oy) => { x.fillStyle = PAL[col]; let px = 0; chars.forEach((ch, i) => { const jy = jys ? jys[i % jys.length] : 0; table[ch].forEach((row, y) => { for (let j = 0; j < row.length; j++) if (row[j] === "#") x.fillRect(px + j + ox, y + jy + oy, 1, 1); }); px += gw(ch) + 1; }); };
    pass(shade || "D", 1, 1); pass(shade || "D", 2, 1); pass(ink || "k", 0, 0); pass(ink || "k", 1, 0);

    cause, ticks: 0, rankDone: false, stamped: false, goal: null, boarded: run.boarded, n: run.n, stars: run.stars, hist: run.hist.slice(), maxChain: run.maxChain, stamp: play && run.newStamp };
  // one concrete next goal from a small rotating pool (bar 1.6.1)
  const next = RANKS.find(t => t > run.score), pool = [
    next ? { k: "g_score", n: next } : null, { k: "g_station", n: run.n + 1 }, { k: "g_chain", n: Math.max(6, run.maxChain + 4) },
    run.star3 ? null : { k: "g_star3" }, { k: "g_riders", n: Math.max(15, Math.ceil((run.boarded + 6) / 5) * 5) },
    { k: "g_clear", n: Math.max(3, run.clears + 2) }, { k: "g_clean", n: Math.max(4, run.n + 1) }

}
function resultStep(now) {

  if (!r.rankDone && r.showRank && age > RES.count + countDur() + 60) { r.rankDone = true; sfx.rank(); }
  if (!r.stamped && r.newBest && age > RES.best) { // never in demo: newBest is only set in play
    r.stamped = true; sfx.best(); platform("happytime");
    const by = wide() ? overY() + 118 : overLowY(true) + 54;
    burst(140, by, 16, 110, { col: "y", s: 2 }); burst(140, by, 5, 120, { kind: "spr", spr: SP.star });
  }
}
const resAge = (r, now) => now - r.at;
const countDur = () => state === "demo-over" ? 900 : RES.countDur; // the clip gets a slower count-up that reads on video

// ---------- screen, language, mute ----------
const UI = { start: [54, 286, 72, 22], retry: [54, 286, 72, 22], toTitle: [4, 296, 58, 17], resume: [0, 0, 94, 22], restart: [0, 0, 66, 18], quit: [0, 0, 66, 18] };
function layoutUI() {
  const py = pauseY(); UI.resume = [43, py + 34, 94, 22]; UI.restart = [12, py + 66, 76, 18]; UI.quit = [92, py + 66, 76, 18];
  const vb = vBot(), ttw = textW(S("toTitle"), { px: 12, sc: 2 }) + 14; // sized to its label, so it never runs under the retry tag
  if (wide()) { const oy = overY() + 182; UI.toTitle = [4, Math.min(oy + 4, 299, vb - 21), ttw, 17]; UI.retry = [Math.max(54, 4 + ttw + 4), Math.min(oy, 292, vb - 26), 72, 22]; }
  else { const ly = overLowY(true) + 78; UI.toTitle = [12, ly + 3, ttw, 17]; UI.retry = [Math.max(54, 12 + ttw + 6), ly, 72, 22]; }
  UI.start = [54, Math.min(286, vb - 30), 72, 22];
  const core = (el, r, p) => place(el, r[0] - p + PX.cx0, r[1] - p + PX.cy0, r[2] + 2 * p, r[3] + 2 * p);
  core($("btnStart"), UI.start, 3); core($("btnResume"), UI.resume, 1); core($("btnRestart"), UI.restart, 1); core($("btnQuit"), UI.quit, 1);
  core($("btnRetry"), UI.retry, 2); core($("btnToTitle"), UI.toTitle, 1);
  place(btnMute, PX.LW - 19, 0, 19, 18); place(btnPause, PX.LW - 19, 18, 19, 18); place($("btnLang"), 0, 0, langW() + 4, 19);
}
function resize() {
  const box = pixResize(cv, wrap.clientWidth || innerWidth, wrap.clientHeight || innerHeight, CW, CH, [0, 40, 60, 80, 96, 110], bay => bay >= 90);
  if (PX.TOP > 0 && PX.LH < CH) PX.cy0 = -Math.min(44, CH - PX.LH); // landscape: the roof stays, the far platform goes
  for (const el of [cv, uiEl]) { el.style.width = box.w + "px"; el.style.height = box.h + "px"; el.style.left = box.left + "px"; el.style.top = box.top + "px"; }
  buildBg(); layoutUI();
}
window.addEventListener("resize", resize);
function applyLang() {
  document.documentElement.lang = lang;
  document.title = STRINGS.ja.title + " / Oshiya Rush";
  document.querySelectorAll("[data-s]").forEach(el => { el.textContent = S(el.getAttribute("data-s")); });
  $("btnLang").textContent = S("lang");
  layoutUI();
}
function setMute(m) { if (!DEMO) store.set("mute", m); auMute(m); btnMute.textContent = m ? "sound off" : "sound on"; }

// ---------- flow ----------
function hideAll() { ovTitle.hidden = true; ovPause.hidden = true; ovOver.hidden = true; }
const newSeed = () => (Math.random() * 4294967296) >>> 0;
function startAI(mode, seed) { state = mode === "demo" ? "demo" : "title"; newRun(mode, seed == null ? newSeed() : seed); btnPause.hidden = true; }
function toTitle() { pfStop(); hideAll(); ovTitle.hidden = DEMO; startAI("attract"); }
function startPlay() {
  if (auInit()) auResume();
  sfx.ui(); hideAll();
  state = "play"; runCount++;
  newRun("play", newSeed());
  btnPause.hidden = false;
  pfStart();
}
function showOver(now) {
  state = "over"; run.result = makeResult(now); musicLevel("bed");
  if (run.result.newBest) store.set("best", run.score);
  store.set("runs", num("runs") + 1);
  ovOver.hidden = false; overShownAt = T(); btnPause.hidden = true;
  platform("gameOver", run.score);
}
function pauseGame(at) {
  if (state !== "play") return;
  state = "paused"; fx.pauseT = T();
  run.pauseClock = (at || T()) - run.offset;
  musicLevel("off");
  ovPause.hidden = false; btnPause.hidden = true;
  pfStop();
}
function resumeGame() {
  if (state !== "paused") return;
  if (auInit()) auResume();
  run.offset = T() - run.pauseClock;
  state = "play"; ovPause.hidden = true; btnPause.hidden = false;
  musicLevel("play");
  pfStart();
}
function holdClock() { if (run && run.holdAt == null && (state === "title" || state === "demo")) run.holdAt = T(); }
function releaseClock() { if (run && run.holdAt != null) { run.offset += T() - run.holdAt; run.holdAt = null; } }
function onHide() { if (state === "play") pauseGame(); else holdClock(); }
function onShow() { releaseClock(); lastNow = performance.now(); }
const retryReady = () => T() - overShownAt > 350; // a short lockout so a late gameplay tap does not restart by accident
function retry() { if (state === "over" && retryReady()) startPlay(); }

// ---------- input: the heave on pointerdown / keydown; the response is drawn on the next frame ----------
function heave(ts) { // ts: the event's own time stamp, so a busy frame does not make the press late
  if (state !== "play") return;
  updateRun(T());
  let tc = clockNow();
  if (!manual && ts > 0) { const lag = performance.now() - ts; if (lag > 0 && lag < 100) tc -= lag; }
  press(tc);
}
auUnlock();
cv.addEventListener("pointerdown", e => { e.preventDefault(); heave(e.timeStamp); });
cv.addEventListener("pointercancel", e => e.preventDefault()); // nothing is held, so a cancelled touch commits nothing
ovPause.addEventListener("click", e => { if (e.target === ovPause) resumeGame(); });
ovTitle.addEventListener("click", e => { if (!e.target.closest("button") || e.target.id === "btnStart") startPlay(); }); // a tap anywhere starts
ovOver.addEventListener("click", e => { if (e.target !== ovOver) return; if (!skipResult(T())) retry(); });
$("btnLang").addEventListener("click", e => { e.stopPropagation(); lang = lang === "ja" ? "en" : "ja"; store.set("lang", lang); applyLang(); sfx.ui(); });
btnMute.addEventListener("click", e => { e.stopPropagation(); if (auInit()) auResume(); setMute(!AU.muted); btnMute.blur(); });
btnPause.addEventListener("click", e => { e.stopPropagation(); pauseGame(); btnPause.blur(); });
$("btnResume").addEventListener("click", e => { e.stopPropagation(); resumeGame(); });
$("btnRestart").addEventListener("click", e => { e.stopPropagation(); pfStop(); startPlay(); });
$("btnQuit").addEventListener("click", e => { e.stopPropagation(); toTitle(); });
$("btnRetry").addEventListener("click", e => { e.stopPropagation(); retry(); });
$("btnToTitle").addEventListener("click", e => { e.stopPropagation(); if (retryReady()) toTitle(); });
document.addEventListener("keydown", e => {
  if (DEMO || e.ctrlKey || e.metaKey || e.altKey || e.key === "Tab") return;
  const k = e.key, ok = k === " " || k === "Enter" || k === "Spacebar";
  if (ok || k.startsWith("Arrow")) e.preventDefault();
  if (e.repeat) return;
  if (k === "m" || k === "M") { setMute(!AU.muted); return; }
  if (isTitle()) { if (ok) startPlay(); }
  else if (state === "play") { if (k === "Escape" || k === "p" || k === "P") pauseGame(); else if (ok || k === "ArrowUp" || k === "ArrowDown") heave(e.timeStamp); }
  else if (state === "paused") { if (ok || k === "Escape" || k === "p" || k === "P") resumeGame(); }
  else if (state === "over") { if (ok) { if (!skipResult(T())) retry(); } else if (k === "Escape") toTitle(); }
});
document.addEventListener("visibilitychange", () => { if (document.hidden) onHide(); else onShow(); });
window.addEventListener("blur", () => { if (state === "play") pauseGame(); });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());

// ---------- update and loop ----------
function update(now, dt) {
  if (!run) return;
  if ((state === "play" || state === "title" || state === "demo") && run.holdAt == null) updateRun(now);
  if (isDying()) {
    const el = now - run.dead.at, wait = state === "dying" ? FREEZE : state === "demo-dying" ? 1300 : 1400; // the demo lingers on the failure for the clip
    if (el > wait) { if (state === "dying") showOver(now); else if (state === "demo-dying") { state = "demo-over"; run.result = makeResult(now); musicLevel("bed"); } else startAI("attract"); }
  }
  if (state === "demo-over" && now - run.result.at > 3200) startAI("demo"); // a short result hold, then the clip loops
  if (isOver()) resultStep(now);
  juiceStep(dt);
  if (state === "paused" || (isDying() && now - run.dead.at < FREEZE)) return; // the failure freeze holds every pose
  const vdt = Juice.stop > 0 ? dt * 0.15 : dt; // hitstop slows the visuals only; the run clock never stops

  stepPositions(vdt);
}
function step(now, dt) {
  update(now, dt);

  if (raw > 250 && run && run.ai && run.holdAt == null && !isDying()) run.offset += raw - 16; // the AI never teleports
  step(now, clamp(raw, 0, 50) / 1000);
  draw(now);
}

// ---------- test hooks (the contract in tools/README.md; tools/qa.mjs and review-kit read them) ----------
window.__game = {
  get state() { return state === "demo-over" || state === "demo-dying" ? "demo" : state === "title-dying" ? "title" : state; },
  get score() { return run ? run.score : 0; },
  get mode() { return run ? run.mode : null; },
  snap() { // gameplay state for frame-rate parity: integers only, no wall clock
    if (!run || !run.st) return null;
    const st = run.st, r = st.door;
    return { state, score: run.score, lives: run.lives, station: run.n, phase: ["arrive", "open", "board", "bell", "close", "pinch", "depart"].indexOf(st.ph),
      queue: st.queue.length, door: r ? r.d : -1, need: r ? r.need : -1, rate: st.R, cracks: st.cracks, complaints: run.complaints,
      chain: run.chain, boarded: run.boarded, dead: run.dead && run.dead.reason, t: Math.round(clockNow()) };
  },
  manual(on) { manual = !!on; simT = performance.now(); lastNow = simT; },
  tick(ms, render) { simT += ms; step(simT, ms / 1000); if (render) draw(simT); },
  demo(seed) { hideAll(); btnPause.hidden = true; startAI("demo", seed); },
  tap() { heave(); },
  autoplay(on) { autopilot = !!on; },
  fail() { if (state === "play" && !run.dead) { run.lives = 1; loseLife("pinch", clockNow(), T(), DX, FEET_DOOR - 14); } },
  audioState() { return AU.ctx ? AU.ctx.state : "none"; },
  view() { return { K: PX.K, dpr: PX.dpr, w: PX.LW, h: PX.LH, top: PX.TOP, reduce: Juice.reduce, textMin: TXT.min }; },
  texts() { return TXT.last.slice(); },
  target() { const u = PX.K / PX.dpr, b = cv.getBoundingClientRect(); return { x: b.left + (PX.cx0 + DX) * u, y: b.top + (PX.cy0 + 186) * u }; }, // the doorway: a fixed point, never a moving rider
  peak(n) { return auPeak(() => PEAK_SET.slice(0, n || 8).forEach(k => sfx[k](1, "s"))); }
};

// ---------- boot ----------
buildSprites();
resize();
applyLang();
AU.muted = !!store.get("mute", false); setMute(AU.muted);
if (DEMO) { hideAll(); btnMute.hidden = true; btnPause.hidden = true; auInit(); startAI("demo"); } // recordings start the bus without a gesture when the browser allows it
else toTitle();
requestAnimationFrame(frame);
})();
