  } else if (ph === "depart" && !G.ai && G.lives > 0) {
    txt(s.departing, 387, 504, 15, "#ffb347");
    txt(s.tapSkip, 387, 528, 9.5, "#c9ced8", "center", 800);
  } else {
    txt(ph === "arrive" || ph === "open" ? s.arriving : s.departing, 387, 511, 15, "#ffb347");
  }
}

function drawOshiya(time) {
  const shoving = G.shoving;
  const bx = shoving ? 286 : 296, by = shoving ? 494 : 506;
  dot("#00000022", bx + 2, by + 6, 19, 17);
  dot("#2b3a66", bx, by, 18, 18);
  box("#f3c43a", bx - 2, by + 2, 4, 12);
  dot("#f2cfb2", bx, by - 6, 11, 11);
  dot("#2b3a66", bx, by - 15, 12, 6); ctx.fillRect(bx - 12, by - 15, 24, 3);
  box("#f3c43a", bx - 11, by - 13, 22, 2);
  ctx.fillStyle = "#2a2f3a";
  if (shoving) { ctx.fillRect(bx - 6, by - 6, 4, 1.8); ctx.fillRect(bx + 2, by - 6, 4, 1.8); }
  else { dot(null, bx - 4, by - 5, 1.6, 1.6); dot(null, bx + 4, by - 5, 1.6, 1.6); }
  if (!shoving) { glove(bx - 17, by + 6, 0, 0.7); glove(bx + 17, by + 6, 0, 0.7); }
}
function glove(x, y, rot, s) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#8d93a0"; ctx.lineWidth = 2;
  rrect(-11, -10, 22, 22, 9); ctx.fill(); ctx.stroke();
  dot(null, -12, 2, 5, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, -9); ctx.lineTo(-4, -2); ctx.moveTo(3, -9); ctx.lineTo(3, -2); ctx.stroke();
  ctx.restore();
}
function drawShoveHands(time) {
  const pump = Math.sin(time * 28) * 4;
  if (G.shoving) {
    for (const sx of [-1, 1]) glove(DOOR_CX + sx * 20, DOOR_LINE + 24 + pump * (sx > 0 ? 1 : -1), Math.PI + sx * 0.15, 1.15);
    ctx.strokeStyle = "#ffffffcc"; ctx.lineWidth = 3; ctx.lineCap = "round";
    for (let i = -2; i <= 2; i++) { const x = DOOR_CX + i * 16, y = DOOR_LINE + 52 + ((time * 160 + i * 13) % 26); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 12); ctx.stroke(); }
  }
  if (G.shovingFar) {
    // kept just below the HUD band so the far-side gloves stay visible
    for (const sx of [-1, 1]) glove(DOOR_CX + sx * 20, FAR_LINE + 2 - pump * (sx > 0 ? 1 : -1), sx * 0.15, 1.15);
  }
}

function carPath(L, R, top, bot, b) {
  ctx.beginPath();
  ctx.moveTo(L, top); ctx.quadraticCurveTo((L + R) / 2, top - b * 2, R, top);
  ctx.quadraticCurveTo(R + b * 1.6, (top + bot) / 2, R, bot);
  ctx.lineTo(L, bot);
  ctx.quadraticCurveTo(L - b * 1.6, (top + bot) / 2, L, top); ctx.closePath();
}

function drawCar(time) {
  const L = G.carL, R = G.carR;
  const warn = G.redT > 0 ? (Math.sin(time * 40) * 0.5 + 0.5) * G.redT : 0;
  const b = clamp(G.pressureShown, 0, 1.4) * 6 + warn * 3;
  // neighbouring cars (roofs) and gangways
  ctx.fillStyle = "#c4c9cf";
  ctx.fillRect(L - 12 - 26 - 640, ROOF_Y + 4, 640, DOOR_Y1 - ROOF_Y - 8);
  ctx.fillRect(R + 12 + 26, ROOF_Y + 4, 640, DOOR_Y1 - ROOF_Y - 8);
  ctx.fillStyle = "#adb3ba";
  for (const x0 of [L - 38 - 600, R + 38 + 40]) for (let k = 0; k < 5; k++) rrect(x0 + k * 120, 230, 80, 60, 8), ctx.fill();
  box("#6fbf8e", L - 38 - 640, DOOR_Y1 - 14, 640, 6); ctx.fillRect(R + 38, DOOR_Y1 - 14, 640, 6);
  box("#5c6068", L - 38, 210, 26, 120); ctx.fillRect(R + 12, 210, 26, 120);
  ctx.strokeStyle = "#474a50"; ctx.lineWidth = 2;
  for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.moveTo(L - 34 + k * 5, 212); ctx.lineTo(L - 34 + k * 5, 328); ctx.moveTo(R + 16 + k * 5, 212); ctx.lineTo(R + 16 + k * 5, 328); ctx.stroke(); }
  // shell
  carPath(L - 12, R + 12, ROOF_Y, DOOR_Y1, b);
  ctx.fillStyle = "#e6e9ec"; ctx.fill(); ctx.strokeStyle = "#8e96a0"; ctx.lineWidth = 2; ctx.stroke();
  box("#6fbf8e", L - 12, DOOR_Y1 - 6, R - L + 24, 4); ctx.fillRect(L - 12, ROOF_Y + 2, R - L + 24, 3);
  // door sills cut through the walls
  const sill = y => {
    box("#b5bbc2", DOOR_CX - DOOR_HW, y, DOOR_HW * 2, 12);
    ctx.fillStyle = "#9aa1a9"; for (let i = 0; i < 3; i++) ctx.fillRect(DOOR_CX - DOOR_HW, y + 2 + i * 4, DOOR_HW * 2, 1.5);
    box("#3b414b", DOOR_CX - DOOR_HW - 4, y - 2, 5, 16); ctx.fillRect(DOOR_CX + DOOR_HW - 1, y - 2, 5, 16);
  };
  sill(DOOR_Y0);
  if (G.farDoor) sill(ROOF_Y);
  // windows along the far wall
  for (let x = L + 14; x < R - 40; x += 66) {
    if (G.farDoor && Math.abs(x + 22 - DOOR_CX) < DOOR_HW + 26) continue;
    const brk = G.broken.some(bx => Math.abs(bx - (x + 22)) < 33);
    ctx.fillStyle = brk ? "#3b4250" : warn > 0.3 ? "#ff9d94" : "#bfe1f2";
    ctx.fillRect(x, ROOF_Y + 6 - b * 0.9, 44, 5);
    if (brk) { ctx.strokeStyle = "#dff3ff"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + 10, ROOF_Y + 3); ctx.lineTo(x + 20, ROOF_Y + 12); ctx.lineTo(x + 30, ROOF_Y + 2); ctx.lineTo(x + 38, ROOF_Y + 11); ctx.stroke(); }
  }
  // floor
  carPath(L, R, TOP_IN, DOOR_Y0, b * 0.7);
  ctx.fillStyle = "#f6eedb"; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = "#ece2c8"; ctx.lineWidth = 1.5;
  ctx.beginPath(); for (let y = 150; y < DOOR_Y0; y += 34) { ctx.moveTo(L, y); ctx.lineTo(R, y); } ctx.stroke();
  ctx.fillStyle = "#ffe08a3a";
  for (let i = -1; i < 6; i++) {
    const x0 = L + i * 104 + ((time * 6) % 104) * 0;
    ctx.beginPath(); ctx.moveTo(x0, TOP_IN); ctx.lineTo(x0 + 52, TOP_IN); ctx.lineTo(x0 + 52 - 150, DOOR_Y0); ctx.lineTo(x0 - 150, DOOR_Y0); ctx.fill();
  }
  // door wells
  box("#e8dcc0", DOOR_CX - DOOR_HW, DOOR_Y0 - 30, DOOR_HW * 2, 30);
  box("#f3c43a", DOOR_CX - DOOR_HW, DOOR_Y0 - 4, DOOR_HW * 2, 4);
  if (G.farDoor) { box("#e8dcc0", DOOR_CX - DOOR_HW, TOP_IN, DOOR_HW * 2, 30); box("#f3c43a", DOOR_CX - DOOR_HW, TOP_IN, DOOR_HW * 2, 4); }
  ctx.restore();
  // benches
  const bench = (x0, y0, x1, y1) => { rbox("#5f7fb8", x0, y0, x1 - x0, y1 - y0, 6); box("#7c98c9", x0 + 4, y0 + 4, x1 - x0 - 8, 4); };
  if (G.farDoor) { bench(L, TOP_IN, DOOR_CX - BENCH_GAP, BENCH_TOP); bench(DOOR_CX + BENCH_GAP, TOP_IN, R, BENCH_TOP); }
  else bench(L, TOP_IN, R, BENCH_TOP);
  bench(L, BENCH_BOT, DOOR_CX - BENCH_GAP, DOOR_Y0); bench(DOOR_CX + BENCH_GAP, BENCH_BOT, R, DOOR_Y0);
  const pr = G.pressureShown;
  for (const s of G.seats) drawSeat(s, pr, time);
  // door panels
  drawPanels(DOOR_Y0, DOOR_LINE);
  if (G.farDoor) drawPanels(ROOF_Y, FAR_LINE);
}
function drawPanels(y0, line) {
  let g = DOOR_HW * (1 - easeOut(G.closeAmt));
  for (const p of G.ps) if (p.state === "pinched" && p.pinchLine === line) g = Math.max(g, p.r * 0.1);
  if (g >= DOOR_HW - 0.5) return;
  ctx.fillStyle = "#d2d7dd"; ctx.strokeStyle = "#7d8590"; ctx.lineWidth = 1.5;
  ctx.fillRect(DOOR_CX - DOOR_HW, y0, DOOR_HW - g, 12); ctx.strokeRect(DOOR_CX - DOOR_HW, y0, DOOR_HW - g, 12);
  ctx.fillRect(DOOR_CX + g, y0, DOOR_HW - g, 12); ctx.strokeRect(DOOR_CX + g, y0, DOOR_HW - g, 12);
  box("#2a2f3a", DOOR_CX - g - 3, y0, 3, 12); ctx.fillRect(DOOR_CX + g, y0, 3, 12);
}
function drawSeat(s, pr, time) {
  const x = s.x, y = s.y;
  dot(s.body, x, y + (s.top ? 4 : -4), 15, 12);
  if (s.top) {
    dot(s.skin, x, y - 1, 10, 10);
    ctx.fillStyle = s.hair; ctx.beginPath(); ctx.arc(x, y - 2, 10.5, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    ctx.fillStyle = "#2a2f3a";
    if (pr > 0.6) { ctx.fillRect(x - 6, y - 1, 4, 1.6); ctx.fillRect(x + 2, y - 1, 4, 1.6); }
    else { dot(null, x - 3.5, y, 1.4, 1.4); dot(null, x + 3.5, y, 1.4, 1.4); }
    if (pr > 0.5) { dot("#7cc3ef", x + 9, y - 6 + ((time * 10 + s.ph) % 4), 1.8, 2.6); }
  } else {
    dot(s.hair, x, y + 1, 10, 10);
  }
}

function drawStrapsAndLight(time) {
  const L = G.carL, R = G.carR, sw = G.sway * 7 + Math.sin(time * 2) * 0.6;
  ctx.save();
  carPath(L, R, TOP_IN, DOOR_Y0, 0); ctx.clip();
  ctx.strokeStyle = "#9aa3ad88"; ctx.lineWidth = 2;
  for (const y of [166, 372]) {
    ctx.beginPath(); ctx.moveTo(L, y - 8); ctx.lineTo(R, y - 8); ctx.stroke();
    for (let x = L + 24; x < R - 10; x += 38) {
      ctx.strokeStyle = "#8f98a3aa"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, y - 8); ctx.lineTo(x + sw, y - 2); ctx.stroke();
      ctx.strokeStyle = "#ffffffcc"; ctx.lineWidth = 3; ell(x + sw * 1.2, y + 2, 5.5, 5.5); ctx.stroke();
      ctx.strokeStyle = "#8f98a3"; ctx.lineWidth = 1.2; ctx.stroke();
    }
  }
  ctx.fillStyle = "#fff2c412";
  for (let i = -1; i < 6; i++) { const x0 = L + i * 104; ctx.beginPath(); ctx.moveTo(x0, TOP_IN); ctx.lineTo(x0 + 52, TOP_IN); ctx.lineTo(x0 - 98, DOOR_Y0); ctx.lineTo(x0 - 150, DOOR_Y0); ctx.fill(); }
  ctx.restore();
}

function drawPerson(p, time) {
  const r = p.r, k = p.kind;
  const flying = p.state === "free" && Math.hypot(p.vx, p.vy) > 260;
  const lp = p.state === "pinched" ? 1.2 : p.lp;
  // backpacks sit behind the body
  if (k === "backpack" || k === "hiker") {
    rbox(p.bag, -r * (k === "hiker" ? 0.75 : 0.6), -r * (k === "hiker" ? 1.25 : 1.0), r * (k === "hiker" ? 1.5 : 1.2), r * (k === "hiker" ? 1.1 : 0.8), r * 0.25);
    if (k === "hiker") { ctx.strokeStyle = "#1e2230"; ctx.lineWidth = 2.5; ctx.stroke(); box("#00000025", -r * 0.5, -r * 1.0, r, r * 0.12); }
  }
  dot(p.body, 0, 0, r, r * 0.98);
  if (p.rigid) { ctx.strokeStyle = "#1e2230"; ctx.lineWidth = 2.6; ctx.stroke(); }
  if (k === "suit" || k === "backpack") {
    tri("#ffffff", -r * 0.3, r * 0.15, r * 0.3, r * 0.15, 0, r * 0.62);
    ctx.fillStyle = p.tie; ctx.beginPath(); ctx.moveTo(0, r * 0.24); ctx.lineTo(r * 0.1, r * 0.4); ctx.lineTo(0, r * 0.72); ctx.lineTo(-r * 0.1, r * 0.4); ctx.fill();
    if (k === "backpack") { box(p.bag, -r * 0.62, -r * 0.1, r * 0.13, r * 0.7); ctx.fillRect(r * 0.49, -r * 0.1, r * 0.13, r * 0.7); }
  } else if (k === "student") {
    ctx.fillStyle = "#e9c46a"; for (const yy of [0.32, 0.58]) { dot(null, 0, r * yy, r * 0.06, r * 0.06); }
    box("#151820", -r * 0.28, r * 0.12, r * 0.56, r * 0.1);
  } else if (k === "blazer") {
    // school blazer: shirt, striped tie, gold crest on the chest pocket
    tri("#ffffff", -r * 0.3, r * 0.15, r * 0.3, r * 0.15, 0, r * 0.62);
    ctx.fillStyle = p.tie; ctx.beginPath(); ctx.moveTo(0, r * 0.24); ctx.lineTo(r * 0.11, r * 0.4); ctx.lineTo(0, r * 0.72); ctx.lineTo(-r * 0.11, r * 0.4); ctx.fill();
    box("#e9c46a", -r * 0.08, r * 0.36, r * 0.16, r * 0.05); ctx.fillRect(-r * 0.06, r * 0.5, r * 0.12, r * 0.05);
    dot("#e9c46a", -r * 0.55, r * 0.42, r * 0.11, r * 0.11);
  } else if (k === "sumo") {
    ctx.strokeStyle = "#ffffff66"; ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.arc(i * r * 0.32, r * 0.55, r * 0.1, 0, Math.PI); ctx.stroke(); }
    tri("#f2c7a5", -r * 0.25, r * 0.1, r * 0.25, r * 0.1, 0, r * 0.45);
    box("#e3c35a", -r * 0.95, r * 0.28, r * 1.9, r * 0.12);
  } else if (k === "suitcase") {
    rbox(p.bag, r * 0.25, r * 0.05, r * 0.7, r * 0.8, r * 0.12);
    ctx.strokeStyle = "#1e2230"; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.45, r * 0.05); ctx.lineTo(r * 0.45, -r * 0.08); ctx.lineTo(r * 0.75, -r * 0.08); ctx.lineTo(r * 0.75, r * 0.05); ctx.stroke();
  }
  // head
  const hy = -r * (k === "sumo" ? 0.3 : 0.22), hr = r * (k === "sumo" ? 0.42 : 0.55);
  dot(p.skin, 0, hy, hr, hr);
  if (p.rigid) { ctx.strokeStyle = "#1e2230"; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.fillStyle = p.hair;
  ctx.beginPath(); ctx.arc(0, hy - hr * 0.02, hr * 1.04, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  if (k === "sumo") { dot(null, 0, hy - hr * 1.1, hr * 0.3, hr * 0.22); }
  if (k === "suitcase") { dot("#f0e2b6", 0, hy - hr * 0.55, hr * 1.35, hr * 0.42); ctx.strokeStyle = "#1e2230"; ctx.lineWidth = 2; ctx.stroke(); box("#d9534f", -hr * 0.7, hy - hr * 0.62, hr * 1.4, hr * 0.14); }
  // face
  const ey = hy + hr * 0.12, ex = hr * 0.36;
  ctx.fillStyle = "#2a2f3a"; ctx.strokeStyle = "#2a2f3a"; ctx.lineWidth = Math.max(1.4, r * 0.07); ctx.lineCap = "round";
  if (lp > 0.4 && p.state !== "eject") {
    ctx.fillStyle = "#ff8f8f" + (lp > 0.8 ? "cc" : "88");
    dot(null, -hr * 0.62, ey + hr * 0.3, hr * 0.2, hr * 0.12); dot(null, hr * 0.62, ey + hr * 0.3, hr * 0.2, hr * 0.12);
  }
  ctx.fillStyle = "#2a2f3a";
  const my = ey + hr * 0.42;
  if (p.state === "eject" || flying) {
    dot(null, -ex, ey, hr * 0.12, hr * 0.12); dot(null, ex, ey, hr * 0.12, hr * 0.12);
    dot(null, 0, my, hr * 0.14, hr * 0.17);
  } else if (lp > 0.75) {
    const e = hr * 0.16;
    ctx.beginPath(); ctx.moveTo(-ex - e, ey - e); ctx.lineTo(-ex + e * 0.6, ey); ctx.lineTo(-ex - e, ey + e);
    ctx.moveTo(ex + e, ey - e); ctx.lineTo(ex - e * 0.6, ey); ctx.lineTo(ex + e, ey + e); ctx.stroke();
    ctx.beginPath(); for (let i = 0; i <= 4; i++) ctx.lineTo(-hr * 0.26 + i * hr * 0.13, my + (i % 2 ? -1 : 1) * hr * 0.06); ctx.stroke();
  } else if (lp > 0.3) {
    ctx.beginPath(); ctx.moveTo(-ex - hr * 0.13, ey); ctx.lineTo(-ex + hr * 0.13, ey); ctx.moveTo(ex - hr * 0.13, ey); ctx.lineTo(ex + hr * 0.13, ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-hr * 0.14, my); ctx.lineTo(hr * 0.14, my); ctx.stroke();
  } else {
    if (p.blink > 0) { dot(null, -ex, ey, hr * 0.09, hr * 0.11); dot(null, ex, ey, hr * 0.09, hr * 0.11); }
    else { ctx.beginPath(); ctx.moveTo(-ex - hr * 0.1, ey); ctx.lineTo(-ex + hr * 0.1, ey); ctx.moveTo(ex - hr * 0.1, ey); ctx.lineTo(ex + hr * 0.1, ey); ctx.stroke(); }
    ctx.beginPath();
    if (p.sad) ctx.arc(0, my + hr * 0.14, hr * 0.15, Math.PI * 1.15, Math.PI * 1.85);
    else ctx.arc(0, my - hr * 0.1, hr * 0.15, Math.PI * 0.2, Math.PI * 0.8);
    ctx.stroke();
  }
  if (lp > 0.55 && p.state === "free") {
    ctx.fillStyle = "#7cc3ef";
    const sy = hy - hr * 0.5 + ((time * 1.6 + p.seed) % 1) * hr * 0.5;
    ctx.beginPath(); ctx.moveTo(hr * 0.95, sy - hr * 0.25); ctx.quadraticCurveTo(hr * 1.15, sy + hr * 0.05, hr * 0.95, sy + hr * 0.12); ctx.quadraticCurveTo(hr * 0.75, sy + hr * 0.05, hr * 0.95, sy - hr * 0.25); ctx.fill();
  }
}

// stuck in the door: the panels close on the rider's bag or coat hem (never on the rider), and the rider tugs at it.
// Drawn around the rider, who stands just below the door line; (gx, gy) is the door gap relative to the rider.
function drawPinched(p, time) {
  const r = p.r, gx = DOOR_CX - p.x, gy = p.pinchLine - p.y;
  const tug = (Math.sin(time * 18 + p.seed) * 0.5 + 0.5) * r * 0.12;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (p.pinchItem === "bag") {
    // strap from the rider's hands through the gap, bag dangling on the far side of the doors
    ctx.strokeStyle = "#2a2f3a"; ctx.lineWidth = Math.max(2, r * 0.12);
    ctx.beginPath(); ctx.moveTo(gx * 0.3, -r * 0.7 + tug); ctx.lineTo(gx, gy); ctx.stroke();
    ctx.save(); ctx.translate(gx, gy - 3); ctx.rotate(Math.sin(time * 9 + p.seed) * 0.14);
    rbox(p.bag, -r * 0.6, -r * 0.9, r * 1.2, r * 0.88, r * 0.16);
    ctx.strokeStyle = "#1e2230"; ctx.lineWidth = 2; ctx.stroke();
    box("#00000030", -r * 0.6, -r * 0.55, r * 1.2, r * 0.08);
    ctx.restore();
  } else {
    // coat tail running from the rider's back through the gap, flapping on the far side
    const fl = Math.sin(time * 16 + p.seed) * r * 0.14;
    ctx.fillStyle = p.body; ctx.strokeStyle = "#1e2230"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-r * 0.55, -r * 0.1 + tug); ctx.lineTo(gx - r * 0.1, gy); ctx.lineTo(gx + r * 0.1, gy); ctx.lineTo(r * 0.55, -r * 0.1 + tug); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(gx - r * 0.1, gy); ctx.lineTo(gx - r * 0.45 + fl, gy - r * 0.6); ctx.lineTo(gx + r * 0.4 + fl, gy - r * 0.52); ctx.lineTo(gx + r * 0.1, gy); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.save(); ctx.translate(0, tug); drawPerson(p, time); ctx.restore();
  // both hands grip the strap / coat and pull
  const hx = p.pinchItem === "bag" ? gx * 0.3 : 0, hy = -r * 0.72 + tug;
  ctx.strokeStyle = "#2a2f3a55"; ctx.lineWidth = 1.5;
  for (const sx of [-1, 1]) { dot(p.skin, hx + sx * r * 0.2, hy, r * 0.17, r * 0.15); ctx.stroke(); }
}

function drawPassenger(p, time) {
  const inCarFrame = p.inCar || p.state === "pinched" || p.state === "eject" || p.state === "fall";
  const x = p.x + (inCarFrame && p.state !== "eject" ? G.carX : 0);
  let y = p.y;
  const sp = Math.hypot(p.vx, p.vy);
  ctx.save();
  ctx.translate(x, y);
  if (p.state !== "eject" && p.state !== "fall") { dot("#4a3d2a24", 2, p.r * 0.18, p.r * 1.02, p.r * 0.92); }
  if (p.state === "pinched") {
    drawPinched(p, time);
    ctx.restore();
    return;
  }
  if (p.state === "eject") {
    // a little bigger mid-flight, as if high in the air
    const k = 1 + 0.3 * Math.sin(Math.PI * Math.min(1, p.et / p.eD));
    ctx.scale(k, k); ctx.rotate(p.rot);
  }
  // squash along the most compressed axis, stretch along fast motion, wobble after impacts
  let sAxis = p.sqA, sAmt = p.sqS * (p.rigid ? 0.25 : 1);
  if (sp > 220 && p.state === "free") { sAxis = Math.atan2(p.vy, p.vx) + Math.PI / 2; sAmt = Math.max(sAmt, Math.min(0.22, sp / 2600)); }
  const wob = p.wob * Math.sin(time * 34 + p.seed) * 0.12;
  let walk = 0;
  if (p.state === "queue") walk = Math.sin(p.walk) * 0.05;
  const sx = 1 - sAmt + wob + walk, sy = 1 + sAmt * 0.6 - wob - walk;
  ctx.rotate(sAxis); ctx.scale(sx, sy); ctx.rotate(-sAxis);
  if (p.state === "queue" && G.queue[0] === p && G.aim) {
    const a = Math.atan2(G.aim.dy, G.aim.dx), k = Math.hypot(G.aim.dx, G.aim.dy) / MAX_DRAG;
    ctx.rotate(a); ctx.scale(1 + k * 0.12, 1 - k * 0.12); ctx.rotate(-a);
  }
  drawPerson(p, time);
  ctx.restore();
}

function drawAim(time) {
  const p = G.queue[0];
  if (!p || !boardingPhase() || G.lives <= 0) return;
  let dx, dy, sp;
  if (G.aim) { const len = Math.hypot(G.aim.dx, G.aim.dy); if (len < 2) return; dx = G.aim.dx / len; dy = G.aim.dy / len; sp = speedFromDrag(len); }
  else if (G.kbShown && !G.ai) { dx = Math.cos(G.kbAim); dy = Math.sin(G.kbAim); sp = KEY_SPEED; }
  else return;
  const dist = sp * sp / (2 * FRICTION);
  ctx.fillStyle = "#e2574c";
  let ex = p.x, ey = p.y;
  for (let d = p.r + 6; d < dist; d += 12) {
    const x = p.x + dx * d, y = p.y + dy * d;
    if (G.walls.some(R => x > R.x0 - 4 && x < R.x1 + 4 && y > R.y0 - 4 && y < R.y1 + 4)) break;
    ctx.globalAlpha = 0.85 - 0.5 * d / dist;
    dot(null, x, y, 3.2, 3.2);
    ex = x; ey = y;
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "#e2574c"; ctx.lineWidth = 2.5; ell(ex, ey, p.r * 0.7, p.r * 0.7); ctx.stroke();
  if (G.aim) {
    const len = Math.hypot(G.aim.dx, G.aim.dy);
    ctx.strokeStyle = "#2a2f3a55"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + G.aim.dx, p.y + G.aim.dy); ctx.stroke();
    glove(p.x + G.aim.dx, p.y + G.aim.dy + 8, 0, 0.85);
    box("#2a2f3a", p.x - 26, p.y + p.r + 6, 52, 6);
    box("#e2574c", p.x - 26, p.y + p.r + 6, 52 * Math.min(1, len / MAX_DRAG), 6);
  }
}

function heart(x, y, s, filled) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.5, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35); ctx.closePath();
  ctx.fillStyle = filled ? "#e2574c" : "#c9c3b5"; ctx.fill();
}

function drawHUD(time) {
  const s = T();
  box("#fbf6ea", xL, yT, xR - xL, 78 - yT);
  box("#6fbf8e", xL, 74, xR - xL, 4);
  txt(s.score, 18, 16, 10, "#7b7f88", "left", 800);
  txt(String(G.score), 18, 38, 26, "#2a2f3a", "left");
  for (let i = 0; i < 3; i++) heart(170 + i * 26, 30, 11, i < G.lives);
  // pressure meter
  const px = 18, pw = 238, py = 52, ph = 14, pv = clamp(G.pressureShown, 0, 1.3) / 1.3;
  rbox("#e5dfd1", px, py, pw, ph, 7);
  ctx.save(); rrect(px, py, pw, ph, 7); ctx.clip();
  box("#f4c9c4", px + pw / 1.3, py, pw - pw / 1.3, ph);
  const red = G.pressure >= 1;
  ctx.fillStyle = red ? (Math.sin(time * 30) > 0 ? "#e2574c" : "#ff8a7a") : G.pressureShown > 0.7 ? "#f0a33a" : "#6fbf8e";
  ctx.fillRect(px, py, pw * pv, ph);
  ctx.restore();
  box("#2a2f3a", px + pw / 1.3 - 1, py - 2, 2, ph + 4);
  txt(s.pressure + " " + Math.round(G.pressureShown * 100) + "%", px + 6, py + ph / 2 + 0.5, 9.5, "#2a2f3a", "left", 900);
  if (G.redT > 0) {
    ctx.strokeStyle = "#e2574c"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(px + pw + 12, py + ph / 2, 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * G.redT); ctx.stroke();
  }
  // shove stamina
  const sx = 296, sw = 136;
  glove(sx - 8, py + 6, 0, 0.55);
  rbox("#e5dfd1", sx + 4, py, sw, ph, 7);
  if (G.stamina > 0.01) { rbox(G.shoving || G.shovingFar ? "#4a7fc1" : "#7fa6d9", sx + 4, py, Math.max(ph, sw * G.stamina), ph, 7); }
  txt(s.stamina, sx + 10, py + ph / 2 + 0.5, 9.5, "#ffffff", "left", 900);
}

function drawBubble(str, x, y, color) {
  ctx.font = "900 15px " + FONT;
  const w = ctx.measureText(str).width + 24;
  rbox("#00000025", x - w / 2 + 2, y - 15, w, 32, 16);
  rbox(color || "#ffffff", x - w / 2, y - 17, w, 32, 16);
  txt(str, x, y - 1, 15, "#2a2f3a");
}

function drawHints(time) {
  if (G.ai || G.mode !== "play" || G.lives <= 0) return;
  const s = T();
  if (G.hintFlick && G.phase === "board" && readyPassenger() && !G.aim) {
    if (!G.kbShown) {
      const k = (time * 0.9) % 1, hy = READY_Y - k * 90;
      ctx.globalAlpha = 1 - k * 0.6;
      glove(READY_X + 30, hy + 20, -0.3, 0.9);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#e2574c"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.setLineDash([2, 10]);
      ctx.beginPath(); ctx.moveTo(READY_X, READY_Y - 30); ctx.lineTo(READY_X, 380); ctx.stroke(); ctx.setLineDash([]);
    }
    // below the first queue rows so it never hides a passenger at the first stations
    drawBubble(G.kbUsed ? s.hintFlickKey : s.hintFlick, READY_X, 692);
  }
  if (G.hintShove && !G.usedShove && boardingPhase() && doorTime() < 3.4 && G.station <= 2) {
    const pulse = (time * 2) % 1;
    ctx.strokeStyle = "#4a7fc1"; ctx.lineWidth = 4; ctx.globalAlpha = 1 - pulse;
    ell(DOOR_CX, DOOR_LINE, 30 + pulse * 40, 18 + pulse * 26); ctx.stroke(); ctx.globalAlpha = 1;
    drawBubble(G.kbUsed ? s.hintShoveKey : s.hintShove, DOOR_CX, 370, "#dbe8ff");
  }
}

function drawEffects(time) {
  for (const q of G.particles) {
    const a = 1 - q.life / q.max;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = q.color;
    if (q.type === "puff") { dot(null, q.x, q.y, q.size * (1.4 - a * 0.6), q.size * (1.4 - a * 0.6)); }
    else if (q.type === "drop") { const dx = q.car ? G.carX : 0; dot(null, q.x + dx, q.y, q.size * 0.7, q.size); }
    else if (q.type === "star") { ctx.save(); ctx.translate(q.x + G.carX, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.size, -1.5, q.size * 2, 3); ctx.fillRect(-1.5, -q.size, 3, q.size * 2); ctx.restore(); }
    else { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.size / 2, -q.size / 4, q.size, q.size / (q.type === "shard" ? 1.5 : 2)); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  for (const q of G.popups) {
    const a = Math.min(1, (q.life - q.t) * 3);
    ctx.globalAlpha = a;
    ctx.lineWidth = 4; ctx.strokeStyle = "#ffffff"; ctx.lineJoin = "round";
    ctx.font = "900 " + q.size + "px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.strokeText(q.text, q.x, q.y); ctx.fillStyle = q.color; ctx.fillText(q.text, q.x, q.y);
  }
  ctx.globalAlpha = 1;
  for (const st of G.stamps) {
    const t = st.t, k = t < 0.18 ? 2.2 - 1.2 * easeOut(t / 0.18) : 1, a = t > 1.35 ? Math.max(0, 1 - (t - 1.35) / 0.35) : 1;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(st.x, st.y); ctx.rotate(st.rot); ctx.scale(k, k);
    ctx.font = "900 " + st.size + "px " + FONT;
    const w = ctx.measureText(st.text).width + 30, h = st.size * 1.35 + (st.sub ? 22 : 0);
    rbox("#fffdf6ee", -w / 2, -st.size * 0.68, w, h, 10);
    ctx.strokeStyle = st.color; ctx.lineWidth = 5; ctx.stroke();
    txt(st.text, 0, 0, st.size, st.color);
    if (st.sub) txt(st.sub, 0, st.size * 0.72, 18, "#2a2f3a");
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawBanner() {
  const b = G.banner;
  if (!b) return;
  const s = T(), t = b.t;
  const a = t < 0.3 ? t / 0.3 : t > BANNER_TIME - 0.5 ? Math.max(0, 1 - (t - (BANNER_TIME - 0.5)) / 0.5) : 1;
  const nm = STATION_NAMES[(b.n - 1) % STATION_NAMES.length];
  ctx.globalAlpha = a;
  const y = 270 + (1 - Math.min(1, t / 0.3)) * 20;
  rbox("#2a2f3ae0", 60, y - 44, 330, 70 + b.notes.length * 26, 14);
  txt(s.station(b.n), 225, y - 24, 13, "#9fe0b8", "center", 900);
  txt(lang === "ja" ? nm[0] : nm[1], 225, y + 2, 26, "#ffffff");
  b.notes.forEach((n, i) => txt(s[n], 225, y + 34 + i * 26, 15, "#f3c43a"));
  ctx.globalAlpha = 1;
}

// soft cushions on the platform for riders popped out of a window: pops in, squashes on landing, fades with its rider
function drawCushions(time) {
  for (const c of G.cushions) {
    const ap = Math.min(1, c.t / 0.25);
    let sx = easeOut(ap) * (1 + 0.18 * Math.sin(ap * Math.PI)), sy = sx;
    if (c.landT >= 0) { const k = Math.exp(-c.landT * 5) * Math.cos(c.landT * 24) * 0.22; sx += k; sy -= k; }
    ctx.save();
    ctx.globalAlpha = c.landT > 1.2 ? Math.max(0, 1 - (c.landT - 1.2) / 0.4) : 1;
    ctx.translate(c.x, c.y); ctx.scale(sx, sy);
    const w = c.w, h = c.h;
    rbox("#00000022", -w / 2 + 3, -h / 2 + 5, w, h, h * 0.42);
    rbox("#f39bb8", -w / 2, -h / 2, w, h, h * 0.42);
    rbox("#f9c3d5", -w / 2 + 6, -h / 2 + 4, w - 12, h * 0.4, h * 0.25);
    ctx.strokeStyle = "#d9789a"; ctx.lineWidth = 2; rrect(-w / 2, -h / 2, w, h, h * 0.42); ctx.stroke();
    ctx.fillStyle = "#d9789a";
    for (const tx of [-0.25, 0, 0.25]) dot(null, tx * w, h * 0.08, 2.4, 2);
    if (c.landT >= 0) {
      // the rider sits on the cushion after a small bounce
      const hop = c.landT < 0.35 ? Math.sin(c.landT / 0.35 * Math.PI) * 10 : 0;
      ctx.save(); ctx.scale(1 / sx, 1 / sy); ctx.translate(0, -6 - hop);
      drawPerson(c.rider, time);
      ctx.restore();
    }
    ctx.restore();
  }
}

function render(time) {
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  const sh = G.shake > 0.2 ? G.shake : 0;
  ctx.save();
  if (sh) ctx.translate(rand(-sh, sh), rand(-sh, sh));
  drawBackground(time);
  drawSignAndBoard(time);
  drawCushions(time);
  ctx.save(); ctx.translate(G.carX, 0); drawCar(time); ctx.restore();
  // riders inside first, then everyone on the platform in depth order
  const list = G.ps.filter(p => p.state !== "eject");
  list.sort((a, b) => (a.state === "pinched") - (b.state === "pinched") || a.y - b.y);
  const inside = list.filter(p => p.inCar || p.state === "fall");
  const outside = list.filter(p => !(p.inCar || p.state === "fall"));
  for (const p of inside) drawPassenger(p, time);
  ctx.save(); ctx.translate(G.carX, 0); drawStrapsAndLight(time); ctx.restore();
  drawOshiya(time);
  for (const p of outside) drawPassenger(p, time);
  if (G.phase === "pinch") { ctx.save(); ctx.translate(G.carX, 0); drawPanels(DOOR_Y0, DOOR_LINE); if (G.farDoor) drawPanels(ROOF_Y, FAR_LINE); ctx.restore(); }
  drawShoveHands(time);
  drawAim(time);
  drawBanner();
  drawHints(time);
  drawEffects(time);
  ctx.restore();
  drawHUD(time);
  for (const p of G.ps) if (p.state === "eject") drawPassenger(p, time);
}

// ---- loop
let lastNow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = lastNow ? (now - lastNow) / 1000 : 1 / 60;
  lastNow = now;
  dt = clamp(dt, 0, 1 / 30);
  const time = now / 1000;
  if (!G.paused && G.mode !== "over") {
    if (G.hitstop > 0) { G.hitstop -= dt; updateEffects(dt * 0.15); }
    else update(dt);
  } else if (G.mode === "over") updateEffects(dt);
  render(time);
}

// ---- boot
resize();
applyLang();
updateMuteIcon();
startRun(true);
if (DEMO) { ovTitle.hidden = true; G.mode = "play"; $("btnPause").hidden = true; }
requestAnimationFrame(frame);
})();
</script>
</body>
