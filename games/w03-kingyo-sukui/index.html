<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04121a">
<title>金魚すくい</title>
<style>
/* Festival night: teal water, lantern orange. One portrait play area centred on wide screens. */
:root {
  --night: #04121a;
  --deep: #0a2a36;
  --ink: #fff4e2;
  --dim: #9cc4c6;
  --lantern: #ffb04a;
  --red: #ff5b3a;
  --mint: #7ef0c0;
  --pink: #ff6fa3;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 15%, #173a40 0%, var(--night) 70%) var(--night);
  color: var(--ink); font-family: var(--font); overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: none;
}
#app {
  position: relative; height: 100%; aspect-ratio: 9 / 16; max-width: 100%; margin: 0 auto;
  background: var(--deep); overflow: hidden; touch-action: none; box-shadow: 0 0 80px #000c;
}
canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
.hud { position: absolute; inset: 0 0 auto 0; pointer-events: none; }
.score {
  position: absolute; left: 0; right: 0; top: calc(20px + env(safe-area-inset-top)); text-align: center;
  font-weight: 900; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 0 #000a, 0 0 18px #ffb04a66; transition: transform .12s;
}
.score.bump { transform: scale(1.18); }
.side { position: absolute; left: 12px; top: calc(24px + env(safe-area-inset-top)); }
.poi { display: flex; gap: 4px; min-height: 14px; }
.poi i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--pink); background: #fffbeecc; box-sizing: border-box; }
.best { margin-top: 7px; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--dim); text-shadow: 0 1px 0 #000a; }
.best b { color: var(--lantern); font-size: 14px; font-variant-numeric: tabular-nums; }
.tools { position: absolute; top: calc(22px + env(safe-area-inset-top)); right: 8px; display: flex; gap: 4px; z-index: 6; }
.tool {
  font: 800 11px/1 var(--font); color: var(--dim); background: #04121acc; min-width: 30px; height: 30px;
  border: 1px solid #ffffff2a; border-radius: 999px; padding: 0 8px; cursor: pointer; display: grid; place-items: center;
}
.tool:hover { color: var(--ink); }
.tool svg { width: 15px; height: 15px; display: block; }
.tool .x { display: none; }
.tool.muted .x { display: inline; }
.tool.muted .w { display: none; }
.tool:focus-visible, .btn:focus-visible { outline: 2px solid var(--lantern); outline-offset: 3px; }
.panel {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 0 16px; text-align: center; z-index: 4;
  background: radial-gradient(ellipse at 50% 48%, #04121a70 0%, #04121ad8 75%);
}
.kicker { font-size: 12px; font-weight: 800; letter-spacing: .3em; color: var(--mint); }
.panel h1 {
  font-weight: 900; margin: 0; font-size: clamp(30px, min(14vw, 9.5vh), 72px); line-height: 1.05; letter-spacing: .04em;
  color: var(--ink); text-shadow: 0 0 26px #ff8a3a88, 0 4px 0 #000a;
}
.panel h1 span { color: var(--red); }
.how { font-size: 15px; line-height: 1.8; color: var(--dim); max-width: 21em; margin: 0; font-weight: 700; text-shadow: 0 1px 0 #000a; }
.how em { font-style: normal; color: var(--ink); }
.btn {
  font: 900 20px/1 var(--font); color: #3a1206; background: var(--lantern); letter-spacing: .06em;
  border: 0; border-radius: 999px; padding: 16px 44px; cursor: pointer; box-shadow: 0 6px 0 #b86a1c, 0 0 30px #ffb04a55;
  transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b86a1c; }
.hint { font-size: 12px; color: var(--dim); max-width: 26em; line-height: 1.6; }
.credit { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); left: 0; right: 0; font-size: 11px; color: #9cc4c6aa; letter-spacing: .1em; }
.result-num { font-weight: 900; font-size: clamp(44px, 13vh, 84px); line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 0 30px #ffb04a66; }
.result-sub { font-size: 14px; color: var(--dim); font-weight: 700; }
.result-sub b { color: var(--lantern); }
.newbest { color: var(--red); font-size: 16px; font-weight: 900; letter-spacing: .14em; }
.tip {
  position: absolute; left: 16px; right: 16px; bottom: calc(26px + env(safe-area-inset-bottom)); text-align: center;
  font-size: 15px; font-weight: 900; color: var(--ink); pointer-events: none;
  text-shadow: 0 2px 0 #000, 0 0 10px #000; animation: bob 1s ease-in-out infinite alternate;
}
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
@media (max-height: 520px) {
  .panel { gap: 8px; padding: 0 10px; } .kicker { letter-spacing: .12em; } .panel h1 { font-size: min(14vw, 8.8vh); }
  .how { font-size: 13px; line-height: 1.5; } .btn { padding: 12px 34px; } .hint { font-size: 11px; } .credit { bottom: 4px; }
}
@media (prefers-reduced-motion: reduce) { .btn, .score { transition: none; } .tip { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="goldfish tub"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="score" id="score">0</div>
    <div class="side">
      <div class="poi" id="poiIcons"></div>
      <div class="best"><span data-s="best"></span> <b id="best">0</b></div>

  <div class="panel" id="title">
    <div class="kicker">WEEKLY MINI GAME #03</div>

  <div class="panel" id="overPanel" hidden>
    <div class="kicker" data-s="overKicker"></div>

    <button class="tool" id="muteBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
    <button class="tool" id="pauseBtn" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
  </div>
</div>
<script>
(() => {
"use strict";
window.Platform = window.Platform || { gameplayStart() {}, gameplayStop() {}, happytime() {}, gameOver(score) {} };
const plat = (name, arg) => { try { window.Platform[name](arg); } catch (e) { /* adapter errors never break the game */ } };

// ---------- strings ----------
const STR = {
  ja: {
    docTitle: "金魚すくい",
    logo: "金魚<span>すくい</span>",
    how: "<em>長押し</em>でポイを沈めて、<em>はなして</em>すくう。<br>リングがあふれたら…破れる！",
    start: "あそぶ",
    controls: "キーボード：矢印で移動・スペース長押しで沈める・Shiftでゆっくり",
    best: "ベスト",
    paused: "ひとやすみ中",
    resume: "つづける",
    resumeHint: "スペース / Enter でも再開",
    overKicker: "ポイが ぜんぶ 破れた",
    newBest: "ベスト更新！",
    retry: "もういちど",
    retryHint: "スペース / Enter ですぐリトライ",
    result: (n, m) => `すくった金魚 <b>${n}</b>匹 ・ 最大 <b>×${m}</b>`,
    tipPress: "金魚の上で 長押しして 沈める",
    tipRelease: "はなして すくい上げる！",
    tipRing: "リングが赤く光ったら 破れる寸前！",
    tipSlow: "速く動かすと 紙が弱るよ",
    aim: "ここ！",
    unit: "匹", bowlUnit: "匹",
    m2: "ダブル!", m4: "大漁!", m8: "超大漁!!",
    golden: "金の魚!", goldenIn: "金の魚が来た!", restock: "おかわり!", restockSub: "群れが入ったぞ",
    demekin: "でめきん 登場", demekinSub: "重さ3 ・ 速い ポイ から逃げる",
    ranchu: "らんちゅう 登場", ranchuSub: "重さ5 ・ はや魚にも注意",
    torn: "破れた!", melted: "紙がとけた…", spare: "ポイ +1",
    langBtn: "EN", langLabel: "English", sound: "サウンド", pause: "一時停止"
  },
  en: {
    docTitle: "Goldfish Scoop",
    logo: "Goldfish <span>Scoop</span>",
    how: "<em>Hold</em> to dip the paper scoop, <em>release</em> to lift.<br>Overfill the ring and it tears!",
    start: "PLAY",
    controls: "Keyboard: arrows move, hold Space to dip, Shift for slow moves",
    best: "BEST",
    paused: "PAUSED",
    resume: "RESUME",
    resumeHint: "or press Space / Enter",
    overKicker: "ALL SCOOPS TORN",
    newBest: "NEW BEST!",
    retry: "AGAIN",
    retryHint: "Space / Enter to retry",
    result: (n, m) => `<b>${n}</b> fish caught · best <b>×${m}</b>`,
    tipPress: "Hold over the fish to dip",
    tipRelease: "Release to scoop!",
    tipRing: "Red flashing ring = about to tear!",
    tipSlow: "Fast moves weaken the paper",
    aim: "HERE!",
    unit: "", bowlUnit: " fish",
    m2: "DOUBLE!", m4: "BIG HAUL!", m8: "MEGA HAUL!!",
    golden: "GOLDEN!", goldenIn: "A golden fish!", restock: "RESTOCK!", restockSub: "a whole school poured in",
    demekin: "Black moor!", demekinSub: "weight 3 · fish flee fast scoops",
    ranchu: "Lionhead!", ranchuSub: "weight 5 · watch the darters",
    torn: "TORN!", melted: "Paper dissolved…", spare: "+1 SCOOP",
    langBtn: "JA", langLabel: "日本語", sound: "Sound", pause: "Pause"
  }
};

// ---------- small utils ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const lerp = (a, b, t) => a + (b - a) * t;
const multFor = n => (n >= 4 ? 8 : n === 3 ? 4 : n === 2 ? 2 : 1);
const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
};
const KEY = { best: "kingyo-sukui.best", mute: "kingyo-sukui.mute", lang: "kingyo-sukui.lang" };
const $ = id => document.getElementById(id);
const DEMO = new URLSearchParams(location.search).get("demo") === "1";
const motionQuery = matchMedia("(prefers-reduced-motion: reduce)");

// ---------- tuning ----------
const VW = 360;            // virtual width; height follows the window
const R = 34;              // paper radius
const SLOW = 110;          // drag speed (px/s) above which the paper weakens faster and fish flee
const FLEE_R = 82;
const DIP_COST = 4;         // every dip soaks the paper a little, so blind tap-spamming wears it out
const TOUCH_LIFT = 22;     // touch: poi sits a little above the finger; the touched point stays inside the paper
const HANDLE_ANG = 0.85;
const WARN = 0.8;          // load past 80% of the ring: ring pulses red and the poi trembles ("lift now!" reads with the sound off)
// Fish are drawn 1.3x their physics size (readable on phones). Schooling spacing, flee/dart radii and the
// centre-on-paper scoop test stay in physics units, so catch sizes and balance are unchanged.
const FISH_DRAW = 1.3;
const TYPES = {
  red:     { weight: 1, points: 1,  len: [20, 25], wid: 0.25, cruise: 26, tail: 0.6,  fancy: false },
  dart:    { weight: 2, points: 2,  len: [22, 25], wid: 0.2,  cruise: 32, tail: 0.5,  fancy: false },
  demekin: { weight: 3, points: 3,  len: [24, 27], wid: 0.3,  cruise: 20, tail: 0.85, fancy: true },
  ranchu:  { weight: 5, points: 5,  len: [28, 31], wid: 0.4,  cruise: 15, tail: 0.5,  fancy: true },
  golden:  { weight: 4, points: 10, len: [26, 28], wid: 0.27, cruise: 40, tail: 0.75, fancy: true }
};
const speedMul = t => (t < 30 ? 1 : t < 60 ? 1.2 : 1.3 + Math.min(0.25, (t - 60) / 240));
const drainRate = t => (t < 60 ? 6 : t < 120 ? 8 : Math.min(14, 8 + (t - 120) / 20));
const popTarget = t => (t < 30 ? 14 : t < 60 ? 16 : 18);

// ---------- DOM ----------
const app = $("app"), canvas = $("c"), ctx = canvas.getContext("2d");
const el = {
  hud: $("hud"), score: $("score"), best: $("best"), poiIcons: $("poiIcons"), tip: $("tip"),
  title: $("title"), pause: $("pausePanel"), over: $("overPanel"), final: $("final"), newBest: $("newBest"),
  resultSub: $("resultSub"), start: $("startBtn"), resume: $("resumeBtn"), retry: $("retryBtn"),
  lang: $("langBtn"), mute: $("muteBtn"), pauseBtn: $("pauseBtn"), logo: $("logo"), how: $("how")
};

let lang = store.get(KEY.lang);
if (lang !== "ja" && lang !== "en") lang = (navigator.language || "ja").toLowerCase().startsWith("ja") ? "ja" : "en";
const S = () => STR[lang];
function applyLang() {
  const s = S();
  document.documentElement.lang = lang;
  document.title = s.docTitle;
  document.querySelectorAll("[data-s]").forEach(n => { n.textContent = s[n.dataset.s]; });
  el.logo.innerHTML = s.logo;
  el.how.innerHTML = s.how;
  el.lang.textContent = s.langBtn;
  el.lang.setAttribute("aria-label", s.langLabel);
  el.mute.setAttribute("aria-label", s.sound);
  el.pauseBtn.setAttribute("aria-label", s.pause);
  if (state === "over") fillResult();
  const shown = tipKey;
  tipKey = null;
  setTip(shown);
}

// ---------- sound (WebAudio synthesis, created on first gesture) ----------
const Sound = (() => {
  let ac = null, out = null, nbuf = null;
  let muted = store.get(KEY.mute) === "1";
  function init() {
    if (ac) { if (ac.state === "suspended") ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { return; }
    out = ac.createGain();
    out.gain.value = muted ? 0 : 0.6;
    const comp = ac.createDynamicsCompressor();
    out.connect(comp); comp.connect(ac.destination);
    nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = nbuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const ok = () => ac && !muted && ac.state === "running";
  function env(g, t, vol, a, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(f, d, o = {}) {
    if (!ok()) return;
    const t = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    env(g, t, o.vol || 0.2, o.a || 0.005, d);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + d + 0.05);
  }
  function noise(d, o = {}) {
    if (!ok()) return;
    const t = ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource(), flt = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = nbuf; src.loop = true;
    flt.type = o.type || "bandpass";
    flt.frequency.setValueAtTime(o.f || 1000, t);
    if (o.to) flt.frequency.exponentialRampToValueAtTime(o.to, t + d);
    flt.Q.value = o.q || 1;
    env(g, t, o.vol || 0.2, o.a || 0.005, d);
    src.connect(flt); flt.connect(g); g.connect(out);
    src.start(t, Math.random() * 0.5); src.stop(t + d + 0.05);
  }
  const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
  return {
    init,
    get muted() { return muted; },
    setMuted(m) { muted = m; if (out) out.gain.value = m ? 0 : 0.6; store.set(KEY.mute, m ? "1" : "0"); },
    dip() { noise(0.2, { f: 1200, to: 260, q: 1.2, vol: 0.32 }); tone(560, 0.12, { to: 170, vol: 0.18 }); },
    lift() { noise(0.14, { type: "highpass", f: 1800, vol: 0.12 }); tone(320, 0.1, { to: 760, vol: 0.08 }); },
    enter(n) { tone(PENTA[Math.min(n, 9)] * 0.5, 0.08, { type: "triangle", vol: 0.07 }); },
    creak() { tone(110, 0.22, { type: "sawtooth", to: 80, vol: 0.05 }); noise(0.18, { f: 400, q: 6, vol: 0.06 }); },
    plop(i) { const f = PENTA[Math.min(i, 9)]; tone(f, 0.14, { to: f * 1.5, vol: 0.16 }); noise(0.06, { f: 2600, q: 2, vol: 0.06 }); },
    mult(m) {
      const n = m >= 8 ? 5 : m >= 4 ? 3 : 2;
      for (let i = 0; i < n; i++) tone(PENTA[3 + i], 0.35, { type: "triangle", vol: 0.12, delay: i * 0.07 });
      if (m >= 8) tone(2093, 0.8, { type: "sine", vol: 0.08, delay: 0.35 });
    },
    goldIn() { for (let i = 0; i < 7; i++) tone(PENTA[3 + ((i * 3) % 7)] * 2, 0.25, { type: "triangle", vol: 0.06, delay: i * 0.06 }); },
    goldCatch() { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.5, { type: "triangle", vol: 0.12, delay: i * 0.05 })); },
    tear() {
      for (let i = 0; i < 6; i++) noise(0.035, { f: 2400 + Math.random() * 1600, q: 0.8, vol: 0.32, delay: i * 0.03 + Math.random() * 0.01 });
      tone(140, 0.35, { to: 50, vol: 0.32 });
      noise(0.4, { type: "lowpass", f: 900, to: 200, vol: 0.2, delay: 0.25 });
    },
    melt() { noise(0.6, { type: "lowpass", f: 1500, to: 150, vol: 0.18 }); tone(300, 0.5, { to: 120, vol: 0.06 }); },
    splash() { noise(0.12, { f: 1600, to: 500, vol: 0.12 }); },
    spare() { tone(880, 0.15, { type: "triangle", vol: 0.12 }); tone(1320, 0.3, { type: "triangle", vol: 0.12, delay: 0.1 }); },
    restock() {
      tone(90, 0.35, { to: 48, vol: 0.5 }); noise(0.15, { type: "lowpass", f: 300, vol: 0.3 });
      tone(90, 0.3, { to: 48, vol: 0.35, delay: 0.22 });
      for (let i = 0; i < 6; i++) noise(0.1, { f: 1400, to: 500, vol: 0.1, delay: 0.3 + i * 0.07 });
    },
    phase() { [659, 784, 1047].forEach((f, i) => tone(f, 0.4, { type: "triangle", vol: 0.08, delay: i * 0.12 })); },
    over() { [784, 659, 523, 392].forEach((f, i) => tone(f, 0.5, { type: "triangle", vol: 0.12, delay: i * 0.16 })); }
  };
})();

// ---------- layout ----------
let VH = 640, scale = 1, dpr = 1;
const WATER = { x0: 0, y0: 0, x1: 0, y1: 0, r: 20 };
const TUB = { x: 0, y: 0, w: 0, h: 0, r: 30 };
const BOWL = { x: 0, y: 0, r: 26, wob: 0, fish: [] };
let LANTERNS = [];
const bg = document.createElement("canvas");

function rrect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function layout() {
  const cw = app.clientWidth || 360, ch = app.clientHeight || 640;
  scale = cw / VW;
  VH = ch / scale;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  const top = 124;
  Object.assign(TUB, { x: 6, y: top, w: VW - 12, h: VH - top - 8, r: 30 });
  const rim = 13;
  Object.assign(WATER, { x0: TUB.x + rim, y0: TUB.y + rim, x1: TUB.x + TUB.w - rim, y1: TUB.y + TUB.h - rim, r: 20 });
  Object.assign(BOWL, { x: VW - 48, y: 86 });
  LANTERNS = [44, 112, 180, 248].map((x, i) => ({ x, y: 64 + Math.sin((x / VW) * Math.PI) * 10 + 15, hue: i % 2 }));
  buildBg();
  if (run) for (const f of run.fish) { f.x = clamp(f.x, WATER.x0 + 6, WATER.x1 - 6); f.y = clamp(f.y, WATER.y0 + 6, WATER.y1 - 6); }
}

function seigaiha(c, x0, y0, x1, y1, r) {
  const rowH = r * 0.5;
  for (let j = 0, y = y0 - r; y < y1 + r; j++, y += rowH) {
    const off = j % 2 ? r : 0;
    for (let x = x0 - 2 * r + off; x < x1 + 2 * r; x += 2 * r) {
      c.fillStyle = "#1c4f8c";
      c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
      c.strokeStyle = "rgba(196,226,255,0.6)";
      c.lineWidth = 0.7;
      for (let k = 0; k < 4; k++) { c.beginPath(); c.arc(x, y, r * (0.9 - k * 0.22), Math.PI, 0); c.stroke(); }
    }
  }
}

function buildBg() {
  bg.width = canvas.width; bg.height = canvas.height;
  const c = bg.getContext("2d");
  const k = scale * dpr;
  c.setTransform(k, 0, 0, k, 0, 0);
  // night sky band
  let g = c.createLinearGradient(0, 0, 0, TUB.y + 20);
  g.addColorStop(0, "#030c14"); g.addColorStop(1, "#0d2a33");
  c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  g = c.createRadialGradient(VW / 2, 70, 10, VW / 2, 70, 220);
  g.addColorStop(0, "rgba(255,150,70,0.18)"); g.addColorStop(1, "rgba(255,150,70,0)");
  c.fillStyle = g; c.fillRect(0, 0, VW, TUB.y + 20);
  // stall awning
  for (let i = 0, x = -6; x < VW + 24; i++, x += 24) {
    c.fillStyle = i % 2 ? "#e9dcc6" : "#b02d38";
    c.beginPath(); c.rect(x, -2, 24, 12); c.arc(x + 12, 10, 12, 0, Math.PI); c.fill();
  }
  c.fillStyle = "rgba(0,0,0,0.28)"; c.fillRect(0, 0, VW, 24);
  // lantern string
  c.strokeStyle = "rgba(20,10,8,0.9)"; c.lineWidth = 1.2;
  c.beginPath(); c.moveTo(0, 60);
  c.quadraticCurveTo(VW * 0.4, 86, VW * 0.8, 62); c.stroke();
  for (const L of LANTERNS) drawLantern(c, L);
  // tub
  rrect(c, TUB.x, TUB.y, TUB.w, TUB.h, TUB.r);
  c.fillStyle = "#0b2140"; c.fill();
  c.save();
  rrect(c, TUB.x + 1.5, TUB.y + 1.5, TUB.w - 3, TUB.h - 3, TUB.r - 1);
  c.clip();
  seigaiha(c, TUB.x, TUB.y, TUB.x + TUB.w, TUB.y + TUB.h, 6.5);
  c.restore();
  c.lineWidth = 2; c.strokeStyle = "#071528";
  rrect(c, TUB.x + 1, TUB.y + 1, TUB.w - 2, TUB.h - 2, TUB.r); c.stroke();
  // inner lip
  rrect(c, WATER.x0 - 3, WATER.y0 - 3, WATER.x1 - WATER.x0 + 6, WATER.y1 - WATER.y0 + 6, WATER.r + 3);
  c.fillStyle = "#d9ecf5"; c.fill();
  // water
  rrect(c, WATER.x0, WATER.y0, WATER.x1 - WATER.x0, WATER.y1 - WATER.y0, WATER.r);
  g = c.createLinearGradient(0, WATER.y0, 0, WATER.y1);
  g.addColorStop(0, "#15606a"); g.addColorStop(0.45, "#0d4553"); g.addColorStop(1, "#08283a");
  c.fillStyle = g; c.fill();
  c.save(); c.clip();
  g = c.createRadialGradient(VW / 2, (WATER.y0 + WATER.y1) / 2, 60, VW / 2, (WATER.y0 + WATER.y1) / 2, VH * 0.6);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,10,20,0.45)");
  c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  g = c.createLinearGradient(0, WATER.y0, 0, WATER.y0 + 90);
  g.addColorStop(0, "rgba(255,160,70,0.2)"); g.addColorStop(1, "rgba(255,160,70,0)");
  c.fillStyle = g; c.fillRect(0, WATER.y0, VW, 90);
  // inner wall shade
  c.lineWidth = 10; c.strokeStyle = "rgba(0,20,30,0.35)";
  rrect(c, WATER.x0, WATER.y0, WATER.x1 - WATER.x0, WATER.y1 - WATER.y0, WATER.r); c.stroke();
  c.restore();
}

function drawLantern(c, L) {
  const { x, y } = L;
  c.strokeStyle = "rgba(20,10,8,0.9)"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x, y - 24); c.lineTo(x, y - 14); c.stroke();
  let g = c.createRadialGradient(x, y, 4, x, y, 44);
  g.addColorStop(0, "rgba(255,170,80,0.32)"); g.addColorStop(1, "rgba(255,170,80,0)");
  c.fillStyle = g; c.fillRect(x - 44, y - 44, 88, 88);
  g = c.createRadialGradient(x - 3, y - 3, 1, x, y, 15);
  if (L.hue) { g.addColorStop(0, "#fff0c0"); g.addColorStop(0.45, "#ffb04a"); g.addColorStop(1, "#c4531c"); }
  else { g.addColorStop(0, "#ffe2b0"); g.addColorStop(0.45, "#ff6a3a"); g.addColorStop(1, "#a8231c"); }
  c.fillStyle = g;
  c.beginPath(); c.ellipse(x, y, 12, 14, 0, 0, TAU); c.fill();
  c.strokeStyle = "rgba(110,30,10,0.35)"; c.lineWidth = 0.8;
  for (let i = -2; i <= 2; i++) { c.beginPath(); c.ellipse(x, y + i * 4.6, 12 * Math.cos(Math.asin(clamp((i * 4.6) / 14, -0.99, 0.99))), 1.6, 0, 0, Math.PI); c.stroke(); }
  c.fillStyle = "#1a0d08";
  c.fillRect(x - 6.5, y - 16, 13, 4);
  c.fillRect(x - 6.5, y + 12, 13, 4);
}

// ---------- state ----------
let state = "title";   // title | play | paused | over
let run = null;
let best = parseInt(store.get(KEY.best), 10) || 0;
let clock = 0;
let shake = 0, slowT = 0, hitStop = 0;
let particles = [], ripples = [], popups = [], banners = [];
let overAt = 0;
let tipKey = null;
const input = { x: VW / 2, y: 500, ptrDown: false, ptrId: null, keyDown: false, keys: {}, shift: false, tapPending: false };
const ai = { px: 0, py: 0, vx: 0, vy: 0, down: false, timer: 0, wait: 0, under: 0, greedy: false, goal: 0, plan: null, slide: null, sinceTear: 0 };

// ---------- fish ----------
function makeSkin(type) {
  const P = (n, cols, ry = 0.5) => Array.from({ length: n }, () => ({ x: rnd(-0.3, 0.38), y: rnd(-0.9, 0.9), rx: rnd(0.1, 0.2), ry: rnd(ry, 1.1), c: pick(cols) }));
  if (type === "red") {
    const v = Math.random();
    if (v < 0.55) return { a: "#ff6b3d", b: "#d8331b", fin: "rgba(255,110,70,0.72)", patches: Math.random() < 0.3 ? P(1, ["#fff3e6"]) : [] };
    if (v < 0.8) return { a: "#ffa449", b: "#e9661c", fin: "rgba(255,170,90,0.7)", patches: [] };
    return { a: "#fff8f0", b: "#e6d9cf", fin: "rgba(255,236,226,0.7)", patches: P(2 + ((Math.random() * 2) | 0), ["#f2462a", "#ff5a32"]) };
  }
  if (type === "dart") return { a: "#fbf6ee", b: "#d8cec4", fin: "rgba(250,240,232,0.65)", patches: P(5, ["#f2462a", "#1b1b22", "#ff9a3a"], 0.3) };
  if (type === "demekin") return { a: "#3d3d58", b: "#0b0b12", fin: "rgba(40,40,72,0.8)", patches: [], bigEyes: true };
  if (type === "ranchu") {
    return Math.random() < 0.6
      ? { a: "#ff8a3a", b: "#d9441a", fin: "rgba(255,130,70,0.7)", patches: [], wen: "#ffc27a" }
      : { a: "#fff4ea", b: "#e2d4c8", fin: "rgba(255,240,230,0.7)", patches: P(2, ["#f04a2a"]), wen: "#ff6a3a" };
  }
  return { a: "#fff3a6", b: "#e3a312", fin: "rgba(255,214,100,0.82)", patches: [], gold: true };
}

let fishId = 0;
function makeFish(type, x, y, ang, appear = 0) {
  const d = TYPES[type];
  const len = rnd(d.len[0], d.len[1]);
  const cruise = d.cruise * rnd(0.85, 1.15);
  return {
    id: fishId++, type, x, y, vx: Math.cos(ang) * cruise * 0.7, vy: Math.sin(ang) * cruise * 0.7, angle: ang,
    len, w: len * d.wid, cruise, weight: d.weight, points: d.points, phase: Math.random() * TAU, wander: ang,
    appear, leaving: false, life: type === "golden" ? 12 : Infinity, school: 0, burst: 0, burstCd: 0, fear: 0,
    flop: 0, onPaper: false, sparkT: 0, skin: makeSkin(type)
  };
}

function edgeSpot(margin = 28) {
  const side = (Math.random() * 4) | 0;
  const { x0, y0, x1, y1 } = WATER;
  let x, y;
  if (side === 0) { x = x0 + margin; y = rnd(y0 + 60, y1 - 60); }
  else if (side === 1) { x = x1 - margin; y = rnd(y0 + 60, y1 - 60); }
  else if (side === 2) { x = rnd(x0 + 60, x1 - 60); y = y0 + margin; }
  else { x = rnd(x0 + 60, x1 - 60); y = y1 - margin; }
  const ang = Math.atan2((y0 + y1) / 2 - y, (x0 + x1) / 2 - x) + rnd(-0.6, 0.6);
  return { x, y, ang };
}

function spawnFish(type, quiet) {
  const s = edgeSpot();
  const f = makeFish(type, s.x, s.y, s.ang, 0);
  run.fish.push(f);
  if (!quiet) { addRipple(s.x, s.y, 26, 0.5); splashDrops(s.x, s.y, 5, 50); }
  return f;
}

function pickType() {
  const r = Math.random(), t = run.t;
  if (t < 30) return "red";
  if (t < 60) return r < 0.75 ? "red" : "demekin";
  return r < 0.5 ? "red" : r < 0.7 ? "demekin" : r < 0.9 ? "dart" : "ranchu";
}

function countFish() { let n = 0; for (const f of run.fish) if (!f.leaving && f.type !== "golden") n++; return n; }

function spawnGolden() {
  if (run.fish.some(f => f.type === "golden")) return;
  const f = spawnFish("golden", true);
  f.appear = 0;
  addRipple(f.x, f.y, 40, 0.7);
  for (let i = 0; i < 14; i++) addSpark(f.x + rnd(-20, 20), f.y + rnd(-20, 20));
  banner(S().goldenIn, "", "#ffd36e");
  if (run.sfx) Sound.goldIn();
}

function restock() {
  const s = edgeSpot(40);
  const n = 10;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), d = rnd(0, 22);
    const f = makeFish(Math.random() < 0.85 || run.t < 60 ? "red" : "dart", s.x + Math.cos(a) * d, s.y + Math.sin(a) * d, s.ang, 0.2);
    f.vx = Math.cos(s.ang) * 30; f.vy = Math.sin(s.ang) * 30;
    f.school = 7;
    run.fish.push(f);
  }
  for (let i = 0; i < 4; i++) addRipple(s.x + rnd(-15, 15), s.y + rnd(-15, 15), 40 + i * 12, 0.6);
  splashDrops(s.x, s.y, 18, 90);
  banner(S().restock, S().restockSub, "#7ef0c0");
  addShake(3);
  if (run.sfx) Sound.restock();
}

function schedule(dt) {
  const t = run.t;
  if (run.phase < 1 && t >= 30) {
    run.phase = 1;
    banner(S().demekin, S().demekinSub, "#c7c9ff");
    for (let i = 0; i < 3; i++) spawnFish("demekin");
    if (run.sfx) Sound.phase();
  }
  if (run.phase < 2 && t >= 60) {
    run.phase = 2;
    banner(S().ranchu, S().ranchuSub, "#ffb04a");
    for (let i = 0; i < 2; i++) spawnFish("ranchu");
    for (let i = 0; i < 3; i++) spawnFish("dart");
    if (run.sfx) Sound.phase();
  }
  if (t >= run.nextGolden) { run.nextGolden += 40; spawnGolden(); }
  if (t >= run.nextRestock) { run.nextRestock += 45; if (countFish() < popTarget(t) + 6) restock(); }
  run.spawnT -= dt;
  const missing = popTarget(t) - countFish();
  if (run.spawnT <= 0 && missing > 0) { run.spawnT = missing > 5 ? 0.45 : missing > 2 ? 0.8 : 1.3; spawnFish(pickType()); }
}

function updateFish(dt) {
  const fish = run.fish, t = run.t, sm = speedMul(t), fleeOn = t >= 30;
  const p = run.poi, wet = p && p.state === "water";
  const fast = wet && p.speed > SLOW;
  const { x0, y0, x1, y1 } = WATER;
  for (let i = fish.length - 1; i >= 0; i--) {
    const f = fish[i];
    f.phase += dt * (4 + Math.hypot(f.vx, f.vy) * 0.16);
    if (f.life !== Infinity) {
      f.life -= dt;
      f.sparkT -= dt;
      if (f.sparkT <= 0 && f.appear > 0.3) { f.sparkT = 0.12; addSpark(f.x + rnd(-10, 10), f.y + rnd(-8, 8)); }
      if (f.life <= 0 && !f.leaving) f.leaving = true;
    }
    if (f.leaving) { f.appear -= dt / 1.2; if (f.appear <= 0) { fish.splice(i, 1); continue; } }
    else if (f.appear < 1) f.appear = Math.min(1, f.appear + dt / 0.7);
    if (f.flop > 0) { f.flop -= dt; if (f.flop <= 0) splashBack(f); continue; }

    const cr = f.cruise * sm;
    let ax = 0, ay = 0, cnt = 0, avx = 0, avy = 0, cx = 0, cy = 0, sx = 0, sy = 0;
    for (const o of fish) {
      if (o === f || o.flop > 0) continue;
      const dx = o.x - f.x, dy = o.y - f.y, d2 = dx * dx + dy * dy;
      if (d2 > 3600) continue;
      const d = Math.sqrt(d2) || 0.01;
      cnt++; avx += o.vx; avy += o.vy; cx += o.x; cy += o.y;
      const minD = (f.len + o.len) * 0.55;
      if (d < minD) { const s = (minD - d) / minD; sx -= (dx / d) * s; sy -= (dy / d) * s; }
    }
    if (cnt && f.type !== "golden") {
      ax += (avx / cnt - f.vx) * 0.6;
      ay += (avy / cnt - f.vy) * 0.6;
      const coh = f.school > 0 ? 2.2 : 0.45;
      ax += (cx / cnt - f.x) * coh;
      ay += (cy / cnt - f.y) * coh;
    }
    if (f.school > 0) f.school -= dt;
    ax += sx * 150; ay += sy * 150;
    f.wander += (Math.random() - 0.5) * 3.2 * dt;
    ax += Math.cos(f.wander) * cr * 0.8;
    ay += Math.sin(f.wander) * cr * 0.8;
    const M = 38;
    const dl = f.x - x0, dr = x1 - f.x, dtp = f.y - y0, db = y1 - f.y;
    if (dl < M) ax += (1 - dl / M) ** 2 * 280;
    if (dr < M) ax -= (1 - dr / M) ** 2 * 280;
    if (dtp < M) ay += (1 - dtp / M) ** 2 * 280;
    if (db < M) ay -= (1 - db / M) ** 2 * 280;
    if (f.burstCd > 0) f.burstCd -= dt;
    if (f.burst > 0) f.burst -= dt;
    if (f.fear > 0) f.fear -= dt;
    if (wet) {
      const dx = f.x - p.x, dy = f.y - p.y, d = Math.hypot(dx, dy) || 1;
      if (fleeOn && fast && d < FLEE_R) {
        const s = (1 - d / FLEE_R) * 520 * Math.min(2, p.speed / SLOW);
        ax += (dx / d) * s; ay += (dy / d) * s;
        f.fear = 0.6;
      }
      if (f.type === "dart" && d < 66 && f.burstCd <= 0) {
        f.burst = 0.45; f.burstCd = 2.4;
        const a = Math.atan2(dy, dx) + rnd(-0.5, 0.5);
        f.vx = Math.cos(a) * 170 * sm; f.vy = Math.sin(a) * 170 * sm;
        addRipple(f.x, f.y, 14, 0.4);
      }
    }
    f.vx += ax * dt; f.vy += ay * dt;
    const sp = Math.hypot(f.vx, f.vy) || 0.001;
    let target = cr;
    if (f.fear > 0) target = cr * 3.2;
    if (f.burst > 0) target = 170 * sm;
    const ease = f.fear > 0 || f.burst > 0 ? 6 : 1.4;
    const ns = clamp(sp + (target - sp) * Math.min(1, dt * ease), cr * 0.35, Math.max(target * 1.4, cr * 1.8));
    f.vx *= ns / sp; f.vy *= ns / sp;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < x0 + 5) { f.x = x0 + 5; f.vx = Math.abs(f.vx); }
    if (f.x > x1 - 5) { f.x = x1 - 5; f.vx = -Math.abs(f.vx); }
    if (f.y < y0 + 5) { f.y = y0 + 5; f.vy = Math.abs(f.vy); }
    if (f.y > y1 - 5) { f.y = y1 - 5; f.vy = -Math.abs(f.vy); }
    const want = Math.atan2(f.vy, f.vx);
    let diff = want - f.angle;
    diff = ((diff + Math.PI) % TAU + TAU) % TAU - Math.PI;
    f.angle += clamp(diff, -8 * dt, 8 * dt);
  }
}

function splashBack(f) {
  const a = rnd(0, TAU);
  f.vx = Math.cos(a) * 110; f.vy = Math.sin(a) * 110;
  f.fear = 0.5;
  addRipple(f.x, f.y, 30, 0.7);
  splashDrops(f.x, f.y, 6, 70);
  if (run.sfx) Sound.splash();
}

// ---------- poi ----------
function newPoi() {
  run.poi = {
    x: VW / 2, y: WATER.y1 - 110, state: "new", t: 0, dur: 100, wet: false, depth: 0, speed: 0, px: 0, py: 0,
    blob: Array.from({ length: 14 }, () => rnd(-1, 1)), bx: rnd(-7, 7), by: rnd(-7, 7),
    holes: Array.from({ length: 4 }, () => ({ x: rnd(-R * 0.6, R * 0.6), y: rnd(-R * 0.6, R * 0.6), r: rnd(2, 5) })),
    fib: Array.from({ length: 6 }, () => ({ a: rnd(0, TAU), r: rnd(6, R - 4), l: rnd(0.3, 0.9) })),
    needRelease: true, load: { w: 0, n: 0, pts: 0, list: [] }, overCap: false, wakeT: 0, slowAcc: 0, jag: null, tearAng: 0
  };
  if (run.kind === "human") { input.x = run.poi.x; input.y = run.poi.y; }
  else { ai.px = run.poi.x; ai.py = run.poi.y; ai.vx = ai.vy = 0; ai.down = false; ai.wait = 0.35; ai.plan = null; }
}

function control() {
  if (run.ai) return { x: ai.px, y: ai.py, down: ai.down };
  // tapPending latches a press until it has dipped once, so a tap shorter than one frame still dips (and lifts on the next frame)
  return { x: input.x, y: input.y, down: input.ptrDown || input.keyDown || input.tapPending };
}

function computeLoad(x, y) {
  const L = { w: 0, n: 0, pts: 0, list: [] };
  for (const f of run.fish) {
    f.onPaper = false;
    if (f.flop > 0 || f.appear < 0.6) continue;
    const dx = f.x - x, dy = f.y - y;
    if (dx * dx + dy * dy <= R * R) { L.w += f.weight; L.n++; L.pts += f.points; L.list.push(f); f.onPaper = true; }
  }
  return L;
}
const capOf = p => p.dur * 0.08;
// 0 = fine, 1 = past WARN of the ring (lift now), 2 = over the ring (lifting tears)
function strainOf(p) {
  if (p.state !== "water" || !p.load.n) return 0;
  const cap = capOf(p);
  return p.load.w > cap ? 2 : p.load.w >= cap * WARN ? 1 : 0;
}

function updatePoi(dt) {
  const p = run.poi;
  if (!p) return;
  p.t += dt;
  const c = control();
  // needRelease waits for a physical release (a held press from a tear or a resume must not dip); the tap latch does not count
  if (!(run.ai ? c.down : input.ptrDown || input.keyDown)) p.needRelease = false;
  const tx = clamp(c.x, WATER.x0 + 4, WATER.x1 - 4), ty = clamp(c.y, WATER.y0 + 4, WATER.y1 - 4);
  p.depth = clamp(p.depth + (p.state === "water" ? 14 : -10) * dt, 0, 1);
  if (p.state === "new") {
    if (run.kind === "human") input.tapPending = false; // taps while the scoop slides in are ignored, not queued
    const k = clamp(p.t / 0.4, 0, 1);
    p.y = lerp(VH + 60, WATER.y1 - 110, 1 - (1 - k) ** 3);
    if (run.kind === "human") { input.x = p.x; input.y = p.y; }
    else { ai.px = p.x; ai.py = p.y; }
    if (k >= 1) p.state = "air";
    return;
  }
  if (p.state === "torn") {
    if (run.kind === "human") input.tapPending = false;
    if (p.t > 1.0) {
      if (run.stock > 0) { run.stock--; newPoi(); }
      else endRun();
    }
    return;
  }
  if (p.state === "air" || p.state === "lift") {
    const kf = Math.min(1, dt * 20);
    p.x += (tx - p.x) * kf; p.y += (ty - p.y) * kf;
    if (p.state === "lift" && p.t > 0.22) p.state = "air";
    if (p.wet) { p.dur -= 1.5 * dt; if (p.dur <= 0) { p.dur = 0; tearPoi("melt"); return; } }
    for (const f of run.fish) f.onPaper = false;
    if (p.state === "air" && c.down && !p.needRelease) {
      if (run.kind === "human") { p.x = tx; p.y = ty; } // a press made during the lift still dips where it was made
      dip();
    }
    return;
  }
  // underwater: a press made while already dipped must not queue a second dip
  if (run.kind === "human") input.tapPending = false;
  const kf = Math.min(1, dt * 22);
  p.x += (tx - p.x) * kf; p.y += (ty - p.y) * kf;
  const sp = Math.hypot(p.x - p.px, p.y - p.py) / Math.max(dt, 1e-4);
  p.speed += (sp - p.speed) * Math.min(1, dt * 8);
  p.px = p.x; p.py = p.y;
  const excess = Math.max(0, (p.speed - SLOW) / SLOW);
  p.dur -= (drainRate(run.t) + 30 * excess) * dt;
  if (excess > 0) {
    p.wakeT -= dt;
    if (p.wakeT <= 0) { p.wakeT = 0.07; const a = rnd(0, TAU); addRipple(p.x + Math.cos(a) * R, p.y + Math.sin(a) * R, 14, 0.35); }
    p.slowAcc += dt;
    if (p.slowAcc > 0.35) showTempTip("tipSlow");
  }
  const prevN = p.load.n;
  p.load = computeLoad(p.x, p.y);
  const over = p.load.w > capOf(p);
  if (run.sfx) {
    if (p.load.n > prevN) Sound.enter(p.load.n);
    if (over && !p.overCap) Sound.creak();
  }
  p.overCap = over;
  if (strainOf(p)) showTempTip("tipRing");
  if (p.dur <= 0) { p.dur = 0; tearPoi("melt"); return; }
  if (!c.down) lift();
}

function dip() {
  const p = run.poi;
  p.state = "water"; p.t = 0; p.wet = true; p.speed = 0; p.dur = Math.max(1, p.dur - DIP_COST); p.px = p.x; p.py = p.y; p.overCap = false;
  p.load = computeLoad(p.x, p.y);
  addRipple(p.x, p.y, R + 34, 0.8);
  addRipple(p.x, p.y, R + 14, 0.6);
  splashDrops(p.x, p.y, 10, 70);
  if (run.sfx) Sound.dip();
  if (run.hint === 0) run.hint = 1;
  input.tapPending = false;
}

function lift() {
  const p = run.poi;
  const L = computeLoad(p.x, p.y);
  p.load = L;
  for (const f of run.fish) f.onPaper = false;
  if (L.n > 0 && L.w > capOf(p)) { tearPoi("heavy", L); return; }
  p.state = "lift"; p.t = 0;
  addRipple(p.x, p.y, R + 26, 0.7);
  splashDrops(p.x, p.y, 8, 50);
  if (L.n === 0) {
    if (run.sfx) Sound.lift();
    if (run.hint === 1) run.hint = 0;
    return;
  }
  catchFish(L);
}

function catchFish(L) {
  const p = run.poi;
  const n = L.n, mult = multFor(n);
  const gain = L.pts * mult;
  run.score += gain;
  run.caught += n;
  run.bestMult = Math.max(run.bestMult, mult);
  const order = L.list.slice().sort(() => Math.random() - 0.5);
  order.forEach((f, i) => {
    const idx = run.fish.indexOf(f);
    if (idx >= 0) run.fish.splice(idx, 1);
    run.flyers.push({ f, sx: f.x, sy: f.y, t: -i * 0.13, dur: 0.55, spin: rnd(-1, 1) > 0 ? 1 : -1, idx: i, started: false });
  });
  const golden = L.list.some(f => f.type === "golden");
  const col = mult >= 8 ? "#ff5b8a" : mult >= 4 ? "#ffb04a" : mult >= 2 ? "#7ef0c0" : "#fff4e2";
  addPopup(p.x, p.y - R - 8, "+" + gain, col, mult >= 4 ? 30 : 24);
  if (mult >= 2) addPopup(p.x, p.y - R - 40, `×${mult} ${S()["m" + mult]}`, col, mult >= 8 ? 30 : mult >= 4 ? 26 : 20, 0.1);
  if (golden) {
    addPopup(p.x, p.y + R + 18, S().golden, "#ffd36e", 24, 0.2);
    for (let i = 0; i < 24; i++) addSpark(p.x + rnd(-R, R), p.y + rnd(-R, R));
    if (run.sfx) Sound.goldCatch();
  }
  if (mult >= 2 && run.sfx) Sound.mult(mult);
  if (mult >= 4) hitStop = 0.08;
  if (mult >= 8) addShake(5);
  if ((mult >= 4 || golden) && run.kind === "human") plat("happytime");
  // spare scoops at 10, 25, 45, 70… fish, so careful play cannot last forever
  if (run.caught >= run.nextSpare) {
    run.spareGap += 5; run.nextSpare += run.spareGap;
    if (run.stock < 3) {
      run.stock++;
      addPopup(BOWL.x - 20, BOWL.y + 44, S().spare, "#ff8fb8", 18, 0.6);
      if (run.sfx) Sound.spare();
    }
  }
  if (run.hint >= 0 && run.hint < 2) run.hint = 2;
  if (run.ai) ai.sinceTear++;
}

function tearPoi(kind, L) {
  const p = run.poi;
  p.state = "torn"; p.t = 0; p.tearKind = kind;
  p.tearAng = rnd(0, Math.PI);
  p.jag = Array.from({ length: 11 }, (_, i) => (i === 0 || i === 10 ? 0 : rnd(-5, 5)));
  if (L) for (const f of L.list) { f.flop = 0.42; f.onPaper = false; }
  slowT = 0.9;
  addShake(kind === "heavy" ? 9 : 5);
  for (let i = 0; i < 18; i++) {
    const a = rnd(0, TAU), s = rnd(30, 110);
    particles.push({ kind: "paper", x: p.x + Math.cos(a) * rnd(0, R), y: p.y + Math.sin(a) * rnd(0, R), z: 6, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: rnd(60, 160), rot: rnd(0, TAU), vr: rnd(-8, 8), size: rnd(2, 5), life: 1.4, max: 1.4 });
  }
  addRipple(p.x, p.y, R + 50, 0.9);
  addRipple(p.x, p.y, R + 24, 0.7);
  splashDrops(p.x, p.y, 16, 110);
  addPopup(p.x, p.y - R - 14, kind === "heavy" ? S().torn : S().melted, "#ff5b5b", kind === "heavy" ? 30 : 20);
  if (run.sfx) kind === "heavy" ? Sound.tear() : Sound.melt();
  if (run.ai) { ai.sinceTear = 0; ai.down = false; }
  if (run.hint === 1) run.hint = 0;
}

// ---------- flyers & bowl ----------
function updateFlyers(dt) {
  for (let i = run.flyers.length - 1; i >= 0; i--) {
    const fl = run.flyers[i];
    fl.t += dt;
    if (fl.t >= 0 && !fl.started) { fl.started = true; splashDrops(fl.sx, fl.sy, 4, 40); }
    if (fl.t >= fl.dur) {
      run.flyers.splice(i, 1);
      BOWL.fish.push({ skin: fl.f.skin, type: fl.f.type, ph: rnd(0, TAU), lane: Math.random() });
      if (BOWL.fish.length > 12) BOWL.fish.shift();
      BOWL.wob = 1;
      for (let k = 0; k < 6; k++) particles.push({ kind: "drop", x: BOWL.x + rnd(-8, 8), y: BOWL.y - 6, z: 0, vx: rnd(-50, 50), vy: rnd(-10, 10), vz: rnd(60, 140), life: 0.6, max: 0.6, r: rnd(1, 2), air: true });
      if (run.sfx) Sound.plop(fl.idx + 2);
    }
  }
}

// ---------- AI (attract + ?demo=1) ----------
function bestCircle(ahead, cap, safeFrac, near) {
  const pts = [];
  for (const f of run.fish) {
    if (f.appear < 0.8 || f.flop > 0 || f.leaving) continue;
    pts.push({ x: f.x + f.vx * ahead, y: f.y + f.vy * ahead, w: f.weight, p: f.points });
  }
  const cands = [];
  for (let i = 0; i < pts.length; i++) {
    cands.push(pts[i]);
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[j].x - pts[i].x, dy = pts[j].y - pts[i].y;
      if (dx * dx + dy * dy < R * R * 2.4) cands.push({ x: (pts[i].x + pts[j].x) / 2, y: (pts[i].y + pts[j].y) / 2 });
    }
  }
  let bestC = null;
  const rr = (R * 0.72) ** 2;
  for (const c0 of cands) {
    const cx = clamp(c0.x, WATER.x0 + 10, WATER.x1 - 10), cy = clamp(c0.y, WATER.y0 + 10, WATER.y1 - 10);
    let dist = 0;
    if (near) { dist = Math.hypot(cx - near.x, cy - near.y); if (dist > near.max) continue; }
    let w = 0, n = 0, p = 0;
    for (const q of pts) { const dx = q.x - cx, dy = q.y - cy; if (dx * dx + dy * dy <= rr) { w += q.w; n++; p += q.p; } }
    if (!n || (cap != null && w > cap * safeFrac)) continue;
    const value = p * multFor(n) - dist * 0.02;
    if (!bestC || value > bestC.value) bestC = { x: cx, y: cy, n, w, value };
  }
  return bestC;
}

function aiSpring(tx, ty, dt) {
  const k = 55, c = 2 * Math.sqrt(k) * 0.55;
  ai.vx += ((tx - ai.px) * k - ai.vx * c) * dt;
  ai.vy += ((ty - ai.py) * k - ai.vy * c) * dt;
  const s = Math.hypot(ai.vx, ai.vy);
  if (s > 520) { ai.vx *= 520 / s; ai.vy *= 520 / s; }
  ai.px += ai.vx * dt; ai.py += ai.vy * dt;
}

function aiUpdate(dt) {
  const p = run.poi;
  if (!p || p.state === "torn" || p.state === "new") { ai.down = false; return; }
  const cap = capOf(p);
  ai.timer -= dt;
  if (!ai.down) {
    if (ai.wait > 0) ai.wait -= dt;
    if (ai.timer <= 0) {
      ai.timer = 0.25;
      let plan = bestCircle(0.4, cap, 0.85, null);
      if (!plan || cap < 1.2) plan = bestCircle(0.4, null, 0, null);
      ai.plan = plan;
    }
    if (ai.plan && p.state === "air") {
      const c = ai.plan;
      const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy) || 1;
      const ex = c.x + (dx / d) * R * 0.75, ey = c.y + (dy / d) * R * 0.75;
      aiSpring(ex, ey, dt);
      if (ai.wait <= 0 && Math.hypot(ai.px - ex, ai.py - ey) < 9 && Math.hypot(ai.vx, ai.vy) < 70 && Math.hypot(p.x - ex, p.y - ey) < 14) {
        ai.down = true; ai.under = 0; ai.slide = c; ai.goal = 0; ai.timer = 0.25;
        ai.greedy = cap < 1.2 || ai.sinceTear >= 3 || (ai.sinceTear >= 2 && Math.random() < 0.4);
      }
    } else {
      aiSpring((WATER.x0 + WATER.x1) / 2 + Math.sin(clock * 0.7) * 60, (WATER.y0 + WATER.y1) / 2 + Math.cos(clock * 0.5) * 80, dt * 0.4);
    }
    return;
  }
  ai.under += dt;
  if (ai.timer <= 0) {
    ai.timer = 0.25;
    const c = bestCircle(0.4, ai.greedy ? null : cap, 0.85, { x: p.x, y: p.y, max: 60 });
    if (c) ai.slide = c;
  }
  if (ai.slide) {
    const dx = ai.slide.x - ai.px, dy = ai.slide.y - ai.py, d = Math.hypot(dx, dy) || 1;
    const sp = Math.min(SLOW * 0.7, d * 5);
    const k = Math.min(1, dt * 10);
    ai.vx += ((dx / d) * sp - ai.vx) * k;
    ai.vy += ((dy / d) * sp - ai.vy) * k;
    ai.px += ai.vx * dt; ai.py += ai.vy * dt;
  }
  const L = p.load;
  const ready = L.n >= 2 && L.w < cap * 0.85;
  let up = false;
  if (ai.greedy) {
    if (L.n >= 1 && L.w > cap) up = true;
    else if (ready && !ai.goal) ai.goal = L.n + 1;
    if (ai.goal && L.n >= ai.goal) up = true;
    if (ai.under > 4.5) up = true;
  } else if (ready) up = true;
  else if (L.n >= 1 && L.w <= cap && (p.dur < 35 || ai.under > 2.2 || L.list.some(f => f.type === "golden"))) up = true;
  else if (ai.under > 3.2 && L.w <= cap) up = true;
  else if (ai.under > 4.5) up = true;
  if (up) { ai.down = false; ai.wait = rnd(0.25, 0.55); ai.timer = 0; ai.plan = null; }
}

// ---------- fx ----------
function addRipple(x, y, max, a) { ripples.push({ x, y, r: 2, max, a, life: 0 }); }
function splashDrops(x, y, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(sp * 0.3, sp);
    particles.push({ kind: "drop", x, y, z: 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vz: rnd(80, 190), life: 1, max: 1, r: rnd(1, 2.2) });
  }
}
function addSpark(x, y) { particles.push({ kind: "spark", x, y, vx: rnd(-10, 10), vy: rnd(-25, -5), life: 0.7, max: 0.7, size: rnd(2, 4.5) }); }
function addPopup(x, y, text, col, size, delay = 0) {
  if (run && run.kind === "attract") return;
  popups.push({ x, y: Math.max(y, WATER.y0 + 20), text, col, size, life: 1.2 + delay, max: 1.2, delay });
}
function banner(text, sub, col) { if (run && run.kind === "attract") return; banners.push({ text, sub, col, life: 2.4, max: 2.4 }); }
function addShake(v) { if (!motionQuery.matches) shake = Math.max(shake, v); }

function updateFx(dt, rdt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.kind === "drop" || q.kind === "paper") {
      q.z += q.vz * dt; q.vz -= 420 * dt;
      if (q.kind === "paper") { q.rot += q.vr * dt; if (q.z < 0) { q.z = 0; q.vx *= 0.9; q.vy *= 0.9; q.vr *= 0.9; } }
      else if (q.z < 0) { if (!q.air && Math.random() < 0.3) addRipple(q.x, q.y, 8, 0.35); q.life = 0; }
    }
    if (q.life <= 0) particles.splice(i, 1);
  }
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.life += dt;
    r.r = 2 + (r.max - 2) * (1 - (1 - Math.min(1, r.life / 0.9)) ** 2);
    if (r.life > 0.9) ripples.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) { popups[i].life -= rdt; if (popups[i].life <= 0) popups.splice(i, 1); }
  for (let i = banners.length - 1; i >= 0; i--) { banners[i].life -= rdt; if (banners[i].life <= 0) banners.splice(i, 1); }
  if (banners.length > 2) banners.splice(0, banners.length - 2);
  shake = Math.max(0, shake - rdt * 22);
  BOWL.wob = Math.max(0, BOWL.wob - rdt * 2.5);
}

// ---------- tips / hints ----------
function showTempTip(key) {
  if (!run || run.kind !== "human" || run.tips[key]) return;
  run.tips[key] = true;
  run.tempTip = { key, t: 2.6 };
}
function updateHints(dt) {
  if (run.kind !== "human") return;
  run.hintAge += dt;
  if (run.hint < 2 && run.hintAge > 18) run.hint = 2;
  if (run.hint === 0 && run.poi && run.poi.state === "air") {
    run.aimT -= dt;
    if (run.aimT <= 0) { run.aimT = 0.5; run.aim = bestCircle(0.3, capOf(run.poi), 0.9, null); }
  } else run.aim = null;
  let key = null;
  if (run.tempTip) { run.tempTip.t -= dt; key = run.tempTip.key; if (run.tempTip.t <= 0) run.tempTip = null; }
  else if (run.hint === 0) key = "tipPress";
  else if (run.hint === 1) key = "tipRelease";
  if (state !== "play") key = null;
  setTip(key);
}
function setTip(key) {
  if (key === tipKey) return;
  tipKey = key;
  if (!key) { el.tip.hidden = true; return; }
  el.tip.textContent = S()[key];
  el.tip.hidden = false;
}

// ---------- run lifecycle ----------
function newRun(kind) {
  const isAi = kind !== "human";
  run = {
    kind, ai: isAi, sfx: kind !== "attract", t: isAi ? 26 : 0, score: 0, shownScore: -1, caught: 0, bestMult: 1, stock: 2, nextSpare: 10, spareGap: 10,
    fish: [], flyers: [], poi: null, spawnT: 1, phase: 0, nextGolden: isAi ? 33 : 20, nextRestock: isAi ? 40 : 45,
    ended: false, restartIn: 1, hint: isAi ? -1 : 0, hintAge: 0, aim: null, aimT: 0, tips: {}, tempTip: null, icons: -1
  };
  particles = []; ripples = []; popups = []; banners = [];
  BOWL.fish = []; slowT = 0; hitStop = 0; shake = 0;
  ai.sinceTear = 1;
  const { x0, y0, x1, y1 } = WATER;
  const spots = [
    { x: VW / 2 + rnd(-30, 30), y: y1 - 120, n: 4 },
    { x: rnd(x0 + 60, x1 - 60), y: y0 + rnd(70, 140), n: 4 },
    { x: x0 + 70, y: (y0 + y1) / 2 + rnd(-40, 40), n: 3 },
    { x: x1 - 70, y: (y0 + y1) / 2 + rnd(-40, 60), n: 3 }
  ];
  for (const s of spots) {
    const ang = rnd(0, TAU);
    for (let i = 0; i < s.n; i++) {
      const f = makeFish("red", s.x + rnd(-24, 24), s.y + rnd(-24, 24), ang + rnd(-0.4, 0.4), 1);
      f.wander = ang;
      run.fish.push(f);
    }
  }
  newPoi();
}

function startGame() {
  Sound.init();
  newRun("human");
  state = "play";
  el.title.hidden = true; el.over.hidden = true; el.pause.hidden = true;
  el.hud.hidden = false; el.pauseBtn.hidden = false;
  input.ptrDown = false; input.keyDown = false; input.keys = {}; input.tapPending = false;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  plat("gameplayStart");
}

function endRun() {
  run.ended = true;
  run.poi = null;
  if (run.kind !== "human") { run.restartIn = 1; return; }
  state = "over";
  const isBest = run.score > best;
  if (isBest) { best = run.score; store.set(KEY.best, String(best)); }
  el.newBest.hidden = !isBest || run.score === 0;
  fillResult();
  el.over.hidden = false; el.pauseBtn.hidden = true;
  setTip(null);
  overAt = performance.now();
  if (run.sfx) Sound.over();
  plat("gameplayStop");
  plat("gameOver", run.score);
}
function fillResult() {
  if (!run) return;
  el.final.textContent = run.score;
  el.resultSub.innerHTML = S().result(run.caught, run.bestMult);
}

function pause() {
  if (state !== "play" || run.kind !== "human") return;
  state = "paused";
  const p = run.poi;
  if (p && p.state === "water") { p.state = "lift"; p.t = 0; for (const f of run.fish) f.onPaper = false; }
  input.ptrDown = false; input.keyDown = false; input.keys = {}; input.tapPending = false;
  el.pause.hidden = false;
  setTip(null);
  plat("gameplayStop");
}
function resume() {
  if (state !== "paused") return;
  state = "play";
  el.pause.hidden = true;
  if (run.poi) run.poi.needRelease = true;
  last = performance.now();
  plat("gameplayStart");
}

// ---------- rendering ----------
function bodyPath(L, w, bend) {
  ctx.beginPath();
  ctx.moveTo(L * 0.5, 0);
  ctx.bezierCurveTo(L * 0.5, w * 0.75, L * 0.25, w, L * 0.02, w);
  ctx.bezierCurveTo(-L * 0.18, w * 0.95, -L * 0.26, bend + w * 0.45, -L * 0.32, bend + w * 0.22);
  ctx.lineTo(-L * 0.32, bend - w * 0.22);
  ctx.bezierCurveTo(-L * 0.26, bend - w * 0.45, -L * 0.18, -w * 0.95, L * 0.02, -w);
  ctx.bezierCurveTo(L * 0.25, -w, L * 0.5, -w * 0.75, L * 0.5, 0);
  ctx.closePath();
}

function drawFish(f, x, y, ang, sc, alpha, hl) {
  const L = f.len, w = f.w, sk = f.skin, ty = TYPES[f.type];
  const an = Math.min(1, Math.hypot(f.vx, f.vy) / (f.cruise * 1.8));
  const ph = f.phase;
  const wag = Math.sin(ph) * (0.22 + 0.5 * an);
  const bend = Math.sin(ph - 0.9) * w * (0.25 + 0.45 * an);
  ctx.save();
  const ks = sc * FISH_DRAW;
  ctx.translate(x, y); ctx.rotate(ang);
  ctx.scale(ks, ks);
  ctx.globalAlpha = alpha;
  if (sk.gold) {
    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, L * 1.1);
    g.addColorStop(0, `rgba(255,220,110,${0.35 + Math.sin(clock * 6 + f.id) * 0.12})`); g.addColorStop(1, "rgba(255,220,110,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, L * 1.1, 0, TAU); ctx.fill();
  }
  // tail
  const T = L * ty.tail, s = T * (ty.fancy ? 0.75 : 0.45);
  const flick = Math.sin(ph - 1.7) * T * 0.22 * (0.4 + an);
  const notch = ty.fancy ? 0.42 : 0.62;
  ctx.save();
  ctx.translate(-L * 0.32, bend); ctx.rotate(wag);
  ctx.beginPath();
  ctx.moveTo(0, -w * 0.2);
  ctx.bezierCurveTo(-T * 0.35, -s * 0.45, -T * 0.75, -s + flick * 0.4, -T, -s + flick);
  ctx.quadraticCurveTo(-T * notch, flick * 0.7, -T, s + flick);
  ctx.bezierCurveTo(-T * 0.75, s + flick * 0.4, -T * 0.35, s * 0.45, 0, w * 0.2);
  ctx.closePath();
  ctx.fillStyle = sk.fin; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.2)"; ctx.lineWidth = 0.5;
  ctx.beginPath();
  for (let i = -2; i <= 2; i++) { ctx.moveTo(0, 0); ctx.lineTo(-T * 0.92, i * s * 0.42 + flick * 0.8); }
  ctx.stroke();
  ctx.restore();
  // pectoral fins
  ctx.fillStyle = sk.fin;
  for (const sg of [-1, 1]) {
    ctx.save();
    ctx.translate(L * 0.16, sg * w * 0.75);
    ctx.rotate(sg * (Math.PI - 0.9 + Math.sin(ph * 0.8) * 0.25));
    ctx.beginPath(); ctx.ellipse(L * 0.08, 0, L * 0.12, L * 0.045, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // body
  bodyPath(L, w, bend);
  const g = ctx.createLinearGradient(0, -w, 0, w);
  g.addColorStop(0, sk.b); g.addColorStop(0.5, sk.a); g.addColorStop(1, sk.b);
  ctx.fillStyle = g; ctx.fill();
  if (sk.patches.length || sk.wen || sk.gold) {
    ctx.save(); ctx.clip();
    for (const pa of sk.patches) { ctx.fillStyle = pa.c; ctx.beginPath(); ctx.ellipse(pa.x * L, pa.y * w, pa.rx * L, pa.ry * w, 0, 0, TAU); ctx.fill(); }
    if (sk.wen) {
      ctx.fillStyle = sk.wen;
      for (const [hx, hy] of [[0.36, 0], [0.28, 0.42], [0.28, -0.42], [0.2, 0]]) { ctx.beginPath(); ctx.arc(hx * L, hy * w, w * 0.34, 0, TAU); ctx.fill(); }
    }
    if (sk.gold) {
      const gx = (((clock * 0.9 + f.id * 0.37) % 1.6) - 0.5) * L * 2;
      const gg = ctx.createLinearGradient(gx - 6, 0, gx + 6, 0);
      gg.addColorStop(0, "rgba(255,255,255,0)"); gg.addColorStop(0.5, "rgba(255,255,255,0.85)"); gg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = gg; ctx.fillRect(gx - 6, -w * 2, 12, w * 4);
    }
    ctx.restore();
  }
  ctx.strokeStyle = sk.bigEyes ? "rgba(150,160,255,0.25)" : "rgba(255,255,255,0.3)";
  ctx.lineWidth = w * 0.45; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(L * 0.3, 0); ctx.quadraticCurveTo(0, bend * 0.3, -L * 0.2, bend * 0.7); ctx.stroke();
  // eyes
  if (sk.bigEyes) {
    for (const sg of [-1, 1]) {
      ctx.fillStyle = "#14141c"; ctx.beginPath(); ctx.arc(L * 0.3, sg * (w + L * 0.03), L * 0.1, 0, TAU); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); ctx.arc(L * 0.33, sg * (w + L * 0.03) - L * 0.025, L * 0.03, 0, TAU); ctx.fill();
    }
  } else {
    ctx.fillStyle = "#1a0c08";
    for (const sg of [-1, 1]) { ctx.beginPath(); ctx.arc(L * 0.34, sg * w * 0.55, L * 0.04, 0, TAU); ctx.fill(); }
  }
  if (hl) {
    bodyPath(L, w, bend);
    ctx.strokeStyle = "rgba(255,255,255,0.95)"; ctx.lineWidth = 1.3 / ks; ctx.stroke();
  }
  ctx.restore();
}

function drawPaper(p) {
  const wet = clamp(1 - p.dur / 100, 0, 1);
  const under = p.depth > 0.5;
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.clip();
  ctx.fillStyle = under ? "rgba(232,240,238,0.5)" : "rgba(252,250,244,0.93)";
  ctx.fillRect(-R, -R, R * 2, R * 2);
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 0.6;
  for (const fb of p.fib) { ctx.beginPath(); ctx.arc(0, 0, fb.r, fb.a, fb.a + fb.l); ctx.stroke(); }
  if (p.wet) {
    const rr = R * (0.32 + wet * 1.0);
    ctx.beginPath();
    for (let i = 0; i <= 28; i++) {
      const a = (i / 28) * TAU, bi = p.blob[(i >> 1) % 14];
      const r = rr * (1 + bi * 0.18 + Math.sin(clock * 1.3 + i) * 0.03);
      const x = p.bx + Math.cos(a) * r, y = p.by + Math.sin(a) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    const g = ctx.createRadialGradient(p.bx, p.by, 0, p.bx, p.by, rr * 1.2);
    g.addColorStop(0, `rgba(120,138,146,${0.25 + wet * 0.5})`);
    g.addColorStop(1, `rgba(150,166,172,${0.12 + wet * 0.3})`);
    ctx.fillStyle = g; ctx.fill();
    if (wet > 0.5) {
      ctx.fillStyle = `rgba(10,40,52,${Math.min(0.6, (wet - 0.5) * 1.3)})`;
      for (const h of p.holes) { ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r * wet, h.r * 0.6 * wet, h.x, 0, TAU); ctx.fill(); }
    }
  }
  ctx.restore();
  ctx.lineWidth = 5; ctx.strokeStyle = "#ff6fa3";
  ctx.beginPath(); ctx.arc(0, 0, R + 2, 0, TAU); ctx.stroke();
  ctx.lineWidth = 1.4; ctx.strokeStyle = "rgba(255,225,238,0.85)";
  ctx.beginPath(); ctx.arc(0, 0, R + 2.6, -2.5, -0.9); ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(130,20,60,0.55)";
  ctx.beginPath(); ctx.arc(0, 0, R + 4.6, 0, TAU); ctx.stroke();
}

function drawHandle() {
  ctx.save();
  ctx.rotate(HANDLE_ANG);
  ctx.fillStyle = "#ff6fa3";
  rrect(ctx, R + 2, -4.5, 64, 9, 4.5); ctx.fill();
  ctx.fillStyle = "rgba(255,226,238,0.75)"; ctx.fillRect(R + 6, -3, 54, 1.8);
  ctx.fillStyle = "rgba(140,20,60,0.35)"; ctx.fillRect(R + 6, 2, 54, 1.8);
  ctx.restore();
}

function drawLoadRing(p) {
  const cap = capOf(p);
  const under = p.state === "water";
  const w = under ? p.load.w : 0;
  const st = strainOf(p), over = st === 2;
  const ratio = cap > 0 ? w / cap : 9;
  // past WARN: red ring pulsing at ~2.4 Hz with a glow behind it; over the ring it also flashes fast as before
  const pulse = 0.5 + 0.5 * Math.sin(clock * 15);
  const col = over ? `rgba(255,59,59,${0.7 + Math.sin(clock * 30) * 0.3})`
    : st ? `rgba(255,${(50 + pulse * 60) | 0},${(45 + pulse * 45) | 0},${0.6 + pulse * 0.4})`
    : ratio > 0.6 ? "#ffd36e" : "#7ef0c0";
  const rr = R + 10 + (st ? pulse * 1.5 : 0);
  ctx.lineCap = "butt";
  if (st) {
    ctx.lineWidth = 9 + pulse * 5;
    ctx.strokeStyle = `rgba(255,45,35,${0.12 + pulse * 0.4})`;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, TAU); ctx.stroke();
  }
  for (let i = 0; i < 8; i++) {
    const a0 = -Math.PI / 2 + (i * TAU) / 8 + 0.07, span = TAU / 8 - 0.14, a1 = a0 + span;
    const avail = clamp(cap - i, 0, 1), fill = clamp(w - i, 0, 1);
    ctx.lineWidth = 4;
    ctx.strokeStyle = over && fill > 0 ? "rgba(120,0,0,0.6)" : "rgba(0,0,0,0.38)";
    ctx.beginPath(); ctx.arc(0, 0, rr, a0, a1); ctx.stroke();
    if (avail > 0) { ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.beginPath(); ctx.arc(0, 0, rr, a0, a0 + span * avail); ctx.stroke(); }
    if (fill > 0) { ctx.lineWidth = st ? 6 : 5; ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(0, 0, rr, a0, a0 + span * fill); ctx.stroke(); }
  }
  if (under && p.load.n > 0) {
    const m = multFor(p.load.n);
    const txt = `${p.load.n}${S().unit}${m > 1 ? " ×" + m : ""}`;
    ctx.font = `900 ${st ? 16 + pulse * 2 : 15}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,0.75)";
    const ly = -rr - 13;
    ctx.strokeText(txt, 0, ly);
    ctx.fillStyle = st ? "#ff6b6b" : col; ctx.fillText(txt, 0, ly);
  }
}

function drawPoi(p, layer) {
  const under = p.depth > 0.5;
  if (p.state === "torn") { if (layer === "top") drawTornPoi(p); return; }
  ctx.save();
  ctx.translate(p.x, p.y);
  const st = strainOf(p);
  if (st && !motionQuery.matches) {
    // the loaded poi trembles: a little jitter plus a twist that swings the handle, stronger once over the ring
    const k = st === 2 ? 1.5 : 1;
    ctx.translate(Math.sin(clock * 41) * 1.5 * k, Math.sin(clock * 33 + 1.3) * 1.2 * k);
    ctx.rotate(Math.sin(clock * 23) * 0.06 * k);
  }
  if (layer === "water") {
    if (under) {
      ctx.scale(0.96, 0.96);
      drawPaper(p);
      ctx.fillStyle = "rgba(10,70,90,0.22)";
      ctx.beginPath(); ctx.arc(0, 0, R + 5, 0, TAU); ctx.fill();
    }
    ctx.restore();
    return;
  }
  if (!under) {
    const lift = p.state === "lift" ? Math.sin(clamp(p.t / 0.22, 0, 1) * Math.PI) * 0.08 : 0;
    const h = 1 - p.depth;
    ctx.fillStyle = "rgba(0,12,20,0.28)";
    ctx.beginPath(); ctx.ellipse(9 * h, 13 * h, R + 4, R + 4, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(9 * h, 13 * h); ctx.rotate(HANDLE_ANG); ctx.fillRect(R + 2, -4, 64, 8); ctx.restore();
    ctx.scale(1 + lift, 1 + lift);
    drawPaper(p);
  }
  drawHandle();
  drawLoadRing(p);
  ctx.restore();
}

function drawTornPoi(p) {
  const t = p.t, k = clamp(t / 0.6, 0, 1), sep = (1 - (1 - k) ** 3) * 16;
  const alpha = clamp(1 - (t - 0.5) / 0.5, 0, 1);
  ctx.save();
  ctx.translate(p.x + (t < 0.25 ? rnd(-1.5, 1.5) : 0), p.y);
  ctx.globalAlpha = alpha;
  for (const sg of [-1, 1]) {
    ctx.save();
    ctx.rotate(p.tearAng);
    ctx.translate(0, sg * sep);
    ctx.rotate(sg * k * 0.25);
    ctx.beginPath();
    for (let i = 0; i <= 10; i++) { const x = -R - 6 + (i / 10) * (2 * R + 12); i ? ctx.lineTo(x, p.jag[i]) : ctx.moveTo(x, p.jag[i]); }
    ctx.lineTo(R + 6, sg * (R + 8)); ctx.lineTo(-R - 6, sg * (R + 8)); ctx.closePath();
    ctx.clip();
    ctx.rotate(-p.tearAng);
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU);
    ctx.fillStyle = "rgba(200,212,214,0.75)"; ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = alpha * (1 - k * 0.3);
  ctx.lineWidth = 5; ctx.strokeStyle = "#ff6fa3";
  ctx.beginPath(); ctx.arc(0, 0, R + 2, 0, TAU); ctx.stroke();
  drawHandle();
  ctx.restore();
}

function drawBandFx() {
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < LANTERNS.length; i++) {
    const L = LANTERNS[i];
    const a = 0.12 + Math.sin(clock * 3.1 + i * 1.7) * 0.04 + Math.sin(clock * 7.3 + i) * 0.03;
    const g = ctx.createRadialGradient(L.x, L.y, 2, L.x, L.y, 40);
    g.addColorStop(0, `rgba(255,190,100,${a})`); g.addColorStop(1, "rgba(255,190,100,0)");
    ctx.fillStyle = g; ctx.fillRect(L.x - 40, L.y - 40, 80, 80);
  }
  for (let i = 0; i < 9; i++) {
    const x = ((i * 47 + clock * (4 + (i % 3) * 2)) % (VW + 40)) - 20;
    const y = 40 + ((i * 29) % 70) + Math.sin(clock * 0.6 + i) * 6;
    const r = 6 + (i % 4) * 4;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const c = i % 3 === 0 ? "255,120,80" : "255,190,110";
    g.addColorStop(0, `rgba(${c},0.14)`); g.addColorStop(0.7, `rgba(${c},0.07)`); g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawWaterFx() {
  const { x0, y0, x1, y1 } = WATER;
  const h = y1 - y0;
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = 2.2;
  for (let i = 0; i < 9; i++) {
    const by = y0 + ((i + 0.5) * h) / 9;
    ctx.strokeStyle = `rgba(120,225,230,${0.05 + Math.sin(clock * 0.8 + i) * 0.02})`;
    ctx.beginPath();
    for (let x = x0; x <= x1 + 14; x += 14) {
      const y = by + Math.sin(x * 0.035 + clock * 0.7 + i * 1.7) * 10 + Math.sin(x * 0.083 - clock * 1.1 + i) * 5;
      x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  for (let i = 0; i < 6; i++) {
    const bx = x0 + ((i + 0.5) * (x1 - x0)) / 6;
    ctx.strokeStyle = `rgba(120,225,230,${0.045 + Math.sin(clock * 0.6 + i * 2) * 0.02})`;
    ctx.beginPath();
    for (let y = y0; y <= y1 + 14; y += 14) {
      const x = bx + Math.sin(y * 0.03 + clock * 0.8 + i * 2.1) * 12 + Math.sin(y * 0.07 - clock * 1.2 + i) * 5;
      y === y0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  for (const L of LANTERNS) {
    const x = L.x + Math.sin(clock * 1.7 + L.x) * 3;
    ctx.save();
    ctx.translate(x, y0 + 22);
    ctx.scale(0.55 + Math.sin(clock * 2.3 + L.x) * 0.05, 1);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 30);
    g.addColorStop(0, `rgba(255,170,80,${0.2 + Math.sin(clock * 3.1 + L.x) * 0.04})`);
    g.addColorStop(1, "rgba(255,170,80,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 30, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawRipples() {
  for (const r of ripples) {
    const k = r.life / 0.9, a = r.a * (1 - k);
    ctx.strokeStyle = `rgba(210,246,255,${a})`;
    ctx.lineWidth = 1.8 * (1 - k) + 0.4;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    if (r.r > 12) {
      ctx.strokeStyle = `rgba(210,246,255,${a * 0.45})`;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 0.7, 0, TAU); ctx.stroke();
    }
  }
}

function drawParticles() {
  for (const q of particles) {
    const a = clamp(q.life / q.max, 0, 1);
    if (q.kind === "drop") {
      ctx.fillStyle = `rgba(215,245,255,${0.85 * a})`;
      ctx.beginPath(); ctx.arc(q.x, q.y - q.z, q.r * (1 + q.z / 120), 0, TAU); ctx.fill();
    } else if (q.kind === "paper") {
      ctx.save(); ctx.translate(q.x, q.y - q.z); ctx.rotate(q.rot);
      ctx.fillStyle = `rgba(240,244,240,${a})`;
      ctx.fillRect(-q.size / 2, -q.size / 3, q.size, q.size * 0.66);
      ctx.restore();
    } else if (q.kind === "spark") {
      ctx.globalCompositeOperation = "lighter";
      const s = q.size * (0.5 + a * 0.5);
      ctx.fillStyle = `rgba(255,226,120,${a})`;
      ctx.beginPath();
      ctx.moveTo(q.x, q.y - s); ctx.lineTo(q.x + s * 0.25, q.y); ctx.lineTo(q.x, q.y + s); ctx.lineTo(q.x - s * 0.25, q.y); ctx.closePath();
      ctx.moveTo(q.x - s, q.y); ctx.lineTo(q.x, q.y + s * 0.25); ctx.lineTo(q.x + s, q.y); ctx.lineTo(q.x, q.y - s * 0.25); ctx.closePath();
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
  }
}

function drawBowl() {
  const { x, y, r } = BOWL;
  const wob = BOWL.wob, sq = Math.sin(wob * 18) * wob * 0.1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1 + sq, 1 - sq);
  const g0 = ctx.createRadialGradient(0, 4, 4, 0, 4, r * 1.6);
  g0.addColorStop(0, "rgba(120,230,240,0.18)"); g0.addColorStop(1, "rgba(120,230,240,0)");
  ctx.fillStyle = g0; ctx.beginPath(); ctx.arc(0, 4, r * 1.6, 0, TAU); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.clip();
  ctx.fillStyle = "rgba(200,240,255,0.08)"; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  const wl = -r * 0.32 + Math.sin(clock * 3) * 1.2 + sq * 20;
  const g = ctx.createLinearGradient(0, wl, 0, r);
  g.addColorStop(0, "rgba(90,200,220,0.55)"); g.addColorStop(1, "rgba(20,90,120,0.8)");
  ctx.fillStyle = g; ctx.fillRect(-r, wl, 2 * r, r * 2);
  BOWL.fish.forEach((m, i) => {
    const t = clock * (0.5 + (i % 3) * 0.12) + m.ph;
    const fx = Math.sin(t) * r * 0.55, dir = Math.cos(t) >= 0 ? 1 : -1;
    const fy = wl + 6 + m.lane * (r - wl - 12);
    const big = m.type === "ranchu" ? 1.3 : 1;
    ctx.save(); ctx.translate(fx, fy); ctx.scale(dir * big, big);
    ctx.fillStyle = m.skin.a;
    ctx.beginPath(); ctx.ellipse(0, 0, 4.2, 2.4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = m.skin.fin;
    ctx.beginPath(); ctx.moveTo(-3.5, 0); ctx.lineTo(-7.5, -2.6 + Math.sin(t * 8) * 0.8); ctx.lineTo(-7.5, 2.6 + Math.sin(t * 8) * 0.8); ctx.closePath(); ctx.fill();
    if (m.skin.gold) { ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(-1, -1.2, 2, 0.8); }
    ctx.restore();
  });
  ctx.strokeStyle = "rgba(220,250,255,0.5)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-r, wl); ctx.lineTo(r, wl); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = "rgba(210,245,255,0.6)"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI * 0.32, Math.PI * 1.32); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(0, 0, r - 4, Math.PI * 1.05, Math.PI * 1.35); ctx.stroke();
  ctx.strokeStyle = "rgba(160,220,255,0.9)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, -r * 0.86, r * 0.56, r * 0.14, 0, 0, TAU); ctx.stroke();
  ctx.restore();
  if (run && run.caught > 0 && run.kind !== "attract") {
    // sits low beside the bowl, below the lantern string, so it never covers a lantern
    ctx.font = `900 12px ${FONT}`; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,0.7)";
    const txt = run.caught + S().bowlUnit;
    ctx.strokeText(txt, x - r - 3, y + 22);
    ctx.fillStyle = "#cfefff"; ctx.fillText(txt, x - r - 3, y + 22);
  }
}

function drawText(text, x, y, size, col, alpha = 1, sc = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const half = (ctx.measureText(text).width / 2 + size * 0.2) * sc;
  if (half * 2 < VW - 8) x = clamp(x, 4 + half, VW - 4 - half);
  ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.lineJoin = "round"; ctx.lineWidth = size * 0.22; ctx.strokeStyle = "rgba(10,16,24,0.85)";
  ctx.strokeText(text, 0, 0);
  ctx.fillStyle = col; ctx.fillText(text, 0, 0);
  ctx.restore();
}

function drawAim() {
  const a = run.aim;
  if (!a || !run.poi || run.poi.state !== "air") return;
  const pulse = 1 + Math.sin(clock * 6) * 0.06;
  ctx.save();
  ctx.setLineDash([6, 6]); ctx.lineDashOffset = -clock * 20;
  ctx.strokeStyle = "rgba(255,240,200,0.85)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(a.x, a.y, R * pulse, 0, TAU); ctx.stroke();
  ctx.restore();
  drawText(S().aim, a.x, a.y - R - 14 + Math.sin(clock * 5) * 2, 15, "#ffd36e");
}

function render() {
  const k = scale * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#04121a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const jit = state === "paused" ? 0 : shake;
  const sx = jit > 0 ? rnd(-1, 1) * jit : 0, sy = jit > 0 ? rnd(-1, 1) * jit : 0;
  ctx.setTransform(k, 0, 0, k, sx * k, sy * k);
  ctx.drawImage(bg, 0, 0, VW, VH);
  drawBandFx();
  if (!run) return;
  const p = run.poi;
  ctx.save();
  rrect(ctx, WATER.x0, WATER.y0, WATER.x1 - WATER.x0, WATER.y1 - WATER.y0, WATER.r);
  ctx.clip();
  drawWaterFx();
  ctx.fillStyle = "rgba(0,14,22,0.32)";
  for (const f of run.fish) {
    if (f.flop > 0) continue;
    ctx.globalAlpha = f.appear;
    ctx.beginPath(); ctx.ellipse(f.x + 4, f.y + 6, f.len * 0.48 * FISH_DRAW, f.w * 1.05 * FISH_DRAW, f.angle, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (p) drawPoi(p, "water");
  if (p && p.state === "water" && run.t >= 30) {
    const a = clamp((p.speed - SLOW * 0.6) / (SLOW * 0.6), 0, 1) * 0.5;
    if (a > 0.02) {
      ctx.save(); ctx.setLineDash([4, 7]);
      ctx.strokeStyle = `rgba(255,120,120,${a})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, FLEE_R, 0, TAU); ctx.stroke(); ctx.restore();
    }
  }
  for (const f of run.fish) if (f.flop <= 0) drawFish(f, f.x, f.y, f.angle, 0.75 + 0.25 * f.appear, f.appear, f.onPaper);
  drawRipples();
  ctx.restore();
  for (const f of run.fish) {
    if (f.flop <= 0) continue;
    const k2 = 1 - f.flop / 0.42;
    drawFish(f, f.x, f.y - Math.sin(k2 * Math.PI) * 14, f.angle + Math.sin(k2 * 20) * 0.5, 1 + Math.sin(k2 * Math.PI) * 0.3, 1, false);
  }
  if (p) drawPoi(p, "top");
  if (run.kind === "human" && run.hint === 0) drawAim();
  drawParticles();
  drawBowl();
  for (const fl of run.flyers) {
    if (fl.t < 0) continue;
    const e = clamp(fl.t / fl.dur, 0, 1), ee = e * e * (3 - 2 * e);
    const x = lerp(fl.sx, BOWL.x, ee), y = lerp(fl.sy, BOWL.y, ee) - Math.sin(e * Math.PI) * 80;
    drawFish(fl.f, x, y, fl.f.angle + fl.spin * e * TAU * 1.2, 1.25 - 0.65 * e, 1, false);
  }
  for (const pp of popups) {
    const age = pp.max + pp.delay - pp.life - pp.delay;
    if (age < 0) continue;
    const e = clamp(age / 0.18, 0, 1);
    const sc = e < 1 ? 0.4 + 0.6 * (1 + 2.7 * (e - 1) ** 3 + 1.7 * (e - 1) ** 2) : 1;
    drawText(pp.text, pp.x, pp.y - age * 26, pp.size, pp.col, clamp(pp.life / 0.3, 0, 1), sc);
  }
  for (let i = 0; i < banners.length; i++) {
    const b = banners[i], age = b.max - b.life;
    const inK = clamp(age / 0.25, 0, 1), a = clamp(b.life / 0.4, 0, 1);
    const by = WATER.y0 + 44 + i * 58;
    drawText(b.text, VW / 2 + (1 - inK) * 120, by, 30, b.col, a);
    if (b.sub) drawText(b.sub, VW / 2 + (1 - inK) * 160, by + 26, 13, "#e8f4f4", a);
  }
}

// ---------- HUD ----------
function updateHud() {
  if (!run || el.hud.hidden) return;
  if (run.score !== run.shownScore) {
    if (run.shownScore >= 0 && run.score > run.shownScore) {
      el.score.classList.remove("bump"); void el.score.offsetWidth; el.score.classList.add("bump");
      setTimeout(() => el.score.classList.remove("bump"), 140);
    }
    run.shownScore = run.score;
    el.score.textContent = run.score;
  }
  const icons = run.stock + (run.poi && run.poi.state !== "torn" ? 1 : 0);
  if (icons !== run.icons) { run.icons = icons; el.poiIcons.innerHTML = "<i></i>".repeat(icons); }
  const b = run.kind === "human" ? Math.max(best, run.score) : best;
  if (el.best.textContent !== String(b)) el.best.textContent = b;
}

// ---------- main loop ----------
let last = performance.now();
function step(dt, rdt) {
  clock += dt;
  if (!run) return;
  if (!run.ended) { run.t += dt; schedule(dt); }
  if (run.ai && !run.ended) aiUpdate(dt);
  updateFish(dt);
  updatePoi(dt);
  updateFlyers(dt);
  updateFx(dt, rdt);
  updateHints(dt);
  if (run.ended && run.ai) { run.restartIn -= rdt; if (run.restartIn <= 0) newRun(run.kind); }
}
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - last) / 1000;
  last = now;
  if (!(rdt > 0)) rdt = 0;
  rdt = Math.min(rdt, 0.05);
  if (state !== "paused") {
    if (state === "play" && run && run.kind === "human") { moveByKeys(rdt); }
    if (hitStop > 0) hitStop -= rdt;
    else {
      let ts = 1;
      if (slowT > 0) { ts = slowT > 0.4 ? 0.22 : 0.22 + 0.78 * (1 - slowT / 0.4); slowT -= rdt; }
      step(rdt * ts, rdt);
    }
  }
  render();
  updateHud();
}

// ---------- input ----------
function moveByKeys(dt) {
  const k = input.keys;
  const dx = (k.ArrowRight ? 1 : 0) - (k.ArrowLeft ? 1 : 0), dy = (k.ArrowDown ? 1 : 0) - (k.ArrowUp ? 1 : 0);
  if (!dx && !dy) return;
  const sp = input.shift ? 70 : 170, n = Math.hypot(dx, dy);
  input.x = clamp(input.x + (dx / n) * sp * dt, WATER.x0 + 4, WATER.x1 - 4);
  input.y = clamp(input.y + (dy / n) * sp * dt, WATER.y0 + 4, WATER.y1 - 4);
}
function setPointer(e) {
  const r = canvas.getBoundingClientRect();
  input.x = ((e.clientX - r.left) / r.width) * VW;
  input.y = ((e.clientY - r.top) / r.height) * VH - (e.pointerType === "touch" ? TOUCH_LIFT : 0);
}
// a new press (not a held one) may dip right away, even while the previous scoop is still lifting
function freshPress() {
  input.tapPending = true;
  const p = run.poi;
  if (p && (p.state === "air" || p.state === "lift")) p.needRelease = false;
}
const humanPlaying = () => state === "play" && run && run.kind === "human";
canvas.addEventListener("pointerdown", e => {
  Sound.init();
  if (!humanPlaying()) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
  setPointer(e);
  input.ptrDown = true; input.ptrId = e.pointerId;
  freshPress();
  const p = run.poi;
  if (p && p.state === "air") {
    p.x = clamp(input.x, WATER.x0 + 4, WATER.x1 - 4); p.y = clamp(input.y, WATER.y0 + 4, WATER.y1 - 4);
  }
});
canvas.addEventListener("pointermove", e => {
  if (!humanPlaying()) return;
  if (e.pointerType === "mouse" || input.ptrDown) setPointer(e);
});
const ptrUp = e => { if (e.pointerId === input.ptrId) { input.ptrDown = false; input.ptrId = null; } };
canvas.addEventListener("pointerup", ptrUp);
canvas.addEventListener("pointercancel", ptrUp);
canvas.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());

const GAME_KEYS = ["Space", "Enter", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"];
addEventListener("keydown", e => {
  const k = e.code;
  Sound.init();
  if (GAME_KEYS.includes(k)) e.preventDefault();
  if (state === "title" || state === "over") {
    if ((k === "Space" || k === "Enter") && !e.repeat && !DEMO) {
      if (state === "over" && performance.now() - overAt < 600) return;
      startGame();
    }
    return;
  }
  if (state === "paused") { if ((k === "Space" || k === "Enter" || k === "KeyP" || k === "Escape") && !e.repeat) resume(); return; }
  if (!humanPlaying()) return;
  if (k === "KeyP" || k === "Escape") { pause(); return; }
  if (k === "Space") { input.keyDown = true; if (!e.repeat) freshPress(); }
  if (k.startsWith("Arrow")) input.keys[k] = true;
  if (k === "ShiftLeft" || k === "ShiftRight") input.shift = true;
});
addEventListener("keyup", e => {
  const k = e.code;
  if (k === "Space") input.keyDown = false;
  if (k.startsWith("Arrow")) input.keys[k] = false;
  if (k === "ShiftLeft" || k === "ShiftRight") input.shift = false;
});
const autoPause = () => { if (humanPlaying()) pause(); input.keyDown = false; input.ptrDown = false; input.keys = {}; input.shift = false; input.tapPending = false; };
document.addEventListener("visibilitychange", () => { if (document.hidden) autoPause(); });
addEventListener("blur", autoPause);

el.start.addEventListener("click", startGame);
el.retry.addEventListener("click", () => { if (performance.now() - overAt > 300) startGame(); });
el.resume.addEventListener("click", resume);
el.pauseBtn.addEventListener("click", pause);
for (const b of [el.lang, el.mute, el.pauseBtn]) b.addEventListener("click", e => { if (e.detail > 0) b.blur(); });
el.lang.addEventListener("click", () => { lang = lang === "ja" ? "en" : "ja"; store.set(KEY.lang, lang); applyLang(); });
el.mute.addEventListener("click", () => {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  el.mute.classList.toggle("muted", Sound.muted);
  el.mute.setAttribute("aria-pressed", String(Sound.muted));
});
for (const b of [el.start, el.retry, el.resume, el.lang, el.mute, el.pauseBtn]) b.addEventListener("pointerdown", () => Sound.init());

// ---------- boot ----------
el.mute.classList.toggle("muted", Sound.muted);
el.mute.setAttribute("aria-pressed", String(Sound.muted));
applyLang();
layout();
if (window.ResizeObserver) new ResizeObserver(layout).observe(app);
addEventListener("resize", layout); // also catches devicePixelRatio changes (zoom, moving between monitors)
if (DEMO) {
  el.title.hidden = true;
  el.hud.hidden = false;
  state = "play";
  newRun("demo");
} else {
  newRun("attract");
}
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
