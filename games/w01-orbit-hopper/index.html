<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070920">
<title>軌道ホッパー</title>
<style>
/* Layout: one portrait play area (canvas + DOM overlays), centred on wide screens. Night-sky palette. */
:root {
  --sky: #0e1233;
  --sky-deep: #070920;
  --ink: #f6efe0;
  --dim: #8f95c7;
  --coral: #ff7a6b;
  --butter: #ffd36e;
  --mint: #7fe3c4;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(ellipse at 50% 30%, #141a4a 0%, var(--sky-deep) 70%) var(--sky-deep);
  color: var(--ink); font-family: var(--font); overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: none;
}
#app {
  position: relative; height: 100%; aspect-ratio: 10 / 16; max-width: 100%; margin: 0 auto;
  background: var(--sky); overflow: hidden; touch-action: none; box-shadow: 0 0 60px #00000080;
  container-type: inline-size;
}
canvas { display: block; width: 100%; height: 100%; outline: none; }
.hud {
  position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start;
  padding: calc(14px + env(safe-area-inset-top)) 16px 0; pointer-events: none;
}
.score { font-weight: 900; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 #07092099; }
.combo { font-size: 13px; font-weight: 700; color: var(--mint); letter-spacing: .06em; margin-top: 6px; min-height: 1em; }
.best { font-size: 12px; letter-spacing: .08em; color: var(--dim); text-align: right; margin-top: 40px; font-weight: 700; }
.best b { display: block; color: var(--butter); font-size: 18px; font-variant-numeric: tabular-nums; }
.tools {
  position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; display: flex; gap: 6px; z-index: 5;
}
.tool {
  font: 700 12px/1 var(--font); color: var(--dim); background: #07092099; min-width: 34px; height: 30px;
  border: 1px solid #ffffff2a; border-radius: 999px; padding: 0 10px; cursor: pointer;
}
.tool:hover { color: var(--ink); }
.tool:focus-visible, .btn:focus-visible { outline: 2px solid var(--butter); outline-offset: 3px; }
.panel {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 0 16px; text-align: center; z-index: 4;
  background: radial-gradient(ellipse at 50% 45%, #07092099 0%, #070920e0 72%);
}
.panel h1 {
  font-weight: 900; margin: 0; line-height: 1.08; letter-spacing: .02em;
  font-size: clamp(30px, 11vw, 52px); font-size: clamp(28px, 11.5cqw, 56px); /* sized by the play area, not the window */
  text-wrap: balance; color: var(--ink); text-shadow: 0 0 24px #ff7a6b66, 0 4px 0 #07092099;
}
.panel h1 span { color: var(--butter); }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .3em; color: var(--mint); }
.how { font-size: 15px; line-height: 1.8; color: var(--dim); max-width: 21em; margin: 0; font-weight: 700; text-wrap: balance; }
.how em { font-style: normal; color: var(--ink); }
.btn {
  font: 900 20px/1 var(--font); color: var(--sky-deep); background: var(--butter); letter-spacing: .04em;
  border: 0; border-radius: 999px; padding: 16px 40px; cursor: pointer; box-shadow: 0 6px 0 #c99a2e;
  transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #c99a2e; }
.result-num { font-weight: 900; font-size: 88px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.result-sub { font-size: 14px; color: var(--dim); font-weight: 700; }
.result-sub b { color: var(--butter); }
.newbest { color: var(--coral); font-size: 15px; font-weight: 900; letter-spacing: .12em; }
.hint { font-size: 12px; color: var(--dim); }
.credit { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom)); left: 0; right: 0; font-size: 11px; color: #8f95c7aa; letter-spacing: .08em; }
.tip {
  position: absolute; left: 16px; right: 16px; bottom: calc(64px + env(safe-area-inset-bottom)); text-align: center;
  font-size: 15px; font-weight: 900; color: var(--butter); pointer-events: none; text-shadow: 0 2px 0 #070920; text-wrap: balance;
  animation: bob 1.1s ease-in-out infinite alternate;
}
.brand {
  position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); text-align: center;
  font-size: 13px; font-weight: 900; letter-spacing: .18em; color: #f6efe0b0; pointer-events: none;
}
.brand span { color: var(--butter); }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .tip { animation: none; } }
/* short windows (landscape laptops, small embeds): tighten the menus so nothing collides */
@media (max-height: 560px) {
  .panel { gap: 12px; }
  .how { font-size: 13px; line-height: 1.6; }
  .btn { font-size: 18px; padding: 13px 34px; }
  .result-num { font-size: 64px; }
  .score { font-size: 38px; }
  .credit { bottom: calc(8px + env(safe-area-inset-bottom)); }
  .tip { bottom: calc(16px + env(safe-area-inset-bottom)); font-size: 13px; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" tabindex="-1"></canvas>
  <div class="hud" id="hud" hidden>
    <div>
      <div class="score" id="score">0</div>
      <div class="combo" id="combo"></div>
    </div>
    <div class="best" id="bestBox"><span data-s="best"></span><b id="best">0</b></div>
  </div>
  <div class="tip" id="tip" hidden data-s="tip"></div>
  <div class="brand" id="brand" hidden></div>

  <div class="panel" id="title">
    <div class="kicker" data-s="kicker"></div>
    <h1 id="logo"></h1>
    <p class="how" id="how"></p>
    <button class="btn" id="start" type="button" data-s="start"></button>
    <div class="hint" data-s="controls"></div>
    <div class="credit">Made with Claude</div>
  </div>

  <div class="panel" id="pause" hidden>
    <div class="kicker" data-s="paused"></div>
    <button class="btn" id="resume" type="button" data-s="resume"></button>
    <div class="hint" data-s="resumeHint"></div>
  </div>

  <div class="panel" id="over" hidden>
    <div class="kicker" data-s="overKicker"></div>
    <div class="result-num" id="final">0</div>
    <div class="newbest" id="newbest" hidden data-s="newBest"></div>
    <div class="result-sub" id="resultSub"></div>
    <button class="btn" id="retry" type="button" data-s="retry"></button>
    <div class="hint" data-s="retryHint"></div>
  </div>

  <div class="tools" id="tools">
    <button class="tool" id="pauseBtn" type="button" hidden>II</button>
    <button class="tool" id="mute" type="button"></button>
    <button class="tool" id="lang" type="button"></button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // Portal SDK adapter: a portal build can replace this object before the game script runs.
  window.Platform = window.Platform || { gameplayStart() {}, gameplayStop() {}, happytime() {}, gameOver(score) {} };
  const platform = (name, ...args) => { try { window.Platform[name](...args); } catch (e) { /* SDK failures never break the game */ } };

  // ---- strings ----
  const STRINGS = {
    ja: {
      docTitle: '軌道ホッパー', logo: '軌道<span>ホッパー</span>',
      how: '<em>タップ</em>で飛び出して次の惑星の軌道へ。<br>真ん中を通せば <em>PERFECT</em>！',
      start: 'スタート', controls: 'タップ / クリック / スペースキー',
      best: 'ベスト', soundOn: '♪ ON', soundOff: '♪ OFF', lang: 'EN', pauseLabel: '一時停止',
      paused: '一時停止中', resume: 'つづける', resumeHint: 'スペースキーでも再開',
      newBest: 'ベスト更新！', resultSub: (b, p) => `ベスト <b>${b}</b> ・ PERFECT <b>${p}</b> 回`,
      retry: 'もう一回', retryHint: 'スペースキーでもリトライ',
      tip: '線が次の惑星を指したらタップ！', combo: n => `PERFECT 連続 ${n}`,
      canvas: 'ゲーム画面', brand: '軌道<span>ホッパー</span> #01',
      kicker: 'WEEKLY MINI GAME #01', overKicker: 'LOST IN SPACE'
    },
    en: {
      docTitle: 'Orbit Hopper', logo: 'Orbit <span>Hopper</span>',
      how: '<em>Tap</em> to fling off and catch the next orbit.<br>Thread the centre for a <em>PERFECT</em>!',
      start: 'START', controls: 'Tap / Click / Space',
      best: 'BEST', soundOn: '♪ ON', soundOff: '♪ OFF', lang: 'JA', pauseLabel: 'Pause',
      paused: 'PAUSED', resume: 'RESUME', resumeHint: 'or press Space',
      newBest: 'NEW BEST!', resultSub: (b, p) => `Best <b>${b}</b> · PERFECT <b>${p}</b>`,
      retry: 'RETRY', retryHint: 'or press Space',
      tip: 'Tap when the line points at the next planet!', combo: n => `PERFECT STREAK ${n}`,
      canvas: 'Game screen', brand: 'ORBIT <span>HOPPER</span> #01',
      kicker: 'WEEKLY MINI GAME #01', overKicker: 'LOST IN SPACE'
    }
  };

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const COLORS = ['#ff7a6b', '#ffd36e', '#7fe3c4', '#b9a6ff', '#7cc4ff'];
  const FONT = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif';
  const TAU = Math.PI * 2;
  const DEMO = /(?:^|[?&])demo=1(?:&|$)/.test(location.search);

  // ---- storage (optional: the game works when it throws) ----
  // Keys are namespaced: itch.io serves every HTML game from one shared origin.
  const KEY = 'claude-weekly.orbit-hopper.';
  const store = {
    get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
  };
  let best = Math.max(0, Math.floor(Number(store.get('best', 0)) || 0));
  let soundOn = store.get('sound', true) !== false;
  let lang = store.get('lang', null);
  if (lang !== 'ja' && lang !== 'en') lang = /^ja\b/i.test(navigator.language || 'ja') ? 'ja' : 'en';
  let S = STRINGS[lang];

  function applyLang() {
    S = STRINGS[lang];
    document.documentElement.lang = lang;
    document.title = S.docTitle;
    for (const el of document.querySelectorAll('[data-s]')) el.textContent = S[el.dataset.s];
    $('logo').innerHTML = S.logo;
    $('how').innerHTML = S.how;
    $('brand').innerHTML = S.brand;
    $('lang').textContent = S.lang;
    $('pauseBtn').setAttribute('aria-label', S.pauseLabel);
    cv.setAttribute('aria-label', S.canvas);
    updateHud();
  }

  // ---- canvas sizing ----
  // W/H are world units. Small or short play areas zoom the world out so it is always at least 360x640,
  // otherwise the next planet could sit above the top edge on a landscape laptop.
  let W = 400, H = 640, DPR = 1;
  function resize() {
    const r = cv.getBoundingClientRect();
    const cssW = Math.max(1, r.width), cssH = Math.max(1, r.height);
    const zoom = Math.min(1, cssW / 360, cssH / 640);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cssW / zoom; H = cssH / zoom;
    cv.width = Math.round(cssW * DPR); cv.height = Math.round(cssH * DPR);
    ctx.setTransform(DPR * zoom, 0, 0, DPR * zoom, 0, 0);
    if (planets) for (const p of planets) p.x = Math.max(p.R + 8, Math.min(W - p.R - 8, p.x));
  }

  // ---- sound (WebAudio synthesis, unlocked by the first gesture) ----
  // Created/resumed on activation-triggering events only (pointerup, touchend, click, keydown, mousedown):
  // a touch pointerdown does not count, and a context made there stays suspended on phones.
  let actx = null;
  function unlockAudio() {
    if (document.hidden) return;
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state !== 'running') { const pr = actx.resume(); if (pr && pr.catch) pr.catch(() => {}); }
    } catch (e) {}
  }
  function suspendAudio() {
    try { if (actx && actx.state === 'running') { const pr = actx.suspend(); if (pr && pr.catch) pr.catch(() => {}); } } catch (e) {}
  }
  function beep(freq, dur = 0.08, type = 'sine', vol = 0.12, slide = 0, delay = 0) {
    if (!soundOn || !actx || actx.state !== 'running' || mode === 'attract') return;
    try {
      const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
  const note = n => 440 * Math.pow(2, n / 12);
  const sfx = {
    launch: () => beep(520, 0.1, 'triangle', 0.08, 300),
    capture: hops => beep(note(PENTA[hops % PENTA.length] - 5), 0.14, 'sine', 0.16),
    perfect: c => {
      const base = PENTA[Math.min(c, PENTA.length - 3)];
      beep(note(base), 0.1, 'square', 0.05); beep(note(base + 7), 0.16, 'square', 0.045, 0, 0.07);
      if (c >= 3) beep(note(base + 12), 0.2, 'triangle', 0.07, 0, 0.14);
    },
    milestone: () => [0, 4, 7, 12].forEach((n, i) => beep(note(n + 3), 0.18, 'triangle', 0.08, 0, i * 0.07)),
    die: () => { beep(300, 0.55, 'sawtooth', 0.07, -240); beep(90, 0.4, 'sine', 0.18, -40); },
    newBest: () => [0, 4, 7, 12, 16].forEach((n, i) => beep(note(n), 0.22, 'triangle', 0.08, 0, i * 0.09))
  };

  // ---- background stars (parallax) ----
  const stars = Array.from({ length: 140 }, () => ({
    x: Math.random(), y: Math.random() * 3000, z: 0.15 + Math.random() * 0.6, tw: Math.random() * TAU
  }));

  // ---- difficulty: everything ramps with hops (planets reached), capped so launch windows stay >= ~0.11 s ----
  const RAMP_HOPS = 45;
  const level = hops => Math.min(hops, RAMP_HOPS) / RAMP_HOPS;
  const orbitRadius = L => 78 - L * 24;                       // capture radius 78 -> 54
  const angularSpeed = (L, R) => (2.1 + L * 0.9) * Math.pow(65 / R, 0.25);
  const launchSpeed = L => 560 + L * 160;
  const gapFor = L => 195 + Math.random() * 70 + L * 45;
  const PERFECT_ZONE = 0.4;                                   // fraction of R counted as PERFECT

  // ---- game state ----
  // mode: 'attract' (AI behind the title), 'demo' (?demo=1 AI), 'play' (human)
  // state: 'orbit' | 'fly' | 'dead' | 'over'
  let mode = DEMO ? 'demo' : 'attract';
  let state = 'orbit', paused = false;
  let planets = null, player, camY, score, hops, combo, perfects, particles, popups, rings;
  let shake, flash, hitStop, flyTime, orbitTime, trail, time = 0, deadTimer, squash, tipShown;
  let ai = { style: 'perfect' };

  function makePlanet(y, i) {
    const L = level(i);
    const R = orbitRadius(L);
    const margin = R + 12;
    const driftChance = i > 8 ? Math.min(0.15 + L * 0.4, 0.5) : 0;
    return {
      x: margin + Math.random() * Math.max(10, W - margin * 2),
      y, R,
      body: R * (0.36 + Math.random() * 0.1),
      color: COLORS[i % COLORS.length],
      ring: Math.random() < 0.35,
      drift: Math.random() < driftChance ? (Math.random() < 0.5 ? -1 : 1) * (25 + L * 30) : 0,
      idx: i, pulse: 0
    };
  }

  // Shared by the real step and the AI's prediction so they agree exactly.
  function driftStep(p, dt) {
    if (!p.drift) return;
    p.x += p.drift * dt;
    const lo = p.R + 8, hi = W - p.R - 8;
    if (p.x < lo || p.x > hi) { p.drift *= -1; p.x = Math.max(lo, Math.min(hi, p.x)); }
  }

  function reset() {
    planets = [];
    let y = H * 0.72;
    for (let i = 0; i < 8; i++) {
      const p = makePlanet(y, i);
      if (i === 0) { p.x = W / 2; p.drift = 0; }
      planets.push(p);
      y -= gapFor(level(i + 1));
    }
    const p0 = planets[0];
    player = { x: 0, y: 0, vx: 0, vy: 0, planet: p0, from: p0, a: Math.PI, dir: 1, w: angularSpeed(0, p0.R) };
    camY = p0.y - H * 0.68;
    score = 0; hops = 0; combo = 0; perfects = 0; particles = []; popups = []; rings = [];
    shake = 0; flash = 0; hitStop = 0; flyTime = 0; orbitTime = 0; trail = []; deadTimer = 0; squash = 0;
    state = 'orbit'; tipShown = true;
    pickAiStyle();
    placeOnOrbit();
    if (mode !== 'play') warmStart();
    updateHud();
  }

  // Demo/attract: begin just before a good launch angle so a recorded clip opens with action, not a 3 s wait.
  function warmStart() {
    const start = player.a;
    let bestA = null, bestRel = Infinity;
    for (let i = 0; i < 72; i++) {
      player.a = start + player.dir * i * TAU / 72;
      const hit = predictLaunch(0);
      if (hit && hit.rel < bestRel) { bestRel = hit.rel; bestA = player.a; }
    }
    player.a = bestA == null ? start : bestA - player.dir * player.w * 0.6;
    placeOnOrbit();
  }

  function placeOnOrbit() {
    const p = player.planet;
    player.x = p.x + Math.cos(player.a) * p.R;
    player.y = p.y + Math.sin(player.a) * p.R;
  }

  function spawnAhead() {
    let top = planets[planets.length - 1];
    while (top.y - camY > -H * 1.2) {
      const p = makePlanet(top.y - gapFor(level(top.idx + 1)), top.idx + 1);
      planets.push(p); top = p;
    }
    planets = planets.filter(p => p.y - camY < H + 200 || p === player.planet || p === player.from);
  }

  function launch() {
    if (state !== 'orbit' || paused) return;
    const speed = launchSpeed(level(hops));
    const tx = -Math.sin(player.a) * player.dir, ty = Math.cos(player.a) * player.dir;
    player.vx = tx * speed; player.vy = ty * speed;
    player.from = player.planet;
    state = 'fly'; flyTime = 0;
    burst(player.x, player.y, '#fff8e6', 6, 120);
    sfx.launch();
    updateHud();
  }

  function capture(p) {
    const dx = player.x - p.x, dy = player.y - p.y;
    const v = Math.hypot(player.vx, player.vy);
    // perpendicular distance of the flight line from the planet's centre
    const impact = Math.abs(dx * player.vy - dy * player.vx) / v;
    const perfect = impact < p.R * PERFECT_ZONE;
    player.planet = p;
    player.a = Math.atan2(dy, dx);
    player.dir = (dx * player.vy - dy * player.vx) > 0 ? 1 : -1;
    hops = p.idx;
    player.w = angularSpeed(level(hops), p.R);
    state = 'orbit'; orbitTime = 0;
    score += 1;
    if (perfect) { combo++; perfects++; score += combo; } else combo = 0;
    p.pulse = 1; squash = 1;
    rings.push({ x: p.x, y: p.y, r: p.R, t: 0, color: perfect ? '#ffd36e' : p.color });
    burst(player.x, player.y, perfect ? '#ffd36e' : p.color, perfect ? 28 : 12);
    popups.push({ x: player.x, y: player.y, text: perfect ? (combo > 1 ? `PERFECT ×${combo}` : 'PERFECT') : '+1', t: 0, perfect });
    if (perfect) {
      hitStop = 0.07; flash = 0.18;
      if (!reduceMotion) shake = Math.max(shake, 3 + Math.min(combo, 6));
      sfx.perfect(combo);
      if (combo % 5 === 0) { sfx.milestone(); burst(player.x, player.y, '#7fe3c4', 36, 320); if (mode === 'play') platform('happytime'); }
    } else sfx.capture(hops);
    if (hops >= 2) tipShown = false;
    pickAiStyle();
    updateHud();
  }

  function die() {
    state = 'dead'; deadTimer = mode === 'play' ? 0.65 : 1.0;
    if (!reduceMotion) shake = 14;
    flash = 0.25;
    burst(player.x, player.y, '#ff7a6b', 34, 280);
    sfx.die();
    if (mode === 'play') platform('gameplayStop');
    updateHud();
  }

  let overAt = 0;
  function showGameOver() {
    state = 'over'; overAt = performance.now();
    const isBest = score > best;
    if (isBest) { best = score; store.set('best', best); }
    $('final').textContent = score;
    $('resultSub').innerHTML = S.resultSub(best, perfects);
    $('newbest').hidden = !isBest || score === 0;
    $('over').hidden = false; $('pauseBtn').hidden = true; $('tip').hidden = true;
    $('retry').focus({ preventScroll: true });
    if (isBest && score > 0) { sfx.newBest(); platform('happytime'); }
    platform('gameOver', score);
    updateHud();
  }

  function burst(x, y, color, n, power = 240) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 60 + Math.random() * power;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45 + Math.random() * 0.5, t: 0, color, size: 2 + Math.random() * 3 });
    }
  }

  function updateHud() {
    if (!player) return;
    $('score').textContent = score;
    $('best').textContent = best;
    $('combo').textContent = combo > 1 ? S.combo(combo) : '';
    $('mute').textContent = soundOn ? S.soundOn : S.soundOff;
    $('mute').setAttribute('aria-pressed', String(!soundOn));
    $('tip').hidden = !(tipShown && mode !== 'attract' && state === 'orbit' && !paused);
  }

  // ---- AI: predicts the flight for a launch t0 seconds from now and fires at the best moment ----
  function predictLaunch(t0) {
    const cur = player.planet;
    const sims = [];
    for (const p of planets) if (p.idx >= cur.idx && p.idx <= cur.idx + 3) {
      const s = { x: p.x, y: p.y, R: p.R, drift: p.drift, idx: p.idx, ref: p };
      driftStep(s, t0);
      sims.push(s);
    }
    const c = sims.find(s => s.ref === cur);
    if (!c) return null;
    const a = player.a + player.dir * player.w * t0;
    let x = c.x + Math.cos(a) * c.R, y = c.y + Math.sin(a) * c.R;
    const speed = launchSpeed(level(hops));
    const vx = -Math.sin(a) * player.dir * speed, vy = Math.cos(a) * player.dir * speed;
    let cam = camY;
    const camTarget = cur.y - H * 0.68, h = 1 / 60;
    for (let t = 0; t < 2.2; t += h) {
      for (const s of sims) driftStep(s, h);
      x += vx * h; y += vy * h;
      for (const s of sims) {
        if (s.idx <= cur.idx) continue;
        const dx = x - s.x, dy = y - s.y;
        if (Math.hypot(dx, dy) < s.R) return { planet: s.ref, rel: Math.abs(dx * vy - dy * vx) / speed / s.R };
      }
      cam += (camTarget - cam) * Math.min(1, h * 3.2);
      if (x < -30 || x > W + 30 || y - cam < -60 || y - cam > H + 30) return null;
    }
    return null;
  }

  function pickAiStyle() {
    // Mostly hunts PERFECTs (looks great on video); sometimes settles for a safe early hop like a human would.
    ai = { style: Math.random() < 0.85 ? 'perfect' : 'early', reaction: 0.12 + Math.random() * 0.2 };
  }

  function aiThink() {
    if (state !== 'orbit' || orbitTime < ai.reaction) return;
    const now = predictLaunch(0);
    const revolution = TAU / player.w;
    if (!now) {
      // no landing angle exists (should not happen); jump anyway so the demo never stalls on screen
      if (orbitTime > revolution * 2 + 0.5) launch();
      return;
    }
    if (ai.style === 'early' || orbitTime > revolution + ai.reaction) {
      if (now.rel < 0.75) launch();
      return;
    }
    const next = predictLaunch(1 / 60);
    const atMinimum = !next || next.planet !== now.planet || next.rel >= now.rel;
    if (now.rel < PERFECT_ZONE * 0.8 && atMinimum) launch();
  }

  // ---- loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min((now - last) / 1000, 1 / 30)); last = now;
    if (!paused) {
      time += dt;
      if (hitStop > 0) hitStop -= dt; else step(dt);
    }
    draw();
    requestAnimationFrame(frame);
  }

  function step(dt) {
    for (const p of planets) { driftStep(p, dt); p.pulse = Math.max(0, p.pulse - dt * 2.5); }

    if (state === 'orbit') {
      orbitTime += dt;
      player.a += player.dir * player.w * dt;
      placeOnOrbit();
      if (mode !== 'play') aiThink();
    } else if (state === 'fly') {
      flyTime += dt;
      // substeps of <= 4 px so a star grazing an orbit is never stepped past it on a slow frame
      const sub = Math.max(1, Math.ceil(Math.hypot(player.vx, player.vy) * dt / 4)), h = dt / sub;
      for (let k = 0; k < sub && state === 'fly'; k++) {
        player.x += player.vx * h; player.y += player.vy * h;
        for (const p of planets) {
          if (p.idx <= player.from.idx) continue;
          if (Math.hypot(player.x - p.x, player.y - p.y) < p.R) { capture(p); break; }
        }
      }
      if (state === 'fly') {
        const sy = player.y - camY;
        if (player.x < -30 || player.x > W + 30 || sy > H + 30 || sy < -60 || flyTime > 2.2) die();
      }
    } else if (state === 'dead') {
      deadTimer -= dt;
      if (deadTimer <= 0) {
        if (mode === 'play') showGameOver(); else reset();
      }
    }

    if (state === 'orbit' || state === 'fly') {
      trail.push({ x: player.x, y: player.y });
      if (trail.length > 22) trail.shift();
    }

    // camera keeps the current planet in the lower part of the screen
    const target = player.planet.y - H * 0.68;
    camY += (target - camY) * Math.min(1, dt * 3.2);
    spawnAhead();

    for (const q of particles) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.95; q.vy *= 0.95; }
    particles = particles.filter(q => q.t < q.life);
    for (const u of popups) u.t += dt;
    popups = popups.filter(u => u.t < 0.9);
    for (const r of rings) r.t += dt;
    rings = rings.filter(r => r.t < 0.5);
    shake *= Math.pow(0.0003, dt);
    flash = Math.max(0, flash - dt);
    squash = Math.max(0, squash - dt * 5);
  }

  function draw() {
    ctx.save();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#070920'); g.addColorStop(1, '#141a4a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    if (shake > 0.3 && !reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    for (const s of stars) {
      let y = (s.y - camY * s.z) % 3000; if (y < 0) y += 3000;
      y = y / 3000 * (H + 40) - 20;
      const a = 0.35 + 0.35 * Math.sin(time * 2 + s.tw);
      ctx.fillStyle = `rgba(246,239,224,${a * s.z * 1.4})`;
      ctx.fillRect(s.x * W, y, s.z * 2.2, s.z * 2.2);
    }

    ctx.translate(0, -camY);

    // first hops: show whether the current aim would land (teaches the game without reading)
    let aimHit = null;
    const tutorial = state === 'orbit' && hops < 3;
    if (tutorial) aimHit = predictLaunch(0);

    for (const p of planets) {
      const sy = p.y - camY; if (sy < -150 || sy > H + 150) continue;
      const targeted = aimHit && aimHit.planet === p;
      const pr = p.R * (1 + p.pulse * 0.08);
      ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, TAU);
      ctx.setLineDash([4, 7]); ctx.lineDashOffset = -time * 12;
      ctx.strokeStyle = targeted ? 'rgba(127,227,196,.9)' : p === player.planet ? 'rgba(255,211,110,.55)' : 'rgba(143,149,199,.35)';
      ctx.lineWidth = targeted ? 2.5 : 1.5; ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.R * PERFECT_ZONE, 0, TAU);
      ctx.fillStyle = targeted ? 'rgba(255,211,110,.14)' : 'rgba(255,211,110,.05)'; ctx.fill();
      const gl = ctx.createRadialGradient(p.x, p.y, p.body * 0.6, p.x, p.y, p.body * 2.2);
      gl.addColorStop(0, p.color + '55'); gl.addColorStop(1, p.color + '00');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(p.x, p.y, p.body * 2.2, 0, TAU); ctx.fill();
      const b = p.body * (1 + p.pulse * 0.12);
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, b, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(7,9,32,.22)'; ctx.beginPath(); ctx.arc(p.x + b * 0.35, p.y + b * 0.3, b * 0.8, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(p.x - b * 0.35, p.y - b * 0.4, b * 0.22, 0, TAU); ctx.fill();
      if (p.ring) {
        ctx.strokeStyle = 'rgba(246,239,224,.55)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, b * 1.6, b * 0.45, -0.35, 0, TAU); ctx.stroke();
      }
    }

    for (const r of rings) {
      const k = r.t / 0.5;
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = r.color; ctx.lineWidth = 3 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (1 + k * 0.6), 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    const alive = state === 'orbit' || state === 'fly';
    if (alive) for (let i = 0; i < trail.length; i++) {
      const t = trail[i], k = i / trail.length;
      ctx.fillStyle = `rgba(255,211,110,${k * 0.5})`;
      ctx.beginPath(); ctx.arc(t.x, t.y, 2 + k * 4, 0, TAU); ctx.fill();
    }

    if (alive) {
      if (state === 'orbit') {
        const tx = -Math.sin(player.a) * player.dir, ty = Math.cos(player.a) * player.dir;
        const len = tutorial ? 240 : 90;
        ctx.strokeStyle = aimHit ? 'rgba(127,227,196,.85)' : 'rgba(255,248,230,.25)';
        ctx.lineWidth = 2; ctx.setLineDash([2, 8]);
        ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.x + tx * len, player.y + ty * len); ctx.stroke();
        ctx.setLineDash([]);
      }
      // squash on capture, stretch along velocity while flying
      ctx.save();
      ctx.translate(player.x, player.y);
      if (state === 'fly') { ctx.rotate(Math.atan2(player.vy, player.vx)); ctx.scale(1.45, 0.72); }
      else if (squash > 0) { ctx.rotate(player.a); ctx.scale(1 - squash * 0.35, 1 + squash * 0.35); }
      ctx.fillStyle = '#fff8e6'; ctx.shadowColor = '#ffd36e'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
      ctx.restore();
    }

    for (const q of particles) {
      ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.color;
      ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center';
    for (const u of popups) {
      const k = u.t / 0.9, pop = u.perfect ? 1 + Math.max(0, 0.4 - u.t * 2) : 1;
      ctx.globalAlpha = 1 - k;
      ctx.font = `900 ${Math.round((u.perfect ? 21 : 16) * pop)}px ${FONT}`;
      const half = ctx.measureText(u.text).width / 2 + 6;
      const x = Math.max(half, Math.min(W - half, u.x));
      ctx.fillStyle = '#070920'; ctx.fillText(u.text, x, u.y - 20 - u.t * 40 + 2);
      ctx.fillStyle = u.perfect ? '#ffd36e' : '#f6efe0'; ctx.fillText(u.text, x, u.y - 22 - u.t * 40);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (flash > 0) { ctx.fillStyle = `rgba(255,248,230,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---- flow ----
  function startGame() {
    mode = 'play'; paused = false;
    $('title').hidden = true; $('over').hidden = true; $('pause').hidden = true;
    $('hud').hidden = false; $('pauseBtn').hidden = false;
    reset();
    cv.focus({ preventScroll: true });
    platform('gameplayStart');
  }

  function pauseGame() {
    if (mode !== 'play' || paused || (state !== 'orbit' && state !== 'fly')) return;
    paused = true;
    $('pause').hidden = false; $('pauseBtn').hidden = true;
    $('resume').focus({ preventScroll: true });
    platform('gameplayStop');
    updateHud();
  }

  function resumeGame() {
    if (!paused) return;
    paused = false; last = performance.now();
    $('pause').hidden = true; $('pauseBtn').hidden = false;
    cv.focus({ preventScroll: true });
    platform('gameplayStart');
    updateHud();
  }

  // ---- input ----
  for (const type of ['pointerup', 'touchend', 'click', 'keydown', 'mousedown']) addEventListener(type, unlockAudio, true);

  // A short lock after the result appears, so a player still mashing Space/tap does not skip their score.
  function retry(lockMs = 350) { if (state === 'over' && performance.now() - overAt > lockMs) startGame(); }

  // Listen on the whole window: on wide screens clicks in the side margins count too.
  addEventListener('pointerdown', e => {
    if (e.button > 0 || e.target.closest('button')) return;
    e.preventDefault();
    if (paused) resumeGame();
    else if (mode === 'play' && state === 'orbit') launch();
    else if (!$('over').hidden) retry(600); // tap anywhere to retry, after a longer lock than the button
    else if (!$('title').hidden) startGame();
  });
  addEventListener('keydown', e => {
    // keyboard users on the mute/language buttons get the normal button behaviour
    if (e.target.closest && e.target.closest('.tool') && (e.code === 'Space' || e.code === 'Enter')) return;
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (paused) resumeGame(); else pauseGame();
      return;
    }
    if (e.code !== 'Space' && e.code !== 'Enter' && e.code !== 'NumpadEnter' && e.code !== 'ArrowUp') return;
    if (e.repeat) { e.preventDefault(); return; }
    e.preventDefault();
    if (paused) resumeGame();
    else if (mode === 'play' && state === 'orbit') launch();
    else if (!$('over').hidden) retry();
    else if (!$('title').hidden) startGame();
  });
  $('start').addEventListener('click', startGame);
  $('retry').addEventListener('click', () => retry());
  $('resume').addEventListener('click', resumeGame);
  $('pauseBtn').addEventListener('click', e => { e.currentTarget.blur(); pauseGame(); });
  $('mute').addEventListener('click', e => {
    e.currentTarget.blur();
    soundOn = !soundOn; store.set('sound', soundOn);
    updateHud();
  });
  $('lang').addEventListener('click', e => {
    e.currentTarget.blur();
    lang = lang === 'ja' ? 'en' : 'ja'; store.set('lang', lang);
    applyLang();
    if (!$('over').hidden) $('resultSub').innerHTML = S.resultSub(best, perfects);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pauseGame(); suspendAudio(); } else if (actx) unlockAudio();
  });
  addEventListener('blur', pauseGame);
  addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv); // embeds can resize the play area without a window resize
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault()); // older iOS Safari pinch-zoom

  // ---- boot ----
  resize();
  reset();
  applyLang();
  if (DEMO) {
    $('title').hidden = true; $('hud').hidden = false; $('tools').hidden = true; $('brand').hidden = false;
    $('bestBox').hidden = true; // a demo never sets a best, so "BEST 0" next to a big score would look wrong
  }
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
